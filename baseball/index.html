  out.gameLines = [];
  [home.id,away.id].forEach(tid=>{
    realBatters(tid).forEach(h=>{ const sn=gSnap[h.id]; if(!sn||sn.HR==null) return;
      out.gameLines.push({ pid:h.id, name:h.name, team:tid, isP:false, hr:h.stats.HR-sn.HR, h:h.stats.H-sn.H, rbi:h.stats.RBI-sn.RBI, ab:h.stats.AB-(sn.AB||0) }); });
    [arms[tid].starter.id, ...usedPen[tid]].forEach(pid=>{ const p=players[pid], sn=gSnap[pid]; if(!p||!sn||sn.SO==null) return;
      out.gameLines.push({ name:p.name, team:tid, isP:true, so:p.stats.SO-sn.SO, out:p.stats.OUT-sn.OUT }); });
  });
  // Full per-game box score (compact: player ids + ints, names resolved at view time) for the
  // Box Score viewer. Batting: [pid,AB,R,H,RBI,BB,SO,HR]; pitching: [pid,OUT,H,R,ER,BB,SO,HRA]
  // (R==ER — the sim treats every run as earned). Stored on the schedule/playoff game object.
  const batLine = tid => realBatters(tid).map(h=>{ const sn=gSnap[h.id]||{};
    return [h.id, h.stats.AB-(sn.AB||0), h.stats.R-(sn.R||0), h.stats.H-(sn.H||0),
            h.stats.RBI-(sn.RBI||0), h.stats.BB-(sn.BB||0), h.stats.SO-(sn.SO||0), h.stats.HR-(sn.HR||0)]; });
  const pitLine = tid => [arms[tid].starter.id, ...usedPen[tid]].map(pid=>{ const p=players[pid], sn=gSnap[pid]||{};
    const er=p.stats.ER-(sn.ER||0), ra=(p.stats.R||0)-(sn.R||0);
    return [pid, p.stats.OUT-(sn.OUT||0), p.stats.H-(sn.H||0), ra, er, p.stats.BB-(sn.BB||0), p.stats.SO-(sn.SO||0), p.stats.HRA-(sn.HRA||0)]; });
  out.box = {
     h:home.id, a:away.id, hs:out.hs, as:out.as,
    ls:{ h:lineScore[home.id], a:lineScore[away.id] },
    hb:batLine(home.id), ab:batLine(away.id),
    hp:pitLine(home.id), ap:pitLine(away.id),
    dec
  };
  return out;
}


function awardDecision(winnerId, loserId, arms, usedPen, players, ctx){
  const wStarter = arms[winnerId].starter;
  const rec = ctx.decisionRec || {};
  // WIN — the winning team's pitcher of record when they took the lead for good. Exception:
  // a starter who left before 5 IP (OUT<15) cedes the win to a used reliever.
  let winPitId = rec.winPit;
  let winPit = winPitId!=null ? players[winPitId] : null;
  if(!winPit || winPit.teamId==null){ winPit=wStarter; winPitId=wStarter.id; }   // fallback
  if(winPit.id===wStarter.id && wStarter.stats.OUT<15){
    const rp = (usedPen[winnerId]||[]).map(id=>players[id]).filter(Boolean)[0];
    if(rp){ winPit=rp; winPitId=rp.id; }
  }
  winPit.stats.W++;
  // LOSS — the losing team's pitcher who surrendered the go-ahead run (often a reliever).
  let loserPitId = rec.losePit;
  let losePit = loserPitId!=null ? players[loserPitId] : null;
  if(!losePit){ losePit=arms[loserId].starter; loserPitId=losePit.id; }
  losePit.stats.L++;
  // save: closer = pen[0] (best/priority arm), if he finished a win of <=3
  const margin = Math.abs(ctx.score[winnerId]-ctx.score[loserId]);
  const pen = arms[winnerId].pen; const closer = pen[0];
  let saverId=null;
  if(closer && (usedPen[winnerId]||[]).includes(closer.id) && margin<=3 && closer.id!==wStarter.id && closer.id!==winPitId){
    closer.stats.SV++; saverId=closer.id;
  }
  // holds: setup relievers who bridged a close win (not the winner, not the saver)
  if(margin<=3){
    (usedPen[winnerId]||[]).forEach(id=>{
      if(id===saverId || id===winPitId) return;
      const rp=players[id]; if(rp) rp.stats.HLD=(rp.stats.HLD||0)+1;
    });
  }
  return { w:winPitId, l:loserPitId, s:saverId };   // decision ids for the box score
}

/* mark games-played for hitters in lineup */
// record (deduped) a team label a player actually suited up for this season
function tagTeam(p, lbl){ if(!p) return; if(!p._yrTeams) p._yrTeams=[]; if(!p._yrTeams.includes(lbl)) p._yrTeams.push(lbl); }
const teamLabel = t => t.abbr + (t.aaa?" AAA":(t.college?" (C)":""));
// `idx` is the team→players roster index; `day` is the calendar day (for the
// consecutive-games run). Keep them distinct — an earlier version stored `idx` itself
// in `_lastD`, which put the whole roster index inside every player and made the save
// circular (JSON.stringify threw, so Save File / the localStorage fallback both failed).
function markGamesPlayed(home, away, players, idx, day){
  [home,away].forEach(t=>{
    const lbl=teamLabel(t);
    lineupHitters(t,players,idx).forEach(h=>{ h.stats.G++; tagTeam(h,lbl);
      if(typeof day === "number"){                                   // consecutive-games run (weary legs)
        h._cg = (h._lastD===day-1) ? (h._cg||0)+1 : 1; h._lastD=day;
      }
    });
  });
}

/* ----------------------------- standings ------------------------------- */
function pct(t){ const g=t.w+t.l; return g? t.w/g : 0; }
function standings(teams){
  const byDiv = {};
  teams.forEach(t=>{
    const k=t.league+" "+t.division;
    (byDiv[k]=byDiv[k]||[]).push(t);
  });
  Object.values(byDiv).forEach(arr=>arr.sort((a,b)=>pct(b)-pct(a)||b.w-a.w));
  return byDiv;
}
function playoffSeeds(teams, league, n){
  const lt = teams.filter(t=>t.league===league);
  const byDiv={};
  lt.forEach(t=>(byDiv[t.division]=byDiv[t.division]||[]).push(t));
  const winners=[];
  Object.values(byDiv).forEach(arr=>{arr.sort((a,b)=>pct(b)-pct(a)); winners.push(arr[0]);});
  winners.sort((a,b)=>pct(b)-pct(a));
  const rest = lt.filter(t=>!winners.includes(t)).sort((a,b)=>pct(b)-pct(a));
  // Field size is a league rule. Division winners always seed above wild cards (1-3),
  // then the best remaining records fill out to `n`. n=5 is the classic shape.
  const want = Math.max(2, Math.min(n==null?5:n, lt.length));
  return [...winners, ...rest].slice(0, want);
}
// How many rounds a league bracket of `n` teams needs before it has a champion.
const bracketRounds = n => Math.max(1, Math.ceil(Math.log2(Math.max(2,n))));
// Pair one round from the still-alive teams (best seed first). When the field isn't a
// power of two the TOP seeds sit out — exactly enough games are played to cut the field
// down to the next power of two, so the classic 5-team field opens with one play-in.
function pairRound(alive){
  const n = alive.length;
  if(n<2) return { series:[], byes:alive.slice() };
  const pow = 1 << Math.floor(Math.log2(n));
  const pairs = (n===pow) ? n/2 : (n-pow);       // games played this round
  const byeCount = n - pairs*2;
  const byes = alive.slice(0, byeCount);
  const playing = alive.slice(byeCount);
  const series = [];
  for(let i=0;i<pairs;i++) series.push(mkSeries(playing[i], playing[playing.length-1-i]));
  return { series, byes };
}
// Round key (drives series length + labels) by position in the league bracket: the last
// round is always the League Championship, the one before it the Division Series.
function roundKeyFor(i, total){ return i===total-1 ? "cs" : i===total-2 ? "ds" : "wc"; }
// Best-of for a given round under the active rules.
function seriesLenFor(G, roundKey){
  const R = rules(G);
  return roundKey==="ws" ? R.lenWS : roundKey==="cs" ? R.lenCS : roundKey==="ds" ? R.lenDS : R.lenWC;
}

/* ----------------------------- derived stat display -------------------- */
const avg = s => s.AB? (s.H/s.AB) : 0;
const obp = s => { const d=s.AB+s.BB+(s.HBP||0)+(s.SF||0); return d? (s.H+s.BB+(s.HBP||0))/d : 0; };   // (H+BB+HBP)/(AB+BB+HBP+SF)
const slg = s => { const tb=(s.H-s._2B-s._3B-s.HR)+2*s._2B+3*s._3B+4*s.HR; return s.AB? tb/s.AB:0; };
const ops = s => obp(s)+slg(s);
const ip  = s => Math.floor(s.OUT/3) + (s.OUT%3)/10;
const era = s => s.OUT? (s.ER*27/s.OUT) : 0;
const whip= s => s.OUT? ((s.BB+s.H)/(s.OUT/3)) : 0;
const fpct= s => s.TC? ((s.TC-(s.E||0))/s.TC) : 0;   // fielding %: (chances - errors)/chances
// derived hitting rate stats
const iso  = s => s.AB? (slg(s)-avg(s)) : 0;                                   // isolated power
const babip= s => { const d=s.AB-s.SO-s.HR+(s.SF||0); return d>0? (s.H-s.HR)/d : 0; };
const woba = s => { const pa=s.AB+s.BB+(s.SF||0)+(s.HBP||0); if(!pa) return 0;  // wOBA-lite (standard weights)
  const b1=s.H-s._2B-s._3B-s.HR;
  return (0.69*s.BB + 0.72*(s.HBP||0) + 0.89*b1 + 1.27*s._2B + 1.62*s._3B + 2.10*s.HR)/pa; };
// derived pitching rate stats
const kp9 = s => s.OUT? (s.SO*27/s.OUT) : 0;
const bb9 = s => s.OUT? (s.BB*27/s.OUT) : 0;
const kbb = s => s.BB? (s.SO/s.BB) : (s.SO||0);
const FIP_CONST = 3.40;   // calibrated so league FIP centers on league ERA (earned-run basis since unearned runs were split out)
const fip  = s => s.OUT? (((13*(s.HRA||0) + 3*(s.BB+(s.HBP||0)) - 2*s.SO)/(s.OUT/3)) + FIP_CONST) : 0;
// ---- WAR (simplified, calibrated to this league's run environment) ----
// Position WAR = batting runs above avg (wOBA-based) + positional adj + a light defensive
// term + replacement runs, all over runs-per-win. Pitcher WAR = FIP runs saved vs a
// replacement-level arm over IP. Needs league context (avg wOBA / FIP) from leagueWarCtx.
const WOBA_SCALE = 1.20, RUNS_PER_WIN = 11.5;   // tuned so league position WAR sums ~57% of total (vs pitching)
const POS_ADJ = {C:12.5, SS:7.5, "2B":2.5, "3B":2.5, CF:2.5, LF:-7.5, RF:-7.5, "1B":-12.5, DH:-17.5};
const PIT_RPW = 9.5, PIT_REP_CUSHION = 0.85;   // replacement arm ≈ 0.85 R/9 worse than league avg
// League-average wOBA/FIP baseline for WAR, computed from a single level's stats (MLB/AAA/COL)
// so each league's WAR is graded against its own run environment.
function leagueWarCtx(G, level){
  level = level||"MLB";
  let wn=0,wd=0,fn=0,fd=0;
  // league rate aggregates for OPS+/ERA+/wRC+ (one shared scan)
  let obH=0,obD=0, tb=0, slAB=0, er=0, outs=0;
  Object.values(G.players).forEach(p=>{
    const s=levelStats(p,level);
    if(!p.isP){ const pa=s.AB+s.BB+(s.SF||0)+(s.HBP||0); if(pa<=0) return; const b1=s.H-s._2B-s._3B-s.HR;
      wn += 0.69*s.BB+0.72*(s.HBP||0)+0.89*b1+1.27*s._2B+1.62*s._3B+2.10*s.HR; wd += pa;
      obH += s.H+s.BB+(s.HBP||0); obD += s.AB+s.BB+(s.HBP||0)+(s.SF||0);
      tb += b1+2*s._2B+3*s._3B+4*s.HR; slAB += s.AB; }
    else { if(!s.OUT) return; fn += 13*(s.HRA||0)+3*(s.BB+(s.HBP||0))-2*s.SO; fd += s.OUT/3; er += s.ER; outs += s.OUT; }
  });
  return { lgwOBA: wd?wn/wd:0.320, lgFIP: (fd?fn/fd:0)+FIP_CONST,
           lgOBP: obD?obH/obD:0.320, lgSLG: slAB?tb/slAB:0.400, lgERA: outs?er*27/outs:4.30 };
}
// park-adjusted, league-normalized index stats (100 = league average). pf = the player's home
// park factor; he plays ~half his games there, so the adjustment is half-strength.
const parkAdj = pf => 1 + ((pf||1)-1)*0.5;
const opsPlus = (s, ctx, pf) => { if(!ctx||!ctx.lgOBP||!ctx.lgSLG) return null;
  return Math.round(100*(obp(s)/ctx.lgOBP + slg(s)/ctx.lgSLG - 1) / parkAdj(pf)); };
const wrcPlus = (s, ctx, pf) => { if(!ctx||!ctx.lgwOBA) return null;
  return Math.round(100*(woba(s)/ctx.lgwOBA) / parkAdj(pf)); };
const eraPlus = (s, ctx, pf) => { if(!ctx||!ctx.lgERA) return null; const e=era(s);
  return e<=0 ? 999 : Math.min(999, Math.round(100*ctx.lgERA/e * parkAdj(pf))); };
function warOf(p, ctx, st){
  const s = st||p.stats;
  if(p.isP){ if(!s.OUT) return 0; const ipv=s.OUT/3;
    return (((ctx.lgFIP+PIT_REP_CUSHION)-fip(s))/PIT_RPW)*(ipv/9); }
  const pa = s.AB+s.BB+(s.SF||0)+(s.HBP||0); if(!pa) return 0;
  const wRAA = ((woba(s)-ctx.lgwOBA)/WOBA_SCALE)*pa;
  const g   = s.G || Math.round(pa/4.3);
  const pos = (POS_ADJ[p.pos]!=null?POS_ADJ[p.pos]:0)*(g/162);
  const def = ((p.def||50)-50)*0.20*(g/162);
  const rep = 20*(pa/600);
  return (wRAA+pos+def+rep)/RUNS_PER_WIN;
}
const f3 = v => v.toFixed(3).replace(/^0/,"");
const f1w = v => (v>=0?"+":"")+v.toFixed(1);   // signed 1-dp (WAR)
const f2 = v => v.toFixed(2);
const f1 = v => v.toFixed(1);

/* ----------------------------- contracts ------------------------------- */
// A contract is a per-year guaranteed-salary schedule `p.contract` (cap hits; length =
// years left), with `p.salary` mirroring contract[0] (the current-year hit everything
// reads). `p.incentives` is a list of off-cap, stat-based bonuses {stat, need, amount}.
const STAT_INCENTIVES = {
  HR:  {label:"HR",            hit:true,  get:s=>s.HR,    units:""},
  RBI: {label:"RBI",           hit:true,  get:s=>s.RBI,   units:""},
  H:   {label:"Hits",          hit:true,  get:s=>s.H,     units:""},
  R:   {label:"Runs",          hit:true,  get:s=>s.R,     units:""},
  SB:  {label:"Steals",        hit:true,  get:s=>s.SB,    units:""},
  AVG: {label:"AVG (pts)",     hit:true,  get:s=>Math.round(avg(s)*1000), units:" (e.g. 300)"},
  W:   {label:"Wins",          hit:false, get:s=>s.W,     units:""},
  SO:  {label:"Strikeouts",    hit:false, get:s=>s.SO,    units:""},
  SV:  {label:"Saves",         hit:false, get:s=>s.SV,    units:""},
  QS:  {label:"Quality Starts",hit:false, get:s=>s.QS||0, units:""},
  IP:  {label:"Innings",       hit:false, get:s=>Math.floor((s.OUT||0)/3), units:""},
};
function incentivesPerYear(p){ return (p.incentives||[]).reduce((a,i)=>a+(i.amount||0),0); }
function contractTotal(p){ return (p.contract||[p.salary]).reduce((a,b)=>a+b,0); }
// what the player is looking for (annual value + preferred length)
function contractAsk(p){
  return { fairAAV: salaryFor(p), years: p.age>=34?2 : p.age>=31?3 : 4 };
}
// What `aav`/yr the player requires for `years`, given a price `factor` (hometown
// discount <1 when winning, premium >1 when losing). Short deals push the AAV up.
function requiredAAV(p, years, factor){
  const ask=contractAsk(p);
  const yearAdj = clamp(1 + (ask.years - years)*0.04, 0.85, 1.20);
  return ask.fairAAV * (factor||1) * yearAdj;
}
// Will the player accept `aav`/yr for `years` with `incTotal`/yr of incentives?
// Incentives count at HALF toward his ask, so you can trade guaranteed $ for upside.
function willSign(p, aav, years, incTotal, factor){
  return (aav + 0.5*(incTotal||0)) >= requiredAAV(p, years, factor)*0.98;
}
// install a flat (even) contract schedule + incentives onto a player
function setContract(p, aav, years, incentives){
  p.salary = clamp(round(aav*10)/10, 0.5, 70);
  p.years = Math.max(1, years|0);
  p.contract = Array(p.years).fill(p.salary);
  p.incentives = incentives ? incentives.slice() : [];
  p.incentive = incentivesPerYear(p);   // back-compat aggregate (Finances/PlayerModal)
}
// ensure a player has the per-year contract fields (migration / freshly-generated)
function ensureContract(p){
  if(!Array.isArray(p.contract) || p.contract.length===0)
    p.contract = Array(Math.max(1, p.years||1)).fill(p.salary!=null?p.salary:0.7);
  p.years = p.contract.length;
  p.salary = p.contract[0];
  if(!Array.isArray(p.incentives))
    p.incentives = (p.incentive>0) ? [{stat:"_flat", need:0, amount:p.incentive, label:"bonus"}] : [];
  p.incentive = incentivesPerYear(p);
}
// a label like "4y · $20.3M/yr ($81.2M)"
function contractLabel(p){
  const yrs=p.years||(p.contract?p.contract.length:1);
  const tot=contractTotal(p);
  return `${yrs}y · ${money(p.salary)}/yr${yrs>1?` (${money(tot)})`:""}`;
}

const SAVE_KEY = "pocketgm_baseball_v2";
const SAVE_VERSION = 4;
// New saves are written compressed with this marker prefix; legacy saves are plain JSON
// (which always start with "{"), so loadGame can tell them apart and read either.
const SAVE_LZ_PREFIX = "LZ16:";
// --- multi-slot saves: each franchise lives under its own key; an index lists them all ---
const SLOTS_KEY = "pocketgm_slots";
const slotKey = id => "pocketgm_slot_" + id;
// Big save blobs live in IndexedDB (quota is hundreds of MB to GBs, vs the ~5MB
// localStorage cap that forced trimHistories/emergency pruning). Only the tiny slot
// INDEX (names, seasons) stays in localStorage so the Main Menu lists saves synchronously.
const IDB_NAME="pgbaseball_db", IDB_STORE="saves";
let _idbPromise=null;
function idb(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((res,rej)=>{
    try{
      if(!window.indexedDB){ rej(new Error("no idb")); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error);
    }catch(e){ rej(e); }
  });
  return _idbPromise;
}
function idbSet(key,val){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(val,key); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error("abort")); })); }
function idbGet(key){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,"readonly"); const rq=tx.objectStore(IDB_STORE).get(key); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); })); }

function writeKey(key, G){
  try{ localStorage.setItem(key, SAVE_LZ_PREFIX + LZString.compressToUTF16(JSON.stringify(G))); return true; }
  catch(e){
    // last-ditch backstop on the ~5MB quota: aggressively trim, then retry; never lose data silently
    try{ trimHistories(G, 12, 1); if(typeof pruneFreeAgents==="function") pruneFreeAgents(G, 140);
      localStorage.setItem(key, SAVE_LZ_PREFIX + LZString.compressToUTF16(JSON.stringify(G))); return true; }
    catch(e2){ console.error("Save failed — storage full:", e2); return false; }
  }
}
function decodeSaveStr(s){
  if(s==null) return null;
  const json = s.startsWith(SAVE_LZ_PREFIX) ? LZString.decompressFromUTF16(s.slice(SAVE_LZ_PREFIX.length)) : s;
  return json ? JSON.parse(json) : null;
}
function readKey(key){
  try{ const g = decodeSaveStr(localStorage.getItem(key)); return g ? migrate(g) : null; }
  catch(e){ return null; }
}
function listSlots(){ try{ return JSON.parse(localStorage.getItem(SLOTS_KEY)||"[]"); }catch(e){ return []; } }
function writeSlotIndex(slots){ try{ localStorage.setItem(SLOTS_KEY, JSON.stringify(slots)); }catch(e){} }
function updateSlotIndex(G){
  const u = G.teams && G.teams[G.userTeamId];
  const slots = listSlots().filter(s=>s.id!==G.slotId);
  slots.unshift({ id:G.slotId, name:(u?u.name:"Franchise"), abbr:(u?u.abbr:"?"),
    season:G.season, day:(G.day||0), phase:G.phase, ts:Date.now() });
  writeSlotIndex(slots);
}
// Save a game to ITS slot (creating one if needed). The index updates synchronously
// (menu correctness); the blob write is async. Stores the RAW object — IndexedDB
// structured-clones it, far cheaper than JSON+LZ on a deep franchise.
async function saveGame(G){
  if(!G) return false;
  if(!G.slotId) G.slotId = "s"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
  updateSlotIndex(G);
  try{
    await idbSet(slotKey(G.slotId), G);
    try{ localStorage.removeItem(slotKey(G.slotId)); }catch(e){}   // reclaim any legacy localStorage copy
    return true;
  }catch(idbErr){
    // IndexedDB unavailable — fall back to compressed localStorage (small saves only)
    return writeKey(slotKey(G.slotId), G);
  }
}
async function loadSlot(id){
  try{
    let raw=null;
    try{ raw = await idbGet(slotKey(id)); }catch(e){}
    if(raw==null){ try{ raw = localStorage.getItem(slotKey(id)); }catch(e){} }   // legacy fallback
    if(raw==null) return null;
    // new saves are stored as raw objects; older ones as (possibly compressed) strings
    const g = (typeof raw === "object") ? raw : decodeSaveStr(raw);
    return g ? migrate(g) : null;
  }catch(e){ return null; }
}
function deleteSlot(id){
  writeSlotIndex(listSlots().filter(s=>s.id!==id));   // sync, so the menu refresh sees it gone
  idbDel(slotKey(id));
  try{ localStorage.removeItem(slotKey(id)); }catch(e){}
}
// One-time: move any legacy localStorage save blobs into IndexedDB and free the
// localStorage space, so an almost-full localStorage never blocks anything again.
async function migrateSavesToIDB(){
  try{
    const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf("pocketgm_slot_")===0) keys.push(k); }
    for(const k of keys){
      const blob=localStorage.getItem(k); if(blob==null) continue;
      try{ await idbSet(k, blob); localStorage.removeItem(k); }catch(e){ /* keep it in localStorage if IDB write fails */ }
    }
  }catch(e){}
}
// One-time migration: fold a pre-slots single autosave into a slot so existing franchises survive.
function migrateLegacySave(){
  if(listSlots().length) return;
  const g = readKey(SAVE_KEY);
  if(g){ g.slotId = g.slotId || "legacy"; saveGame(g); }
}
// legacy single-slot helpers (kept for back-compat / the old autosave key)
function loadGame(){ return readKey(SAVE_KEY); }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

// League news / transaction wire. Every notable move (signing, trade, call-up,
// draft pick, award, title) is logged here so the franchise keeps a persistent,
// scrollable history. Newest first; capped so saves stay small.
function logNews(G, type, msg, teamId){
  if(!G) return;
  if(!Array.isArray(G.news)) G.news=[];
  G.news.unshift({ season:G.season, day:(G.day||0)+1, phase:G.phase, type, msg, teamId: teamId==null?null:teamId });
  if(G.news.length>250) G.news.length=250;
}
// permanent trade ledger (separate from the capped news wire) — every executed
// trade in franchise history, browsable at the bottom of the Trades tab
function logTrade(G, desc){
  (G.tradeLog=G.tradeLog||[]).unshift({ season:G.season, day:(G.day||0)+1, desc });
  if(G.tradeLog.length>300) G.tradeLog.length=300;
}

// Forward-compatibility: backfill fields added by newer versions so an existing
// franchise keeps loading (and playing) across updates instead of being wiped.
function migrate(G){
  if(!G || !Array.isArray(G.teams)) return G;
  try{
    // CRITICAL: resume the in-memory uid() counter past every id already in this save,
    // BEFORE anything generates new players. uid() restarts at 1 each page load; without
    // this, draft/refill/FA players reuse low ids and overwrite existing players in the
    // dict (the "my players disappear every season" bug). Scan rostered players + draft class.
    let maxId = 0;
    Object.values(G.players||{}).forEach(p=>{ if(typeof p.id==="number" && p.id>maxId) maxId=p.id; });
    (G.draftClass||[]).forEach(p=>{ if(p && typeof p.id==="number" && p.id>maxId) maxId=p.id; });
    uid.atLeast(maxId);
    if(!G.aaaTeams){ G.aaaTeams = G.teams.map(t=>makeAAATeam(t)); }
    if(!G.aaaSchedule) G.aaaSchedule = buildSchedule(G.aaaTeams);
    // college league (amateur draft pipeline) — build it for saves created before this feature
    if(!Array.isArray(G.collegeTeams) || !G.collegeTeams.length){
      G.collegeTeams = COLLEGE_DEFS.map((d,i)=>makeCollegeTeam(d,i));
      G.collegeTeams.forEach(ct=>buildCollegeRoster(ct.id).forEach(p=>{ G.players[p.id]=p; }));
      G.collegeTeams.forEach(ct=>autoSetLineups(ct, G.players));
      G.collegeSchedule = buildSchedule(G.collegeTeams, collegeGamesBetween);
      padSchedules(G.schedule, G.aaaSchedule, G.collegeSchedule);
    }

    if(!G.picks) G.picks = buildPicksMulti((G.season||2026)+1, G.teams);

    if(Array.isArray(G.picks) && G.picks.length){
      const minS=Math.min(...G.picks.map(p=>p.season));
      for(let y=minS; y<minS+PICK_YEARS; y++){ if(!G.picks.some(p=>p.season===y)) G.picks.push(...buildPicks(y, G.teams)); }
    }
    if(!Array.isArray(G.draftPicks)) G.draftPicks = [];
    if(!Array.isArray(G.awardHistory)) G.awardHistory = [];
    if(!Array.isArray(G.news)) G.news = [];
    if(!Array.isArray(G.tradeOffers)) G.tradeOffers = [];

    if(G.tradeDeadline==null) G.tradeDeadline = Math.round((G.schedule?G.schedule.length:224)*0.58);
    if(!Array.isArray(G.hof)) G.hof = [];
    if(!Array.isArray(G.hofBallot)) G.hofBallot = [];
    (G.teams||[]).forEach((t,i)=>{ if(!t.ballpark) t.ballpark = makeBallpark(i); else { if(t.ballpark.hand==null) t.ballpark.hand = ballparkHand(t.ballpark.name); if(t.ballpark.capacity==null) t.ballpark.capacity = rint(33,47)*1000; } if(!t.academy) t.academy={level:1}; ensureCommercial(t); });   // backfill ballparks + academy + commercial slots

    if(!G.rules){

    G.teams.forEach(t=>{ if(!Array.isArray(t.form)) t.form=[]; if(t.fanMood==null) t.fanMood=60; if(!t.identity) t.identity=pick(["normal","normal","normal","aggressive","aggressive","conservative"]); });
    // one-time trait seeding for rosters that predate traits
    if(!G._traitsSeeded){ Object.values(G.players).forEach(p=>{ if(!p.trait) maybeTrait(p); }); G._traitsSeeded=true; }
    if(!Array.isArray(G.champions)) G.champions = G.champion ? [{season:G.champion.season, id:G.champion.id}] : [];
    // de-dupe any accidental repeat champions (one entry per season; keep the winner)
    if(Array.isArray(G.champions)){
      const seen=new Set();
      G.champions = G.champions.filter(c=>{ if(c==null||seen.has(c.season)) return false; seen.add(c.season); return true; });
    }
    if(G.teams.some(t=>t.rivalId==null)) assignRivals(G.teams);
    // One-time retroactive backfill for saves that predate rings/league records:
    // award championship rings from the teams a player actually suited up for (per
    // p.history) in each title season, and seed G.leagueRecords from the best of every
    // club's franchise records. Idempotent (rings dedupe via Set, league records only
    // fill empty slots). Flag is versioned: bump it to force a corrected re-run on saves
    // that already ran an earlier version (v2 adds the current/just-crowned champion).
    if(!G._honorsBackfilled2){
      const abbrById={}; G.teams.forEach(t=>abbrById[t.id]=t.abbr);
      const champBySeason={}; (G.champions||[]).forEach(c=>{ if(c) champBySeason[c.season]=abbrById[c.id]; });
      Object.values(G.players||{}).forEach(p=>{
        const got=new Set(p.rings||[]);
        (p.history||[]).forEach(e=>{
          const champ=champBySeason[e.season]; if(!champ) return;
          // an MLB stint (AAA labels end " AAA") with that year's champion = a ring
          if((e.teams||[]).some(tl=>!/ AAA$/.test(tl) && tl===champ)) got.add(e.season);
        });
        // the latest title may be crowned but not yet archived in history (offseason not
        // processed) — credit the current champion's current MLB roster for that season.
        if(G.champion && p.teamId===G.champion.id) got.add(G.champion.season);
        if(got.size) p.rings=[...got].sort((a,b)=>a-b);
      });
      const lr=G.leagueRecords=G.leagueRecords||{};
      ["teamWins","HR","RBI","H","R","SB","AVG","pW","pK","pSV","ERA"].forEach(k=>{
        let best=null,bteam=null;
        G.teams.forEach(t=>{ const r=(t.records||{})[k]; if(!r) return;
          const better = k==="ERA" ? (best==null||r.value<best.value) : (best==null||r.value>best.value);
          if(better){ best=r; bteam=t.abbr; }
        });
        if(best && !lr[k]) lr[k]={ value:best.value, holder:best.holder, team:bteam, season:best.season };
      });
      G._honorsBackfilled=true; G._honorsBackfilled2=true;
    }
    // Records v2: three tiers (game/season/career). Carry the old flat leagueRecords into
    // .season, seed .career from current players' running totals; .game fills in going forward.
    if(!G.records){
      G.records = { game:{}, season:(G.leagueRecords||{}), career:{} };
      recordCareerRecords(G);
    }
    Object.values(G.players||{}).forEach(p=>{ if(p.peakOvr==null) p.peakOvr=p.ovr; if(p.num==null) p.num=rint(1,99); if(p.isP && p.gb==null) p.gb=+clamp(gauss(0.48,0.07),0.30,0.66).toFixed(3); ensureContract(p); });
    const fixTeam = t=>{
      if(!t.pos) t.pos = {};
      if(!Array.isArray(t.lineup)) t.lineup = [];
      if(!Array.isArray(t.rotation)) t.rotation = [];
      if(!Array.isArray(t.history)) t.history = [];
      // guarantee a 5-man rotation and a bullpen priority list for older saves
      if(t.rotation.length<5 || !t.bullpen) ensureLineup(t, G.players);
      if(!t.bullpen) t.bullpen = bullpenOrder(t, G.players);
    };
    G.teams.forEach(fixTeam);
    G.aaaTeams.forEach(fixTeam);
    // one-time AI roster cleanup: promote each AI org's best talent out of AAA (skip the
    // user's club so their own call-up decisions stand). Re-set the touched lineups.
    if(!G._aiAligned){
      G.teams.forEach(t=>{ if(t.id!==G.userTeamId){ aiAlignOrg(G, t.id); autoSetLineups(t, G.players); autoSetLineups(G.aaaTeams[t.id], G.players); } });
      G._aiAligned = true;
    }
    // one-time cleanup for saves bloated by seasons of un-pruned free agents/prospects
    // (sim speed scales with total player count). Only fires on an already-large pool.
    if(Array.isArray(G.freeAgents) && Object.keys(G.players).length>2800){
      G.aaaTeams.forEach(t=>{ if(typeof AAA_CAP!=="undefined") trimRoster(G,t,AAA_CAP); });
      pruneFreeAgents(G);
    }
    // Shrink bloated saves on load: deep franchises accumulated unbounded per-player history that
    // blew past the localStorage quota (the "refresh reverts me to last season / deletes records"
    // bug). Trimming here rescues an existing save the first time it's reopened. Idempotent.
    trimHistories(G);
    // normalize playoff series to the game-by-game shape (hw/lw/games)
    if(G.playoffs){
      const po=G.playoffs;
      const norm=(s,need)=>{ if(!s) return;
        if(!Array.isArray(s.games)) s.games=[];
        if(typeof s.hw!=='number') s.hw = (s.done&&s.winner===s.hi)?need:0;
        if(typeof s.lw!=='number') s.lw = (s.done&&s.winner===s.lo)?need:0;
      };
      ["Empire","Pioneer"].forEach(lg=>{ const b=po[lg]; if(!b) return;
        if(b.rounds) b.rounds.forEach(rd=>(rd||[]).forEach(s=>norm(s,4)));
        else { (b.wc||[]).forEach(s=>norm(s,1)); (b.ds||[]).forEach(s=>norm(s,3)); norm(b.cs,4); }
      });
      norm(po.ws,4);
    }
    G.version = SAVE_VERSION;
  }catch(e){
    // Best-effort: a partial migration still beats a crash, so we keep the
    // save and carry on. But swallowing this silently is how a corrupt
    // franchise looks like a gameplay bug three sessions later — leave a
    // trail, and stamp the save so the damage is visible after the fact.
    console.error("[pocketgm] save migration failed; loading partially migrated save", e);
    try{ G.migrationError = { message: String(e && e.message || e), at: Date.now(), from: G.version, to: SAVE_VERSION }; }catch(_){}
  }
  return G;
}

// Manual backup: download the whole franchise as a JSON file (user-initiated click)
function exportSave(G){
  try{
    const data = JSON.stringify(G);
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const u = G.teams[G.userTeamId];
    a.href = url;
    a.download = `pocketgm-${u?u.abbr:"save"}-${G.season}-day${(G.day||0)+1}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    return true;
  }catch(e){ return false; }
}
function importSave(file, onLoad){
  const r = new FileReader();
  r.onload = e=>{
    try{ const g = migrate(JSON.parse(e.target.result));
      if(g && Array.isArray(g.teams)){ onLoad(g); } else { alert("That file isn't a valid Pocket GM save."); }
    }catch(err){ alert("Couldn't read that save file."); }
  };
  r.readAsText(file);
}

/* ----------------------------- new game -------------------------------- */
function newGame(userTeamId, opts={}){
  const { teams, aaaTeams, collegeTeams, players } = generateLeague(userTeamId, opts);
  assignRivals(teams);
  // rules chosen on the Splash screen apply to the very first calendar
  const startRules = Object.assign({}, RULES_DEFAULT, (opts && opts.rules) || {});
  const gb = gamesForLength(startRules.seasonLen);
  const cgb = startRules.seasonLen>=162 ? collegeGamesBetween
            : (a,b)=>{ const n=collegeGamesBetween(a,b); const f=startRules.seasonLen/162; return n?Math.max(2,Math.round(n*f)):0; };
  const schedule = buildSchedule(teams, gb);
  const aaaSchedule = buildSchedule(aaaTeams, gb);
  const collegeSchedule = buildSchedule(collegeTeams, cgb);
  padSchedules(schedule, aaaSchedule, collegeSchedule);
  const G = {
    season: 2026, day: 0, phase: "regular", version: SAVE_VERSION,
    seed: (opts && opts.seed!=null && !Number.isNaN(opts.seed)) ? (opts.seed>>>0) : null,
    userTeamId, teams, aaaTeams, collegeTeams, players, schedule, aaaSchedule, collegeSchedule,
    picks: buildPicksMulti(2027, teams),   // next 3 drafts' picks are all tradeable
    freeAgents: [], draftClass: [], draftPicks: [], draftPick: 0,
    playoffs: null, champion: null, champions: [], hof: [], log: [], news: [],
    tradeDeadline: Math.round(schedule.length*0.58), tradeOffers: [], waivers: [],
    settings: { injuries: true }, gmStrikes: 0, gmFired: null,
    rules: startRules, pendingRules: null,
    difficulty: (opts && opts.difficulty) || "normal",
  };
  setOwnerMandate(G);   // owner sets the first-season mandate
  // commercial world starts live: AI clubs have deals, the user has offers waiting
  G.teams.forEach(t=>{ if(t.id!==userTeamId) SPONSOR_SLOTS.forEach(s=>{ if(!t.sponsors[s]) t.sponsors[s]=mkSponsorOffer(t,s); }); });
  genSponsorOffers(G);
  ensureGMs(G);         // every rival club gets a named GM from day one
  return G;
}

// pair up teams into rivalries: two pairs within each division, plus the odd-team-out
// in each division gets a cross-league rival in the mirror division.
function assignRivals(teams){
  const byDiv={};
  teams.forEach(t=>{ const k=t.league+"|"+t.division; (byDiv[k]=byDiv[k]||[]).push(t); });
  Object.values(byDiv).forEach(arr=>{
    arr.sort((a,b)=>a.id-b.id);
    if(arr[0]&&arr[1]){ arr[0].rivalId=arr[1].id; arr[1].rivalId=arr[0].id; }
    if(arr[2]&&arr[3]){ arr[2].rivalId=arr[3].id; arr[3].rivalId=arr[2].id; }
  });
  ["East","Central","West"].forEach(d=>{
    const a=byDiv["Empire|"+d], b=byDiv["Pioneer|"+d];
    if(a&&b&&a[4]&&b[4]){ a[4].rivalId=b[4].id; b[4].rivalId=a[4].id; }
  });
  teams.forEach(t=>{ if(t.rivalId==null){ const dm=teams.find(o=>o.id!==t.id && o.league===t.league && o.division===t.division); if(dm) t.rivalId=dm.id; } });
}

  const [showRules, setShowRules] = useState(false);
  const [palette, setPalette] = useState(false);
  const migratedRef = useRef(false);
  if(!migratedRef.current){ migrateLegacySave(); migratedRef.current=true; }   // fold a pre-slots autosave into a slot (once, before the menu reads slots)
  // Non-blocking autosave: commit updates React state immediately and debounces the
  // async IndexedDB blob write; flushSave forces the pending write out. Flushed on
  // tab-hide / page-close / back-to-menu so nothing is ever lost.
  const saveRef = useRef({ g:null, timer:null });
  const flushSave = () => { const s=saveRef.current; if(s.timer){ clearTimeout(s.timer); s.timer=null; } if(s.g){ const g=s.g; s.g=null; saveGame(g).then(ok=>{ if(!ok) tShow("⚠️ Save failed — use Save File to back up now."); }); } };
  const commit = g => { if(!g.slotId) g.slotId = "s"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36); setG({...g}); saveRef.current.g=g; if(!saveRef.current.timer){ saveRef.current.timer=setTimeout(()=>{ saveRef.current.timer=null; flushSave(); }, 300); } };
  const tShow = msg => { setToast(msg); setTimeout(()=>setToast(""),2500); };
  const openSlot = id => { loadSlot(id).then(g=>{ if(g){ setG(g); setTab("hub"); setScreen("play"); } else tShow("Couldn't load that save."); }); };
  const toMenu = () => { flushSave(); if(G) saveGame(G); setG(null); setScreen("menu"); };   // autosave on the way out
  React.useEffect(()=>{ migrateSavesToIDB(); const h=()=>{ if(document.visibilityState==="hidden") flushSave(); }; const b=()=>flushSave(); document.addEventListener("visibilitychange",h); window.addEventListener("pagehide",b); window.addEventListener("beforeunload",b); return ()=>{ document.removeEventListener("visibilitychange",h); window.removeEventListener("pagehide",b); window.removeEventListener("beforeunload",b); }; }, []);
  // Keyboard: ⌘K / Ctrl-K opens the jump-to palette. Ignored while typing in a field
  // so it never steals a keystroke from the seed box or a contract negotiation.
  React.useEffect(()=>{
    const onKey = e => {
      const el = e.target;
      const typing = el && (el.tagName==="INPUT" || el.tagName==="TEXTAREA" || el.tagName==="SELECT" || el.isContentEditable);
      if((e.metaKey||e.ctrlKey) && (e.key==="k"||e.key==="K")){ e.preventDefault(); setPalette(p=>!p); return; }
      if(typing) return;
      if(e.key==="?"){ e.preventDefault(); setPalette(true); }
    };
    window.addEventListener("keydown", onKey);
    return ()=>window.removeEventListener("keydown", onKey);
  }, []);

  if(screen==="menu") return <MainMenu onLoad={openSlot} onNew={()=>setScreen("splash")} />;
  if(screen==="splash" || !G) return <Splash onStart={(id,opts)=>{
    const g=newGame(id,opts); g.slotId=null;
    if(opts && opts.fantasy){ startFantasyDraft(g); fantasyAutoUntilUser(g); }
    commit(g); setTab("hub"); setScreen("play");
  }} onBack={listSlots().length?()=>setScreen("menu"):null} />;
  if(G.gmFired) return <GMFired G={G} onNew={()=>{ saveGame(G); setG(null); setScreen("splash"); }} onMenu={toMenu} />;
  // A fantasy draft takes over the whole screen until every club is built.
  if(G.fantasyDraft && !G.fantasyDraft.done)
    return <PlayerCtx.Provider value={p=>setGlobalPlayer(p)}>
      <FantasyDraftScreen G={G} commit={commit} tShow={tShow} />
      {globalPlayer && <PlayerModal p={globalPlayer} team={teamById(G,globalPlayer.teamId)} G={G} onClose={()=>setGlobalPlayer(null)} />}
      {toast && <div className="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#16213a] border border-[#1d2940] px-4 py-2 rounded-lg text-sm z-50">{toast}</div>}
    </PlayerCtx.Provider>;

  const user = G.teams[G.userTeamId];
  const players = G.players;
  SCOUT_LVL = user.scouting || 1;   // the user's scouting network lifts the rating fog everywhere

  // Two-level navigation. A flat strip of 18 tabs was unreadable (and brutal on a
  // phone), so tabs live in five sections; the section row is always visible and the
  // tab row shows only the active section. `groupOf` keeps the section in sync when
  // something else navigates for you (Hub shortcuts, the command palette, ⌘K).
  const GROUPS = navGroups(G);
  const groupOf = k => (GROUPS.find(g=>g.tabs.some(t=>t[0]===k)) || GROUPS[0]).key;
  const activeGroup = groupOf(tab);
  const curGroup = GROUPS.find(g=>g.key===activeGroup) || GROUPS[0];

  return (
    <PlayerCtx.Provider value={p=>setGlobalPlayer(p)}>
    <div className="min-h-screen">
      {/* Your club's crest colour bleeds into the chrome — a thin identity stripe under
          the header and a tinted header wash, so the app reads as YOUR franchise. */}
      <header className="sticky top-0 z-20 bg-[#0d1526] border-b border-[#1d2940] px-4 py-3 flex items-center gap-3 flex-wrap relative"
        style={{ backgroundImage:`linear-gradient(90deg, ${crestColors(user.id)[0]}22, transparent 55%)` }}>
        <div className="absolute left-0 right-0 bottom-0 h-[2px]"
          style={{ background:`linear-gradient(90deg, ${crestColors(user.id)[0]}, ${crestColors(user.id)[1]}, transparent)` }} />
        <div className="font-black text-lg tracking-tight">⚾ POCKET <span className="text-emerald-400">GM</span></div>
        <div className="text-sm text-slate-400"><Crest t={user} size={18}/>{user.name}</div>
        <div className="ml-auto flex items-center gap-2 text-sm">
          <Badge>{G.season}</Badge>
          <Badge>{G.phase==="regular"?`Day ${G.day+1}/${G.schedule.length}`:G.phase.toUpperCase()}</Badge>
          <Badge>{user.w}-{user.l}</Badge>
          <button onClick={()=>{ if(exportSave(G)) tShow("💾 Save file downloaded"); }}
            className="px-2 py-1 rounded bg-[#16213a] hover:bg-[#1c2c4a] text-slate-200 text-xs">Save File</button>
          <label className="px-2 py-1 rounded bg-[#16213a] hover:bg-[#1c2c4a] text-slate-200 text-xs cursor-pointer">
            Load File
            <input type="file" accept="application/json,.json" className="hidden"
              onChange={e=>{ const f=e.target.files[0]; if(f) importSave(f, g=>{ g.slotId=null; commit(g); setTab("hub"); setScreen("play"); tShow("✅ Save loaded as a new slot"); }); e.target.value=""; }} />
          </label>
          <button onClick={()=>setShowRules(true)}
            className="px-2 py-1 rounded bg-[#16213a] hover:bg-[#1c2c4a] text-slate-200 text-xs" title="League rules — season length, playoffs, DH, salary cap">📋 Rules</button>
          <button onClick={()=>setShowSettings(true)}
            className="px-2 py-1 rounded bg-[#16213a] hover:bg-[#1c2c4a] text-slate-200 text-xs" title="Settings">⚙</button>
          <button onClick={toMenu}
            className="px-2 py-1 rounded bg-[#16213a] hover:bg-[#1c2c4a] text-slate-200 text-xs" title="Autosaves, then back to your franchises">☰ Menu</button>
        </div>
      </header>

      <nav className="bg-[#0b1220] border-b border-[#15203a] sticky top-[57px] z-10">
        <div className="flex gap-1 px-3 pt-2 overflow-x-auto">
          {GROUPS.map(g=>(
            <button key={g.key} onClick={()=>setTab(g.tabs[0][0])}
              className={"px-3 py-1.5 rounded-t-md text-sm whitespace-nowrap font-semibold border-b-2 "+
                (activeGroup===g.key ? "text-emerald-300 border-emerald-400" : "text-slate-400 border-transparent hover:text-slate-200")}>
              {g.label}
            </button>
          ))}
          <button onClick={()=>setPalette(true)} title="Jump to… (⌘K)"
            className="ml-auto px-2 py-1 rounded text-xs text-slate-500 hover:text-slate-200 whitespace-nowrap self-center">⌘K</button>
        </div>
        <div className="flex gap-1 px-3 py-2 overflow-x-auto">
          {curGroup.tabs.map(([k,label])=>(
            <button key={k} onClick={()=>setTab(k)}
              className={"px-3 py-1.5 rounded-md text-sm whitespace-nowrap "+(tab===k?"bg-emerald-500 text-slate-900 font-semibold":"text-slate-300 hover:bg-[#16213a]")}>
              {label}
            </button>
          ))}
        </div>
      </nav>

      <main className="p-4 max-w-6xl mx-auto">
        {tab==="hub" && <Hub G={G} commit={commit} tShow={tShow} setTab={setTab} />}
        {tab==="roster" && <Roster G={G} team={user} commit={commit} />}
        {tab==="lineup" && <LineupEditor G={G} commit={commit} tShow={tShow} />}
        {tab==="standings" && <Standings G={G} />}
        {tab==="players" && <PlayersBrowser G={G} commit={commit} tShow={tShow} setTab={setTab} setTradeFocus={setTradeFocus} />}
        {tab==="aaa" && <AAALeague G={G} />}
        {tab==="college" && <CollegeLeague G={G} />}
        {tab==="stats" && <Leaders G={G} />}
        {tab==="awards" && <Awards G={G} />}
        {tab==="hof" && <HallOfFame G={G} />}
        {tab==="bacup" && <BACup G={G} commit={commit} tShow={tShow} />}
        {tab==="news" && <NewsFeed G={G} />}
        {tab==="schedule" && <Schedule G={G} />}
        {tab==="trades" && <Trades G={G} commit={commit} tShow={tShow} tradeFocus={tradeFocus} setTradeFocus={setTradeFocus} />}
        {tab==="fa" && <FreeAgency G={G} commit={commit} tShow={tShow} />}
        {tab==="finances" && <Finances G={G} commit={commit} tShow={tShow} />}
        {tab==="draft" && <Draft G={G} commit={commit} tShow={tShow} setTab={setTab} />}
        {tab==="playoffs" && <Playoffs G={G} commit={commit} tShow={tShow} />}
      </main>

      {toast && <div className="fixed bottom-4 left-1/2 -translate-x-1/2 bg-emerald-500 text-slate-900 px-4 py-2 rounded-lg font-semibold shadow-lg z-50">{toast}</div>}
      {globalPlayer && <PlayerModal p={globalPlayer} team={teamById(G, globalPlayer.teamId)} G={G} onClose={()=>setGlobalPlayer(null)} />}
      {showSettings && <SettingsModal G={G} commit={commit} tShow={tShow} onClose={()=>setShowSettings(false)} />}
      {showRules && <LeagueRulesModal G={G} commit={commit} tShow={tShow} onClose={()=>setShowRules(false)} />}
      {palette && <CommandPalette G={G} onGo={setTab} onClose={()=>setPalette(false)} />}
    </div>
    </PlayerCtx.Provider>
  );
}

function Badge({children}){ return <span className="px-2 py-1 rounded bg-[#16213a] text-slate-200 tnum text-xs">{children}</span>; }
function Card({children, className=""}){ return <div className={"bg-[#101a30] border border-[#1d2940] rounded-xl p-4 "+className}>{children}</div>; }
function OvrPill({v}){
  const c = v>=80?"bg-emerald-500 text-slate-900":v>=70?"bg-lime-500 text-slate-900":v>=60?"bg-yellow-500 text-slate-900":v>=50?"bg-orange-500 text-slate-900":"bg-slate-600 text-slate-100";
  return <span className={"inline-block w-8 text-center rounded font-bold text-xs py-0.5 "+c}>{v}</span>;
}
// procedural club crest: a shield in two deterministic colors with the club abbr —
// no assets, no save cost, same crest every load
function crestColors(id){ const r=mulberry32(((id+7)*2654435761)>>>0); const h=Math.floor(r()*360), h2=(h+140+Math.floor(r()*80))%360; return [`hsl(${h},52%,36%)`,`hsl(${h2},62%,55%)`]; }
function Crest({t, size=18}){
  if(!t) return null;
  const [c1,c2]=crestColors(t.id);
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" style={{display:"inline-block",verticalAlign:"-3px",marginRight:"4px",flexShrink:0}}>
      <path d="M16 1 L29 6 V15 C29 24 23 29 16 31 C9 29 3 24 3 15 V6 Z" fill={c1} stroke={c2} strokeWidth="1.8"/>
      <path d="M16 1 L29 6 V15 C29 24 23 29 16 31 Z" fill="rgba(255,255,255,0.10)"/>
      <text x="16" y="20.5" textAnchor="middle" fontSize="10.5" fontWeight="800" fill="#fff" fontFamily="system-ui,sans-serif">{(t.abbr||"?").slice(0,3)}</text>
    </svg>);
}
// muted "potential" chip shown beside OVR (outlined, amber) so ceiling reads at a glance
function PotPill({v}){
  return <span className="inline-block w-8 text-center rounded font-semibold text-xs py-0.5 border border-amber-500/50 text-amber-300/90" title="Potential">{v}</span>;
}
// OVR → POT pair, e.g. for tables/cards (small "→" between)
function OvrPot({p}){
  return <span className="inline-flex items-center gap-1"><OvrPill v={p.ovr}/><span className="text-slate-600 text-[10px]">→</span><PotPill v={p.pot}/></span>;
}
// ---- Scouting fog: unproven players (draft prospects, raw youngsters) show a SCOUTED rating that
// can be off; it converges to the true value as they accumulate pro games. Deterministic per id.
function scoutGames(p){ let g=(p&&p.stats&&p.stats.G)||0; ((p&&p.history)||[]).forEach(h=>{ if((h.level==="MLB"||h.level==="AAA")&&h.stats) g+=h.stats.G||0; }); return g; }
let SCOUT_LVL = 1;   // the user's scouting-network level — set in App each render; lifts the fog everywhere in the UI
function scoutConf(p){ if(!p||p.isP===undefined) return 1; let c=clamp(scoutGames(p)/170,0,1); if(p.amateur) c=Math.min(c,0.30); c=clamp(c+(p.age-18)*0.02,0,1); return clamp(c+(SCOUT_LVL-1)*0.15,0,1); }
function scoutBias(p){ return (mulberry32((p.id>>>0)||1)()*2-1)*9; }                 // a scout's fixed lean, ±9
function scoutedOvr(p){ const c=scoutConf(p); return clamp(Math.round(p.ovr + scoutBias(p)*(1-c)),20,99); }
function scoutedPot(p){ const c=scoutConf(p); return clamp(Math.round(p.pot + scoutBias(p)*(1-c)*1.1),20,99); }
function ScoutOvrPill({p}){ const c=scoutConf(p); if(c>=0.85) return <OvrPill v={p.ovr}/>;
  return <span className="inline-flex items-center" title={`Scouted estimate · ${Math.round(c*100)}% confidence — firms up with pro games`}><OvrPill v={scoutedOvr(p)}/><span className="text-slate-500 text-[9px] ml-0.5">~</span></span>; }
function ScoutPotPill({p}){ const c=scoutConf(p); if(c>=0.85) return <PotPill v={p.pot}/>;
  return <span className="inline-flex items-center" title={`Scouted ceiling · ${Math.round(c*100)}% confidence`}><PotPill v={scoutedPot(p)}/><span className="text-amber-500/60 text-[9px] ml-0.5">~</span></span>; }
function ScoutPot({p}){ const c=scoutConf(p); if(c>=0.85) return <OvrPot p={p}/>;
  return <span className="inline-flex items-center gap-1"><ScoutOvrPill p={p}/><span className="text-slate-600 text-[10px]">→</span><ScoutPotPill p={p}/></span>; }
function StatusPill({s}){
  const st = s==="ST";
  return <span className={"inline-block w-7 text-center rounded font-bold text-[10px] py-0.5 "+(st?"bg-emerald-600 text-white":"bg-slate-600 text-slate-200")}>{s}</span>;
}

/* ---------------------------- press conferences -------------------------- */
// After a result the beat writers actually care about, you get one question and three
// ways to answer. Every answer is a real trade-off — there is no free "correct" pick:
// backing the room lifts morale but lets the fans down, and vice versa.
// Fires at most once every few days so it stays an event, not a chore.
const PRESSER_COOLDOWN = 6;
const PRESSERS = {
  streakBad: {
    q: t=>`${t.abbr} have lost ${t._lossRun} straight. Is this roster good enough?`,
    options: [
      { label:"Back the players publicly", morale:+7, fans:-4,
        line:"“This group is good enough. I'd run it back tomorrow.”" },
      { label:"Say changes are coming",    morale:-8, fans:+6,
        line:"“Nobody's job is safe. We're going to look at everything.”" },
      { label:"Deflect — it's on me",      morale:+3, fans:+1,
        line:"“Put it on me. They're playing hard; I built the roster.”" },
    ],
  },
  streakGood: {
    q: t=>`${t.abbr} have won ${t._winRun} in a row. Are you contenders?`,
    options: [
      { label:"Declare yourselves buyers", morale:+6, fans:+7,
        line:"“We're going for it. Everyone in this room knows that.”" },
      { label:"Stay measured",             morale:+2, fans:-2,
        line:"“It's a long season. We've won nothing yet.”" },
      { label:"Credit the clubhouse",      morale:+9, fans:+1,
        line:"“That's them, not me. Best room I've been around.”" },
    ],
  },
  starSlump: {
    q: (t,p)=>`${p.name} is scuffling badly. Is he still your guy?`,
    options: [
      { label:"He's untouchable",       morale:+8, fans:-5,
        line:p=>`“${p.name} is our guy. That isn't changing.”` },
      { label:"Everyone's accountable", morale:-6, fans:+5,
        line:p=>`“${p.name} knows the standard. So does everyone here.”` },
      { label:"No comment",             morale:0,  fans:-1,
        line:()=>"“I'm not going to discuss individuals.”" },
    ],
  },
};
// Should a presser fire today, and which one? Reads the club's current form.
function pickPresser(G){
  const t = G.teams[G.userTeamId]; if(!t) return null;
  if(G.presser) return null;                                   // one open at a time
  if((G.day||0) - (G._lastPresser==null?-99:G._lastPresser) < PRESSER_COOLDOWN) return null;
  if((t.w+t.l) < 8) return null;                               // let the season breathe first
  // t.form is a rolling list of 1 (win) / 0 (loss), newest last
  const form = t.form || [];
  if(!form.length) return null;
  const last = form[form.length-1];
  let run=0; for(let i=form.length-1;i>=0;i--){ if(form[i]===last) run++; else break; }
  if(last===0 && run>=4){ t._lossRun=run; return { kind:"streakBad" }; }
  if(last===1 && run>=5){ t._winRun=run;  return { kind:"streakGood" }; }
  // a star having a genuinely bad year
  const stars = rosterOf(G, t.id).filter(p=>!p.isP && p.ovr>=76 && p.stats.PA>=120);
  const slumping = stars.find(p=>ops(p.stats) < 0.640);
  if(slumping && chance(0.5)) return { kind:"starSlump", pid:slumping.id };
  return null;
}
// Apply the chosen answer: clubhouse morale (scaled by that player's personality when
// the question was about him) and fan mood both move, and the quote hits the wire.
function answerPresser(G, optIdx){
  const pr = G.presser; if(!pr) return;
  const spec = PRESSERS[pr.kind]; if(!spec) { G.presser=null; return; }
  const opt = spec.options[optIdx]; if(!opt) return;
  const t = G.teams[G.userTeamId];
  const subject = pr.pid!=null ? G.players[pr.pid] : null;
  const swing = subject ? personalityOf(subject).moraleSwing : 1;
  // morale lives per-player; nudge the big-league room
  rosterOf(G, t.id).forEach(p=>{
    const s = personalityOf(p).moraleSwing;
    p.morale = clamp((p.morale==null?70:p.morale) + opt.morale * s * (subject && p.id===subject.id ? swing : 1) * 0.5, 0, 100);
  });
  t.fanMood = clamp((t.fanMood==null?60:t.fanMood) + opt.fans, 20, 95);
  const line = typeof opt.line === "function" ? opt.line(subject) : opt.line;
  logNews(G,"event",`🎤 Press conference — ${line}`, t.id);
  G._lastPresser = G.day||0;
  G.presser = null;
}

  const org = [["aaa","AAA"],["college","College"]];
  if(G.phase==="offseason") org.push(["draft","Draft"]);
  return [
    { key:"club",    label:"🏟 Club",    tabs:[["hub","Hub"],["roster","Roster"],["lineup","Lineup"],["finances","Finances"]] },

// Flat list of every reachable tab, for the palette.
function allTabs(G){ return navGroups(G).flatMap(g=>g.tabs.map(([k,l])=>({k, label:l, group:g.label}))); }

// ⌘K / Ctrl-K jump-to. Type a few letters, Enter takes the top hit — faster than
// hunting a section for a tab you already know the name of.
function CommandPalette({G, onGo, onClose}){
  const [q, setQ] = useState("");
  const [i, setI] = useState(0);
  const inputRef = useRef(null);
  React.useEffect(()=>{ if(inputRef.current) inputRef.current.focus(); }, []);
  const items = allTabs(G).filter(t=>!q || t.label.toLowerCase().includes(q.toLowerCase()) || t.k.includes(q.toLowerCase()));
  const pick = n => { const t=items[n]; if(t){ onGo(t.k); onClose(); } };
  const onKey = e => {
    if(e.key==="ArrowDown"){ e.preventDefault(); setI(x=>Math.min(x+1, items.length-1)); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setI(x=>Math.max(x-1, 0)); }
    else if(e.key==="Enter"){ e.preventDefault(); pick(i); }
    else if(e.key==="Escape"){ onClose(); }
  };
  return (
    <div className="fixed inset-0 z-50 bg-black/60 flex items-start justify-center p-4 pt-24" onClick={onClose}>
      <div className="bg-[#101a30] border border-[#1d2940] rounded-xl w-full max-w-md overflow-hidden" onClick={e=>e.stopPropagation()}>
        <input ref={inputRef} value={q} onKeyDown={onKey}
          onChange={e=>{ setQ(e.target.value); setI(0); }} placeholder="Jump to…"
          className="w-full bg-transparent px-4 py-3 text-sm outline-none border-b border-[#1d2940]" />
        <div className="max-h-72 overflow-y-auto">
          {items.map((t,n)=>(
            <button key={t.k} onClick={()=>pick(n)} onMouseEnter={()=>setI(n)}
              className={"w-full text-left px-4 py-2 text-sm flex items-center gap-2 "+(n===i?"bg-emerald-500/15 text-emerald-200":"text-slate-300 hover:bg-[#16213a]")}>
              <span className="flex-1">{t.label}</span>
              <span className="text-[11px] text-slate-500">{t.group}</span>
            </button>
          ))}
          {!items.length && <div className="px-4 py-6 text-center text-sm text-slate-500">Nothing matches “{q}”.</div>}
        </div>
        <div className="px-4 py-2 text-[11px] text-slate-500 border-t border-[#1d2940]">↑↓ to move · Enter to open · Esc to close</div>
      </div>
    </div>
  );
}

// turn an arbitrary text seed into a 32-bit number (so seeds can be words too)
function hashSeed(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ----------------------------- injuries -------------------------------- */
const INJ_HIT = ["hamstring strain","oblique strain","sprained wrist","sore knee","back spasms","bruised hand","ankle sprain","shoulder strain","groin strain","concussion"];
const INJ_PIT = ["shoulder inflammation","elbow soreness","forearm strain","strained lat","blister","rotator cuff strain","oblique strain","sprained ankle","tired arm","back spasms"];
function injuryDuration(){
  const r=Math.random();
  if(r<0.45) return rint(2,6);      // day-to-day
  if(r<0.80) return rint(8,18);     // short IL
  if(r<0.95) return rint(25,50);    // medium
  return rint(60,110);              // long / season-ending
}
// Once per day: heal returning players, then roll new injuries among active MLB/AAA players.
// Injured players are auto-excluded from lineups/rotations (isInjured) and auto-return when healed.
function tickInjuries(G){
  const userMlb0=G.userTeamId;
  // suspensions & rest days tick regardless of the injuries setting
  for(const id in G.players){ const p=G.players[id];
    if(p.susp){ p.susp.days--; if(p.susp.days<=0){ delete p.susp; if(p.teamId===userMlb0) logNews(G,"roster",`${p.pos} ${p.name} returns from suspension`, userMlb0); } }
    if(p._rest>0) p._rest--;
    else if(!p.isP && isMlbId(p.teamId) && (p._cg||0) >= (p.trait==="Iron Man"?26:17) && chance(0.5)){ p._rest=1; p._cg=0; }   // a weary regular gets a day off
  }
  if(G.settings && G.settings.injuries===false){          // injuries can be turned off in Settings
    for(const id in G.players){ if(G.players[id].injury) delete G.players[id].injury; }
    return;
  }
  const userMlb=G.userTeamId, userAaa=aaaIdOf(G.userTeamId);
  for(const id in G.players){ const p=G.players[id]; if(p.injury){
    p.injury.days--;
    if(p.injury.days<=0){
      delete p.injury;
      if(p.teamId===userMlb) logNews(G,"roster",`${p.pos} ${p.name} returns from the injured list`, userMlb);
    }
  }}
  Object.values(G.players).forEach(p=>{
    if(p.teamId==null || isCollegeId(p.teamId) || isInjured(p)) return;
    // a better medical center means fewer injuries and shorter stints for the whole org
    const org = isAAAId(p.teamId) ? G.teams[parentIdOf(p.teamId)] : G.teams[p.teamId];
    const med = (org && org.facilities && org.facilities.medical) || 1;
    if(chance((p.isP?0.0017:0.0014) * (1 - (med-1)*0.08) * (p.trait==="Iron Man"?0.45:1) * diff(G).injury)){
      p.injury = { days:Math.max(2, round(injuryDuration()*(1-(med-1)*0.06))), desc:pick(p.isP?INJ_PIT:INJ_HIT), season:G.season };
      if(p.teamId===userMlb) logNews(G,"roster",`🤕 ${p.pos} ${p.name} injured (${p.injury.desc}) — out ~${p.injury.days} days`, userMlb);
    }
  });
}

// Trade rumor mill: flavor news in the run-up to the deadline, driven by team situations
// (sellers shop vets, buyers scout their needs) and player value — not random spam.
function tickTradeRumors(G){
  if(G.phase!=="regular") return;
  const dl=G.tradeDeadline||9999;
  if(G.day>dl || G.day < dl-28) return;        // only as the deadline approaches
  if(!chance(0.4)) return;                       // ~a few per week
  const teams=G.teams, sitOf=t=>teamSituation(G,t.id);
  // most valuable MLB player matching a filter (with a little randomness so it varies)
  const valuable=(filter)=>{ let best=null,bv=-1;
    teams.forEach(t=>rosterOf(G,t.id).forEach(p=>{ if(p.amateur) return; if(filter&&!filter(p,t)) return;
      const v=playerValue(p)*(0.75+Math.random()*0.5); if(v>bv){bv=v;best={p,t};} }));
    return best; };
  const r=Math.random(); let msg=null, tid=null, subj=null;
  if(r<0.34){
    // a seller (rebuild/retool club) shops a useful veteran
    const sellers=teams.filter(t=>{const m=sitOf(t).mode; return m==="Rebuild"||m==="Retool";});
    const t=pick(sellers.length?sellers:teams);
    const cand=rosterOf(G,t.id).filter(p=>!p.amateur && p.age>=29 && p.ovr>=66).sort((a,b)=>playerValue(b)-playerValue(a))[0];
    if(cand){ msg=`📋 ${t.abbr} reportedly making ${cand.pos} ${cand.name} (${cand.ovr} OVR) available ahead of the deadline`; tid=t.id; subj=cand.name; }
  } else if(r<0.67){
    // a star drawing interest as contenders circle
    const sel=valuable(p=>p.ovr>=72);
    if(sel){ msg=`👀 ${sel.p.pos} ${sel.p.name} (${sel.t.abbr}) is drawing trade interest as contenders circle`; tid=sel.t.id; subj=sel.p.name; }
  } else {
    // a buyer (win-now/contender) scouting a club to fill a need
    const buyers=teams.filter(t=>{const m=sitOf(t).mode; return m==="Win-now"||m==="Contender";});
    const b=pick(buyers.length?buyers:teams), need=(sitOf(b).needs||[])[0];
    let target=null;
    if(need) teams.forEach(t=>{ if(t.id===b.id) return; rosterOf(G,t.id).forEach(p=>{ if(p.amateur) return;
      const posOk = (need==="SP"||need==="RP") ? (p.isP&&p.role===need) : (!p.isP&&p.pos===need);
      if(posOk && p.ovr>=68 && (!target||p.ovr>target.p.ovr)) target={p,t}; }); });
    if(need && target){ msg=`🔎 ${b.abbr} scouts spotted watching ${target.t.abbr}'s ${target.p.pos} ${target.p.name} — hunting ${need} help`; tid=b.id; subj=target.p.name; }
    else { const sel=valuable(p=>p.ovr>=70); if(sel){ msg=`🔎 ${b.abbr} said to be aggressive on the market, eyeing ${sel.p.pos} ${sel.p.name} (${sel.t.abbr})`; tid=b.id; subj=sel.p.name; } }
  }
  if(!msg) return;
  G._rumorRecent = G._rumorRecent || [];
  if(subj && G._rumorRecent.includes(subj)) return;   // don't headline the same player back-to-back
  if(subj){ G._rumorRecent.push(subj); if(G._rumorRecent.length>6) G._rumorRecent.shift(); }
  logNews(G,"rumor",msg,tid);
}

/* ---- Player of the Month + monthly splits (the season is split into 6 "months") ---- */
const MONTH_NAMES=["April","May","June","July","August","September"];
const MHKEYS=["G","PA","AB","H","_2B","_3B","HR","R","RBI","BB","SO","SB","HBP","SF"];
const MPKEYS=["G","OUT","H","ER","BB","SO","W","L","SV","HRA"];
function monthIdx(G){ return Math.min(5, Math.floor(G.day / Math.max(1, G.schedule.length/6))); }
function snapshotMonth(G){ Object.values(G.players).forEach(p=>{ if(isMlbId(p.teamId)) p._monthSnap=Object.assign({}, p.stats); }); }
function finishMonth(G, m){
  const lg={Empire:{h:[],p:[]}, Pioneer:{h:[],p:[]}};
  Object.values(G.players).forEach(p=>{
    if(!isMlbId(p.teamId)) return; const t=teamById(G,p.teamId); if(!t||!lg[t.league]) return;
    const keys=p.isP?MPKEYS:MHKEYS, snap=p._monthSnap||{}, line={}; keys.forEach(k=>line[k]=(p.stats[k]||0)-(snap[k]||0));
    const played = p.isP ? line.OUT>0 : line.PA>0; if(!played) return;
    (p._monthly=p._monthly||[]).push({m, isP:p.isP, line}); if(p._monthly.length>6) p._monthly.shift();
    if(p.isP) lg[t.league].p.push({p,line}); else lg[t.league].h.push({p,line});
  });
  ["Empire","Pioneer"].forEach(L=>{
    const b=lg[L];
    // weight by playing time (mvpScore/cyScore scale with PA/IP) so a full-month regular/starter wins,
    // not a small-sample hot reliever or part-timer
    const bestH=b.h.filter(x=>x.line.PA>=40).reduce((a,c)=>(!a||mvpScore(c.line)>mvpScore(a.line))?c:a,null);
    const bestP=b.p.filter(x=>x.line.OUT>=30).reduce((a,c)=>(!a||cyScore(c.line)>cyScore(a.line))?c:a,null);
    if(bestH){ bestH.p.potm=(bestH.p.potm||0)+1; logNews(G,"award",`📅 ${MONTH_NAMES[m]} ${L} Player of the Month: ${bestH.p.name} (${f3(avg(bestH.line))}, ${bestH.line.HR} HR, ${bestH.line.RBI} RBI)`, bestH.p.teamId); }
    if(bestP){ bestP.p.potmP=(bestP.p.potmP||0)+1; logNews(G,"award",`📅 ${MONTH_NAMES[m]} ${L} Pitcher of the Month: ${bestP.p.name} (${bestP.line.W}-${bestP.line.L}, ${f2(era(bestP.line))} ERA, ${bestP.line.SO} K)`, bestP.p.teamId); }
  });
}
// how well a player performed over a month line, ~[-1, +1] (above/below an average month)
function monthPerfScore(line, isP){
  if(isP){ if(!line.OUT) return 0; return clamp((4.0-era(line))*0.28, -1, 1); }
  if(!line.AB) return 0; return clamp((ops(line)-0.72)*1.3, -1, 1);
}
// In-season player development: a small, age-curved + PERFORMANCE-driven nudge each "month" so
// players progress THROUGH the season (a hot prospect climbs as he rakes), not only at the rollover.
// Small per-month magnitude; the offseason jump is reduced to compensate (no net inflation).
function inSeasonDev(G){
  Object.values(G.players).forEach(p=>{
    if(p.teamId==null || isCollegeId(p.teamId)) return;
    const snap=p._monthSnap||{};
    const enough = p.isP ? ((p.stats.OUT||0)-(snap.OUT||0))>=12 : ((p.stats.PA||0)-(snap.PA||0))>=25;
    if(!enough) return;
    const keys=p.isP?MPKEYS:MHKEYS, line={}; keys.forEach(k=>line[k]=(p.stats[k]||0)-(snap[k]||0));
    const perf=monthPerfScore(line, p.isP), gap=Math.max(0,p.pot-p.ovr);
    let center;
    if(p.age<=23)      center = 0.14 + gap*0.013;
    else if(p.age<=26) center = 0.05 + gap*0.009;
    else if(p.age<=28) center = 0.0;
    else if(p.age<=30) center = -0.05;
    else if(p.age<=33) center = -0.12;
    else               center = -0.22;
    if(isAAAId(p.teamId) && p.age<=25) center += 0.10;
    // a better training facility compounds development across the whole org
    const org = isAAAId(p.teamId) ? G.teams[parentIdOf(p.teamId)] : G.teams[p.teamId];
    if(org && org.facilities && org.facilities.training>1 && center>0) center += (org.facilities.training-1)*0.02;
    // performance MODULATES growth — a young player who's raking realizes his ceiling much faster,
    // one who's scuffling stalls (multiplicative for risers; small additive for declining vets)
    if(p.age<=27 && center>0) center *= clamp(1 + perf*0.9, 0.2, 1.9);
    else center += perf * 0.12;
    center = clamp(center, -0.5, 0.7);
    const before=p.ovr;
    (p.isP?["stu","ctl","stm"]:["con","pow","eye","spd","def"]).forEach(a=>{ if(p[a]!=null && chance(0.55)) p[a]=clamp(round(p[a]+gauss(center,0.6)),20,99); });
    computeOvr(p); if(p.ovr>(p.peakOvr||0)) p.peakOvr=p.ovr;
    if(p.ovr!==before) p._seasonDev=(p._seasonDev||0)+(p.ovr-before);   // mid-season movement (for display)
  });
}
function tickMonthly(G){
  const m=monthIdx(G);
  if(G._curMonth==null){ G._curMonth=m; snapshotMonth(G); return; }
  if(m!==G._curMonth){
    inSeasonDev(G);                                                       // gradual in-season progression (always)
    if(!(G.settings && G.settings.potm===false)) finishMonth(G, G._curMonth);   // POTM + monthly splits (toggle)
    G._curMonth=m; snapshotMonth(G);
  }
}

function simDay(G){
  const RG = rules(G);                          // active league rules for every game played today
  let idx = rosterIndex(G.players);             // build the team→players index ONCE for the whole day
  // safety net: a team that can't field a lineup/staff would crash simGame and hang the
  // whole Sim loop. Refill any depleted MLB/AAA roster to a playable minimum first.
  let repaired=false;
  for(const t of G.teams){ const r=idx[t.id]||[]; if(r.filter(p=>!p.isP).length<9 || r.filter(p=>p.isP).length<1){ refillRoster(G,t.id,14,12,[23,33],0); ensureLineup(t,G.players); repaired=true; } }
  for(const t of G.aaaTeams){ const r=idx[t.id]||[]; if(r.filter(p=>!p.isP).length<9 || r.filter(p=>p.isP).length<1){ refillRoster(G,t.id,12,9,[19,26],-6); autoSetLineups(t,G.players); repaired=true; } }
  for(const t of (G.collegeTeams||[])){ const r=idx[t.id]||[]; if(r.filter(p=>!p.isP).length<9 || r.filter(p=>p.isP).length<1){ refillRoster(G,t.id,12,9,[17,21],-12); autoSetLineups(t,G.players); repaired=true; } }
  if(repaired) idx = rosterIndex(G.players);     // rebuild after adding players
  const playDay = (sched, isMLB) => {
    const day = sched[G.day];
    if(!day) return;
    day.forEach(g=>{
      if(g.played) return;
      const home=teamById(G,g.home), away=teamById(G,g.away);
      // Manager Mode: thread the user's standing tactics into HIS games only
      const userGame = isMLB && (g.home===G.userTeamId || g.away===G.userTeamId);
      const tactics = (G.managerMode && userGame && G.tactics) ? Object.assign({teamId:G.userTeamId}, G.tactics) : null;
      const res = simGame(home, away, G.players, idx, isMLB, tactics, RG);   // isMLB → record platoon/venue splits
      markGamesPlayed(home, away, G.players, idx, G.day);
      if(isMLB) updateGameRecords(G, res.gameLines, G.season);   // single-game records (MLB only)
      if(isMLB) updateHitStreaks(G, res.gameLines);              // active hitting streaks (MLB only)
      recordFeats(G, res);                                       // no-hitters / perfect games / cycles / multi-HR (all levels)
      g.played=true; g.hs=res.hs; g.as=res.as;
      if(isMLB){ g.box=res.box;   // full box score for every MLB game (this season's schedule only)
        // attach the scoring-play game log only to the USER's games (keeps the save bounded)
        if(g.home===G.userTeamId || g.away===G.userTeamId){ g.box.plays=res.plays; g.box.walkoff=res.walkoff; g.box.finalInning=res.finalInning; }
      }
      // BENCHES CLEAR: a hit-batter war boils over into a brawl — suspensions follow
      // (4+ combined HBP is genuinely rare → a few brawls per season league-wide)
      if(isMLB && (res.hbp||0)>=4 && chance(0.3)){
        const pool=rosterOf(G,home.id).concat(rosterOf(G,away.id)).filter(p=>!isInjured(p));
        const names=[]; const n=rint(2,4);
        for(let i=0;i<n && pool.length;i++){ const p=pool.splice(rint(0,pool.length-1),1)[0]; p.susp={days:rint(2,5), desc:"bench-clearing brawl"}; names.push(p.name); }
        if(names.length) logNews(G,"event",`🥊 BENCHES CLEAR in ${away.abbr} @ ${home.abbr} after ${res.hbp} hit batters — suspended: ${names.join(", ")}`, (home.id===G.userTeamId||away.id===G.userTeamId)?G.userTeamId:null);
      }
      const homeWon=res.hs>res.as;
      if(homeWon){ home.w++; away.l++; } else { away.w++; home.l++; }
      home.streak = homeWon ? (home.streak>=0?(home.streak||0)+1:1) : (home.streak<=0?(home.streak||0)-1:-1);
      away.streak = homeWon ? (away.streak<=0?(away.streak||0)-1:-1) : (away.streak>=0?(away.streak||0)+1:1);
      home._wsMax = Math.max(home._wsMax||0, home.streak); away._wsMax = Math.max(away._wsMax||0, away.streak);
      home.rs+=res.hs; home.ra+=res.as; away.rs+=res.as; away.ra+=res.hs;
      // rolling form (last-10) + rivalry head-to-head book (MLB only, kept forever)
      if(isMLB){
        (home.form=home.form||[]).push(homeWon?1:0); if(home.form.length>10) home.form.shift();
        (away.form=away.form||[]).push(homeWon?0:1); if(away.form.length>10) away.form.shift();
        if(home.rivalId===away.id || away.rivalId===home.id){
          const lo=Math.min(home.id,away.id), hi=Math.max(home.id,away.id), k=lo+"-"+hi;
          const h=(G.h2h=G.h2h||{})[k]=(G.h2h[k]||{a:0,b:0});   // a = the lower id's wins
          if((home.id===lo)===homeWon) h.a++; else h.b++;
        }
      }
    });
  };
  playDay(G.schedule, true);                     // MLB
  if(G.aaaSchedule) playDay(G.aaaSchedule, false); // AAA affiliates
  if(G.collegeSchedule) playDay(G.collegeSchedule, false); // amateur college league
  // bullpen recovery: every arm sheds fatigue each day (≈3 days to recover from a heavy outing)
  for(const id in G.players){ const p=G.players[id]; if(p._tired){ p._tired=Math.max(0,p._tired-0.34); if(p._tired<0.05) delete p._tired; } }
  tickInjuries(G);                                // heal/return players, then roll new injuries
  G.day++;
  tickMonthly(G);   // Player/Pitcher of the Month + monthly splits at each "month" boundary
  // Mid-season All-Star Game (exhibition, ~season midpoint) — banked separately, no stat impact
  if((!G.allStarGame || G.allStarGame.season!==G.season) && G.day>=Math.floor(G.schedule.length*0.5)){
    try{ playAllStarGame(G); }catch(e){ /* never let the exhibition block the sim */ }
  }
  // BA Cup: a side knockout whose rounds are sprinkled through the season (no stat impact)
  ensureSeasonCup(G); tickBACup(G);
  // trade market: drop offers once they're stale or the deadline passes; before the
  // deadline an AI club occasionally pitches the user a deal.
  if(!Array.isArray(G.tradeOffers)) G.tradeOffers=[];
  if(rules(G).tradeDeadlineOn && G.day>G.tradeDeadline){ G.tradeOffers=[]; }
  else {
    // bidding-war offers live one day; normal offers go stale after 12
    G.tradeOffers = G.tradeOffers.filter(o=>o._war ? (G.day-o.day)<1 : (G.day-o.day)<=12);
    if(rules(G).tradeDeadlineOn && G.day===G.tradeDeadline && G._dlSeason!==G.season){ G._dlSeason=G.season; deadlineDayFrenzy(G); }
    else if(G.tradeOffers.length<2 && chance(0.045*diff(G).aiTrade)){ const off=makeAITradeOffer(G); if(off) G.tradeOffers.push(off); }
    tickTradeRumors(G);   // flavor rumors building toward the deadline
  }
  // waiver wire: occasional AI cuts + claim processing
  maybeAIWaive(G); processWaivers(G);
  // the beat writers want a word (regular season only, and never more than one open)
  if(G.phase==="regular" && G.settings && G.settings.pressers!==false){
    const pr = pickPresser(G);
    if(pr) G.presser = pr;
  }
  if(G.day>=G.schedule.length){ enterPlayoffs(G); }
}

function userNextGame(G){
  for(let d=G.day; d<G.schedule.length; d++){
    const g = G.schedule[d].find(x=>(x.home===G.userTeamId||x.away===G.userTeamId));
    if(g && !g.played) return {day:d, g};
  }
  return null;
}

/* ----------------------------- Roster ---------------------------------- */
function rosterOf(G, teamId){ return Object.values(G.players).filter(p=>p.teamId===teamId); }
function payroll(G, teamId){ return rosterOf(G,teamId).reduce((s,p)=>s+p.salary,0); }
// SALARY-CAP rule. "none" keeps the classic behaviour (a club may spend up to its own
// budget). "hard" adds a league-wide ceiling nobody can cross. "soft" lets clubs spend
// past the line and settles a luxury tax at the rollover instead of blocking the deal.
function capLimitFor(G, teamId){
  const t = teamById(G, teamId); if(!t) return 0;
  const R = rules(G);
  return R.capMode==="hard" ? Math.min(t.budget, R.capAmount) : t.budget;
}
// Room to add salary right now (what every signing/claim path should check).
function capSpaceFor(G, teamId){ return capLimitFor(G, teamId) - payroll(G, teamId); }
// Luxury tax owed by a club this season under a soft cap (0 otherwise).
function luxuryTaxFor(G, teamId){
  const R = rules(G);
  if(R.capMode!=="soft") return 0;
  const over = payroll(G, teamId) - R.capAmount;
  return over>0 ? +(over * R.taxRate).toFixed(1) : 0;
}
// Shortfall penalty for a club under the payroll floor (0 when the floor is off).
function floorShortfallFor(G, teamId){
  const R = rules(G);
  if(!R.floorAmount) return 0;
  const under = R.floorAmount - payroll(G, teamId);
  return under>0 ? +under.toFixed(1) : 0;
}

// Procedurally generate a ballpark's outfield wall — deterministic per park (seeded by the
// name) so each team's stadium is stable and distinct. Most are normal/symmetric; some are
// asymmetric; a few are quirky (a short porch + angular corner, Fenway-style). Returns the
// ordered wall points (left foul pole → right foul pole) + an outer ring for the grandstand.
const HX=180, HY=150;   // home plate
function ballparkGeom(seed){
  const rng=mulberry32((seed>>>0)||1);
  const push=(pt,d)=>{ const dx=pt.x-HX, dy=pt.y-HY, len=Math.hypot(dx,dy)||1; return {x:pt.x+dx/len*d, y:pt.y+dy/len*d}; };
  const base=[ {x:42,y:80},{x:96,y:40},{x:180,y:26},{x:264,y:40},{x:318,y:80} ];   // L pole, L gap, CF, R gap, R pole
  const roll=rng();
  let wall;
  if(roll<0.50){            // normal / symmetric — small mirrored jitter
    const dP=(rng()*2-1)*7, dG=(rng()*2-1)*9, dC=(rng()*2-1)*7;
    wall=[ push(base[0],dP), push(base[1],dG), push(base[2],dC), push(base[3],dG), push(base[4],dP) ];
  } else if(roll<0.85){     // asymmetric — independent jitter per point
    wall=base.map(pt=>push(pt,(rng()*2-1)*15));
  } else {                  // quirky — a short porch on one side + an angular corner
    wall=base.map(pt=>push(pt,(rng()*2-1)*9));
    const left=rng()<0.5, gi=left?1:3, fi=left?0:4;
    wall[gi]=push(base[gi], -(16+rng()*12));                          // pull the gap in (short porch)
    const corner={ x:(wall[fi].x+wall[gi].x)/2+(left?-12:12), y:(wall[fi].y+wall[gi].y)/2-12 };  // angular jut
    wall.splice(left?1:3, 0, corner);
  }
  wall.forEach(p=>{ p.x=clamp(p.x,16,344); p.y=clamp(p.y,16,118); });
  const outer=wall.map(p=>push(p,16));
  return { wall, outer };
}

          <path d={wallLine} fill="none" stroke={accent} strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>
          {/* infield dirt diamond */}
          <path d="M180 150 L222 120 L180 92 L138 120 Z" fill="#c39157"/>
          <path d="M180 150 L222 120 L180 92 L138 120 Z" fill="none" stroke="#a9763f" strokeWidth="1"/>
          {/* foul lines (home → each foul pole) */}
          <path d={`M180 151 L ${pt(W[0])} M180 151 L ${pt(W[last])}`} stroke="#e6edf6" strokeWidth="1.4" opacity="0.85"/>
          {/* bases + mound + home plate */}
          <circle cx="180" cy="121" r="4" fill="#d9a86b" stroke="#a9763f"/>

          <path d="M176 149 h8 v4 l-4 3 l-4 -3 Z" fill="#f1f5f9"/>
          {/* corner light towers */}
          {[34,326].map((x,i)=>(<g key={i}><rect x={x-1.5} y="42" width="3" height="30" fill="#3a4a5a"/><rect x={x-11} y="32" width="22" height="12" rx="2" fill="#1c2740" stroke="#3a4a5a"/>{[-7,-1.5,4].map((dx,j)=><circle key={j} cx={x+dx} cy="38" r="1.8" fill="#fde68a"/>)}</g>))}

        <div className="mt-2 text-sm text-center">

          ); })()}

      </div>
    </Card>
  );
}

function Roster({G, team, commit}){
  const [sel, setSel] = useState(null);
  const ros = rosterOf(G, team.id);
  const aaa = G.aaaTeams[team.id];
  const aaaRos = rosterOf(G, aaaIdOf(team.id)).sort((a,b)=>b.ovr-a.ovr);
  const release = (p)=>{
    const inSeason = G.phase==="regular";
    if(!confirm(inSeason?`Place ${p.name} on waivers? Other clubs may claim him; if he clears he becomes a free agent.`:`Release ${p.name}? He becomes a free agent.`)) return;
    if(inSeason){ placeOnWaivers(G, p, team.id); logNews(G,"roster",`${team.abbr} placed ${p.pos} ${p.name} (${p.ovr}) on waivers`, team.id); }
    else { movePlayerToFA(G, p); logNews(G,"roster",`${team.abbr} released ${p.pos} ${p.name} (${p.ovr})`, team.id); }
    commit(G);
  };
  const sendDown = (p)=>{                         // MLB -> AAA
    flushLevel(p);                                // bank his MLB stats before he changes level
    movePlayer(G, p, team.id); p.teamId = aaaIdOf(team.id);
    autoSetLineups(aaa, G.players); ensureLineup(team, G.players);
    logNews(G,"roster",`${team.abbr} optioned ${p.pos} ${p.name} (${p.ovr}) to AAA`, team.id);
    commit(G);
  };
  const callUp = (p)=>{                           // AAA -> MLB
    flushLevel(p);                                // bank his AAA stats before he changes level
    movePlayer(G, p, team.id);                    // movePlayer keeps level; override to MLB
    p.teamId = team.id;
    autoSetLineups(aaa, G.players);
    logNews(G,"roster",`${team.abbr} called up ${p.pos} ${p.name} (${p.ovr}) from AAA`, team.id);
