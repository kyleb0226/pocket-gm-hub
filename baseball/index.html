          );}))}</tbody>
        </table></div>
      </Card>}
    </div>
  );
}

/* ----------------------------- All Players browser --------------------- */
// view toggle for Players tab: "ratings" shows attributes, "stats" shows season stats
function PlayersBrowser({G, commit, tShow, setTab, setTradeFocus}){
  const [q,setQ]=useState(""); const [teamF,setTeamF]=useState("ALL"); const [levelF,setLevelF]=useState("ALL");
  const [posF,setPosF]=useState("ALL"); const [ageMin,setAgeMin]=useState(""); const [ageMax,setAgeMax]=useState("");
  const [sortK,setSortK]=useState("ovr"); const [view,setView]=useState("ratings");
  const [modal,setModal]=useState(null);
  const [signTarget,setSignTarget]=useState(null);   // FA negotiate modal
  const [extendTarget,setExtendTarget]=useState(null); // extension modal
  const me=G.teams[G.userTeamId];
  const space=capSpaceFor(G, me.id);
  const lvlOf=p=>levelOf(p.teamId);
  const orgOf=p=>p.teamId==null?null:(isCollegeId(p.teamId)?p.teamId:(isAAAId(p.teamId)?parentIdOf(p.teamId):p.teamId));
  // The search box drives a filter+sort across every player in the league
  // (majors, AAA, college and free agents). Typing fired that on each
  // keystroke, so debounce what the filter actually reads: `q` stays instant
  // for the input's own value, `qDebounced` is what the expensive pass uses.
  const [qDebounced,setQDebounced]=useState("");
  useEffect(()=>{ const t=setTimeout(()=>setQDebounced(q),150); return ()=>clearTimeout(t); },[q]);

  const sorters={ ovr:(a,b)=>b.ovr-a.ovr, pot:(a,b)=>b.pot-a.pot, age:(a,b)=>a.age-b.age,
    name:(a,b)=>a.name.localeCompare(b.name), salary:(a,b)=>b.salary-a.salary, value:(a,b)=>playerValue(b)-playerValue(a),
    hr:(a,b)=>(b.stats.HR||0)-(a.stats.HR||0), avg:(a,b)=>avg(b.stats)-avg(a.stats),
    era:(a,b)=>((a.isP&&a.stats.OUT)?era(a.stats):99)-((b.isP&&b.stats.OUT)?era(b.stats):99),
    ops:(a,b)=>ops(b.stats)-ops(a.stats), rbi:(a,b)=>(b.stats.RBI||0)-(a.stats.RBI||0),
    sb:(a,b)=>(b.stats.SB||0)-(a.stats.SB||0), so:(a,b)=>(b.stats.SO||0)-(a.stats.SO||0),
    sv:(a,b)=>(b.stats.SV||0)-(a.stats.SV||0), ip:(a,b)=>(b.stats.OUT||0)-(a.stats.OUT||0) };

  const { rows, total } = useMemo(()=>{
    const matched=Object.values(G.players).filter(p=>{
      if(qDebounced && !p.name.toLowerCase().includes(qDebounced.toLowerCase())) return false;
      const lvl=lvlOf(p);
      if(levelF!=="ALL" && lvl!==levelF) return false;
      if(teamF==="FA"){ if(lvl!=="FA") return false; }
      else if(teamF!=="ALL"){ if(orgOf(p)!==Number(teamF)) return false; }
      if(posF==="P"){ if(!p.isP) return false; }
      else if(posF==="H"){ if(p.isP) return false; }
      else if(posF!=="ALL"){ if(p.pos!==posF) return false; }
      const amin=ageMin?Number(ageMin):0, amax=ageMax?Number(ageMax):99;
      if(p.age<amin||p.age>amax) return false;
      return true;
    });
    return { total: matched.length, rows: [...matched].sort(sorters[sortK]||sorters.ovr).slice(0,400) };
  }, [G, qDebounced, levelF, teamF, posF, ageMin, ageMax, sortK]);
  const plbl=p=>{ const t=teamById(G,p.teamId); return t?(t.abbr+(t.aaa?" AAA":"")):"FA"; };
  const sel="bg-[#0b1220] border border-[#1d2940] rounded px-2 py-1 text-sm";

  // actions from the players browser
  const doSign=(p,aav,years,incs)=>{
    setContract(p,aav,years,incs); p.teamId=me.id; G.freeAgents=G.freeAgents.filter(id=>id!==p.id);
    ensureLineup(me,G.players);
    logNews(G,"signing",`${me.abbr} signed ${p.pos} ${p.name} (${p.ovr}) — ${contractLabel(p)}`, me.id);
    setSignTarget(null); commit(G); tShow(`✅ Signed ${p.name}`);
  };
  const doExtend=(p,aav,years,incs)=>{
    setContract(p,aav,years,incs);
    logNews(G,"signing",`${me.abbr} extended ${p.pos} ${p.name} (${p.ovr}) — ${contractLabel(p)}`, me.id);
    setExtendTarget(null); commit(G); tShow(`✅ ${p.name} extended`);
  };
  // trade: we store the target in localStorage and open the Trades tab pre-loaded
  const [tradeTarget,setTradeTarget]=useState(null);   // player we want to acquire
  // side-by-side compare: tick up to four rows and read them off one card
  const [cmp,setCmp]=useState([]);
  const toggleCmp = id => setCmp(c=>c.includes(id) ? c.filter(x=>x!==id) : (c.length>=4 ? c : c.concat(id)));

  const isMine=p=>p.teamId===me.id || p.teamId===aaaIdOf(me.id);
  const isFA=p=>p.teamId==null;
  const isOtherMLB=p=>!isMine(p)&&!isFA(p)&&isMlbId(p.teamId);   // MLB only — not AAA, not college amateurs

  // stat columns for ratings vs stats view
  const hitRatCols=[["CON","con"],["POW","pow"],["EYE","eye"],["SPD","spd"],["DEF","def"]];
  const pitRatCols=[["STU","stu"],["CTL","ctl"],["STM","stm"]];
  const hitStaCols=[["G","G"],["AB","AB"],["H","H"],["HR","HR"],["RBI","RBI"],["SB","SB"],["BB","BB"],["SO","SO"],["AVG",p=>f3(avg(p.stats))],["OBP",p=>f3(obp(p.stats))],["SLG",p=>f3(slg(p.stats))],["OPS",p=>f3(ops(p.stats))]];
  const pitStaCols=[["G","G"],["GS","GS"],["W","W"],["L","L"],["SV","SV"],["QS",p=>p.stats.QS||0],["HLD",p=>p.stats.HLD||0],["IP",p=>p.stats.OUT?f1(ip(p.stats)):"—"],["ERA",p=>p.stats.OUT?f2(era(p.stats)):"—"],["WHIP",p=>p.stats.OUT?f2(whip(p.stats)):"—"],["K",p=>p.stats.SO||0]];

  const colVal=(col,p)=>{ if(typeof col[1]==="function") return col[1](p); const k=col[1]; return p.stats?.[k]??p[k]??"—"; };

  // detect whether all rows are pitchers / all hitters or mixed (pick columns accordingly)
  const allP=rows.every(p=>p.isP), allH=rows.every(p=>!p.isP), mixed=!allP&&!allH;
  const ratCols=allP?pitRatCols:hitRatCols;
  const staCols=allP?pitStaCols:hitStaCols;
  const dispCols=view==="ratings"?ratCols:staCols;

  return (
    <div className="space-y-3">
      {/* filter bar */}
      <Card>
        <div className="flex flex-wrap gap-2 items-center">
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search name…" className={sel+" flex-1 min-w-[120px]"} />
          <select value={teamF} onChange={e=>setTeamF(e.target.value)} className={sel}>
            <option value="ALL">All teams</option>
            {G.teams.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
            <option value="FA">Free Agents</option>
          </select>
          <select value={levelF} onChange={e=>setLevelF(e.target.value)} className={sel}>
            <option value="ALL">All levels</option><option value="MLB">MLB</option><option value="AAA">AAA</option><option value="FA">FA</option>
          </select>
          <select value={posF} onChange={e=>setPosF(e.target.value)} className={sel}>
            <option value="ALL">All pos</option><option value="H">Hitters</option><option value="P">Pitchers</option>
            {["C","1B","2B","3B","SS","LF","CF","RF","DH","SP","RP"].map(x=><option key={x} value={x}>{x}</option>)}
          </select>
          <input value={ageMin} onChange={e=>setAgeMin(e.target.value)} placeholder="min age" type="number" className={sel+" w-16"} />
          <span className="text-slate-500 text-xs">–</span>
          <input value={ageMax} onChange={e=>setAgeMax(e.target.value)} placeholder="max age" type="number" className={sel+" w-16"} />
          <select value={sortK} onChange={e=>setSortK(e.target.value)} className={sel}>
            <option value="ovr">Sort: OVR</option><option value="pot">POT</option><option value="value">Value</option>
            <option value="age">Age</option><option value="salary">Salary</option><option value="name">Name</option>
            <option value="hr">HR</option><option value="avg">AVG</option><option value="ops">OPS</option>
            <option value="rbi">RBI</option><option value="sb">SB</option>
            <option value="era">ERA</option><option value="so">K</option><option value="sv">SV</option><option value="ip">IP</option>
          </select>
          <div className="flex rounded overflow-hidden border border-[#1d2940] text-xs">
            <button onClick={()=>setView("ratings")} className={"px-2 py-1 "+(view==="ratings"?"bg-emerald-500 text-slate-900 font-semibold":"bg-[#16213a] text-slate-300")}>Ratings</button>
            <button onClick={()=>setView("stats")} className={"px-2 py-1 "+(view==="stats"?"bg-emerald-500 text-slate-900 font-semibold":"bg-[#16213a] text-slate-300")}>Stats</button>
          </div>
        </div>
        <div className="text-xs text-slate-500 mt-1">{total} players{total>400?" · showing first 400":""}</div>
      </Card>

      {/* Side-by-side compare. The best value in each row is highlighted so the winner
          of each category reads instantly instead of having to eyeball the numbers. */}
      {cmp.length>0 && (()=>{
        const ps = cmp.map(id=>G.players[id]).filter(Boolean);
        if(!ps.length) return null;
        const allPitch = ps.every(p=>p.isP), allHit = ps.every(p=>!p.isP);
        const base = [
          ["Age", p=>p.age, "low"], ["OVR", p=>p.ovr, "high"], ["POT", p=>p.pot, "high"],
          ["Salary", p=>p.salary, "low", p=>money(p.salary)],
          ["Years left", p=>p.years||0, "high"],
          ["Trade value", p=>playerValue(p), "high", p=>playerValue(p).toFixed(0)],
        ];
        const hit = [["CON",p=>p.con,"high"],["POW",p=>p.pow,"high"],["EYE",p=>p.eye,"high"],["SPD",p=>p.spd,"high"],["DEF",p=>p.def,"high"],
          ["AVG",p=>avg(p.stats),"high",p=>p.stats.AB?f3(avg(p.stats)):"\u2014"],["HR",p=>p.stats.HR||0,"high"],["RBI",p=>p.stats.RBI||0,"high"],
          ["OPS",p=>ops(p.stats),"high",p=>p.stats.AB?f3(ops(p.stats)):"\u2014"]];
        const pit = [["STU",p=>p.stu,"high"],["CTL",p=>p.ctl,"high"],["STM",p=>p.stm,"high"],
          ["IP",p=>p.stats.OUT||0,"high",p=>p.stats.OUT?f1(ip(p.stats)):"\u2014"],
          ["ERA",p=>p.stats.OUT?era(p.stats):999,"low",p=>p.stats.OUT?f2(era(p.stats)):"\u2014"],
          ["WHIP",p=>p.stats.OUT?whip(p.stats):999,"low",p=>p.stats.OUT?f2(whip(p.stats)):"\u2014"],
          ["K",p=>p.stats.SO||0,"high"]];
        const metrics = base.concat(allPitch?pit:allHit?hit:[]);
        return (
          <Card>
            <div className="flex items-center justify-between mb-2">
              <h3 className="font-bold text-sm">⚖️ Compare ({ps.length}{ps.length>=4?" — max":""})</h3>
              <button onClick={()=>setCmp([])} className="text-xs text-slate-400 hover:text-slate-200">Clear</button>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm tnum">
                <thead><tr className="text-slate-400 text-xs border-b border-[#1d2940]">
                  <th className="text-left font-medium"></th>
                  {ps.map(p=><th key={p.id} className="px-2 text-center">
                    <PlayerLink p={p}/>
                    <div className="text-[10px] text-slate-500 font-normal">{p.isP?p.role:p.pos} · {plbl(p)}</div>
                  </th>)}
                </tr></thead>
                <tbody>
                  {metrics.map(([label, get, dir, fmt])=>{
                    const vals = ps.map(get);
                    const best = dir==="low" ? Math.min(...vals) : Math.max(...vals);
                    const allSame = vals.every(v=>v===vals[0]);
                    return (
                      <tr key={label} className="border-b border-[#15203a]">
                        <td className="text-left text-slate-400 text-xs py-1">{label}</td>
                        {ps.map((p,i)=>(
                          <td key={p.id} className={"px-2 text-center "+(!allSame && vals[i]===best ? "text-emerald-300 font-semibold" : "text-slate-300")}>
                            {fmt?fmt(p):vals[i]}
                          </td>
                        ))}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            {!allPitch && !allHit && <div className="text-[11px] text-slate-500 mt-2">Mixed hitters and pitchers — only the shared rows are shown. Tick all hitters or all pitchers for the full stat comparison.</div>}
          </Card>
        );
      })()}

      {/* main table */}
      <Card>
        <div className="overflow-x-auto max-h-[72vh] overflow-y-auto">
          <table className="w-full text-sm tnum">
            <thead><tr className="text-slate-400 text-xs border-b border-[#1d2940] sticky top-0 bg-[#101a30]">
              <th className="w-6" title="Compare"></th>
              <th className="text-left py-1 pr-1">Pos</th>
              <th className="text-left">Name</th>
              <th className="text-left">Team</th>
              <th>Lvl</th><th>Age</th><th>OVR</th><th>POT</th>
              {!mixed && dispCols.map(c=><th key={c[0]}>{c[0]}</th>)}
              {mixed && <th className="text-left pl-2">Key stat</th>}
              <th className="text-right">Salary</th>
              <th className="text-right pr-1">Val</th>
              <th></th>
            </tr></thead>
            <tbody>
              {rows.map(p=>{
                const mine=isMine(p), fa=isFA(p), otherML=isOtherMLB(p);
                const etTerms=mine&&p.years<=2?extensionTerms(G,p):null;
                return (
                  <tr key={p.id} className={"border-b border-[#15203a] hover:bg-[#13203a]"+(mine?" bg-emerald-900/10":"")}>
                    <td className="py-1"><input type="checkbox" checked={cmp.includes(p.id)} onChange={()=>toggleCmp(p.id)} title="Add to compare" /></td>
                    <td className="text-slate-400 py-1 pr-1">{p.pos}</td>
                    <td className="text-left"><button onClick={()=>setModal(p)} className="font-medium hover:text-emerald-300 text-left">{p.name}</button></td>
                    <td className="text-left text-slate-400 text-xs">{plbl(p)}</td>
                    <td className="text-center text-slate-500 text-xs">{lvlOf(p)}</td>
                    <td className="text-center">{p.age}</td>
                    <td className="text-center"><OvrPill v={p.ovr}/></td>
                    <td className="text-center text-slate-400">{p.pot}</td>
                    {!mixed && dispCols.map(c=><td key={c[0]} className="text-center">{colVal(c,p)}</td>)}
                    {mixed && <td className="text-left pl-2 text-slate-400 text-xs whitespace-nowrap">{p.isP?(p.stats.OUT?`${p.stats.W}-${p.stats.L} ${f2(era(p.stats))} ERA`:"—"):(p.stats.AB?`${f3(avg(p.stats))} ${p.stats.HR}HR`:"—")}</td>}
                    <td className="text-right text-slate-300">{money(p.salary)}</td>
                    <td className="text-right pr-1 text-slate-400">{playerValue(p).toFixed(0)}</td>
                    <td className="whitespace-nowrap pl-1">
                      {fa && <button onClick={()=>setSignTarget(p)} className="px-2 py-0.5 bg-emerald-700 hover:bg-emerald-600 rounded text-xs">Sign</button>}
                      {mine && p.years<=2 && !etTerms?.refuses && <button onClick={()=>setExtendTarget(p)} className="px-2 py-0.5 bg-sky-700 hover:bg-sky-600 rounded text-xs">Extend</button>}
                      {mine && p.years<=2 && etTerms?.refuses && <span className="text-red-400 text-xs px-1">wants out</span>}
                      {(otherML || (mine&&!fa)) && G.phase==="regular"&&G.day<=G.tradeDeadline && (
                        <button onClick={()=>setTradeTarget(p)} className="px-2 py-0.5 bg-amber-700 hover:bg-amber-600 rounded text-xs ml-1">Trade</button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {/* trade intent mini-panel: pre-loads a target into state then opens trades tab */}
      {tradeTarget && (()=>{
        const other = tradeTarget.teamId!=null && !isAAAId(tradeTarget.teamId) ? G.teams[tradeTarget.teamId] : null;
        return (
          <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={()=>setTradeTarget(null)}>
            <div className="bg-[#101a30] border border-[#1d2940] rounded-xl p-5 max-w-sm w-full" onClick={e=>e.stopPropagation()}>
              <div className="font-bold mb-2">Start a trade for {tradeTarget.name}?</div>
              <div className="text-sm text-slate-300 mb-4">
                {other ? `Owned by ${other.name}. Jump to the Trades tab with them pre-selected.` : `This is your player. Go to Trades to offer him out.`}
              </div>
              <div className="flex gap-2">
                <button onClick={()=>{ if(setTradeFocus) setTradeFocus(tradeTarget.id); if(setTab) setTab("trades"); setTradeTarget(null); }} className="flex-1 py-2 bg-emerald-500 text-slate-900 rounded-lg font-bold">Open Trades →</button>
                <button onClick={()=>setTradeTarget(null)} className="px-4 py-2 bg-[#16213a] rounded-lg">Cancel</button>
              </div>
            </div>
          </div>
        );
      })()}

      {modal && <PlayerModal p={modal} team={teamById(G, modal.teamId)} G={G} onClose={()=>setModal(null)} />}
      {signTarget && <ContractModal G={G} p={signTarget} mode="sign" capSpace={space} factor={1} refuses={false}
        onClose={()=>setSignTarget(null)} onSign={(a,y,inc)=>doSign(signTarget,a,y,inc)} tShow={tShow} />}
      {extendTarget && <ContractModal G={G} p={extendTarget} mode="extend" capSpace={space+extendTarget.salary}
        factor={extensionTerms(G,extendTarget).factor} refuses={extensionTerms(G,extendTarget).refuses}
        onClose={()=>setExtendTarget(null)} onSign={(a,y,inc)=>doExtend(extendTarget,a,y,inc)} tShow={tShow} />}
    </div>
  );
}

/* --------------------------- error boundary ---------------------------- */
// Without this, any render-time throw unmounts the whole tree and leaves a
// blank page — with the franchise still safe in IndexedDB but no way to reach
// it, and no clue what broke. Catch it, say so, and offer the two things that
// actually recover: reload, or export the save before touching anything.
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err){ return { err }; }
  componentDidCatch(err, info){ console.error("[pocketgm] render crash", err, info); }
  render(){
    if(!this.state.err) return this.props.children;
    const msg = String(this.state.err && this.state.err.stack || this.state.err);
    return (
      <div className="max-w-2xl mx-auto p-6 text-slate-200">
        <h1 className="text-xl font-bold mb-2">Something broke while drawing this screen.</h1>
        <p className="text-sm text-slate-400 mb-4">
          Your save is untouched — it lives in IndexedDB, not in this page. Reload to get
          back in. If it keeps happening, export the save first and note what you were doing.
        </p>
        <div className="flex gap-2 mb-4">
          <button className="px-3 py-2 rounded bg-sky-700 hover:bg-sky-600 text-sm font-semibold"
                  onClick={()=>window.location.reload()}>Reload</button>
          <button className="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm font-semibold"
                  onClick={()=>{ try{ navigator.clipboard.writeText(msg); }catch(e){} }}>Copy error</button>
        </div>
        <pre className="text-xs whitespace-pre-wrap bg-[#0f1729] p-3 rounded overflow-auto max-h-64">{msg}</pre>
      </div>
    );
  }
}

/* ----------------------------- mount ----------------------------------- */
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
<script>
  (function(){
    try {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<pre style="color:#f87171;padding:16px;white-space:pre-wrap">App failed to start:\n' +
        (e && (e.message || e)) + '</pre>';
      console.error(e);
    }
  })();
</script>
<script>
  // PWA service worker: network-first for the app so a new push always wins,
  // and auto-reload once when a fresh version takes over.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        // Check for an update on every launch.
        reg.update();
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function(){
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              // A new version is ready — reload to use it.
              window.location.reload();
            }
          });
        });
      }).catch(function(e){ console.warn('SW registration failed', e); });
    });
  }
</script>
