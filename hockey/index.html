   * changed the baseline would have to re-prove every one of them.

const DEPTH_PRESETS = {
  classic: { label: "Classic", blurb: "The game as it was. Nothing below is switched on." },
  deep:    { label: "Deep",    blurb: "Every system on. More to manage, and more that manages itself." },
};
/* The first option is always the off/legacy one; `deep` names what the full
   preset should choose. It has to be SPELLED OUT rather than taken as the last
   option — home ice offers classic / realistic / none, where the richest
   setting is the middle one and the last would switch the advantage off
   entirely. Deep would have quietly made home ice mean nothing. */
function applyDepthPreset(G, name) {
  DEPTH_RULES.forEach((d) => setRule(G, d.k, name === "deep" ? d.deep : d.opts[0][0]));
  return G;
}
/* Which preset the current settings match, or null for a mix of the two. */
function depthPreset(G) {
  if (DEPTH_RULES.every((d) => ruleValue(G, d.k) === d.opts[0][0])) return "classic";
  if (DEPTH_RULES.every((d) => ruleValue(G, d.k) === d.deep)) return "deep";
  return null;
}
const depthOn = (G, k) => !!ruleValue(G, k);

// Knobs that change the shape of a season must wait for the rollover.
const STRUCTURAL_RULES = ["seasonLen", "playoffFormat", "seriesLen"];

const DIFFICULTIES = {
  casual:    { label:"Casual",    budget:1.15, askPrice:0.9,  injury:0.75, patience:2.0 },
  normal:    { label:"Normal",    budget:1.0,  askPrice:1.0,  injury:1.0,  patience:1.0 },
  cutthroat: { label:"Cutthroat", budget:0.9,  askPrice:1.15, injury:1.25, patience:0.55 },
};

/* ----------------------------- the board's ask -----------------------------
 * boardConfidence existed but nothing ever said what was expected, so a season
 * had no stated stakes. A mandate is set at the start of every year from where
 * the club actually is, and judged when the Cup is handed out.
 * ------------------------------------------------------------------------- */
/* Below this the board stops asking and starts looking. Deliberately low: a
   manager should be able to survive one bad year on a rebuild, and only a run
   of them should cost him the job. */
const FIRING_LINE = 12;

const MANDATES = {
  rebuild:   { label: "Develop the young players", need: 0,  blurb: "Nobody expects the playoffs. Bring the kids along." },
  compete:   { label: "Push for a playoff spot",   need: 1,  blurb: "Be in it in March." },
  playoffs:  { label: "Make the playoffs",         need: 1,  blurb: "Anything less is a failed season." },
  round:     { label: "Win a round",               need: 2,  blurb: "Getting in isn't the job any more." },
  contend:   { label: "Reach the Cup Final",       need: 3,  blurb: "This roster was built to go deep." },
  cup:       { label: "Win the Cup",               need: 4,  blurb: "It's the Cup or it's a wasted year." },
};
/* Taking the next job. The club you left keeps its history; you start again on
   a fresh board with a fresh mandate, which is the whole shape of the thing —
   a career is a sequence of tenures, not one club forever. */
/* ------------------------- the manager's own record -------------------------
 * A club keeps `t.seasons` for ever. The MANAGER kept `G.tenure` — a start
 * year, an end year and a cup count — so a career spent at four clubs left no
 * record of what you actually did at any of them. Your own page was the one
 * page in the game with no history on it.
 *
 * `G.gmSeasons` is the manager's equivalent of `t.seasons`: one row a year,
 * stamped with the club, so moving on doesn't erase what came before. Written
 * at the rollover, where the club's own row is written, from the same numbers.
 * ------------------------------------------------------------------------- */
function recordGmSeason(G) {
  const t = G.teams[G.userTeam];
  if (!t) return G;
  G.gmSeasons = G.gmSeasons || [];
  if (G.gmSeasons.some((s) => s.year === G.year)) return G;
  const champ = G.playoffs && G.playoffs.champion;
  const made = !!(G.playoffs && G.playoffs.rounds[0].some((s) => s.hi === G.userTeam || s.lo === G.userTeam));
  G.gmSeasons.push({
    year: G.year, teamId: G.userTeam, abbr: t.abbr,
    w: t.w, l: t.l, otl: t.otl, pts: t.pts,
    playoffs: made,
    rounds: G.playoffs ? G.playoffs.rounds.filter((rd) => rd.some((s) => s.winner === G.userTeam)).length : 0,
    cup: champ === G.userTeam,
    mandate: (G.mandate && G.mandate.label) || null,
    met: seasonAchievement(G) >= ((G.mandate && G.mandate.need) || 1),
    board: Math.round(G.boardConfidence),
  });
  return G;
}
/* The career in one line, across every club. */
function gmCareer(G) {
  const s = G.gmSeasons || [];
  const clubs = Array.from(new Set(s.map((x) => x.abbr)));
  return {
    seasons: s.length,
    w: s.reduce((a, x) => a + x.w, 0), l: s.reduce((a, x) => a + x.l, 0), otl: s.reduce((a, x) => a + x.otl, 0),
    playoffs: s.filter((x) => x.playoffs).length,
    rounds: s.reduce((a, x) => a + x.rounds, 0),
    cups: s.filter((x) => x.cup).length,
    met: s.filter((x) => x.met).length,
    clubs,
  };
}

/* ============================ CAREER AND OWNERSHIP =========================
 * The whole game was played from a chair somebody else could take away, and a
 * twenty-season career had nothing to show for itself but a trophy count. This
 * is the other axis: you are PAID, what you are worth depends on what you have
 * done, and the money can eventually buy you the thing nobody can take away.
 *
 * The ladder is deliberately long and mostly out of reach. A club costs far
 * more than a manager earns, so the route in is a MINORITY STAKE alongside
 * other investors — and from there you buy them out one at a time. Owning a
 * majority is the point at which the board stops being able to sack you.
 *
 * All of it is off by default and lives behind the `ownership` rule.
 * ------------------------------------------------------------------------- */

/* What a club is worth, in the same millions everything else is priced in.
   Market size is the floor, winning is the multiplier, and the trophy case is
   permanent — a club with history is never cheap again. */
const CLUB_BASE_VALUE = 26;
const CLUB_MKT_VALUE = 7.5;
function teamValue(G, teamId) {
  const t = G.teams[teamId];
  if (!t) return 0;
  const seasons = (t.seasons || []).slice(-5);
  const pace = seasons.length
    ? seasons.reduce((s, x) => s + x.pts, 0) / (seasons.length * 2 * ruleValue(G, "seasonLen"))
    : 0.5;
  const history = (t.cupWins || 0) * 6 + (t.playoffApps || 0) * 0.5;
  const gate = (t.revenue || 0) * 0.4 + (t.budget || 0) * 0.6;
  return round1(clamp(
    (CLUB_BASE_VALUE + (t.mkt || 3) * CLUB_MKT_VALUE) * (0.65 + pace) + history + gate,
    18, 400));
}

/* What you have done, on a scale the game can price. Cups dominate, because
   they should; seasons and rounds accumulate; getting sacked costs you. */
function gmLegacy(G) {
  const s = G.gmSeasons || [];
  const cups = s.filter((x) => x.cup).length;
  const rounds = s.reduce((a, x) => a + x.rounds, 0);
  const po = s.filter((x) => x.playoffs).length;
  const sacked = (G.tenure || []).length;
  return Math.round(clamp(cups * 26 + rounds * 4 + po * 2.5 + s.length * 1.2 - sacked * 6, 0, 200));
}
/* What a club will pay you. A first job is a first job; a man with three cups
   names his price. */
const GM_BASE_SALARY = 1.4;
function gmSalaryFor(G, teamId) {
  const t = G.teams[teamId];
  const mkt = t ? (t.mkt || 3) : 3;
  return round1(GM_BASE_SALARY + mkt * 0.22 + gmLegacy(G) * 0.032);
}
function gmState(G) {
  if (!G.gm) G.gm = { cash: 0, salary: 0, contract: null, stakes: {}, ownHistory: [], paid: [] };
  if (!G.gm.stakes) G.gm.stakes = {};
  if (!G.gm.ownHistory) G.gm.ownHistory = [];
  return G.gm;
}
/* Paid once a season, at the rollover. Recorded per year so the career page can
   show what you actually earned rather than a running total with no story. */
function payGm(G) {
  if (!depthOn(G, "ownership")) return G;
  const gm = gmState(G);
  const salary = gm.contract ? gm.contract.salary : gmSalaryFor(G, G.userTeam);
  gm.salary = salary;
  gm.cash = round1((gm.cash || 0) + salary);
  gm.paid = (gm.paid || []).concat([{ year: G.year, salary, teamId: G.userTeam }]).slice(-40);
  if (gm.contract && gm.contract.yrs > 0) gm.contract.yrs--;
  return G;
}

/* ------------------------------- your stake --------------------------------
 * `t.investors` is who else is in. Their shares and yours always sum to one,
 * and a club nobody has bought into is simply owned by its original owner. */
function myShare(G, teamId) { return (gmState(G).stakes || {})[teamId] || 0; }
function isMajorityOwner(G, teamId) { return myShare(G, teamId) > 0.5; }
function ownsAny(G) { return Object.keys(gmState(G).stakes || {}).filter((k) => gmState(G).stakes[k] > 0); }

/* How badly the people who own it want out. Derived from the club id so it is
   stable, nudged by how the club is doing — a losing side in a small market is
   the one that comes up for sale. `t.forSaleYear` records a club that has
   actually been put on the market. */
function sellWillingness(G, teamId) {
  const t = G.teams[teamId];
  if (!t) return 0;
  const base = hashUnit(t.id * 3301 + 7);        // some owners simply never sell
  const seasons = (t.seasons || []).slice(-3);
  const bad = seasons.length
    ? seasons.filter((s) => !s.playoffs).length / seasons.length : 0.5;
  const small = 1 - (t.mkt || 3) / 6;
  return clamp(base * 0.6 + bad * 0.28 + small * 0.2, 0, 1);
}

/* What is actually available this offseason. Computed, not stored, so it can
   never be stale — and deliberately thin: a club changing hands is meant to be
   the event of a decade, not a shopping list. */
const SALE_WILLING_BAR = 0.72;    // an owner has to genuinely want out
const STAKE_MIN = 0.08;           // the smallest slice anybody will sell
function ownershipMarket(G) {
  if (!depthOn(G, "ownership")) return [];
  const gm = gmState(G);
  const out = [];
  G.teams.forEach((t) => {
    const mine = myShare(G, t.id);
    if (mine >= 1) return;
    const w = sellWillingness(G, t.id);
    const value = teamValue(G, t.id);
    if (mine > 0) {
      /* You're already in. Partners will sell you more, and the price goes up
         as your stake does — the last slice is always the dearest, because the
         man holding it knows exactly what it's worth to you. */
      /* A QUARTER of what's left, not nearly half. At 45% the first step up
         from a 15% stake was 38% in one $27M lump — thirteen years of saving
         with no partial progress, and a thirty-year career that reached a
         majority of nothing. A quarter buys a step every few years, which is
         how a takeover actually feels: you creep up on it. */
      const slice = Math.min(1 - mine, Math.max(STAKE_MIN, (1 - mine) * 0.25));
      out.push({ kind: "buyout", teamId: t.id, share: round1(slice * 100) / 100,
        price: round1(value * slice * (1.08 + mine * 0.5)), value, willing: w });
      return;
    }
    if (w < SALE_WILLING_BAR) return;
    // A group forming is the way in; an outright sale is the once-a-decade one.
    const outright = w > 0.9 && hashUnit(t.id * 977 + G.year) > 0.72;
    if (outright) {
      out.push({ kind: "club", teamId: t.id, share: 1, price: round1(value * 1.12), value, willing: w });
    } else {
      const slice = 0.15 + Math.floor(hashUnit(t.id * 131 + G.year) * 3) * 0.1;
      out.push({ kind: "stake", teamId: t.id, share: slice,
        price: round1(value * slice * 1.05), value, willing: w });
    }
  });
  return out.sort((a, b) => a.price - b.price);
}

/* Buying in. The money is real and the stake is permanent until you sell it. */
function buyStake(G, teamId, share, price) {
  if (!depthOn(G, "ownership")) return { ok: false, why: "ownership is switched off" };
  const gm = gmState(G);
  if (price > gm.cash) return { ok: false, why: `you have $${gm.cash}M — that costs $${price}M` };
  /* ONE CLUB, AND IT HAS TO BE YOURS. Thirty simulated years ended with
     minority stakes in six clubs at once, several in the same division — a man
     holding a piece of both sides of a playoff series — and, worse, running
     Hartford while owning Boise. No league permits either.
     What's left is the thing the ladder was always for: you buy the club you
     work at, a slice at a time. The one exception is a club going in its
     ENTIRETY, which you can take on from anywhere — and then you go and run it,
     because that's what buying a hockey club means. */
  const before = myShare(G, teamId);
  const elsewhere = ownsAny(G).filter((k) => +k !== teamId);
  if (elsewhere.length) {
    return { ok: false, why: `you already hold part of the ${G.teams[+elsewhere[0]].name}`
      + " — no league lets one man own two clubs. Sell that stake first." };
  }
  const outright = before <= 0 && share >= 1;
  if (teamId !== G.userTeam && !outright) {
    return { ok: false, why: `you can only buy into the club you run`
      + ` — unless the ${G.teams[teamId].name} go in one piece.` };
  }
  const after = Math.min(1, round1((before + share) * 100) / 100);
  gm.cash = round1(gm.cash - price);
  gm.stakes[teamId] = after;
  if (!before) {
    gm.ownHistory.push({ teamId, abbr: G.teams[teamId].abbr, from: G.year, to: null, peak: after });
  } else {
    const h = gm.ownHistory.filter((x) => x.teamId === teamId).pop();
    if (h) h.peak = Math.max(h.peak, after);
  }
  const t = G.teams[teamId];
  news(G, after >= 1
    ? `You now own the ${t.name} outright.`
    : `You have bought ${Math.round(share * 100)}% of the ${t.name} — you hold ${Math.round(after * 100)}%.`,
    "good");
  if (before <= 0.5 && after > 0.5) {
    news(G, `You hold a controlling interest in the ${t.name}. The board cannot sack you.`, "good");
  }
  /* Bought a club whole from outside: you go and run it. Anything else would
     leave you managing one club and owning another, which is the thing this
     rule exists to prevent. */
  if (teamId !== G.userTeam && after >= 1) {
    takeJob(G, teamId);
    news(G, `You own the ${t.name}, and you're taking the chair yourself.`, "good");
  }
  return { ok: true, share: after };
}
/* Selling out, which is also how a career ends well. */
function sellStake(G, teamId, share) {
  const gm = gmState(G);
  const have = myShare(G, teamId);
  if (!have) return { ok: false, why: "you don't own any of it" };
  const sold = Math.min(have, share);
  const price = round1(teamValue(G, teamId) * sold * 0.94);
  gm.cash = round1(gm.cash + price);
  gm.stakes[teamId] = round1((have - sold) * 100) / 100;
  if (gm.stakes[teamId] <= 0) {
    delete gm.stakes[teamId];
    const h = gm.ownHistory.filter((x) => x.teamId === teamId).pop();
    if (h && h.to == null) h.to = G.year;
  }
  return { ok: true, price };
}

/* ------------------------------ running itself -----------------------------
 * Auto-manage was a boolean that reached exactly two routines — the AI's
 * extension offers and its free-agent sweep. Everything else in the game that
 * an AI club does for itself explicitly SKIPPED the user, so a club left to run
 * itself never made a deadline trade, never sold a rental, never answered a
 * demand and never touched the cap floor. Thirty seasons of it went
 * 888-1327-245. That isn't a club running itself badly; it's a club with most
 * of its hands tied.
 *
 * `aiRuns` is now the single gate every one of those routines asks, and a STYLE
 * says how. The four are real strategies with real costs, not difficulty
 * settings: a club told to contend will mortgage picks for rentals and spend to
 * the ceiling, one told to build will sell every veteran it has and play the
 * kids, and one told to be frugal will do neither.
 * ------------------------------------------------------------------------- */
const AUTO_STYLES = {
  /* `keepVet` / `keepKid` rather than one number, because a single multiplier
     made "build" let its OWN PROSPECTS walk alongside the veterans — measured
     over four seasons it came out OLDER than the win-now club, which is the
     exact opposite of the instruction. Who you keep is the strategy; how many
     you keep is just a budget. */
  balanced: { label: "Balanced", blurb: "Runs the club the way the other thirty-one are run: buy when you're up, sell when you're down.",
    fa: 1, extend: 1, keepVet: 1, keepKid: 1, deadline: null, kids: 0, spend: 1 },
  /* `kids: -1` used to make sense when the development curve overshot and a
     thirty-year-old was genuinely the better player. With the curve fixed a
     young man of the same rating is the better bet every time, so preferring
     the veteran was simply playing a worse team — measured, contend went from
     the best style in the game to the worst. Its edge is what it ACQUIRES: the
     deadline, the ceiling, and keeping the men who are already good. */
  contend:  { label: "Win now", blurb: "Buys at the deadline whatever the table says, re-signs its veterans and spends to the ceiling. The picks go.",
    fa: 1.25, extend: 1.25, keepVet: 1.6, keepKid: 1.1, deadline: "buy", kids: -0.4, spend: 1 },
  build:    { label: "Build", blurb: "Sells every veteran worth a pick, keeps every young player it has and plays them ahead of the men.",
    fa: 0.55, extend: 0.75, keepVet: 0.3, keepKid: 1.4, deadline: "sell", kids: 1, spend: 0.85 },
  /* `spend` has to clear the FLOOR to mean anything — at 0.70 against a floor
     of 0.76 the club was pushed straight back up by `enforceFloor` and frugal
     measured identically to balanced. Just above `CAP_FLOOR_PCT` is the lowest
     a club can legally sit, which is exactly what this instruction means —
     written out rather than derived because that constant is declared further
     down the file and this object is evaluated on the way past. */
  /* A budget club loses the players it develops — that is what being a budget
     club MEANS, and without it frugal measured as the BEST strategy in the
     game: young, cheap, improving and richer than everyone. `keepKid` below 1
     is the cost, and it's the right one. It does not "bank the difference":
     measured over three leagues it earns LESS than the others, because a club
     that isn't good enough doesn't fill its building either. That is the
     honest answer and the blurb says so. */
  frugal:   { label: "Frugal", blurb: "Won't pay to keep anyone. A young squad, constantly turning over, that watches the players it develops leave — and finishes where you'd expect.",
    fa: 0.35, extend: 0.5, keepVet: 0.4, keepKid: 0.8, deadline: null, kids: 0.5, spend: 0.79 },
};
/* Which style the user's club is on, or null when he's running it himself.
   `true` is the old boolean, kept working so an existing save doesn't lose it. */
function autoStyle(G) {
  const v = ruleValue(G, "autoManage");
  if (!v) return null;
  return AUTO_STYLES[v] || AUTO_STYLES.balanced;
}
/* THE question every AI routine should ask, and the reason most of them were
   quietly leaving one club out of the league. */
function aiRuns(G, teamId) { return teamId !== G.userTeam || !!autoStyle(G); }
/* And how it should behave, for the routines that care. Every other club gets
   the balanced numbers, which are all 1 — so nothing about the other
   thirty-one changes, ever. */
function styleFor(G, teamId) {
  return teamId === G.userTeam ? (autoStyle(G) || AUTO_STYLES.balanced) : AUTO_STYLES.balanced;
}

/* ------------------------- what owning actually pays ------------------------
 * Thirty simulated years found the hole: an owner's only income was his GM
 * salary. Fifteen per cent of a sixty-million-dollar club paid nothing at all,
 * so a career banked $2.4M a year against slices priced at $26M and NEVER
 * REACHED A MAJORITY — six clubs held at 15% after thirty seasons and no
 * control of any of them. The ladder had no rungs above the first.
 *
 * A club pays its owners now. `clubProfit` is a yield on what the place is
 * worth, scaled by how it's actually run: a full building and a winning side
 * clears real money, a bad one LOSES it and every owner pays his share. That
 * makes the stake compound — the more you hold the faster you buy the rest,
 * which is exactly how this works in life — and it makes buying into a badly
 * run club the mistake it ought to be.
 * ------------------------------------------------------------------------- */
const DIVIDEND_YIELD = 0.13;      // a well-run club, per year, on its value
function clubProfit(G, teamId) {
  const t = G.teams[teamId];
  if (!t) return 0;
  const value = teamValue(G, teamId);
  /* How the season went. Points percentage runs about .35–.65, so this lands
     between roughly −0.6 and +1.4 — a bad year really does cost the owners. */
  const last = (t.seasons || [])[Math.max(0, (t.seasons || []).length - 1)];
  const pace = last && last.pts ? clamp(last.pts / (2 * ruleValue(G, "seasonLen")), 0.25, 0.72) : 0.5;
  let run = (pace - 0.44) * 5;
  if (last && last.cup) run += 0.5;
  else if (last && last.playoffs) run += 0.25;
  /* And what it's paying out. A club at the ceiling with nothing to show for it
     is the classic way to lose money in this sport. */
  const payroll = capHit(G, teamId) / Math.max(1, rules(G).capAmount);
  run -= (payroll - 0.82) * 1.1;
  return round1(value * DIVIDEND_YIELD * clamp(run, -0.55, 1.45));
}
/* Paid at the rollover, alongside the salary. Losses are paid too — that is
   what a share is. */
function payDividends(G) {
  if (!depthOn(G, "ownership")) return G;
  const gm = gmState(G);
  let total = 0;
  Object.keys(gm.stakes || {}).forEach((k) => {
    const share = gm.stakes[k];
    if (!share) return;
    const cut = round1(clubProfit(G, +k) * share);
    if (!cut) return;
    total += cut;
    gm.dividends = (gm.dividends || []).concat([{ year: G.year, teamId: +k, amt: cut }]).slice(-40);
  });
  if (!total) return G;
  gm.cash = round1(gm.cash + total);
  news(G, total > 0
    ? `Your share of the year's profit: $${round1(total)}M.`
    : `Your share of the year's losses: $${round1(-total)}M.`, total > 0 ? "good" : "bad");
  return G;
}

/* --------------------------- an owner's decisions --------------------------
 * The other half of what thirty years showed: there was nothing to DO with a
 * stake. You bought it, and then the game carried on exactly as before.
 *
 * A direction is the thing an owner actually sets. As a GM the board hands you
 * a mandate and judges you against it; as an owner you decide where the club is
 * going and the board's job is to agree. It isn't free — each direction costs
 * something real — and it only unlocks at a controlling interest, because a man
 * with 15% doesn't get to decide.
 * ------------------------------------------------------------------------- */
const DIRECTIONS = {
  rebuild: { label: "Rebuild", mandate: "rebuild",
    blurb: "Lose now, on purpose. The kids play and come along much faster for it — but the building empties, and anybody you sign has to be paid to come and lose.",
    dev: 1.22, gate: 0.86, ask: 1.1 },
  compete: { label: "Compete", mandate: "playoffs",
    blurb: "A playoff club every year. Nothing gained and nothing given up.",
    dev: 1, gate: 1, ask: 1 },
  winNow: { label: "Win now", mandate: "contend",
    blurb: "Buy the years you have left. The place is full and players take less to come and chase it — and nobody under twenty-three learns a thing.",
    dev: 0.82, gate: 1.14, ask: 0.9 },
};
function directionOf(G, teamId) {
  if (!depthOn(G, "ownership")) return null;
  if (teamId !== G.userTeam || !isMajorityOwner(G, teamId)) return null;
  return DIRECTIONS[G.direction] || null;
}
function setDirection(G, key) {
  if (!DIRECTIONS[key]) return { ok: false, why: "no such direction" };
  if (!isMajorityOwner(G, G.userTeam))
    return { ok: false, why: "you'd need a controlling interest to set the club's course" };
  G.direction = key;
  /* An owner is not judged by his own board. The mandate becomes the thing YOU
     chose, which is the entire difference between owning it and working here. */
  G.mandate = { key: DIRECTIONS[key].mandate, year: G.year, owner: true, ...MANDATES[DIRECTIONS[key].mandate] };
  news(G, `You have set the club's course: ${DIRECTIONS[key].label.toLowerCase()}.`, "info");
  return { ok: true };
}

/* --------------------------------- capital ---------------------------------
 * And somewhere for the money to go besides another slice. An owner can put his
 * own cash into the club — permanently, out of his pocket, never recoverable —
 * and get something the club keeps for ever. It is the one way a manager's
 * career earnings turn into hockey rather than into a bigger number.
 * ------------------------------------------------------------------------- */
const INVESTMENTS = {
  arena: { label: "The building", cost: 12, max: 5,
    blurb: "More seats and better ones. Every home date is worth more, for ever — and a full house is the loudest home ice in the league." },
  facility: { label: "Training facility", cost: 15, max: 3,
    blurb: "Where your young players actually get better. Compounds over a decade in a way nothing else does." },
  scouting: { label: "Scouting department", cost: 9, max: 3,
    blurb: "More eyes on more rinks — extra scouting visits every summer, permanently." },
};
function investLevel(G, teamId, k) {
  const t = G.teams[teamId];
  return (t && t.invest && t.invest[k]) || 0;
}
function investCost(G, teamId, k) {
  const def = INVESTMENTS[k];
  if (!def) return 0;
  // Each one after the first costs more, so a club can't simply be bought good.
  return round1(def.cost * (1 + investLevel(G, teamId, k) * 0.75));
}
function investInClub(G, teamId, k) {
  if (!depthOn(G, "ownership")) return { ok: false, why: "ownership is switched off" };
  const def = INVESTMENTS[k];
  if (!def) return { ok: false, why: "no such thing to build" };
  if (myShare(G, teamId) <= 0) return { ok: false, why: "you don't own any of this club" };
  const lvl = investLevel(G, teamId, k);
  if (lvl >= def.max) return { ok: false, why: `${def.label} is as good as it gets` };
  const gm = gmState(G);
  const cost = investCost(G, teamId, k);
  if (cost > gm.cash) return { ok: false, why: `that costs $${cost}M and you have $${gm.cash}M` };
  gm.cash = round1(gm.cash - cost);
  const t = G.teams[teamId];
  t.invest = t.invest || {};
  t.invest[k] = lvl + 1;
  news(G, `You have put $${cost}M of your own money into the ${def.label.toLowerCase()}.`, "good");
  return { ok: true, level: lvl + 1, cost };
}

/* -------------------------------- relocation -------------------------------
 * The one thing only an owner can do, and the one every fan dreads. A club is
 * a building in a city; a man who owns it outright can put it on a truck.
 *
 * The markets are real places with sizes attached, and moving to a bigger one
 * is worth money for ever — the gate scales off `t.mkt` and so does the club's
 * value. It costs a fortune up front, it takes the SUPPORT WITH IT (a moved
 * club starts with an empty building and has to earn a city back), and it
 * erases the rivalry, because a rivalry is geography.
 *
 * Needs a controlling interest. A minority holder does not get to move a club
 * out of its city, and neither does a manager.
 * ------------------------------------------------------------------------- */
const MARKETS = [
  { city: "Las Vegas",    name: "Aces",       mkt: 5 },
  { city: "Houston",      name: "Outlaws",    mkt: 5 },
  { city: "Atlanta",      name: "Firebirds",  mkt: 5 },
  { city: "Seattle",      name: "Kraken",     mkt: 4 },
  { city: "Salt Lake",    name: "Yeti",       mkt: 4 },
  { city: "Kansas City",  name: "Scouts",     mkt: 3 },
  { city: "Hamilton",     name: "Steelers",   mkt: 4 },
  { city: "Quebec City",  name: "Nordiques",  mkt: 3 },
  { city: "Saskatoon",    name: "Blades",     mkt: 2 },
  { city: "Hershey",      name: "Bears",      mkt: 2 },
];
const RELOCATE_BASE = 40;        // $M before the market premium
const RELOCATE_PER_MKT = 14;     // and what each step up costs on top
/* What's available: anywhere no club already plays. `t.movedFrom` remembers
   where a club came from, so a city that has been abandoned stays abandoned. */
function relocationOptions(G) {
  if (!depthOn(G, "ownership")) return [];
  const used = new Set();
  G.teams.forEach((t) => { used.add(t.city); if (t.movedFrom) t.movedFrom.forEach((c) => used.add(c)); });
  const here = G.teams[G.userTeam];
  return MARKETS.filter((m) => !used.has(m.city)).map((m) => ({
    ...m,
    cost: round1(RELOCATE_BASE + Math.max(0, m.mkt - (here ? here.mkt : 3)) * RELOCATE_PER_MKT),
    bigger: m.mkt > (here ? here.mkt : 3),
  })).sort((a, b) => b.mkt - a.mkt || a.cost - b.cost);
}
function relocate(G, city, keepName) {
  if (!depthOn(G, "ownership")) return { ok: false, why: "ownership is switched off" };
  const t = G.teams[G.userTeam];
  if (!isMajorityOwner(G, G.userTeam))
    return { ok: false, why: "only a controlling owner can move a club" };
  const opt = relocationOptions(G).find((m) => m.city === city);
  if (!opt) return { ok: false, why: "nobody is waiting for a club there" };
  const gm = gmState(G);
  if (opt.cost > gm.cash) return { ok: false, why: `moving costs $${opt.cost}M and you have $${gm.cash}M` };
  gm.cash = round1(gm.cash - opt.cost);
  const from = t.city;
  t.movedFrom = (t.movedFrom || []).concat([from]);
  t.city = opt.city;
  if (!keepName) t.name = opt.name;
  t.mkt = opt.mkt;
  /* The building is new and empty. Whatever an owner spent on the old one does
     not come with him, the city has to be won over from scratch, and the
     rivalry is gone because a rivalry is two places, not two badges. */
  t.invest = { ...(t.invest || {}), arena: 0 };
  t.revenue = 0;
  if (t.rivalId != null && G.teams[t.rivalId]) G.teams[t.rivalId].rivalId = null;
  t.rivalId = null;
  moveFans(G, -(fanMood(G) - 35));
  G.relocations = (G.relocations || []).concat([{ year: G.year, from, to: t.city, name: t.name }]);
  news(G, `The franchise is moving. ${from} loses its club; ${t.city} has one.`, "bad");
  return { ok: true, cost: opt.cost, from, to: t.city };
}

/* ------------------------------- the vote ----------------------------------
 * A majority owner cannot be sacked — that is what the majority is for. A
 * MINORITY owner can be voted out by his partners, and how likely that is
 * depends on how much of the club he holds and how badly it is going. Owning a
 * piece buys you patience, not immunity. */
function ownerVoteChance(G, teamId) {
  const share = myShare(G, teamId);
  // No stake, no vote: a manager who owns nothing is simply sacked by the
  // board, which is the ordinary path and not this one.
  if (share <= 0) return 0;
  if (share > 0.5) return 0;
  if (G.boardConfidence > FIRING_LINE) return 0;
  // Every point of stake is a point of protection.
  return clamp(0.75 - share * 1.2, 0, 0.75);
}

/* Stepping back. An owner does not have to run his own club, and can take the
   job back whenever he likes — that is the whole difference between owning the
   place and working there. */
function standDown(G) {
  if (!isMajorityOwner(G, G.userTeam) && myShare(G, G.userTeam) <= 0) {
    return { ok: false, why: "you don't own this club" };
  }
  G.gmStoodDown = { teamId: G.userTeam, year: G.year };
  news(G, `You have stepped back from running the ${G.teams[G.userTeam].name}. You still own it.`, "info");
  return { ok: true };
}
function takeBackTheJob(G) {
  if (!G.gmStoodDown) return { ok: false, why: "you're already running it" };
  const teamId = G.gmStoodDown.teamId;
  G.gmStoodDown = null;
  G.userTeam = teamId;
  G.fired = null;
  G.boardConfidence = Math.max(G.boardConfidence, 50);
  setMandate(G);
  news(G, `You have taken charge of the ${G.teams[teamId].name} again.`, "good");
  return { ok: true };
}

function takeJob(G, teamId) {
  if (teamId == null || !G.teams[teamId]) return { ok: false, why: "no such club" };
  G.userTeam = teamId;
  G.hiredYear = G.year;
  G.fired = null;
  // A new board starts you around even, a touch below if you were just sacked.
  G.boardConfidence = 55;
  G.shotLog = {}; G.gameLog = {}; G.lastGame = null;
  G.block = []; G.offers = [];
  setMandate(G);
  news(G, `You have taken over at the ${G.teams[teamId].name}.`, "good");
  return { ok: true };
}

function setMandate(G) {
  /* A man who owns the club is not handed a mandate by his own board. The
     course he set IS the expectation, and it stands until he changes it. */
  const owned = directionOf(G, G.userTeam);
  if (owned) {
    G.mandate = { key: owned.mandate, year: G.year, owner: true, ...MANDATES[owned.mandate] };
    return G.mandate;
  }
  const t = G.teams[G.userTeam];
  const strength = teamStrength(G, G.userTeam);
  const last = t.seasons && t.seasons.length ? t.seasons[t.seasons.length - 1] : null;
  const wonCup = last && last.cup;
  /* What the club actually DID recently, not just what it rates on paper. A
     roster of twenty-one-year-olds on entry deals still scores as competitive,
     which is how a side that finished last four years running kept being told
     to win a round. Two bad years and the board wants a rebuild, whatever the
     ratings say. */
  const recent = (t.seasons || []).slice(-2);
  const dire = recent.length >= 2 && recent.every((s) => !s.playoffs && s.pts < 60);
  /* Asking for the Cup should be RARE, and it has to STAY rare.
   *
   * These were absolute numbers — 73 for the Cup, 68 to contend, and so on —
   * against a `teamStrength` that is a plain average of overall ratings. And
   * the league INFLATES: measured over twenty seasons the average NHL player
   * goes from 62 to 75, so club strength climbs with it and by about year
   * twelve every one of the thirty-two clears 73. Every club in the league
   * asked to win the same Cup, for ever, on a fixed scale that stopped meaning
   * anything the moment the ratings moved.
   *
   * A board doesn't grade a roster against a number, it grades it against the
   * other thirty-one. `strengthRank` is 0 for the best club in the league, so
   * these read as "top two", "top seven", and so on — which survives any amount
   * of inflation and says exactly what was always meant. */
  const wentDeep = !!(last && last.rounds >= 3);
  const rank = strengthRank(G, G.userTeam);
  const n = G.teams.length;
  const within = (frac) => rank < Math.max(1, Math.round(n * frac));
  let key = "rebuild";
  if (dire) key = recent.every((s) => s.pts < 45) ? "rebuild" : "compete";
  else if (wonCup || within(0.06) || (wentDeep && within(0.16))) key = "cup";
  else if (within(0.22)) key = "contend";
  else if (within(0.38)) key = "round";
  else if (within(0.56)) key = "playoffs";
  else if (within(0.78)) key = "compete";
  /* AND IT CAN ONLY ASK FOR ONE STEP MORE THAN YOU JUST DID. Strength is a
     rating, not a result: a club that rates 73 and finishes twentieth was
     still being told to win the Cup, year after year, because the paper said
     it was good. A board that watched the same team miss the playoffs asks it
     to make them — not to win four rounds. Escalation has to be earned. */
  if (last) {
    const did = last.cup ? 4 : last.playoffs ? Math.min(3, 1 + last.rounds) : 0;
    const ceiling = did + 1;
    const order = ["rebuild", "compete", "playoffs", "round", "contend", "cup"];
    while (order.indexOf(key) > 0 && (MANDATES[key].need || 0) > ceiling) {
      key = order[order.indexOf(key) - 1];
    }
  }
  G.mandate = { key, year: G.year, ...MANDATES[key] };
  return G.mandate;
}
/* What the club actually achieved, on the mandate's own scale. */
function seasonAchievement(G) {
  const P = G.playoffs;
  if (!P) return 0;
  const made = P.rounds[0].some((s) => s.hi === G.userTeam || s.lo === G.userTeam);
  if (!made) return 0;
  if (P.champion === G.userTeam) return 4;
  const rounds = P.rounds.filter((rd) => rd.some((s) => s.winner === G.userTeam)).length;
  return Math.min(3, 1 + rounds);
}

/* -------------------------------- the room ---------------------------------
 * Hockey is the most dressing-room sport there is and the game had none of it.
 * A personality is derived from the player's id, so it's stable for his whole
 * career and an old save gets one without reshuffling anybody. It is pure
 * character — it never touches a rating — but it decides who wears the C, how
 * he takes a bad run, and how much the room sags when things go wrong.
 * ------------------------------------------------------------------------- */
const PERSONALITIES = [
  { key: "leader",    label: "Natural leader",  lead: 2.2, steady: 1.6 },
  { key: "quiet",     label: "Quiet pro",       lead: 1.1, steady: 1.5 },
  { key: "warrior",   label: "Warrior",         lead: 1.6, steady: 1.2 },
  { key: "sniper",    label: "Pure shooter",    lead: 0.7, steady: 0.9 },
  { key: "hothead",   label: "Hothead",         lead: 0.5, steady: 0.4 },
  { key: "joker",     label: "Room joker",      lead: 0.9, steady: 1.3 },
  { key: "workhorse", label: "Workhorse",       lead: 1.3, steady: 1.4 },
  { key: "moody",     label: "Moody",           lead: 0.4, steady: 0.5 },
];
const personalityOf = (p) => PERSONALITIES[(p.id * 2749) % PERSONALITIES.length];

/* ------------------------------ player demands ----------------------------
 * `personalityOf` and `roomMorale` have existed since the room was built and
 * nothing has ever come of them — a moody winger buried on the fourth line was
 * exactly as content as a quiet pro playing twenty minutes. A demand is what
 * turns character into something you have to manage.
 *
 * Two of them, and both are earned rather than random: a player good enough to
 * be playing more asks for minutes, and a player who has been ignored long
 * enough — or is rotting on a club going nowhere — asks out. `steady` is what
 * decides how long he'll wear it, which is what that rating was always for.
 *
 * `p.demand` holds one at a time, with the day it was made, so the UI can say
 * how long you have been ignoring him.
 * ------------------------------------------------------------------------- */
const DEMAND_EVERY = 21;        // days between a club's players speaking up
const DEMAND_MIN_GP = 12;       // before this nobody has a case
const DEMAND_PATIENCE = 40;     // days a demand stands before it curdles

/* What a player of his quality expects to be playing, in minutes. Measured off
   the engine's own deployment rather than invented: a top-six forward runs
   ~17, a depth man ~11, and a defenceman more of both. */
function expectedMinutes(p) {
  const base = p.pos === "D" ? 15.5 : 12.5;
  return base + Math.max(0, p.ovr - 55) * 0.28;
}
const DEMAND_SQUAD_RANK = 12;   // outside his club's best twelve he has no case
function demandCase(G, p) {
  if (p.pos === "G" || !p.season || p.season.gp < DEMAND_MIN_GP) return null;
  /* HE HAS TO HAVE A CASE. `expectedMinutes` is an absolute, and a four-line
     club can only give top-six minutes to six forwards — so every decent
     third-liner in the league had a grievance and the count climbed to a third
     of all players. A man outside his own club's best twelve is not being
     wronged, he is being ranked. */
  if (p.teamId != null) {
    const squad = rosterOf(G, p.teamId).filter((x) => x.pos !== "G")
      .sort((a, b) => b.ovr - a.ovr);
    if (squad.findIndex((x) => x.id === p.id) >= DEMAND_SQUAD_RANK) return null;
  }
  const mins = p.season.toi / Math.max(1, p.season.gp);
  const want = expectedMinutes(p);
  const short = want - mins;
  const per = personalityOf(p);
  // A steady character puts up with more before he says anything.
  const bar = 1.6 * per.steady;
  if (short < bar) return null;
  const t = G.teams[p.teamId];
  const pos = t ? standings(G).findIndex((x) => x.id === p.teamId) : 0;
  /* Asking OUT is the bigger step: he has to be badly under-used AND either
     senior enough to have run out of patience or stuck on a club going
     nowhere. Anything less is a conversation about ice time. */
  const hopeless = pos >= 24 && p.age >= 28;
  const buried = short >= bar * 2;
  return { kind: buried && (hopeless || p.age >= 30) ? "trade" : "minutes",
    short: round1(short), want: round1(want), got: round1(mins) };
}

function rollDemands(G) {
  if (!depthOn(G, "demands")) return G;
  if (G.phase !== "regular" || G.day % DEMAND_EVERY !== 0 || G.day === 0) return G;
  /* THE WHOLE LEAGUE, not just your club. Demands started as a thing that
     happened to you, which made them a tax rather than a system — an unhappy
     star in Boise is exactly the kind of thing that should turn up on your
     deadline board, and it can't if only your players are ever unhappy. */
  G.teams.forEach((t) => rosterOf(G, t.id).forEach((p) => {
    if (p.demand) return;                     // he's already said his piece
    const c = demandCase(G, p);
    if (!c) return;
    p.demand = { kind: c.kind, day: G.day, year: G.year, want: c.want, got: c.got };
    // Your own room is news; a rumble elsewhere is only news when it's a
    // player worth hearing about.
    if (t.id === G.userTeam) {
      news(G, c.kind === "trade"
        ? `${fullName(p)} has asked to be traded — ${c.got} minutes a night and he wants out.`
        : `${fullName(p)} wants more ice time — ${c.got} a night when he expects ${c.want}.`,
        c.kind === "trade" ? "bad" : "info");
    } else if (c.kind === "trade" && p.ovr >= 72) {
      news(G, `${fullName(p)} has asked out of ${t.city}.`, "info");
    }
  }));
  /* A demand you meet goes away on its own; one you ignore long enough stops
     being a request. This is the only thing that reads `p.demand` back. */
  rosterOf(G, G.userTeam, true).forEach((p) => {
    if (!p.demand || p.demand.year !== G.year) return;
    if (!demandCase(G, p)) { p.demand = null; return; }      // you fixed it
    if (p.demand.kind === "minutes" && G.day - p.demand.day > DEMAND_PATIENCE) {
      p.demand = { ...p.demand, kind: "trade", day: G.day };
      news(G, `${fullName(p)} has stopped asking for minutes and asked to be traded.`, "bad");
    }
  });
  return G;
}
/* Unhappiness is a real cost, not a news item. A man who has asked out is not
   giving you his best, which is what makes meeting the demand worth something.
   A holdout isn't playing at all, so he never reaches this. */
function demandDrag(G, p) {
  if (!depthOn(G, "demands") || !p.demand) return 1;
  return p.demand.kind === "trade" ? 0.965 : 0.985;
}

/* ---------------------------- answering a demand --------------------------
 * A demand you can only respond to by quietly changing the lines is half a
 * mechanic. These are the three things a manager actually does: promise him
 * something, tell him no, or agree he should go.
 *
 * A PROMISE IS A DEBT. It buys peace now and costs you if you don't keep it —
 * `checkPromises` looks at whether his minutes actually moved, and a broken
 * promise lands harder than the original complaint ever did. Refusing is
 * cheaper today and worse for the room. Agreeing to move him puts him on the
 * block, where the trade machinery already lives.
 * ------------------------------------------------------------------------- */
const PROMISE_WINDOW = 21;     // days you have to make good on it
const PROMISE_MARGIN = 1.0;    // minutes you have to find for it to count

function answerDemand(G, pid, how) {
  const p = G.players[pid];
  if (!p || !p.demand) return { ok: false, why: "he hasn't asked for anything" };
  if (p.teamId !== G.userTeam) return { ok: false, why: "not your player" };
  if (how === "promise") {
    if (p.demand.kind !== "minutes") return { ok: false, why: "it's past that — he wants out" };
    p.demand = { ...p.demand, answered: "promise", promisedAt: G.day,
      // What he was playing when you gave your word, so it can be checked.
      base: round1(p.season.toi / Math.max(1, p.season.gp)) };
    news(G, `You promised ${fullName(p)} more ice time.`, "info");
    return { ok: true, why: "he'll wait and see" };
  }
  if (how === "refuse") {
    p.demand = { ...p.demand, answered: "refuse", answeredAt: G.day };
    // Telling a man no is allowed to be the right call. It just isn't free.
    addRoomHit(G, p.teamId, p.demand.kind === "trade" ? 4 : 2);
    news(G, `You told ${fullName(p)} he isn't going anywhere.`, "bad");
    return { ok: true, why: "he didn't take it well" };
  }
  if (how === "trade") {
    p.demand = { ...p.demand, answered: "trade", answeredAt: G.day };
    setBlock(G, pid, true);
    generateOffers(G);
    news(G, `${fullName(p)} has been made available.`, "info");
    return { ok: true, why: "clubs will call" };
  }
  return { ok: false, why: "no such answer" };
}

/* Did you keep your word? Run with the demand roll, so it is checked on the
   same rhythm everything else in the room is. */
function checkPromises(G) {
  rosterOf(G, G.userTeam, true).forEach((p) => {
    const d = p.demand;
    if (!d || d.answered !== "promise" || d.year !== G.year) return;
    if (G.day - d.promisedAt < PROMISE_WINDOW) return;
    const now = p.season.toi / Math.max(1, p.season.gp);
    if (now >= d.base + PROMISE_MARGIN) {
      p.demand = null;
      news(G, `${fullName(p)} has got his minutes and is happy again.`, "good");
    } else {
      // A broken promise is worse than a refusal — he asked, you said yes, and
      // nothing changed.
      p.demand = { kind: "trade", day: G.day, year: G.year, want: d.want, got: round1(now), broken: true };
      addRoomHit(G, p.teamId, 6);
      news(G, `${fullName(p)} never got the minutes he was promised and wants out.`, "bad");
    }
  });
  return G;
}

/* ------------------------- how everybody else answers ----------------------
 * Demands went league-wide and only YOU could ever resolve one, so an AI club's
 * unhappy player stayed unhappy for ever: over ten measured seasons the count
 * climbed 180 → 906, half the league, with `answered` at exactly zero every
 * year and morale falling from 49 to 31.
 *
 * Other clubs now do the same three things you can. They give a man minutes if
 * he's good enough to deserve them, they let him go if he isn't, and if neither
 * is true they wear it — but the demand resolves either way, because a room
 * that can never be settled isn't a system, it's a leak.
 * ------------------------------------------------------------------------- */
function aiAnswerDemands(G) {
  if (!depthOn(G, "demands")) return G;
  G.teams.forEach((t) => {
    // Your room is yours to manage — unless you've handed the club over.
    if (!aiRuns(G, t.id)) return;
    rosterOf(G, t.id, true).forEach((p) => {
      if (!p.demand) return;
      const squad = rosterOf(G, t.id).slice().sort((a, b) => b.ovr - a.ovr);
      const rank = squad.findIndex((x) => x.id === p.id);
      /* Good enough to play more? Then he plays more, and the complaint goes
         away — this is a club acting sensibly, not a favour. */
      if (rank >= 0 && rank < 9) { p.demand = null; p.holdout = false; return; }
      // Not good enough, and asking to leave: they let him go.
      if (p.demand.kind === "trade") {
        p.holdout = false;
        p.demand = null;
        if (p.contract.amt <= TERMINATE_MAX_CAP) releaseToPool(G, p);
        return;
      }
      // Otherwise it simply passes, the way most of them do.
      if (G.day - (p.demand.day || 0) > DEMAND_PATIENCE) p.demand = null;
    });
  });
  return G;
}

/* A trade demand should bring the phone to life. `generateOffers` already
   prices a listed player; this simply makes sure a man who has asked out is
   listed, so the two systems meet instead of running past each other. */
function demandOffers(G) {
  if (!depthOn(G, "demands")) return G;
  let any = false;
  rosterOf(G, G.userTeam, true).forEach((p) => {
    if (!p.demand || p.demand.kind !== "trade" || p.demand.answered === "refuse") return;
    if (onBlock(G, p.id)) return;
    setBlock(G, p.id, true);
    any = true;
  });
  if (any) generateOffers(G);
  return G;
}

/* ---------------------------------- holdouts ------------------------------
 * The end of the line. A man who asked out, was refused or ignored, and is
 * still there stops turning up. `p.holdout` is read by `activeRoster`, so he
 * is simply unavailable — no special case in the engine, the same as an injury.
 * ------------------------------------------------------------------------- */
const HOLDOUT_AFTER = 35;      // days of being ignored after asking to leave
function rollHoldouts(G) {
  if (!depthOn(G, "demands")) return G;
  // League-wide, like the demands themselves — a holdout elsewhere weakens that
  // club, which is exactly the kind of thing a rival should be able to exploit.
  G.teams.forEach((t) => rosterOf(G, t.id).forEach((p) => {
    if (p.holdout || !p.demand || p.demand.kind !== "trade") return;

/* --------------------------------- rosters -------------------------------- */

const playersOf = (G) => Object.values(G.players);

  rosterOf(G, teamId).filter((p) => p.inj <= 0 && !p.holdout && !p.ltir);

/* ----------------------------- lines & pairings ---------------------------- */
/* lines.F : 4 lines of [LW, C, RW] player ids
   lines.D : 3 pairs of [LD, RD]
   lines.G : [starter, backup]
   lines.PP: 2 units of 5, lines.PK: 2 units of 4 */

/* Share of even-strength forward ice time. Steepening this toward the real

   scoring tail: exactly ONE hundred-point scorer a year against a real one to
   fourteen, and a first line playing fourteen minutes a night against a real

/* Circle-method round robin over all 32 clubs, repeated until the season length

      rf.forEach((fx) => fixtures.push(fx));
      round++;
      arr.splice(1, 0, arr.pop());   // rotate all but the first
    }
  }

  // Spread the fixtures over a real calendar instead of playing all 32 clubs
  // every single night. Rest days are what make back-to-backs mean anything.
  let days = Math.max(len + 1, Math.round(len * CAL_DAYS_PER_ROUND));
  const cal = Array.from({ length: days }, () => []);
  const busy = Array.from({ length: days }, () => new Set());
  // Three nights off in midwinter for the All-Star break — a real gap in the
  // calendar rather than a cosmetic label.
  const breakStart = Math.floor(days * 0.55);
  const onBreak = new Set([breakStart, breakStart + 1, breakStart + 2]);
  const place = (fx, idx) => {
    // Spread by position in the whole fixture list, not by round. Anchoring on
    // the round would drop all sixteen of a round's games on one night, which is
    // exactly the every-club-plays-every-day calendar this replaced.
    const target = Math.min(days - 1, Math.floor((idx * days) / fixtures.length));
    for (let d = target; d < days; d++) {
      if (onBreak.has(d) || busy[d].has(fx.home) || busy[d].has(fx.away)) continue;
      cal[d].push(fx); busy[d].add(fx.home); busy[d].add(fx.away); return true;
    }
    for (let d = 0; d < target; d++) {
      if (onBreak.has(d) || busy[d].has(fx.home) || busy[d].has(fx.away)) continue;
      cal[d].push(fx); busy[d].add(fx.home); busy[d].add(fx.away); return true;
    }
    return false;
  };
  fixtures.forEach((fx, idx) => {
    if (place(fx, idx)) return;
    // Should never happen at these ratios, but a fixture must never be dropped.
    cal.push([fx]); busy.push(new Set([fx.home, fx.away])); days++;
  });

  G.schedule = cal;
  G.day = 0;
  G.allStarDay = breakStart + 1;
  G.lastPlayed = new Array(n).fill(-9);
  return cal;
}

// Days off since a club last played. 0 means a genuine back-to-back.
function restFor(G, teamId) {
  const last = (G.lastPlayed && G.lastPlayed[teamId] != null) ? G.lastPlayed[teamId] : -9;
  return last < 0 ? 3 : Math.max(0, G.day - last - 1);
}

/* -------------------------------- new game -------------------------------- */

function newGame(userTeam, opts) {
  opts = opts || {};
  const G = {
    v: 1,
    seed: (opts.seed != null ? opts.seed : Math.floor(Math.random() * 1e9)) | 0,
    nextPid: 1,
    year: opts.year || 2026,
    userTeam: userTeam || 0,
    hiredYear: opts.year || 2026,
    tenure: [],
    fired: null,
    difficulty: opts.difficulty || "normal",
    rules: Object.assign({}, RULES_DEFAULT, opts.rules || {}),
    pendingRules: null,
    phase: "regular",
    day: 0,
    players: {},
    teams: [],
    schedule: [],
    results: [],
    playoffs: null,
    draftClass: [],
    freeAgents: [],
    picks: [],
    history: [],
    log: [],
    awards: null,
    boardConfidence: 62,
    news: [],
    retained: [],
    waivers: [],
    mandate: null,
    lastMandate: null,
    hall: [],
    block: [],
    offers: [],
    shotLog: {},
    gameLog: {},
    records: null,
  };

  G.teams = TEAMS.map((t, i) => ({
    id: i, ...t,
    w:0, l:0, otl:0, pts:0, gf:0, ga:0, gp:0, streak:0, l10:[],
    lines: null, lineChem: [0, 0, 0, 0], lineSig: [null, null, null, null],
    pairChem: [0, 0, 0], pairSig: [null, null, null],
    cupWins: 0, playoffApps: 0,
    revenue: 0, budget: 0,
  }));

  // Roster generation. Team tier spreads the league from contender to lottery.
  /* How far apart the clubs are. A wide spread reads as exciting but it makes
     the league unrecognisable: the bottom club finished on 43 points against a
     real-world floor around 55, and the resulting blowouts inflated everything
     downstream — shutouts, 30-goal scorers, +/- extremes. Real NHL rosters sit
     closer together than instinct suggests. */
  const tiers = G.teams.map(() => clamp(gauss(G, 56, 4.4), 44, 68));
  G.teams.forEach((t, i) => {
    const tier = tiers[i];
    Object.entries(ROSTER_SHAPE).forEach(([pos, count]) => {
      for (let k = 0; k < count; k++) {
        // Top-line talent sits well above roster filler.
        const slot = 1 - k / (count + 1);
        const p = genPlayer(G, pos, tier + slot * 16 - 6);
        p.teamId = i;
        G.players[p.id] = p;
      }
    });
    // A few depth bodies on the farm.
    for (let k = 0; k < 5; k++) {
      const p = genPlayer(G, pick(G, ["C","LW","RW","D","G"]), tier - 14, ri(G, 19, 24));
      p.teamId = i; p.farm = true;
      G.players[p.id] = p;
    }
  });

  // Contracts, sized to market with a little noise, then squeezed under the cap.
  G.teams.forEach((t) => {
    rosterOf(G, t.id, true).forEach((p) => {
      p.contract = {
        amt: round1(clamp(marketValue(G, p) * (0.85 + rnd(G) * 0.35), MIN_SALARY, rules(G).capAmount * MAX_SALARY_PCT)),
        yrs: p.age < 23 ? ri(G, 1, 3) : ri(G, 1, 5),
      };
      if (p.farm) p.contract.amt = MIN_SALARY;
      p.ntc = eligibleForNtc(p) && p.contract.yrs >= 3 && rnd(G) < 0.55;
    });
    let guard = 0;
    while (capHit(G, t.id) > rules(G).capAmount && guard++ < 60) {
      const worst = rosterOf(G, t.id).sort((a, b) => b.contract.amt / Math.max(1, b.ovr) - a.contract.amt / Math.max(1, a.ovr))[0];
      if (!worst) break;
      worst.contract.amt = round1(Math.max(MIN_SALARY, worst.contract.amt * 0.85));
    }
    t.lines = autoLines(G, t.id);
    t.budget = round1(20 + t.mkt * 6);
    t.coach = genCoach(G, 50 + t.mkt * 3);
  });

  /* Rivalries, paired inside each division so they're always mutual. Eight
     clubs a division makes four pairs; nobody is left without one. */
  DIVS.forEach((_, d) => {
    const ids = G.teams.filter((t) => t.div === d).map((t) => t.id);
    for (let i = 0; i + 1 < ids.length; i += 2) {
      G.teams[ids[i]].rivalId = ids[i + 1];
      G.teams[ids[i + 1]].rivalId = ids[i];
    }
  });

  // Free agent pool and this year's draft picks.
  for (let k = 0; k < 40; k++) {
    const p = genPlayer(G, pick(G, ["C","LW","RW","D","G"]), 46, ri(G, 24, 36));
    G.players[p.id] = p;
    G.freeAgents.push(p.id);
  }
  seedPicks(G, G.year, 4);

  /* The founding league. Nobody generated here was ever drafted — the world
     starts with them already in it — so their bios must not claim they went
     undrafted, which is a different and much less flattering thing. One integer
     draws the line: anyone with a higher id arrived later, and a later arrival
     with no draft record really is an undrafted signing. Stamped BEFORE the
     draft class is built, or an offseason start would file its prospects on the
     wrong side of it. */
  G.foundingMaxPid = G.nextPid - 1;

  buildSchedule(G);
  setMandate(G);

  /* Where the career begins. Dropping straight into game one is the default and
     what every save did before, but the offseason is where a GM job actually
     starts: you inherit a roster, and the first things you do are a draft and a
     free-agent market. Starting there means your first season is one you built.
     It is a genuine offseason, not a cutscene — the same `offseasonStage` /
     `doOffseasonStep` sequence the game runs every other year, so the draft
     board, the scouting budget and the market all behave exactly as they will
     in year two. The season that follows is `G.year + 1`, because the draft you
     are about to run is this year's. */
  if (opts.start === "offseason") {
    G.phase = "offseason";
    G.offseasonStep = "review";
    buildDraftClass(G);
  }
  return G;
}

/* Tradeable pick records. Rounds beyond `PICK_ROUNDS` still exist in the draft —
   `pickOwner` falls back to the original club — they just can't be traded, which
   keeps the record count bounded. Seeding starts at the CURRENT year so this
   year's picks can move on draft day; seeding only future years meant the very
   first draft had no tradeable picks at all. */
const PICK_ROUNDS = 3;
function seedPicks(G, fromYear, years) {
  for (let y = 0; y < years; y++) {
    for (let rd = 1; rd <= PICK_ROUNDS; rd++) {
      G.teams.forEach((t) => G.picks.push({ year: fromYear + y, round: rd, owner: t.id, orig: t.id }));
    }
  }
}

/* --------------------------- migrating old saves --------------------------- */
function migrate(G) {
  if (!G) return G;
  G.rules = Object.assign({}, RULES_DEFAULT, G.rules || {});
  if (!G.picks) G.picks = [];
  if (!G.news) G.news = [];
  if (!G.history) G.history = [];
  if (!G.log) G.log = [];
  if (!G.freeAgents) G.freeAgents = [];
  if (!G.draftClass) G.draftClass = [];
  if (G.boardConfidence == null) G.boardConfidence = 62;
  // A save that predates the firing rule keeps its job and its start date.
  if (!G.tenure) G.tenure = [];
  if (G.fired === undefined) G.fired = null;
  if (G.hiredYear == null) G.hiredYear = G.year - (G.teams[G.userTeam].seasons || []).length;
  if (!G.lastPlayed) G.lastPlayed = new Array((G.teams || []).length || TEAMS.length).fill(-9);
  if (!G.retained) G.retained = [];
  if (!G.waivers) G.waivers = [];
  if (!G.shotLog) G.shotLog = {};
  if (G.scoutPoints == null) G.scoutPoints = 0;
  if (!G.draftLog) G.draftLog = [];
  if (!G.draftStars) G.draftStars = [];
  if (!G.gm) G.gm = { cash: 0, salary: 0, contract: null, stakes: {}, ownHistory: [], paid: [] };
  if (!G.gm.stakes) G.gm.stakes = {};
  if (!G.gm.ownHistory) G.gm.ownHistory = [];
  /* A save from before the line was drawn can't know where it fell, and
     guessing would put "undrafted" on founding players. Null means "don't
     claim anything", which is the honest reading. */
  if (G.foundingMaxPid === undefined) G.foundingMaxPid = null;
  // A save from before the order was year-stamped: a class in hand means the
  // order on file is this year's, and anything else means there isn't one.
  if (G.draftYear === undefined) G.draftYear = (G.draftClass || []).length ? G.year : null;
  if (!G.block) G.block = [];
  if (!G.offers) G.offers = [];
  if (!G.hall) G.hall = [];
  if (!G.gameLog) G.gameLog = {};
  playersOf(G).forEach((p) => {
    if (!p.stats) p.stats = blankStats(p.pos);
    if (!p.season) p.season = blankStats(p.pos);
    if (!p.career) p.career = [];
    /* A save whose seasons were archived before shares were stored gets them
       derived from the raw line. That is the ONE case where recomputing an old
       year under today's constants is right — the alternative is a career table
       with a decade of blanks. A collapsed retired total is left alone: summing
       a career's worth of games and calling the result one season's shares
       would be badly wrong, not slightly.
       Gated on a SAVE-LEVEL flag, not on whether a given row looks stamped: a
       genuinely zero share stores nothing, so a per-row test can never tell
       "not done" from "done, and it was zero" and would re-run the whole league
       on every migrate — and migrate runs on every click of the trade screen. */
    if (!G.psBackfilled) {
      (p.career || []).forEach((c) => { if (!c.total) stampShares(G, p, c); });
      if (p.stats && p.stats.gp) stampShares(G, p, p.stats);
    }
    /* Nobody stays on long-term reserve once he's fit. Without this a player
       whose injury ran out could sit there indefinitely — off the cap, out of
       every lineup — and `autoLines` would quietly hand his minutes to whoever
       was left, which is how a defenceman ends up at forty minutes a night. */
    if (p.ltir && p.inj <= 0) p.ltir = false;
    if (!p.trophies) p.trophies = [];
    if (!p.rings) p.rings = [];
    if (!p.allStars) p.allStars = [];
    if (p.fatigue == null) p.fatigue = 0;
    if (!p.shoots) p.shoots = (p.id % 100) < 62 ? "L" : "R";
    const kind = p.pos === "G" ? "G" : "S";
    // Only the LIVE season carries shot buckets; an older save that put them on
    // `p.stats` too gets that space back here.
    if (p.stats) { delete p.stats.z; delete p.stats.net; }
    [p.season].forEach((s) => {
      if (!s) return;
      if (!s.z) s.z = blankZones(kind);
      if (!s.net) s.net = blankNet(kind);
      if (kind === "S") {
        // Older saves predate attempt tracking; seed it from shots on goal so
        // the on-goal share doesn't read as zero.
        if (s.att == null) s.att = s.sog || 0;
        if (s.miss == null) s.miss = 0;
        if (s.blkd == null) s.blkd = 0;
      }
    });
    p.ovr = ovrOf(p);
  });
  G.teams.forEach((t) => {
    if (!t.l10) t.l10 = [];
    if (!t.lineChem) t.lineChem = [0, 0, 0, 0];
    if (!t.lineSig) t.lineSig = [null, null, null, null];
    if (!t.pairChem) t.pairChem = [0, 0, 0];
    if (!t.pairSig) t.pairSig = [null, null, null];
  });
  /* Runs LAST: it reads career lines and point shares, so everything above has
     to have been repaired first. It writes its results back onto the history
     rows, so the expensive half only ever happens once per save. */
  G.psBackfilled = 1;
  backfillAwards(G);
  return G;
}

/* ============================ THE GAME ENGINE ==============================
 * A game is 60 minutes of shift time split across line-vs-line matchups.
 * For each matchup we work out a shot rate from the offensive unit against the
 * defensive unit, roll shots, then resolve each shot against the goalie. The
 * home side gets last change: a small bias toward putting its top line against
 * the opponent's weaker pairs.
 * ========================================================================== */

/* ------------------------------ deployment --------------------------------
 * Two levers the coach actually has: how the minutes are split, and who plays
 * against whom. Ice time is stored per club and normalised on read, so a save
 * that predates it still behaves exactly as before.
 * ------------------------------------------------------------------------- */

function normalise(arr, fallback) {
  if (!arr || arr.length !== fallback.length) return fallback.slice();
  const tot = arr.reduce((a, b) => a + Math.max(0, b), 0);
  if (tot <= 0) return fallback.slice();
  return arr.map((v) => Math.max(0, v) / tot);
}
const iceTimeF = (t) => normalise(t && t.iceF, LINE_TOI);
/* Defence pair minutes. Forwards had a coach's control over this from the
   start; pairs were a hard-coded constant, which is odd given a top pair plays
   more of the game than any forward line does. */
const iceTimeD = (t) => normalise(t && t.iceD, PAIR_TOI);

/* How often our line `li` sees each of their four. Line-for-line is the default
   because that's what happens when nobody is steering. With last change, the
   home coach gets to steer: his designated checking line chases their best, and
   his own top line is pushed away from it toward their depth. On the road he
   can only ask — the other bench answers. */
function matchupMix(G, side, li, oppT) {
  const mix = [0, 0, 0, 0];
  const base = Math.min(3, li);
  mix[base] = 1;
  const myT = G.teams[side.box.teamId];
  const check = myT.checkLine;
  if (check == null) return mix;
  // Away, the coach still tries, he just doesn't get the last word.
  const power = side.isHome ? 0.62 : 0.22;
  if (li === check) {
    // Throw this line at their top line.
    for (let k = 0; k < 4; k++) mix[k] *= (1 - power);
    mix[0] += power;
  } else if (li === 0 && check !== 0) {
    // And keep our best away from their checkers, out against their depth.
    for (let k = 0; k < 4; k++) mix[k] *= (1 - power);
    mix[2] += power * 0.55;
    mix[3] += power * 0.45;
  }
  const tot = mix.reduce((a, b) => a + b, 0);
  return tot > 0 ? mix.map((v) => v / tot) : [1, 0, 0, 0];
}

/* ------------------------------ the last minute ---------------------------
 * Down one with the clock going, a coach decides how early the goalie comes
 * off. The engine already resolved this — at one fixed pair of odds for all
 * thirty-two clubs, which is the one moment of a hockey game where coaches most
 * visibly differ.
 *
 * `normal` IS the old pair of numbers, so the default changes nothing. Going
 * early buys chances at the cost of empty nets; sitting tight does the reverse.
 *
 * An AI club's choice comes off the system its coach plays — needing no storage
 * and no draw, since a trap coach was never going to pull with three minutes
 * left. That part sits behind `coachStaff`, because thirty-one benches all
 * making different calls moves the league's goal totals, and the calibrated
 * engine has to still be measurable underneath. YOUR OWN choice always applies:
 * you asked for it.
 * ------------------------------------------------------------------------- */
const PULL_TIMINGS = {
  late:   { label: "Late", tie: 0.11, eng: 0.33, blurb: "Give him the last twenty seconds and no more. Fewer empty nets against, and fewer nights you tie it." },
  normal: { label: "Normal", tie: 0.17, eng: 0.45, blurb: "A minute or so, the way most clubs do it." },
  early:  { label: "Early", tie: 0.24, eng: 0.56, blurb: "Two minutes, six skaters, and take what comes. More ties, and more losses by two." },
};
function pullTiming(G, teamId) {
  const t = G.teams[teamId];
  if (t && t.pull && PULL_TIMINGS[t.pull]) return PULL_TIMINGS[t.pull];
  if (t && teamId !== G.userTeam && depthOn(G, "coachStaff")) {
    const sys = coachOf(t).system;
    if (sys === "trap") return PULL_TIMINGS.late;
    if (sys === "aggressive") return PULL_TIMINGS.early;
  }
  return PULL_TIMINGS.normal;
}

const ES_MINUTES = 47;      // even strength
const PP_MIN_PER = 1.7;     // ice time per power play
// How the two special-teams units split the work, as real clubs do.
const PP_UNIT_SPLIT = [0.65, 0.35];
const PK_UNIT_SPLIT = [0.58, 0.42];

function emptyBox(G, teamId) {
  const box = { teamId, g: 0, sog: 0, pim: 0, pp: 0, ppg: 0, hits: 0, blk: 0, fow: 0, fol: 0, players: {}, goalie: null, scorers: [] };
  // Farm and injured players are included so a stray id can never miss — only
  // players who actually take ice time are credited in applyGame.
  rosterOf(G, teamId, true).forEach((p) => {
    box.players[p.id] = p.pos === "G"
      ? { sa: 0, sv: 0, ga: 0, toi: 0, sosa: 0, sosv: 0, starts: 0, z: blankZones("G"), net: blankNet("G") }
      : { g: 0, a: 0, sog: 0, pim: 0, hit: 0, blk: 0, toi: 0, pm: 0, fow: 0, fol: 0, ppg: 0, shg: 0, gwg: 0,
          eng: 0, fights: 0, sos: 0, soa: 0, att: 0, miss: 0, blkd: 0,
          z: blankZones("S"), net: blankNet("S") };
  });
  return box;
}

/* Not every shot is the same shot. A point blast from a defenceman and a rush
   chance off the wing arrive at the goalie with very different odds, so the zone
   is picked first and it decides both who shoots and how stoppable it is. */
const SHOT_ZONES = [
  { key: "rush",  p: 0.22, save: -0.034, dBias: 0.22 },
  { key: "cycle", p: 0.52, save:  0.000, dBias: 0.50 },
  { key: "point", p: 0.26, save:  0.055, dBias: 3.40 },
];
/* Which zone a chance comes from is NOT a league constant — it's an argument
   between the two units on the ice, and it's the reason one club's shot map
   should look different from another's:
     - speed up front turns pucks into rush chances;
     - a defenceman who can shoot drags the play out to the point;
     - a quick, sound defensive unit denies the middle, which pushes the other
       side out to the point and takes the rush away.
   Without this every team's map was the same shape and only the volume moved. */
function pickZone(G, offIds, defIds) {
  const w = SHOT_ZONES.map((z) => z.p);
  if (offIds && defIds) {
    const off = offIds.map((id) => G.players[id]).filter(Boolean);
    const def = defIds.map((id) => G.players[id]).filter(Boolean);
    if (off.length && def.length) {
      const avg = (arr, k) => arr.reduce((s, p) => s + p.r[k], 0) / arr.length;
      const fwd = off.filter((p) => p.pos !== "D");
      const dmen = off.filter((p) => p.pos === "D");
      const speed = fwd.length ? avg(fwd, "spd") : 55;
      const hands = fwd.length ? (avg(fwd, "hnd") + avg(fwd, "pss")) / 2 : 55;
      const dShot = dmen.length ? avg(dmen, "sht") : 45;
      const oppDfn = avg(def, "dfn");
      const oppSpd = avg(def, "spd");
      const oppPhy = avg(def, "phy");
      // rush: our legs against theirs, and against a unit that's hard to beat
      w[0] *= clamp(1 + (speed - 55) * 0.022 - (oppSpd - 55) * 0.015 - (oppDfn - 55) * 0.016, 0.35, 2.4);
      // cycle: hanging onto it down low. NOT a leftover — if this isn't
      // modulated it pins the middle of every club's chart to ~50% and the
      // three zones never change rank, which is what made every map look alike.
      w[1] *= clamp(1 + (hands - 55) * 0.008 - (oppPhy - 55) * 0.006, 0.55, 1.6);
      // point: our defencemen's shot, and a defence that forces us outside
      w[2] *= clamp(1 + (dShot - 45) * 0.024 + (oppDfn - 55) * 0.019, 0.35, 2.4);
    }
  }
  const tot = w.reduce((a, b) => a + b, 0);
  let x = rnd(G) * tot;
  for (let i = 0; i < SHOT_ZONES.length; i++) { x -= w[i]; if (x <= 0) return SHOT_ZONES[i]; }
  return SHOT_ZONES[1];
}

// Who takes the shot in a given unit — weighted by shooting and hands, with
// defencemen far likelier to be the one firing from the point.
function shooterFrom(G, ids, dBias) {
  const ps = ids.map((id) => G.players[id]).filter(Boolean);
  if (!ps.length) return null;
  const bias = dBias == null ? 0.55 : dBias;
  // The exponent sets how concentrated scoring is. At 1.6 the league produced
  // 76-goal seasons, which the NHL has not seen since 1988.
  const wts = ps.map((p) => Math.pow(Math.max(1, ratingNow(p, "sht") * 0.7 + ratingNow(p, "hnd") * 0.3 - 20), 1.42) * (p.pos === "D" ? bias : 1));
  const tot = wts.reduce((a, b) => a + b, 0);
  let x = rnd(G) * tot;
  for (let i = 0; i < ps.length; i++) { x -= wts[i]; if (x <= 0) return ps[i]; }
  return ps[ps.length - 1];
}
// Assists go to the linemates who actually move the puck.
function assistsFrom(G, ids, scorerId) {
  const ps = ids.map((id) => G.players[id]).filter((p) => p && p.id !== scorerId);
  const out = [];
  if (!ps.length) return out;
  const roll = rnd(G);
  /* How many assists a goal carries. The NHL runs about 1.70 assists per goal:
     roughly 3% of goals are unassisted, a quarter carry one, and about seventy
     per cent carry two. The old 24/38/38 split averaged 1.14, which is why the
     league's assist leader finished BELOW its goal leader and nobody ever
     reached a hundred points. */
  const n = roll < 0.03 ? 0 : roll < 0.30 ? 1 : 2;
  const pool = ps.slice();
  for (let i = 0; i < n && pool.length; i++) {
    const wts = pool.map((p) => Math.pow(Math.max(1, p.r.pss - 15), 1.7));
    const tot = wts.reduce((a, b) => a + b, 0);
    let x = rnd(G) * tot, chosen = pool[pool.length - 1];
    for (let k = 0; k < pool.length; k++) { x -= wts[k]; if (x <= 0) { chosen = pool[k]; break; } }
    out.push(chosen.id);
    pool.splice(pool.indexOf(chosen), 1);
  }
  return out;
}

function resolveShots(G, ctx, shots, offIds, defIds, gid, strength) {
  const gq = goalieQuality(G, gid);
  // Save percentage lives in a believable band; a great goalie is ~.925. A tired
  // goalie leaks: a full fatigue load is worth about fifteen points of save
  // percentage, which is roughly what a goalie on his third start in four nights
  // actually looks like.
  const gp = G.players[gid];
  const tired = gp ? clamp(gp.fatigue, 0, 100) / 100 : 0;
  /* Goals per team-game is SOG x (1 - SV%), and all three have to land together.
     At .9032 the league produced 2.77 goals a night against a real 3.0-3.1 —
     shots and shooting percentage were both in band, but their product was low,
     which showed up as 239 shutouts a season against an NHL 90-190. */
  let base = 0.8948 + (gq - 55) * 0.0016 - tired * 0.015;
  if (strength === "pp") base -= 0.028;
  const gBox = ctx.gBox, sBox = ctx.sBox;
  if (!gBox.players[gid]) return;   // no dressed goaltender — nothing to resolve against
  const hole = gp ? goalieHole(gp) : null;
  const blockers = defIds.map((id) => G.players[id]).filter((p) => p && p.pos === "D");

  /* One attempt, one outcome. Each attempt is an independent event that either
     hits a shin pad, sails wide, or reaches the goalie — it is NOT one shot on
     goal with a blocked and a missed sibling invented around it, which is what
     this used to do and which meant a single chance produced up to three
     records. `shots` is the number expected to REACH the net, so the loop runs
     over the attempts needed to produce that many. */
  const canBlock = blockers.length > 0;
  const pBlock = canBlock ? 0.24 : 0;
  const pMiss = 0.21;
  const pOnGoal = 1 - pBlock - pMiss;
  const attempts = Math.round(shots / pOnGoal);

  for (let s = 0; s < attempts; s++) {
    const zone = pickZone(G, offIds, defIds);
    const shooter = shooterFrom(G, offIds, zone.dBias);
    if (!shooter || !sBox.players[shooter.id]) continue;
    const sh = sBox.players[shooter.id];

    // A record per attempt, kept only when somebody is going to look at it (the
    // user's club). The clock time is invented the same way the play-by-play's
    // is; the game, the opponent and the outcome are real.
    const log = ctx.shots;
    const rec = (r, cell) => {
      if (!log) return;
      log.push({ p: shooter.id, g: gid, off: sBox.teamId, def: gBox.teamId,
        t: rnd(G) * 60, z: zone.key, c: cell, r, st: strength });
    };

    sh.att++;
    const roll = rnd(G);
    if (roll < pBlock) {
      // Whose block it is. Uniform among whoever was on the ice made blocks a
      // pure function of ice time; a shot-blocking specialist should stand out.
      /* Role nudges who blocks, but the block LEADER is set by ice time, not by
         this: neutralising the weighting entirely still left the leader at 342.
         That is the top-pair-minutes problem, not a shot-blocking one. */
      let bw = blockers.map((x) => Math.max(0.2, roleTrait(x, "blk") * (1 + ((x.r.dfn || 50) - 50) * 0.005)));
      const bTot = bw.reduce((a, c) => a + c, 0);
      let bx = rnd(G) * bTot, b = blockers[blockers.length - 1];
      for (let i = 0; i < blockers.length; i++) { bx -= bw[i]; if (bx <= 0) { b = blockers[i]; break; } }
      if (ctx.oppBox.players[b.id]) { sh.blkd++; ctx.oppBox.players[b.id].blk++; rec("b", null); }
      else { sh.miss++; rec("m", null); }
      continue;
    }
    if (roll < pBlock + pMiss) { sh.miss++; rec("m", null); continue; }

    const cell = pickCell(G, shooter, gp);
    const exposed = hole && cell.key === hole.key ? 0.032 : 0;
    const quality = (shooter.r.sht - 55) * 0.0013 + (rnd(G) - 0.5) * 0.02;
    const saveP = clamp(base + zone.save + cell.save - exposed - quality, 0.55, 0.99);
    sBox.sog++; sh.sog++;
    gBox.players[gid].sa++;
    sh.z[zone.key].s++;
    sh.net[cell.key].a++;
    gBox.players[gid].z[zone.key].sa++;
    gBox.players[gid].net[cell.key].sa++;
    if (rnd(G) > saveP) {
      rec("g", cell.key);
      sh.z[zone.key].g++;
      sh.net[cell.key].g++;
      gBox.players[gid].net[cell.key].ga++;
      if (ctx.events) ctx.events.push({ t: rnd(G) * 60, kind: "goal", team: sBox.teamId, pid: shooter.id, zone: zone.key, cell: cell.key, strength });
      sBox.g++; sBox.players[shooter.id].g++;
      gBox.players[gid].ga++; gBox.ga = (gBox.ga || 0) + 1;
      if (strength === "pp") { sBox.ppg++; sBox.players[shooter.id].ppg++; }
      if (strength === "sh") sBox.players[shooter.id].shg++;
      const helpers = assistsFrom(G, offIds, shooter.id);
      helpers.forEach((id) => { if (sBox.players[id]) sBox.players[id].a++; });
      sBox.scorers.push({ id: shooter.id, a: helpers, strength });
      if (strength === "es") {
        offIds.forEach((id) => { if (sBox.players[id]) sBox.players[id].pm++; });
        defIds.forEach((id) => { if (ctx.oppBox.players[id]) ctx.oppBox.players[id].pm--; });
      }
    } else {
      rec("s", cell.key);
      gBox.players[gid].sv++;
      gBox.players[gid].z[zone.key].sv++;
      // Only the dangerous ones are worth narrating.
      if (ctx.events && zone.key === "rush" && rnd(G) < 0.28)
        ctx.events.push({ t: rnd(G) * 60, kind: "save", team: gBox.teamId, pid: gid, shooter: shooter.id, zone: zone.key });
    }
  }
}

/* Who starts in goal. A back-to-back, or a starter who's been run into the
   ground, is what gets the backup into a game — the depth chart alone never
   would. A backup much worse than the starter still doesn't play. */
function pickStarter(G, lines, rest) {
  const s = G.players[lines.G[0]], b = G.players[lines.G[1]];
  if (!s) return lines.G[1] != null ? lines.G[1] : lines.G[0];
  if (!b) return s.id;
  const restDays = rest == null ? 2 : rest;
  // A backup much worse than the starter still gets games — just later, when the
  // starter is genuinely run down rather than merely tired.
  const gap = s.ovr - b.ovr;
  const limit = gap > 14 ? 78 : 55;
  const worn = s.fatigue > limit || (restDays === 0 && s.fatigue > limit - 30);
  return worn ? b.id : s.id;
}

/* Three rounds and then sudden death, hands against reflexes. Shootout goals
   never count toward a skater's season total — only the team's score moves —
   so they're tracked separately as `sos`/`soa`. */
function runShootout(G, a, b, aLines, bLines, aGid, bGid) {
  const order = (lines) => lines.F.flat().map((id) => G.players[id]).filter(Boolean)
    .sort((x, y) => (y.r.hnd * 0.6 + y.r.sht * 0.4) - (x.r.hnd * 0.6 + x.r.sht * 0.4));
  const aS = order(aLines), bS = order(bLines);
  if (!aS.length || !bS.length) return rnd(G) < 0.5 ? a : b;
  const attempt = (sh, gid, box, gBox) => {
    const g = G.players[gid];
    const skill = sh.r.hnd * 0.6 + sh.r.sht * 0.4;
    const stop = g ? g.r.rfx * 0.6 + g.r.pos * 0.4 : 40;
    const scored = rnd(G) < clamp(0.33 + (skill - stop) * 0.006, 0.08, 0.72);
    if (box.players[sh.id]) { box.players[sh.id].soa++; if (scored) box.players[sh.id].sos++; }
    if (gBox.players[gid]) { gBox.players[gid].sosa++; if (!scored) gBox.players[gid].sosv++; }
    return scored;
  };
  let ag = 0, bg = 0;
  for (let r = 0; r < 3; r++) {
    if (attempt(aS[r % aS.length], bGid, a, b)) ag++;
    if (attempt(bS[r % bS.length], aGid, b, a)) bg++;
  }
  let r = 3, guard = 0;
  while (ag === bg && guard++ < 15) {
    const x = attempt(aS[r % aS.length], bGid, a, b);
    const y = attempt(bS[r % bS.length], aGid, b, a);
    if (x && !y) ag++; else if (y && !x) bg++;
    r++;
  }
  return ag === bg ? (rnd(G) < 0.5 ? a : b) : (ag > bg ? a : b);
}

function simGame(G, homeId, awayId, opts) {
  opts = opts || {};
