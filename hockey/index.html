        <Side tid={other} roster={theirRoster} sel={theirs} set={setTheirs}
          picks={picksOf(other)} pickSel={theirPicks} setPickSel={setTheirPicks}
          label={`You get (${G.teams[other].abbr})`} />
      </div>

      {lockedIn.length ? (
        <div className={`${card} p-3 space-y-2`}>
          <div className="text-sm text-amber-300">
            {lockedIn.map((p) => fullName(p)).join(", ")} {lockedIn.length === 1 ? "has" : "have"} a no-trade clause.
          </div>
          <div className="flex gap-2 flex-wrap">
            {lockedIn.map((p) => (
              <button key={p.id} className={btnGhost} onClick={() => {
                const g2 = migrate(JSON.parse(JSON.stringify(G)));
                const r = requestNtcWaiver(g2, p.id);
                setG(g2);
                notify(r.ok ? `${fullName(p)} will waive it.` : `${fullName(p)} won't waive it.`);
              }}>Ask {shortName(p)} to waive</button>
            ))}
          </div>
        </div>
      ) : null}

      {/* The deal that dies at the cap, and the club that can save it. */}
      {rules(G).retainedSalary && (mine.length || theirs.length) ? (() => {
        const movers = mine.concat(theirs).map((id) => G.players[id])
          .filter((p) => p && p.contract.amt >= BROKER_MIN_SPACE);
        if (!movers.length) return null;
        const pid = bPid != null && movers.some((p) => p.id === bPid) ? bPid : null;
        const p = pid != null ? G.players[pid] : null;
        const cands = p ? brokerCandidates(G, pid, bPct, [G.userTeam, other]).slice(0, 4) : [];
        const help = cands.find((c) => c.teamId === bTeam) || null;
        const fee = p ? brokerFee(G, pid, bPct) : 0;
        const myPickList = picksOf(G.userTeam);
        const feePicks = myPickList.filter((pk) => bPicks.includes(pkId(pk)));
        const feeVal = feePicks.reduce((s, pk) => s + pickValue(G, pk), 0);
        return (
          <Section title="Bring in a third club" className="p-3"
            right={<span className="text-xs text-slate-500">somebody else eats the money, and charges you for it</span>}>
            <div className="space-y-2 pt-1">
              <div className="flex flex-wrap items-center gap-2 text-sm">
                <span className="text-slate-400">Whose contract</span>
                <select className={`${inputCls} text-sm`} value={pid == null ? "" : pid}
                  onChange={(e) => { setBPid(e.target.value === "" ? null : +e.target.value); setBTeam(null); }}>
                  <option value="">nobody — do it ourselves</option>
                  {movers.map((m) => (
                    <option key={m.id} value={m.id}>{shortName(m)} — ${m.contract.amt}M × {m.contract.yrs}</option>
                  ))}
                </select>
                {p ? (
                  <>
                    <span className="text-slate-400">they take</span>
                    <select className={`${inputCls} text-sm`} value={bPct}
                      onChange={(e) => { setBPct(+e.target.value); setBTeam(null); }}>
                      <option value={0.25}>25% — ${round1(p.contract.amt * 0.25)}M</option>
                      <option value={0.5}>50% — ${round1(p.contract.amt * 0.5)}M</option>
                    </select>
                  </>
                ) : null}
              </div>
              {p ? (
                cands.length ? (
                  <>
                    <div className="flex flex-wrap gap-2">
                      {cands.map((c) => (
                        <button key={c.teamId}
                          className={`px-2 py-1 rounded text-xs ${c.teamId === bTeam ? "bg-sky-600 text-white" : "bg-[#16233c] text-slate-300 hover:bg-[#1c2c4a]"}`}
                          onClick={() => setBTeam(c.teamId)}>
                          {G.teams[c.teamId].abbr} · wants {c.fee.toFixed(1)}
                          <span className="text-slate-400 ml-1">(${c.space}M free)</span>
                        </button>
                      ))}
                    </div>
                    {help ? (
                      <div className="space-y-1.5">
                        <div className="text-xs text-slate-400">
                          Pay {G.teams[help.teamId].name} in picks — they want about {help.fee.toFixed(1)}
                          {" "}for eating ${help.eats}M of it.
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {myPickList.map((pk) => (
                            <button key={pkId(pk)}
                              className={`px-2 py-0.5 rounded text-[11px] ${bPicks.includes(pkId(pk)) ? "bg-sky-600 text-white" : "bg-[#16233c] text-slate-300"}`}
                              onClick={() => toggle(bPicks, setBPicks, pkId(pk))}>
                              {pickLabel(G, pk, G.userTeam).text} · {pickValue(G, pk).toFixed(1)}
                            </button>
                          ))}
                        </div>
                        <div className={`text-xs ${feeVal >= help.fee * 0.97 ? "text-emerald-400" : "text-amber-400"}`}>
                          {feeVal >= help.fee * 0.97
                            ? `They'll do it — ${feeVal.toFixed(1)} offered against ${help.fee.toFixed(1)}.`
                            : `Not enough yet — ${feeVal.toFixed(1)} against ${help.fee.toFixed(1)}.`}
                        </div>
                      </div>
                    ) : (
                      <div className="text-xs text-slate-500">Pick who you're ringing.</div>
                    )}
                  </>
                ) : (
                  <div className="text-xs text-amber-400">
                    Nobody has the room and a free retention slot for that.
                  </div>
                )
              ) : null}
              {p && help ? (
                <button className={btnPri} onClick={() => {
                  const g2 = migrate(JSON.parse(JSON.stringify(G)));
                  const r = brokerTrade(g2, g2.userTeam, mine, selPicks(G.userTeam, myPicks),
                    other, theirs, selPicks(other, theirPicks),
                    { teamId: help.teamId, pid, pct: bPct, picks: feePicks }, { retain });
                  if (!r.ok) { notify(r.why); return; }
                  setG(g2);
                  setMine([]); setTheirs([]); setMyPicks([]); setTheirPicks([]); setRetain({});
                  setBPid(null); setBTeam(null); setBPicks([]);
                  notify(`Done — ${G.teams[help.teamId].abbr} keep $${r.broker.amt}M of it.`);
                }}>Do it with {G.teams[help.teamId].abbr}</button>
              ) : null}
            </div>
          </Section>
        );
      })() : null}

      <div className={`${card} p-3 flex flex-wrap items-center gap-3`}>
        <div className="text-sm">
          <span className="text-slate-400">Their read: </span>
          {mine.length || theirs.length || myPicks.length || theirPicks.length
            ? <span className={ev.ok ? "text-emerald-400" : "text-amber-400"}>{ev.why}</span>
            : <span className="text-slate-500">pick some pieces</span>}
          {ev.aVal != null ? <span className="text-slate-500 ml-2 tnum">({ev.aVal} out / {ev.bVal} in)</span> : null}
        </div>
        <div className="flex-1" />
        <button className={btnPri} disabled={!ev.ok} onClick={() => {
          const g2 = migrate(JSON.parse(JSON.stringify(G)));
          const r = doTrade(g2, g2.userTeam, mine, selPicks(G.userTeam, myPicks), other, theirs, selPicks(other, theirPicks), { retain });
          if (r.ok) {
            setG(g2); setMine([]); setTheirs([]); setMyPicks([]); setTheirPicks([]); setRetain({});
            notify("Trade completed.");
          } else notify(r.why);
        }}>Propose</button>
      </div>
    </div>
  );
}

/* ------------------------------ free agency ------------------------------- */

function FreeAgencyTab({ G, setG, notify, openPlayer }) {
  const [target, setTarget] = useState(null);
  const [amt, setAmt] = useState(1);
  const [yrs, setYrs] = useState(3);
  const [counter, setCounter] = useState(null);
  /* The terms on the table. They travel together into every call that prices
     or signs the deal, so the number he's asking and the number you offer are
     always quoted against the SAME contract. */
  const [ntc, setNtc] = useState(false);
  const [sb, setSb] = useState(0);
  const [pb, setPb] = useState(0);
  const fas = G.freeAgents.map((id) => G.players[id]).filter(Boolean);
  const terms = { ntc, sb, pb };

  const open = (p) => {
    setTarget(p.id);
    setYrs(3); setNtc(false); setSb(0); setPb(0);
    setAmt(askingPrice(G, p.id, G.userTeam, 3));
    setCounter(null);
  };
  const p = target != null ? G.players[target] : null;

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-3 gap-2">
        <Stat label="Cap space" value={`$${capSpace(G, G.userTeam)}M`} tone={capSpace(G, G.userTeam) < 0 ? "text-rose-400" : ""} />
        <Stat label="Roster" value={rosterOf(G, G.userTeam).length} sub={`max ${ROSTER_MAX}`} />
        <Stat label="Available" value={fas.length} />
      </div>

      {p ? (
        <Section title={`Negotiating with ${fullName(p)}`} className="p-3">
          <div className="space-y-3 pt-1">
            <div className="flex flex-wrap gap-4 text-sm">
              <div><PosBadge pos={p.pos} /> <span className="text-slate-400 ml-1">age {p.age}</span></div>
              <div><span className="text-slate-400">Overall </span>{p.ovr} <span className="text-slate-500">/ {p.pot}</span></div>
              <div><span className="text-slate-400">He's asking </span>${askingPrice(G, p.id, G.userTeam, yrs, terms)}M × {yrs}</div>
            </div>
            <ContractTerms G={G} p={p} yrs={yrs} ntc={ntc} sb={sb} pb={pb}
              setNtc={(v) => { setNtc(v); setCounter(null); }}
              setSb={(v) => { setSb(v); setCounter(null); }}
              setPb={(v) => { setPb(v); setCounter(null); }} />
            <div className="grid sm:grid-cols-3 gap-3 items-end">
              <div>
                <div className="text-xs text-slate-400 mb-1">Salary ($M per year)</div>
                <input type="number" step="0.1" min="0.8" className={`${inputCls} w-full`}
                  value={amt} onChange={(e) => setAmt(+e.target.value)} />
              </div>
              <div>
                <div className="text-xs text-slate-400 mb-1">Term (years)</div>
                <select className={`${inputCls} w-full`} value={yrs} onChange={(e) => { setYrs(+e.target.value); setCounter(null); }}>
                  {[1, 2, 3, 4, 5, 6, 7].map((y) => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
              <div className="flex gap-2">
                <button className={btnPri} onClick={() => {
                  const g2 = migrate(JSON.parse(JSON.stringify(G)));
                  const r = negotiate(g2, p.id, g2.userTeam, amt, yrs, terms);
                  if (!r.ok) {
                    setCounter(r.counter || null);
                    notify(r.why || "He turned it down.");
                    setG(g2);
                    return;
                  }
                  const s = signPlayer(g2, p.id, g2.userTeam, amt, yrs, terms);
                  if (!s.ok) { notify(s.why); return; }
                  setG(g2); setTarget(null); setCounter(null);
                  notify(`Signed ${fullName(p)} — $${round1(amt)}M × ${yrs}${contractTermsLabel(g2, g2.players[p.id])}.`);
                }}>Offer</button>
                <button className={btnGhost} onClick={() => { setTarget(null); setCounter(null); }}>Walk away</button>
              </div>
            </div>
            {counter ? (
              <div className="text-sm text-amber-300">
                He'd sign for ${counter}M × {yrs}.
                <button className="ml-2 text-sky-400 hover:underline" onClick={() => { setAmt(counter); setCounter(null); }}>
                  Meet it
                </button>
              </div>
            ) : null}
          </div>
        </Section>
      ) : null}

      <Section>
        <SortTable min={720} rowKey={(x) => x.id} rows={fas} initial="ovr"
          onRow={(x) => open(x)}
          cols={[
            { key: "name", label: "Player", get: (x) => x.ln, cell: (x) => <span className="whitespace-nowrap">{fullName(x)}</span> },
            { key: "pos", label: "Pos", get: (x) => POS.indexOf(x.pos), cell: (x) => <PosBadge pos={x.pos} /> },
            { key: "age", label: "Age", get: (x) => x.age },
            { key: "ovr", label: "Ovr", get: (x) => x.ovr, cls: "font-semibold" },
            { key: "pot", label: "Pot", get: (x) => x.pot, cls: "text-slate-400" },
            { key: "ask", label: "Asking", get: (x) => askingPrice(G, x.id, G.userTeam, 3),
              cell: (x) => `$${askingPrice(G, x.id, G.userTeam, 3)}M` },
            { key: "act", label: "", get: () => 0, cell: (x) => (
              <button className="text-xs text-sky-400 hover:underline"
                onClick={(e) => { e.stopPropagation(); open(x); }}>Negotiate</button>
            ) },
          ]} empty="Nobody available." />
      </Section>
    </div>
  );
}

/* -------------------------------- playoffs -------------------------------- */

function roundName(n) {
  if (n === 1) return "Cup Final";
  if (n === 2) return "Conference Finals";
  if (n === 4) return "Second Round";
  return "First Round";
}

/* The row in `G.results` a series game came from. Matched on the day it was
   played; a save from before series games carried one falls back to the
   scoreline, which is unambiguous enough for two named clubs on one night. */
function resultFor(G, g) {
  return (G.results || []).find((r) => r.playoff && r.home === g.home && r.away === g.away
    && (g.d != null ? r.day === g.d : (r.hg === g.hg && r.ag === g.ag))) || null;
}

const STRENGTH_LABEL = { pp: "PP", sh: "SH", en: "EN", en6: "6on5" };

/* Who scored. `G.results` has carried this for every game since the first
   build — regular season and playoffs alike — and only the regular season ever
   showed it, so a Cup run was seven rows of bare numbers. */
function ScoringSummary({ G, r, openPlayer }) {
  if (!r) return <div className="px-3 py-2 text-xs text-slate-500">No summary for this game.</div>;
  if (!r.scorers || !r.scorers.length) {
    return <div className="px-3 py-2 text-xs text-slate-500">
      {r.so ? "Decided in the shootout — no goal is credited to a skater." : "No goals."}
    </div>;
  }
  return (
    <div className="px-3 py-1.5 space-y-0.5">
      {r.scorers.map((s, i) => {
        const p = G.players[s.id];
        const helpers = (s.a || []).map((id) => G.players[id]).filter(Boolean);
        return (
          <div key={i} className="flex items-baseline gap-2 text-xs">
            <span className="w-8 shrink-0 text-slate-500">{G.teams[s.t] ? G.teams[s.t].abbr : ""}</span>
            <span className="cursor-pointer hover:text-sky-300 font-medium"
              onClick={() => p && openPlayer && openPlayer(p.id)}>
              {p ? fullName(p) : "unknown"}
            </span>
            {/* The engine's own codes: "es" is even strength and needs no
                label, "en6" is a six-on-five goal, and the rest read as-is. */}
            {STRENGTH_LABEL[s.strength] ? (
              <span className="text-[10px] uppercase text-amber-300">{STRENGTH_LABEL[s.strength]}</span>
            ) : null}
            {helpers.length ? (
              <span className="text-slate-500 truncate">
                ({helpers.map((h) => shortName(h)).join(", ")})
              </span>
            ) : <span className="text-slate-600">(unassisted)</span>}
          </div>
        );
      })}
    </div>
  );
}

function SeriesPage({ G, s, onClose, openPlayer }) {
  const hi = G.teams[s.hi], lo = G.teams[s.lo];
  const [openGame, setOpenGame] = useState(null);
  /* Who's actually driving THIS series, counted from its own scoring summaries.
     It used to read `p.po`, the whole-postseason line, which was wrong twice
     over: it credited a man's other rounds to this one, and `finishSeason`
     blanks it — so every series you opened after the Cup was handed out said
     "No games played" about seven games you had just watched. */
  const stars = useMemo(() => {
    const tally = {};
    s.games.forEach((g) => {
      const r = resultFor(G, g);
      if (!r) return;
      (r.scorers || []).forEach((sc) => {
        const add = (id, k) => {
          if (!G.players[id]) return;
          const t = tally[id] = tally[id] || { id, g: 0, a: 0 };
          t[k]++;
        };
        add(sc.id, "g");
        (sc.a || []).forEach((id) => add(id, "a"));
      });
    });
    return [s.hi, s.lo].map((tid) => Object.values(tally)
      .filter((t) => G.players[t.id] && G.players[t.id].teamId === tid)
      .sort((a, b) => (b.g + b.a) - (a.g + a.a) || b.g - a.g).slice(0, 5));
  }, [G, s]);
  return (
    <Modal wide title={`${hi.city} ${hi.name} vs ${lo.city} ${lo.name}`} onClose={onClose}>
      <div className="space-y-3">
        <div className={`${card} p-4 text-center`}>
          <div className="text-3xl font-bold tnum">{s.w[0]} – {s.w[1]}</div>
          <div className="text-xs text-slate-400 mt-1">
            {s.done ? `${G.teams[s.winner].name} advance` : `first to ${winsNeeded(G)}`}
          </div>
        </div>
        <Section title="Games"
          right={s.games.length ? <span className="text-xs text-slate-500">tap a game for the summary</span> : null}>
          <div>
            {s.games.map((g, i) => (
              <div key={i} className="border-b border-[#16223a] last:border-0">
                <button onClick={() => setOpenGame(openGame === i ? null : i)}
                  className={`w-full flex items-center gap-3 px-3 py-1.5 text-sm text-left hover:bg-[#16223a]
                    ${openGame === i ? "bg-[#16223a]" : ""}`}>
                  <span className="w-16 text-slate-500">Game {i + 1}</span>
                  <span className="flex-1">{G.teams[g.away].abbr} @ {G.teams[g.home].abbr}</span>
                  <span className="tnum">{g.ag}–{g.hg}{g.so ? " SO" : g.ot ? " OT" : ""}</span>
                  <span className="text-slate-600 text-xs w-3">{openGame === i ? "−" : "+"}</span>
                </button>
                {openGame === i ? (
                  <div className="bg-[#0b1424] border-t border-[#16223a]">
                    <ScoringSummary G={G} r={resultFor(G, g)} openPlayer={openPlayer} />
                  </div>
                ) : null}
              </div>
            ))}
            {!s.games.length ? <div className="px-3 py-4 text-sm text-slate-500">Not started.</div> : null}
          </div>
        </Section>
        <div className="grid sm:grid-cols-2 gap-3">
          {[0, 1].map((i) => (
            <Section key={i} title={`${G.teams[i === 0 ? s.hi : s.lo].name} leaders`} className="p-3">
              <div className="pt-1">
                {stars[i].length ? stars[i].map((t) => (
                  <div key={t.id} className="flex justify-between text-sm py-0.5 cursor-pointer hover:text-sky-300"
                    onClick={() => openPlayer(t.id)}>
                    <span>{shortName(G.players[t.id])}</span>
                    <span className="tnum text-slate-400">{t.g}G {t.a}A · {t.g + t.a}</span>
                  </div>
                )) : <div className="text-sm text-slate-500">No games played.</div>}
              </div>
            </Section>
          ))}
        </div>
        <Section title="Unavailable" className="p-3">
          <div className="text-sm text-slate-400 pt-1">
            {[s.hi, s.lo].flatMap((tid) => rosterOf(G, tid, true).filter((p) => p.inj > 0)
              .map((p) => `${G.teams[tid].abbr} ${shortName(p)} (${p.injDesc})`)).join(" · ") || "Everybody's healthy."}
          </div>
        </Section>
      </div>
    </Modal>
  );
}

function PlayoffsTab({ G, setG, openPlayer }) {
  const [open, setOpen] = useState(null);
  if (!G.playoffs) return <div className="text-slate-400 text-sm">The playoffs haven't started.</div>;
  const P = G.playoffs;
  return (
    <div className="space-y-3">
      {P.champion != null ? (
        <div className={`${card} p-4 text-center`}>
          <div className="text-xs uppercase tracking-wide text-slate-400">Champions</div>
          <div className="text-2xl font-bold text-sky-400">{G.teams[P.champion].city} {G.teams[P.champion].name}</div>
        </div>
      ) : null}
      {P.rounds.map((rd, i) => (
        <Section key={i} title={roundName(rd.length)} className="p-3">
          <div className="space-y-1 pt-1">
            {rd.map((s, j) => (
              <button key={j} onClick={() => setOpen(s)}
                className={`w-full flex items-center gap-3 text-sm px-2 py-1.5 rounded hover:bg-[#16223a]
                  ${s.hi === G.userTeam || s.lo === G.userTeam ? "bg-sky-950/40" : ""}`}>
                <span className="flex-1 text-left">{G.teams[s.hi].city} {G.teams[s.hi].name}</span>
                <span className="tnum font-semibold">{s.w[0]}–{s.w[1]}</span>
                <span className="flex-1 text-right">{G.teams[s.lo].city} {G.teams[s.lo].name}</span>
              </button>
            ))}
          </div>
        </Section>
      ))}
      {P.champion == null ? (
        <div className="flex gap-2">
          <button className={btnPri} onClick={() => {
            const g2 = migrate(JSON.parse(JSON.stringify(G)));
            simPlayoffDay(g2);
            setG(g2);
          }}>Play the next game</button>
          <button className={btnGhost} onClick={() => {
            const g2 = migrate(JSON.parse(JSON.stringify(G)));
            simPlayoffRound(g2);
            setG(g2);
          }}>Play out the round</button>
        </div>
      ) : null}
      {open ? <SeriesPage G={G} s={open} onClose={() => setOpen(null)} openPlayer={openPlayer} /> : null}
    </div>
  );
}

/* -------------------------------- All-Star -------------------------------- */

/* This winter's tournament, round by round, with the squad of whoever won it. */
function WorldCupBracket({ G, cup, openPlayer }) {
  const name = (k) => (NATIONS.find((n) => n.k === k) || { name: k }).name;
  const champSquad = ((cup.squads || {})[cup.gold] || { ids: [] }).ids
    .map((id) => G.players[id]).filter(Boolean)
    .sort((a, b) => (pts(b.season) || 0) - (pts(a.season) || 0));
  const ROUND = ["Quarter-finals", "Semi-finals", "Final"];
  return (
    <div className="space-y-3">
      <div className={`${card} p-4 text-center`}>
        <div className="text-xs uppercase tracking-wide text-slate-400">{cup.year} World Tournament</div>
        <div className="text-lg font-semibold mt-1 text-amber-200">{name(cup.gold)}</div>
        <div className="text-sm text-slate-400 mt-0.5">
          {name(cup.silver)} second{cup.bronze ? ` · ${name(cup.bronze)} third` : ""}
        </div>
        {cup.mvp != null && G.players[cup.mvp] ? (
          <button className="text-sm text-sky-400 hover:underline mt-1" onClick={() => openPlayer(cup.mvp)}>
            Best player: {fullName(G.players[cup.mvp])}
          </button>
        ) : null}
      </div>
      <div className="grid md:grid-cols-3 gap-3">
        {cup.rounds.map((r, ri) => (
          <Section key={ri} title={ROUND[ri] || `Round ${ri + 1}`} className="p-3">
            <div className="space-y-1 pt-1 text-sm">
              {r.map((t, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className={t.win === t.a ? "text-slate-100" : "text-slate-500"}>{name(t.a)}</span>
                  <span className="text-slate-500 tnum">{t.aG}–{t.bG}</span>
                  <span className={t.win === t.b ? "text-slate-100" : "text-slate-500"}>{name(t.b)}</span>
                  {t.ot ? <span className="text-[10px] text-amber-400">OT</span> : null}
                </div>
              ))}
            </div>
          </Section>
        ))}
      </div>
      <Section title={`${name(cup.gold)} — the squad`} className="p-3">
        <div className="grid sm:grid-cols-2 gap-x-4 gap-y-1 pt-1 text-sm">
          {champSquad.map((p) => (
            <div key={p.id} className="flex items-center gap-2">
              <PosBadge pos={p.pos} />
              <button className="flex-1 text-left truncate hover:text-sky-300" onClick={() => openPlayer(p.id)}>
                {fullName(p)}
              </button>
              <span className="text-slate-500 text-xs">
                {p.teamId != null ? G.teams[p.teamId].abbr : "—"}
              </span>
              <span className="text-slate-400 tnum text-xs w-6 text-right">{p.ovr}</span>
            </div>
          ))}
        </div>
      </Section>

  );
}

function AllStarTab({ G, openPlayer }) {
  const a = G.allStar;
  /* In a tournament year there IS no All-Star game — the break belongs to the
     countries — so this tab shows the tournament rather than an empty room. */
  if (G.worldCup) return <WorldCupBracket G={G} cup={G.worldCup} openPlayer={openPlayer} />;
  if (!a) {
    return (
      <div className="text-slate-400 text-sm">
        {worldCupYear(G)
          ? "The countries have the break this winter — no All-Star game this year."
          : "The All-Star break hasn't come round yet."}
      </div>
    );
  }
  const Side = ({ title, ids, score }) => (
    <Section title={title} className="p-3">
      <div className="text-3xl font-bold tnum text-center py-1">{score}</div>
      <div className="pt-1">
        {ids.map((id) => {
          const p = G.players[id];
          if (!p) return null;
          return (
            <div key={id} className="flex items-center gap-2 text-sm py-0.5 cursor-pointer hover:text-sky-300"
              onClick={() => openPlayer(id)}>
              <PosBadge pos={p.pos} />
              <span className="flex-1">{fullName(p)}</span>
              <span className="text-slate-500 text-xs">
                {G.teams[(a.at && a.at[id] != null) ? a.at[id] : p.teamId]
                  ? G.teams[(a.at && a.at[id] != null) ? a.at[id] : p.teamId].abbr : ""}
              </span>
              <span className="tnum text-slate-400">{p.pos === "G" ? `${(svPct(p.season) * 100).toFixed(1)}` : pts(p.season)}</span>
            </div>
          );
        })}
      </div>
    </Section>
  );
  return (
    <div className="space-y-3">
      <div className={`${card} p-4 text-center`}>
        <div className="text-xs uppercase tracking-wide text-slate-400">{a.year} All-Star Game</div>
        <div className="text-lg font-semibold mt-1">
          {CONFS[0]} {a.eastScore} — {a.westScore} {CONFS[1]}
        </div>
        {a.mvp != null && G.players[a.mvp] ? (
          <div className="text-sm text-slate-400 mt-1">MVP: {fullName(G.players[a.mvp])}</div>
        ) : null}
      </div>
      <div className="grid md:grid-cols-2 gap-3">
        <Side title={CONFS[0]} ids={a.east} score={a.eastScore} />
        <Side title={CONFS[1]} ids={a.west} score={a.westScore} />
      </div>
    </div>
  );
}

/* The market. Derived from the YEAR, so the list is stable all offseason and
   costs nothing — and hiring is the point: a staff you can see and cannot
   change is furniture. */
function StaffMarket({ G, setG, notify }) {
  const [role, setRole] = useState(null);
  const t = G.teams[G.userTeam];
  /* The head coach is always here. He predates the staff rule, and he is the
     one who sets the system — the club's whole identity — so being unable to
     replace him was the most conspicuous gap the staff market left. */
  const jobs = [{ k: "head", label: "Head coach" }]
    .concat(depthOn(G, "coachStaff") ? STAFF_ROLES.map((r) => ({ k: r.k, label: r.label })) : [])
    .concat(depthOn(G, "areaScouting") ? [{ k: "scout", label: "Head scout" }] : []);
  const upd = (fn) => { const g2 = migrate(JSON.parse(JSON.stringify(G))); const r = fn(g2); setG(g2); return r; };
  const current = (k) => (k === "head" ? { name: coachOf(t).name, rating: coachOf(t).dev }
    : k === "scout" ? scoutOf(G, t) : (staffOf(G, t).people || {})[k]) || {};
  return (
    <div className="border-t border-[#1e2b45] pt-2 mt-1">
      <div className="flex flex-wrap items-center gap-2">
        <span className="text-xs text-slate-400">Hire</span>
        <span className="text-[11px] text-slate-500">
          ${budgetLeft(G, G.userTeam)}M of ${t.budget || 0}M left
        </span>
        {jobs.map((j) => (
          <button key={j.k} onClick={() => setRole(role === j.k ? null : j.k)}
            className={`text-xs px-2 py-1 rounded ${role === j.k
              ? "bg-sky-500/25 text-sky-200" : "bg-[#0d1728] border border-[#243250] text-slate-400 hover:text-slate-200"}`}>
            {j.label}
          </button>
        ))}
        {role && t.staffHired && t.staffHired[role] ? (
          <button className="text-xs px-2 py-1 text-rose-300 hover:underline"
            onClick={() => { const r = upd((g) => fireStaff(g, role));
              notify(r.ok ? "Let go." : r.why); }}>
            Fire {current(role).name}
          </button>
        ) : null}
      </div>
      {role ? (
        <div className="mt-2 space-y-0.5">
          <div className="text-[11px] text-slate-500">
            Currently {current(role).name} · {current(role).rating}
          </div>
          {staffMarket(G, role).map((c) => (
            <div key={c.id} className="flex items-center gap-2 text-sm py-0.5">
              <span className="flex-1 truncate">{c.name}</span>
              <span className={`tnum ${c.rating > current(role).rating ? "text-emerald-300" : "text-slate-500"}`}>
                {c.rating}
              </span>
              <span className="text-slate-600 text-xs tnum w-12 text-right">${c.cost}M</span>
              <button className={`${btnGhost} text-xs px-2 py-0.5`}
                onClick={() => { const r = upd((g) => hireStaff(g, role, c));
                  notify(r.ok ? `${c.name} hired.` : r.why); }}>
                Hire
              </button>
            </div>
          ))}
        </div>
      ) : null}
    </div>
  );
}

function RoomTab({ G, setG, openPlayer, notify }) {
  const upd = (fn) => { const g2 = migrate(JSON.parse(JSON.stringify(G))); fn(g2); setG(g2); };
  const t = G.teams[G.userTeam];
  const { captain, alternates } = letters(G, G.userTeam);
  const morale = roomMorale(G, G.userTeam);
  const coach = coachOf(t);
  const sys = systemOf(t);
  const roster = rosterOf(G, G.userTeam).filter((p) => p.pos !== "G")
    .sort((a, b) => leadership(G, b) - leadership(G, a));
  const rival = t.rivalId != null ? G.teams[t.rivalId] : null;

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <Stat label="Room" value={morale} sub="morale"
          tone={morale < 35 ? "text-rose-400" : morale > 65 ? "text-emerald-400" : ""} />
        <Stat label="Captain" value={captain ? shortName(captain) : "—"}
          sub={captain ? personalityOf(captain).label : ""} />
        <Stat label="Board" value={Math.round(G.boardConfidence)} sub="confidence"
          tone={G.boardConfidence < 30 ? "text-rose-400" : ""} />
        <Stat label="Rival" value={rival ? rival.abbr : "—"} sub={rival ? rival.name : ""} />
      </div>

      {G.mandate ? (
        <Section title="What the board is asking for" className="p-3">
          <div className="pt-1">
            <div className="text-lg font-semibold text-sky-300">{G.mandate.label}</div>
            <div className="text-sm text-slate-400">{G.mandate.blurb}</div>
            {G.lastMandate ? (
              <div className={`text-xs mt-2 ${G.lastMandate.met ? "text-emerald-400" : "text-rose-400"}`}>
                Last season they wanted: {G.lastMandate.label} — {G.lastMandate.met ? "delivered" : "not delivered"}.
              </div>
            ) : null}
          </div>
        </Section>
      ) : null}

      <Section title="Coaching staff" className="p-3">
        <div className="pt-1 space-y-3">
          <div className="flex flex-wrap items-baseline gap-x-3">
            <span className="font-medium">{coach.name}</span>
            <span className="text-sm text-slate-400">head coach</span>
          </div>
          <div>
            <div className="text-xs text-slate-400 mb-1">System</div>
            <select className={`${inputCls} w-full sm:w-72`} value={coach.system}
              onChange={(e) => upd((g) => {
                g.teams[g.userTeam].coach = { ...coachOf(g.teams[g.userTeam]), system: e.target.value };
              })}>
              {Object.entries(SYSTEMS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
            <div className="text-xs text-slate-400 mt-1">{sys.blurb}</div>
          </div>
          {/* With a staff these three belong to three different people, and the
              head coach's own numbers stop being what the engine reads. */}
          {(() => {
            const st = staffOf(G, G.teams[G.userTeam]);
            const farm = farmCoachOf(G, G.teams[G.userTeam]);
            return (
              <>
                <div className="grid grid-cols-3 gap-2">
                  {STAFF_ROLES.map((r) => (
                    <Stat key={r.k} label={r.label} value={st[r.k]}
                      sub={st.head ? "head coach" : (st.people[r.k] || {}).name} />
                  ))}
                </div>
                {!st.head ? (
                  <div className="text-xs text-slate-500">
                    Your assistants run these, not the head coach — his own ratings no longer apply.
                  </div>
                ) : null}
                {depthOn(G, "farmCoach") ? (
                  <div className="text-xs text-slate-400">
                    <span className="text-slate-500">Affiliate coach </span>
                    {farm.name} <span className="text-slate-500">· development {farm.dev}</span>
                    <span className="text-slate-600"> — his is the number that counts for anyone in the minors.</span>
                  </div>
                ) : null}
                {depthOn(G, "areaScouting") ? (
                  <div className="text-xs text-slate-400">
                    <span className="text-slate-500">Head scout </span>
                    {scoutOf(G, G.teams[G.userTeam]).name}
                    <span className="text-slate-500"> · {scoutOf(G, G.teams[G.userTeam]).rating}</span>
                    <span className="text-slate-600"> — how much a sweep of a region actually tells you.</span>
                  </div>
                ) : null}
                {!st.head || depthOn(G, "areaScouting") ? <StaffMarket G={G} setG={setG} notify={notify} /> : null}
              </>
            );
          })()}
        </div>
      </Section>

      <Section title="Leadership">
        <div className="px-3 py-2 text-xs text-slate-400 border-b border-[#1e2b45]">
          The letter goes to whoever the room follows — years here, what he has won, and who he is.
          Name your own captain if you disagree.
        </div>
        <SortTable min={720} rows={roster} initial="lead" rowKey={(p) => p.id}
          onRow={(p) => openPlayer(p.id)}
          cols={[
            { key: "name", label: "Player", get: (p) => p.ln, cell: (p) => (
              <span className="whitespace-nowrap">
                {fullName(p)}
                {letterFor(G, p) ? <span className="ml-1.5 text-[10px] px-1 rounded bg-amber-500/20 text-amber-300 font-bold">
                  {letterFor(G, p)}</span> : null}
              </span>
            ) },
            { key: "pos", label: "Pos", get: (p) => POS.indexOf(p.pos), cell: (p) => <PosBadge pos={p.pos} /> },
            { key: "age", label: "Age", get: (p) => p.age },
            { key: "per", label: "Character", get: (p) => personalityOf(p).label, cls: "text-slate-300" },
            { key: "yrs", label: "Here", get: (p) => (p.career || []).filter((c) => c.teamId === p.teamId).length,
              cell: (p) => `${(p.career || []).filter((c) => c.teamId === p.teamId).length}y` },
            { key: "rings", label: "Cups", get: (p) => (p.rings || []).length, cls: "text-amber-300" },
            { key: "lead", label: "Leadership", get: (p) => leadership(G, p), cls: "font-semibold",
              cell: (p) => Math.round(leadership(G, p)) },
            { key: "act", label: "", get: () => 0, cell: (p) => (
              captain && captain.id === p.id ? <span className="text-xs text-slate-500">captain</span> : (
                <button className="text-xs text-sky-400 hover:underline" onClick={(e) => {
                  e.stopPropagation();
                  upd((g) => { g.teams[g.userTeam].captainId = p.id; });
                  notify(`${fullName(p)} named captain.`);
                }}>make captain</button>
              )
            ) },
          ]} />
      </Section>
    </div>
  );
}

function HallTab({ G, openPlayer }) {

  return (
    <div className="space-y-3">
      <div className={`${card} p-3 text-sm text-slate-400`}>
        Eligible three years after retiring. At most three go in a year, so it stays worth something.
      </div>
      <Section title={`Hall of Fame — ${hall.length} inducted`}>
        <SortTable min={680} rows={hall} initial="year" rowKey={(h) => h.pid}
          onRow={(h) => openPlayer(h.pid)}
          cols={[
            { key: "year", label: "Class", get: (h) => h.year },
            { key: "name", label: "Player", get: (h) => h.name,
              cell: (h) => <span className="whitespace-nowrap">{h.name}</span> },
            { key: "pos", label: "Pos", get: (h) => POS.indexOf(h.pos), cell: (h) => <PosBadge pos={h.pos} /> },
            { key: "gp", label: "GP", get: (h) => h.gp },
            { key: "prod", label: "Career", get: (h) => (h.pos === "G" ? h.w : h.g + h.a),
              cell: (h) => (h.pos === "G" ? `${h.w} W` : `${h.g}G ${h.a}A`) },
            { key: "rings", label: "Cups", get: (h) => h.rings, cls: "text-amber-300" },
            { key: "tro", label: "Awards", get: (h) => h.trophies },
            { key: "score", label: "Score", get: (h) => h.score, cls: "text-slate-400" },

}

function RecordsTab({ G, openPlayer }) {
  const recs = G.records || {};
  return (
    <div className="space-y-3">
      <Section title="League record book" className="p-3">
        <div className="space-y-1 pt-1">
          {RECORD_DEFS.concat([
            // Not stat lines, so they can't come through RECORD_DEFS — but the
            // longest run of the year belongs on the same page as everything else.
            { key: "pointStreak", label: "Point streak" },
            { key: "winStreak", label: "Winning streak by a club" },
          ]).map((d) => {
            const r = recs[d.key];
            return (
              <div key={d.key} className="flex items-center gap-3 text-sm py-0.5">
                <span className="flex-1 text-slate-400">{d.label}</span>
                {r ? (
                  <>
                    {r.pid != null
                      ? <button className="hover:text-sky-300" onClick={() => openPlayer(r.pid)}>{r.name}</button>
                      : <span>{r.name}</span>}
                    <span className="text-slate-500 text-xs w-12 text-right">{r.year}</span>
                    <span className="tnum font-semibold w-10 text-right">{r.v}</span>
                  </>
                ) : <span className="text-slate-600">unset</span>}
              </div>
            );
          })}
        </div>
      </Section>
      {/* Whole careers, which the book never held — a man could play nine
          hundred games and score a thousand points and never appear on it. */}
      <Section title="Career record book" className="p-3">
        <div className="space-y-1 pt-1">
          {CAREER_RECORD_DEFS.map((d) => {
            const r = (G.careerRecords || {})[d.key];
            return (
              <div key={d.key} className="flex items-center gap-3 text-sm py-0.5">
                <span className="flex-1 text-slate-400">{d.label}</span>
                {r ? (
                  <>
                    <button className="hover:text-sky-300" onClick={() => openPlayer(r.pid)}>{r.name}</button>
                    <span className="tnum font-semibold w-12 text-right">{r.v}</span>
                  </>
                ) : <span className="text-slate-600">unset</span>}
              </div>
            );
          })}
        </div>
      </Section>

      {/* The record book keeps only the best ever, so a 54-goal season left no
          trace once somebody beat it. This is who actually led, year by year. */}
      <Section title="Season by season">
        <SortTable min={760} rows={(G.history || []).filter((h) => h.leaders || h.awards)}
          initial="year" rowKey={(h) => h.year}
          empty="No completed seasons yet — this fills in as the years go by."
          cols={[
            { key: "year", label: "Year", get: (h) => h.year, cls: "font-medium" },
            { key: "champ", label: "Champion", get: (h) => (h.champion != null && G.teams[h.champion] ? G.teams[h.champion].city : ""),
              cell: (h) => (h.champion != null && G.teams[h.champion]
                ? <span className="whitespace-nowrap text-amber-300">{G.teams[h.champion].abbr}</span> : "—") },
            ...RECORD_DEFS.map((d) => ({
              key: d.key,
              // Short headings: the full labels are spelled out in the book above.
              label: { goals: "Goals", points: "Points", assists: "Assists", pim: "PIM",
                       wins: "Wins", shutouts: "SO" }[d.key] || d.key,
              get: (h) => ((h.leaders && h.leaders[d.key]) ? h.leaders[d.key].v : 0),
              cell: (h) => {
                const L = h.leaders && h.leaders[d.key];
                if (!L) return <span className="text-slate-600">—</span>;
                /* A record that still stands gets marked. `G.records` holds the
                   all-time best, so this is "was this the year". */
                const rec = (G.records || {})[d.key];
                const standing = rec && rec.year === h.year && rec.pid === L.pid;
                return (
                  <span className="whitespace-nowrap">
                    <button className="hover:text-sky-300" onClick={() => openPlayer(L.pid)}>
                      {L.name || (G.players[L.pid] ? fullName(G.players[L.pid]) : "—")}
                    </button>
                    <span className={`ml-1 tnum ${standing ? "text-amber-300 font-semibold" : "text-slate-400"}`}
                      title={standing ? "still the league record" : undefined}>
                      {L.v}{standing ? "★" : ""}
                    </span>
                  </span>
                );
              },
            })),
          ]} />
      </Section>
      <Section title="Cups won" className="p-3">
        <div className="grid sm:grid-cols-2 gap-x-6 pt-1">
          {G.teams.filter((t) => t.cupWins > 0).sort((a, b) => b.cupWins - a.cupWins).map((t) => (
            <div key={t.id} className="flex justify-between text-sm py-0.5">
              <span>{t.city} {t.name}</span><span className="tnum text-slate-400">{t.cupWins}</span>
            </div>
          ))}
          {!G.teams.some((t) => t.cupWins > 0) ? <div className="text-sm text-slate-500">Nobody has won one yet.</div> : null}
        </div>
      </Section>
    </div>
  );
}

              <div key={p.id} className="flex items-center gap-2 text-sm py-0.5 cursor-pointer hover:text-sky-300"
                onClick={() => openPlayer(p.id)}>

            ))}

        </Section>
      </div>
    </Modal>
  );
}

/* ------------------------- how a draft class turned out --------------------
 * `p.draft` is stamped for life, so the answer to "was that a good draft?" has
 * always been sitting in the save — it just had nowhere to be asked. Grading is
 * against what the pick was WORTH, not against the league: a fourth-rounder who
 * became an NHL regular is a triumph and a first-overall who did the same is
 * not, and a table that ranked them together would say nothing.
 * ------------------------------------------------------------------------- */
/* What a pick in that slot is expected to become. It falls away steeply, which
   is what makes a late hit worth more than an early one — but it must not fall
   to nothing: at the old curve the last pick was expected to reach 8 overall,
   which every living player beats, so nothing was ever a bust. A first overall
   is held to a real NHL standard and a late third-rounder to roughly a fringe
   professional, which is what those picks actually are. */
function draftPar(G, pick) {
  const total = Math.max(1, draftPicksTotal(G));
  const depth = clamp((pick - 1) / Math.max(1, total - 1), 0, 1);
  return Math.round(DRAFT_PAR_TOP - (DRAFT_PAR_TOP - DRAFT_PAR_LAST) * Math.pow(depth, 0.55));
}

/* The class, graded.
 *
 * Built from `G.draftHistory` when it's there, so men the save has since
 * forgotten still appear — the report used to scan live players only, which is
 * why a 96-pick draft read as "73 players drafted" a decade later. A player who
 * is gone has no rating to grade and says so; that is the truthful answer, not
 * an omission. */
function draftClassReport(G, year) {
  const archived = (G.draftHistory || []).find((d) => d.year === year);
  const live = playersOf(G).filter((p) => p.draft && p.draft.year === year);
  if (!archived && !live.length) return null;

  const entries = archived
    ? archived.picks.map((a) => ({ pick: a.pick, round: a.round, teamId: a.teamId,
        name: a.name, pos: a.pos, p: G.players[a.pid] || null }))
    : live.map((p) => ({ pick: p.draft.pick, round: p.draft.round, teamId: p.draft.teamId,
        name: fullName(p), pos: p.pos, p }));

  const rows = entries.map((e) => {
    const p = e.p;
    const gp = p ? (p.career || []).reduce((s, c) => s + (c.gp || 0), 0) + ((p.season && p.season.gp) || 0) : 0;
    const pts_ = p ? (p.career || []).reduce((s, c) => s + (c.g || 0) + (c.a || 0), 0) : 0;
    const par = draftPar(G, e.pick);
    return {
      ...e, gp, pts: pts_, par,
      ovr: p ? p.ovr : null,
      over: p ? p.ovr - par : -par,
      gone: !p,
      /* A player nobody has seen yet is incomplete, not a bust. One the save has
         forgotten never played — which is a verdict, and a harsh one. */
      settled: !p || gp >= 60 || p.age >= 24,
    };
  }).sort((a, b) => a.pick - b.pick);

  const settled = rows.filter((r) => r.settled);
  const mine = rows.filter((r) => r.teamId === G.userTeam);
  return {
    year, rows, mine,
    graded: settled.length,
    hits: settled.filter((r) => !r.gone && r.over >= 6).length,
    busts: settled.filter((r) => r.gone || r.over <= -10).length,
    nhl: rows.filter((r) => r.gp >= 60).length,
  };
}

function DraftClassReport({ G, openPlayer }) {
  /* Years come from the ARCHIVE first, so a class stays listed long after the
     save has forgotten the players in it. */
  const years = useMemo(() => {
    const s = new Set((G.draftHistory || []).map((d) => d.year));
    playersOf(G).forEach((p) => { if (p.draft) s.add(p.draft.year); });
    return Array.from(s).sort((a, b) => b - a);
  }, [G]);
  const [year, setYear] = useState(years[0]);
  const rep = useMemo(() => draftClassReport(G, years.includes(year) ? year : years[0]), [G, year, years]);
  if (!years.length) return null;
  return (
    <Section title="Draft classes"
      right={
        <div className="flex gap-1 flex-wrap justify-end">
          {years.map((y) => (
            <button key={y} onClick={() => setYear(y)}
              className={`text-[11px] px-1.5 py-0.5 rounded ${(rep && rep.year) === y
                ? "bg-sky-500/25 text-sky-200" : "text-slate-500 hover:text-slate-300"}`}>{y}</button>
          ))}
        </div>
      }>
      {!rep ? <div className="px-3 py-4 text-sm text-slate-500">Nothing drafted that year.</div> : (
        <>
          <div className="px-3 py-2 text-xs text-slate-400 border-b border-[#1e2b45] flex flex-wrap gap-x-4 gap-y-1">
            <span>{rep.rows.length} picked</span>
            <span className="text-emerald-300">{rep.hits} beat their slot</span>
            <span className="text-rose-300">{rep.busts} missed it</span>
            <span>{rep.nhl} became regulars</span>
            <span className="text-slate-600">
              {rep.graded < rep.rows.length ? `${rep.rows.length - rep.graded} too early to say` : "all settled"}
            </span>
            {rep.mine.length ? <span className="text-sky-300">you took {rep.mine.length}</span> : null}
          </div>
          <SortTable min={720} rows={rep.rows} initial="pick" rowKey={(r) => r.pick}
            onRow={(r) => (r.p ? openPlayer(r.p.id) : null)}
            rowCls={(r) => (r.teamId === G.userTeam ? "bg-sky-950/30" : "")}
            cols={[
              { key: "pick", label: "#", get: (r) => -r.pick, cell: (r) => r.pick },
              { key: "rd", label: "Rd", get: (r) => -r.round, cell: (r) => r.round, cls: "text-slate-500 text-xs" },
              { key: "by", label: "By", get: (r) => (G.teams[r.teamId] ? G.teams[r.teamId].abbr : ""),
                cls: "text-slate-400 text-xs" },
              { key: "name", label: "Player", get: (r) => r.name,
                cell: (r) => <span className="whitespace-nowrap">{r.name}</span> },
              { key: "pos", label: "Pos", get: (r) => POS.indexOf(r.pos),
                cell: (r) => (r.pos ? <PosBadge pos={r.pos} /> : null) },
              { key: "ovr", label: "Now", get: (r) => (r.ovr == null ? -1 : r.ovr), cls: "font-semibold",
                cell: (r) => (r.ovr == null ? <span className="text-slate-600 text-xs">—</span> : r.ovr) },
              { key: "gp", label: "NHL GP", get: (r) => r.gp },
              { key: "pts", label: "Pts", get: (r) => r.pts },
              /* The verdict, against the slot rather than against the league. */
              { key: "over", label: "vs slot", get: (r) => r.over, cell: (r) => {
                if (r.gone) return <span className="text-rose-300 text-xs"
                  title="never established himself and has left the game">never played</span>;
                if (!r.settled) return <span className="text-slate-600 text-xs">too early</span>;
                const c = r.over >= 6 ? "text-emerald-300" : r.over <= -10 ? "text-rose-300" : "text-slate-400";
                return <span className={`tnum ${c}`} title={`a pick at ${r.pick} is expected around ${r.par}`}>
                  {r.over > 0 ? "+" : ""}{r.over}</span>;
              } },
            ]} />
        </>
      )}
    </Section>
  );
}

/* ---------------------------- the year in review ---------------------------
 * Everything needed to tell the story of a season is now in the save — the
 * table, the ballots, the leaders, the draft class, the grudges — and it was
 * spread over five screens as five tables. This is the one page that reads like
 * a season rather than a database, built entirely from what is already there.
 * ------------------------------------------------------------------------- */
function SeasonReview({ G, openPlayer, openTeam }) {
  const years = (G.history || []).map((h) => h.year).sort((a, b) => b - a);
  const [year, setYear] = useState(years[0]);
  const h = (G.history || []).find((x) => x.year === (years.includes(year) ? year : years[0]));
  if (!h) return null;
  const me = G.teams[G.userTeam];
  const nm = (id) => (id != null && G.players[id] ? fullName(G.players[id]) : null);
  const table = (h.standings || []).slice().sort((a, b) => b.pts - a.pts);
  const myRow = table.findIndex((s) => s.id === G.userTeam) + 1;
  const cls = draftClassReport(G, h.year);
  return (
    <Section title="The year in review"
      right={
        <div className="flex gap-1 flex-wrap justify-end">
          {years.map((y) => (
            <button key={y} onClick={() => setYear(y)}
              className={`text-[11px] px-1.5 py-0.5 rounded ${h.year === y
                ? "bg-sky-500/25 text-sky-200" : "text-slate-500 hover:text-slate-300"}`}>{y}</button>
          ))}
        </div>
      }>
      <div className="p-3 space-y-3 text-sm">
        {/* The season in a sentence, assembled rather than stored. */}
        <div className="text-slate-300">
          <b>{h.year}.</b>{" "}
          {h.champion != null && G.teams[h.champion]
            ? <>{G.teams[h.champion].city} {G.teams[h.champion].name} won the Cup. </>
            : <>Nobody has lifted it yet. </>}
          {h.userRecord ? (
            <>You finished {h.userRecord.w}-{h.userRecord.l}-{h.userRecord.otl}
              {myRow ? <>, {ordinal(myRow)} of {table.length}</> : null}
              {h.champion === G.userTeam ? <b className="text-amber-300"> — and it was yours.</b> : "."}
            </>
          ) : null}
        </div>

        <div className="grid sm:grid-cols-2 gap-x-6 gap-y-2">
          {h.awards ? (
            <div>
              <div className="text-xs uppercase tracking-wide text-slate-500 mb-1">Silverware</div>
              {["mvp", "scoring", "goals", "defence", "goalie", "rookie"].map((k) => (
                h.awards[k] != null && nm(h.awards[k]) ? (
                  <div key={k} className="flex justify-between gap-2 py-0.5">
                    <span className="text-slate-500 text-xs">{AWARD_LABEL[k]}</span>
                    <button className="hover:text-sky-300 text-right" onClick={() => openPlayer(h.awards[k])}>
                      {nm(h.awards[k])}
                    </button>
                  </div>
                ) : null
              ))}
              {h.retroAwards ? <div className="text-[11px] text-slate-600 mt-1">Reconstructed from the record.</div> : null}
            </div>
          ) : null}
          {h.leaders ? (
            <div>
              <div className="text-xs uppercase tracking-wide text-slate-500 mb-1">Led the league</div>
              {RECORD_DEFS.map((d) => {
                const L = h.leaders[d.key];
                if (!L) return null;
                return (
                  <div key={d.key} className="flex justify-between gap-2 py-0.5">
                    <span className="text-slate-500 text-xs">{d.label}</span>
                    <span className="text-right">
                      <button className="hover:text-sky-300" onClick={() => openPlayer(L.pid)}>{L.name}</button>
                      <span className="text-slate-500 tnum text-xs"> {L.v}</span>
                    </span>
                  </div>
                );
              })}
            </div>
          ) : null}
        </div>

        {cls ? (
          <div className="text-xs text-slate-400 border-t border-[#1e2b45] pt-2">
            <span className="text-slate-500">That June: </span>
            {cls.rows.length} players drafted
            {cls.graded ? <> · {cls.hits} have beaten their slot, {cls.busts} have missed it</> : null}
            {cls.mine.length ? <> · you took {cls.mine.length}
              {cls.mine[0] ? <>, starting with{" "}
                <button className="hover:text-sky-300" onClick={() => openPlayer(cls.mine[0].p.id)}>
                  {fullName(cls.mine[0].p)}</button></> : null}</> : null}
          </div>
        ) : null}

        {/* Grudges are the closest the save has to a memory of bad blood. */}
        {depthOn(G, "rivalryGrowth") && me.grudges && Object.keys(me.grudges).length ? (
          <div className="text-xs text-slate-400 border-t border-[#1e2b45] pt-2">
            <span className="text-slate-500">Bad blood: </span>
            {Object.entries(me.grudges).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([id, n], i) => (
              <span key={id}>
                {i ? " · " : ""}
                <button className="hover:text-sky-300" onClick={() => openTeam(+id)}>{G.teams[+id].name}</button>
                <span className="text-slate-600"> ({n} spring{n === 1 ? "" : "s"})</span>
              </span>
            ))}
          </div>
        ) : null}
      </div>
    </Section>
  );
}

/* The other half of a career: what you're paid, what you're worth, and what you
   own. Everything here is off unless the ownership rule is on. */
function CareerAndOwnership({ G, setG, notify, openTeam }) {
  if (!depthOn(G, "ownership")) return null;
  const gm = gmState(G);
  const upd = (fn) => { const g2 = migrate(JSON.parse(JSON.stringify(G))); const r = fn(g2); setG(g2); return r; };
  const market = useMemo(() => ownershipMarket(G), [G]);
  const stakes = Object.keys(gm.stakes || {}).filter((k) => gm.stakes[k] > 0);
  const legacy = gmLegacy(G);
  const here = myShare(G, G.userTeam);

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <Stat label="Money" value={`$${gm.cash || 0}M`} sub="yours to invest" />
        <Stat label="Salary" value={`$${gm.salary || gmSalaryFor(G, G.userTeam)}M`}
          sub={gm.contract ? `${gm.contract.yrs} yr${gm.contract.yrs === 1 ? "" : "s"} left` : "no deal signed"} />
        <Stat label="Legacy" value={legacy}
          sub={legacy >= 120 ? "they name buildings after you" : legacy >= 60 ? "a real reputation"
            : legacy >= 25 ? "known in the game" : "making your name"} />
        <Stat label="Owned" value={stakes.length ? `${stakes.length} club${stakes.length === 1 ? "" : "s"}` : "—"}
          sub={here > 0 ? `${Math.round(here * 100)}% of this one` : "none of this one"}
          tone={here > 0.5 ? "text-emerald-300" : ""} />
      </div>

      {/* A contract on the table. It expires, and what you're offered next time
          is what your record says you're worth. */}
      {G.gmOffer ? (
        <div className={`${card} p-3 flex flex-wrap items-center gap-3`}>
          <div className="text-sm">
            <span className="text-slate-400">{G.teams[G.gmOffer.teamId].name} offer you </span>
            <b>${G.gmOffer.salary}M</b>
            <span className="text-slate-400"> a year for {G.gmOffer.yrs} years.</span>
          </div>
          <span className="flex-1" />
          <button className={btnPri} onClick={() => upd((g) => {
            gmState(g).contract = { salary: g.gmOffer.salary, yrs: g.gmOffer.yrs };
            g.gmOffer = null;
          })}>Sign it</button>
          <button className={btnGhost} onClick={() => upd((g) => { g.gmOffer = null; })}>Leave it</button>
        </div>
      ) : null}

      {here > 0 ? (
        <Section title="Your club" className="p-3">
          <div className="text-sm pt-1 space-y-1.5">
            <div>
              You hold <b className={here > 0.5 ? "text-emerald-300" : "text-amber-300"}>{Math.round(here * 100)}%</b>
              <span className="text-slate-400"> of the {G.teams[G.userTeam].name}, valued at ${teamValue(G, G.userTeam)}M.</span>
            </div>
            <div className="text-xs text-slate-500">
              {here > 0.5
                ? "You hold control. The board cannot remove you — the only way out is your own."
                : "A minority stake buys patience, not immunity: your partners can still vote you out, and the bigger your share the harder that gets."}
            </div>
            <div className="flex gap-2 flex-wrap pt-1">
              {!G.gmStoodDown ? (
                <button className={btnGhost} onClick={() => { const r = upd((g) => standDown(g));
                  notify(r.ok ? "You've stepped back. The club is still yours." : r.why); }}>
                  Step back from running it
                </button>
              ) : (
                <button className={btnPri} onClick={() => { const r = upd((g) => takeBackTheJob(g));
                  notify(r.ok ? "You're back behind the desk." : r.why); }}>
                  Take charge again
                </button>
              )}
              <button className={`${btnGhost} text-rose-300`}
                onClick={() => { const r = upd((g) => sellStake(g, g.userTeam, 0.25));
                  notify(r.ok ? `Sold a quarter for $${r.price}M.` : r.why); }}>
                Sell 25%
              </button>
            </div>
            {/* What the place actually cleared, and therefore what your share
                of it was worth. A losing club at the cap costs you money. */}
            <div className="flex flex-wrap items-baseline gap-2 pt-1 text-xs">
              <span className="text-slate-500">Last year the club</span>
              <b className={clubProfit(G, G.userTeam) >= 0 ? "text-emerald-300" : "text-rose-300"}>
                {clubProfit(G, G.userTeam) >= 0 ? "cleared" : "lost"} ${Math.abs(clubProfit(G, G.userTeam))}M
              </b>
              <span className="text-slate-500">
                — your share, ${round1(clubProfit(G, G.userTeam) * here)}M
              </span>
            </div>
          </div>
        </Section>
      ) : null}

      {/* The two things an owner decides that a manager cannot. */}
      {here > 0 ? (
        <Section title="The club's course" className="p-3"
          right={<span className="text-xs text-slate-500">
            {here > 0.5 ? "yours to set" : "you'd need control"}</span>}>
          <div className="pt-1 space-y-2">
            <div className="flex gap-2 flex-wrap">
              {Object.entries(DIRECTIONS).map(([k, d]) => (
                <button key={k} disabled={here <= 0.5}
                  className={(G.direction || "") === k ? btnPri : btnGhost}
                  onClick={() => { const r = upd((g) => setDirection(g, k));
                    notify(r.ok ? `The club is ${d.label.toLowerCase()}${k === "compete" ? "" : "ing"}.` : r.why); }}>
                  {d.label}
                </button>
              ))}
            </div>
            <div className="text-xs text-slate-500">
              {(DIRECTIONS[G.direction] || DIRECTIONS.compete).blurb}
            </div>
            {here > 0.5 ? (
              <div className="text-xs text-sky-300">
                An owner isn't judged by his own board — the course you set IS the expectation.
              </div>
            ) : null}
          </div>
        </Section>
      ) : null}

      {/* The one thing only an owner can do, and the one every fan dreads. */}
      {here > 0.5 ? (
        <Section title="Moving the franchise" className="p-3"
          right={<span className="text-xs text-slate-500">a club is a building in a city</span>}>
          <div className="pt-1 space-y-2">
            <div className="text-xs text-slate-500">
              A bigger market is worth more at the gate for ever. You leave the building you paid
              for, the city you won over, and the rivalry — a rivalry is two places, not two badges.
            </div>
            {relocationOptions(G).length ? (
              <div className="space-y-1">
                {relocationOptions(G).slice(0, 6).map((m) => {
                  const afford = m.cost <= (gm.cash || 0);
                  return (
                    <div key={m.city} className="flex flex-wrap items-center gap-2 text-sm">
                      <span className="font-medium">{m.city}</span>
                      <span className="text-slate-500 text-xs">{m.name}</span>
                      <span className={`text-[10px] px-1.5 py-0.5 rounded ${m.bigger
                        ? "bg-emerald-900/40 text-emerald-300" : "bg-[#16233c] text-slate-400"}`}>
                        market {m.mkt}{m.bigger ? " — bigger than here" : ""}
                      </span>
                      <span className="flex-1" />
                      <span className={`tnum text-xs ${afford ? "text-emerald-300" : "text-slate-600"}`}>${m.cost}M</span>
                      <button className={`${btnGhost} text-xs px-2 py-1`} disabled={!afford}
                        onClick={() => {
                          if (!window.confirm(
                            `Move the ${G.teams[G.userTeam].name} from ${G.teams[G.userTeam].city} to ${m.city}?\n\n`
                            + `It costs $${m.cost}M. You lose the arena you have built, the city's goodwill `
                            + `and your rivalry, and ${G.teams[G.userTeam].city} never gets another club.\n\n`
                            + `This cannot be undone.`)) return;
                          const r = upd((g) => relocate(g, m.city));
                          notify(r.ok ? `The club is now the ${G.teams[G.userTeam].name === m.name ? "" : ""}${m.city} side.` : r.why);
                        }}>Move</button>
                    </div>
                  );
                })}
              </div>
            ) : <div className="text-sm text-slate-500">Every market with an appetite already has a club.</div>}
            {(gm.cash || 0) < 40 ? (
              <div className="text-[11px] text-slate-600">You'd need a great deal more money than this.</div>
            ) : null}
          </div>
        </Section>
      ) : null}

      {here > 0 ? (
        <Section title="Putting your money into the club" className="p-3"
          right={<span className="text-xs text-slate-500">out of your pocket, and it never comes back</span>}>
          <div className="pt-1 space-y-2">
            {Object.entries(INVESTMENTS).map(([k, d]) => {
              const lvl = investLevel(G, G.userTeam, k);
              const cost = investCost(G, G.userTeam, k);
              const maxed = lvl >= d.max;
              const afford = cost <= (gm.cash || 0);
              return (
                <div key={k} className="flex flex-wrap items-center gap-2 text-sm">
                  <span className="w-36 shrink-0">{d.label}</span>
                  <span className="flex gap-0.5">
                    {Array.from({ length: d.max }, (_, i) => (
                      <span key={i} className={`w-2.5 h-2.5 rounded-sm ${i < lvl ? "bg-emerald-500" : "bg-[#1e2b45]"}`} />
                    ))}
                  </span>
                  <span className="flex-1 text-xs text-slate-500 min-w-[12rem]">{d.blurb}</span>
                  <button className={`${btnGhost} text-xs px-2 py-1 whitespace-nowrap`}
                    disabled={maxed || !afford}
                    onClick={() => { const r = upd((g) => investInClub(g, g.userTeam, k));
                      notify(r.ok ? `${d.label} improved — $${r.cost}M.` : r.why); }}>
                    {maxed ? "done" : `$${cost}M`}
                  </button>
                </div>
              );

          </div>

      <Section title="On the market"
        right={<span className="text-xs text-slate-500">clubs change hands rarely</span>}>
        {!market.length ? (
          <div className="px-3 py-4 text-sm text-slate-500">Nothing is for sale. Owners sell when they're losing and tired.</div>
        ) : (
          <div>
            {market.slice(0, 8).map((o, i) => {
              const t = G.teams[o.teamId];
              const afford = o.price <= (gm.cash || 0);

                <div key={i} className="flex flex-wrap items-center gap-2 px-3 py-2 border-b border-[#16223a] last:border-0 text-sm">
