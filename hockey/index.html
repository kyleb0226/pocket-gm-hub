    if (rnd(G) < retirementChance(G, p)) {
      if (p.teamId === G.userTeam) news(G, `${fullName(p)} retires at ${p.age}.`, "info");
      // A long server who was genuinely good gets his number hung up by the club
      // he gave the most seasons to.
      const byClub = {};
      (p.career || []).forEach((c) => { if (c.teamId != null) byClub[c.teamId] = (byClub[c.teamId] || 0) + 1; });
      const home = Object.keys(byClub).sort((a, b) => byClub[b] - byClub[a])[0];
      const careerPts = (p.career || []).reduce((s, c) => s + (c.g || 0) + (c.a || 0), 0);
      const careerGp = (p.career || []).reduce((s, c) => s + (c.gp || 0), 0);
      // A rate, not a total — otherwise a short-season league never honours
      // anybody and an 82-game one honours half the roster.
      const ppg = careerGp ? careerPts / careerGp : 0;
      if (home != null && byClub[home] >= 4 && (ppg >= 0.65 || p.trophies.length >= 1)) {
        const t = G.teams[+home];
        t.honours = t.honours || [];
        // The number goes up to the rafters with him, and comes out of circulation.
    t.honours.push({ pid: p.id, name: fullName(p), pos: p.pos, num: sweaterOf(p),
      seasons: byClub[home], pts: careerPts, year: G.year });
        news(G, `The ${G.teams[+home].name} will raise ${fullName(p)}\u2019s number to the rafters — ${byClub[home]} seasons, ${careerPts} points.`, "good");
      }
      p.teamId = null; p.retired = true; p.retiredYear = G.year;
      const i = G.freeAgents.indexOf(p.id); if (i >= 0) G.freeAgents.splice(i, 1);
      return;
    }
    if (p.contract.yrs <= 0) {
      // The club that has him gets first refusal, exactly as it does in life.
      // The user makes his own call — his expiring players reach the market and
      // he can re-sign them there, or extend them before they ever get that far.
      // Your own expiring players are yours to re-sign — unless you've asked
      // the club to run itself, in which case it makes the same call the other
      // thirty-one clubs make.
      if (aiRuns(G, p.teamId)) {
        const offer = aiExtensionOffer(G, p);
        if (offer && rnd(G) < offer.want) {
          p.contract = { amt: offer.ask, yrs: offer.yrs };
          applyBonusTerms(G, p, offer.ask, aiBonusTerms(G, p, offer.yrs));
          p.ntc = eligibleForNtc(p) && offer.yrs >= 3 && rnd(G) < 0.55;
          p.ntcWaived = false;
          return;
        }
      }
      p.teamId = null; p.farm = false;
      if (!G.freeAgents.includes(p.id)) G.freeAgents.push(p.id);
    }
  });
  G.teams.forEach((t) => { t.lines = null; });

  // Every club keeps its own season-by-season record, which is what a franchise
  // history page is made of.
  const champ2 = G.playoffs && G.playoffs.champion;
  const madeIt = (id) => G.playoffs && G.playoffs.rounds[0].some((s) => s.hi === id || s.lo === id);
  const roundsWon = (id) => (G.playoffs ? G.playoffs.rounds.filter((rd) => rd.some((s) => s.winner === id)).length : 0);
  G.teams.forEach((t) => {
    t.seasons = t.seasons || [];
    t.seasons.push({
      year: G.year, w: t.w, l: t.l, otl: t.otl, pts: t.pts, gf: t.gf, ga: t.ga,
      playoffs: madeIt(t.id), rounds: roundsWon(t.id), cup: champ2 === t.id,
    });
    t.honours = t.honours || [];
  });
  // The manager's own row, written from the same numbers as the club's.
  recordGmSeason(G);
  /* And he gets paid, which is what makes the other half of the career
     possible. The salary first, then his share of what the club cleared —
     `t.seasons` has just been written above, so `clubProfit` reads the year
     that actually finished rather than the one before it. */
  payGm(G);
  payDividends(G);
  /* A contract that has run out is renegotiated on what you're worth NOW —
     which is the whole point of a legacy. Offered rather than imposed: it sits
     in `G.gmOffer` until you accept it. */
  if (depthOn(G, "ownership")) {
    const gm = gmState(G);
    if (!gm.contract || gm.contract.yrs <= 0) {
      G.gmOffer = { teamId: G.userTeam, salary: gmSalaryFor(G, G.userTeam),
        yrs: clamp(2 + Math.floor(gmLegacy(G) / 40), 2, 5), year: G.year };
      news(G, `The ${G.teams[G.userTeam].name} have offered you a new deal — $${G.gmOffer.salary}M a year.`, "good");
    }
  }

  // Retained salary burns down with the contract it came from; waivers and
  // waived no-trade clauses don't carry over.
  G.retained = (G.retained || []).map((r) => ({ ...r, yrs: r.yrs - 1 })).filter((r) => r.yrs > 0);
  G.waivers = [];
  playersOf(G).forEach((p) => {
    p.ntcWaived = false;
    if (p.farmSeason) {
      p.farmCareer = (p.farmCareer || []).concat([{ year: G.year, ...p.farmSeason }]);
      p.farmSeason = null;
    }
  });

  /* Attrition. Seven rounds is 224 prospects a year and most late picks never
     become anything — without this they sit on farm rosters forever and the
     save grows by a thousand dead players a decade. A prospect who is old
     enough to have shown something and hasn't is released outright. */
  playersOf(G).forEach((p) => {
    if (p.retired) return;
    const nothingToShow = !(p.career || []).length && !(p.trophies || []).length && !(p.rings || []).length;
    if (!nothingToShow) return;
    // A prospect old enough to have shown something who hasn't.
    const stalled = p.farm && p.teamId != null && p.age >= 23 && p.ovr < 49 && p.pot < 57;
    /* Career farm filler. The pool cap only ever reached players nobody had
       signed, so once clubs started re-signing their own, depth bodies could
       stay under contract forever and never be pruned — a couple of hundred
       extra dead records a decade. A 26-year-old on a farm roster who has never
       played an NHL game and isn't good enough to is done. */
    const filler = p.farm && p.teamId != null && p.age >= 26 && p.ovr < 50;
    // And the bigger leak: an entry-level deal expires, nobody signs him, and
    // he sits in the free-agent pool forever. Most of a seven-round class ends
    // up here, which is a thousand dead records a decade.
    const unwanted = p.teamId == null && p.age >= 22 && p.ovr < 53;
    if (!stalled && !unwanted && !filler) return;
    if (stalled && p.teamId === G.userTeam && p.draft && p.draft.round <= 2) {
      news(G, `${fullName(p)} never developed and has been released.`, "bad");
    }
    const fi = G.freeAgents.indexOf(p.id);
    if (fi >= 0) G.freeAgents.splice(fi, 1);
    delete G.players[p.id];
  });

  /* And a hard cap on the pool, because thresholds alone can't hold it. Seven
     rounds puts 224 players a year into a league that only loses ~50 to
     retirement, so the free-agent list grows without bound whatever the quality
     bar. Everyone who can't get a contract eventually leaves the sport; here
     the ones with nothing on their record leave first. */
  /* Neither limit was enforced — nothing stopped a club stockpiling prospects
     it would never dress, and nothing counted the dressed side at all. A club
     now keeps its best twelve on the farm, its best twenty-three above it, and
     lets the rest go to the market like anyone else. */
  enforceRosterLimits(G);

  capFreeAgentPool(G);

  runHallOfFame(G);
  // Move picks a club has no room for BEFORE the order is drawn, so the draft
  // it walks into is one it can actually roster.
  G.teams.forEach((t) => deferPicksIfFull(G, t.id));
  buildDraftClass(G);
  return G;
}

/* Nobody should start a season unable to ice a legal lineup. After free agency
   has run its course, any club still short is topped up with depth bodies. */
/* What a club must be able to dress. Shared, because `enforceRosterLimits`
   sends surplus players down and `fillRosters` calls them back up — if the two
   disagreed about the minimums they would fight each other every rollover, and
   the club would start the season a goaltender short. */
/* What a club has to carry, and it has to ADD UP TO THE LINEUP. This asked for
   ten forwards when four lines need twelve, so a club at the legal minimum
   could only ice three and a third lines and the rest was borrowed from
   whoever was left. Four of each is twenty in total, which is exactly
   `ROSTER_MIN` — the two numbers now describe the same team. */
const DRESS_MIN = { G: 2, D: 6, C: 4, LW: 4, RW: 4 };
const ROSTER_MIN = 20;   // bodies a club has to have dressed

function fillRosters(G) {
  const need = DRESS_MIN;
  G.teams.forEach((t) => {
    // The minimums are for the DRESSED roster, not the organisation. Counting
    // the farm here once left clubs with their second goalie stuck in the minors
    // and nobody to back up the starter.
    Object.entries(need).forEach(([pos, n]) => {
      const atPos = () => rosterOf(G, t.id).filter((p) => p.pos === pos).length;
      // Recall from the farm before signing anyone off the street.
      rosterOf(G, t.id, true).filter((p) => p.farm && p.pos === pos)
        .sort((a, b) => b.ovr - a.ovr)
        .forEach((p) => { if (atPos() < n) p.farm = false; });
      while (atPos() < n) {
        const p = genPlayer(G, pos, 40, ri(G, 20, 27));
        p.teamId = t.id;
        p.contract = { amt: MIN_SALARY, yrs: ri(G, 1, 2) };
        G.players[p.id] = p;
      }
    });
    // Recall from the farm first, and only then sign bodies off the street.
    const short = ROSTER_MIN - rosterOf(G, t.id).length;
    if (short > 0) {
      rosterOf(G, t.id, true).filter((p) => p.farm).sort((a, b) => b.ovr - a.ovr)
        .slice(0, short).forEach((p) => { p.farm = false; });
    }
    let guard = 0;
    while (rosterOf(G, t.id).length < ROSTER_MIN && guard++ < 12) {
      const p = genPlayer(G, pick(G, ["C", "LW", "RW", "D"]), 40, ri(G, 20, 27));
      p.teamId = t.id;
      p.contract = { amt: MIN_SALARY, yrs: 1 };
      G.players[p.id] = p;
    }
    t.lines = null;
  });
  return G;
}

/* --------------------------------- draft ---------------------------------- */

/* ---------------------------------- the draft -----------------------------
 * Seven rounds, and a board you have to form an opinion about. Every prospect
 * carries FOG: what you see is his true rating pushed around by a bias you
 * can't observe, and the only way to shrink it is to spend scouting on him.
 * The AI drafts off its own noisy read, so the board is genuinely contestable
 * rather than a ranked list everyone agrees on.
 * ------------------------------------------------------------------------- */

/* THREE ROUNDS, not seven. Seven put 224 players a year into a league that
 * loses nowhere near that many, which is the root of almost everything the
 * ten-season audit turned up: the save grew to 4.94 MB by year ten (past what
 * localStorage will hold), the average age fell from 26.0 to 22.4, players over
 * 32 went from 126 to seven, and orgs jammed so hard that `enforceRosterLimits`
 * had to release solid cheap veterans to make room for 42-rated draftees.
 * Ninety-six a year is a pipeline the league can actually absorb. */
const DRAFT_ROUNDS = 3;
const SCOUT_POINTS = 14;      // scouting visits per offseason
const FA_POOL_MAX = 150;      // players who can't get a contract leave the sport
const FA_POOL_HARD = 1.6;     // past this multiple of it, the 200-game protection is spent
const FA_MARKET_FLOOR = 45;  // players clubs leave on the market, so there is always one
const FOG_MAX_SWING = 13;     // how far an unscouted read can be off

const JUNIOR = ["major junior", "college", "European elite", "national program", "prep school"];
const STYLES = {
  C: ["two-way pivot", "playmaker", "faceoff specialist", "power forward"],
  LW: ["sniper", "grinder", "puck hound", "net-front presence"],
  RW: ["sniper", "rush threat", "agitator", "finisher"],
  D: ["shutdown", "puck mover", "offensive defenceman", "stay-at-home", "physical"],
  G: ["butterfly", "hybrid", "athletic scrambler", "positional"],
};

// The reading you get on a prospect, not the truth. Deterministic per player so
// it doesn't shimmer between renders — only scouting moves it.
function scoutedOvr(p) {
  const f = p.scout ? p.scout.fog : 0;
  return Math.round(clamp(p.ovr + (p.scout ? p.scout.bias : 0) * f * FOG_MAX_SWING, 20, 99));
}
function scoutedPot(p) {
  const f = p.scout ? p.scout.fog : 0;
  return Math.round(clamp(p.pot + (p.scout ? p.scout.bias2 : 0) * f * FOG_MAX_SWING * 1.3,
    scoutedOvr(p), 99));
}
const scoutBand = (p) => Math.round((p.scout ? p.scout.fog : 0) * FOG_MAX_SWING);
const scoutLabel = (p) => {
  const f = p.scout ? p.scout.fog : 0;
  return f > 0.75 ? "unseen" : f > 0.45 ? "one viewing" : f > 0.2 ? "well scouted" : "known quantity";
};
function scoutProspect(G, pid) {
  const p = G.players[pid];
  if (!p || !p.scout) return { ok: false, why: "not a prospect" };
  if ((G.scoutPoints || 0) <= 0) return { ok: false, why: "no scouting left this offseason" };
  if (p.scout.fog <= 0.06) return { ok: false, why: "you already know him" };
  G.scoutPoints--;
  p.scout.fog = Math.max(0.05, p.scout.fog * 0.45);
  return { ok: true, fog: p.scout.fog };
}
/* ---------------------------- area scouting -------------------------------
 * Scouting was one visit, one player. A club's scouting department does not
 * work that way: you send somebody to a region or to watch goaltenders, and you
 * come back knowing a bit more about all of them.
 *
 * A sweep costs `AREA_SCOUT_COST` visits and cuts fog on everyone matching, but
 * by much less per player than a personal viewing does — breadth or depth, and
 * that trade is the decision. Off by default, in which case only the
 * one-at-a-time path exists.
 * ------------------------------------------------------------------------- */
const AREA_SCOUT_COST = 3;
const AREA_SCOUT_CUT = 0.82;   // vs 0.45 for a personal viewing

/* Your head scout. Derived like the coaching staff, hired from the same market,
   and he is the reason a sweep is worth different amounts at different clubs —
   a good one comes back knowing more. Only consulted when area scouting is on,
   so the one-at-a-time path is untouched. */
function scoutOf(G, t) {
  const hired = t.staffHired && t.staffHired.scout;
  if (hired) return hired;
  const seed = t.id * 101 + 557;
  return { name: derivedName(seed), rating: derivedRating(seed, 46 + (t.mkt || 3) * 2) };
}
function scoutArea(G, kind, value) {
  if (!depthOn(G, "areaScouting")) return { ok: false, why: "area scouting is switched off" };
  if ((G.scoutPoints || 0) < AREA_SCOUT_COST)
    return { ok: false, why: `a sweep costs ${AREA_SCOUT_COST} visits` };
  const hit = (G.draftClass || []).map((id) => G.players[id]).filter((p) =>
    p && p.scout && p.scout.fog > 0.06 && (kind === "junior" ? p.junior === value : p.pos === value));
  if (!hit.length) return { ok: false, why: "nobody left there to watch" };
  G.scoutPoints -= AREA_SCOUT_COST;
  /* A better scout cuts more fog per sweep. At 55 it is the plain rate; a great
     one gets close to what a personal viewing achieves, a poor one barely
     more than a rumour. */
  const s = scoutOf(G, G.teams[G.userTeam]).rating;
  const cut = clamp(AREA_SCOUT_CUT - (s - 55) * 0.004, 0.55, 0.95);
  hit.forEach((p) => { p.scout.fog = Math.max(0.05, p.scout.fog * cut); });
  return { ok: true, seen: hit.length, scout: s };
}

/* ------------------------------- bust risk --------------------------------
 * `scout.fog` is how well you have SEEN him. Volatility is how wide the range
 * of what he might become actually is — two genuinely different kinds of not
 * knowing, and only the first existed. A safe pick and a boom-or-bust pick can
 * be equally well scouted and are not the same bet.
 *
 * Derived from the player id, so it costs nothing, never drifts, and an
 * existing prospect has one the moment the rule goes on. It feeds `progress`
 * as a multiplier on the year-to-year variance — a volatile player's
 * development swings harder in both directions without changing his mean.
 * ------------------------------------------------------------------------- */
function volatilityOf(G, p) {
  if (!depthOn(G, "prospectRisk") || !p) return 1;
  // 0.55 (a metronome) to 1.75 (anybody's guess), centred near 1.
  return 0.55 + hashUnit(p.id * 2654435761 + 17) * 1.2;
}
function riskLabel(v) {
  return v >= 1.45 ? { t: "volatile", c: "text-rose-300" }
    : v >= 1.15 ? { t: "some risk", c: "text-amber-300" }
    : v >= 0.85 ? { t: "steady", c: "text-slate-400" }
    : { t: "safe", c: "text-emerald-300" };
}

// What a club thinks he's worth: potential first, but only what it can see.
const draftValue = (p) => scoutedPot(p) * 0.68 + scoutedOvr(p) * 0.32;

/* Tiers, the way a scout talks about a board — "the top four, then a gap". A
   ranked list hides exactly that: the difference between the 4th and 5th names
   can be enormous or nothing, and the numbers beside them look the same either
   way. Cut off YOUR read, so a club that has scouted badly draws its lines in
   the wrong places, which is the whole point of scouting at all. */
const DRAFT_TIER_LABEL = ["—", "fringe", "depth", "middle", "top", "elite"];
const DRAFT_TIER_TONE = ["text-slate-600", "text-slate-500", "text-slate-400",
  "text-sky-300", "text-emerald-300", "text-amber-300"];
function draftTier(G, p) {
  const v = draftValue(p);
  return v >= 88 ? 5 : v >= 80 ? 4 : v >= 72 ? 3 : v >= 64 ? 2 : v >= 56 ? 1 : 0;
}

/* --------------------------- clubs ringing you up -------------------------
 * Draft trading was entirely user-initiated: you could call anybody, and nobody
 * ever called you. That removes the best moment the draft has — a club that has
 * fallen for somebody offering you the earth to jump in front of the room and
 * take him.
 *
 * COMPUTED ON DEMAND, not stored and not random. Every input is already on the
 * board, and a stored offer would go stale the instant a pick was made; the
 * per-club preference that makes thirty-two clubs disagree comes from
 * `hashUnit` on the club id, so the same board always produces the same offers
 * and a render can't shuffle them.
 * ------------------------------------------------------------------------- */
const TRADE_UP_HORIZON = 24;   // slots ahead a club will look
const TRADE_UP_PREMIUM = 1.18; // what moving up costs over the raw pick value

function draftUpOffers(G) {
  if (!depthOn(G, "draftTradeUp")) return [];
  if (!G.draftClass || !G.draftClass.length || G.draftYear !== G.year) return [];
  const total = draftPicksTotal(G);
  // The next pick that is actually yours.
  let mine = -1;
  for (let i = G.draftPick; i < total; i++) if (pickOwner(G, i) === G.userTeam) { mine = i; break; }
  if (mine < 0) return [];
  const myPk = (G.picks || []).find((pk) => pk.year === G.year
    && pk.round === Math.floor(mine / G.teams.length) + 1
    && pk.orig === G.draftOrder[mine % G.teams.length]);
  if (!myPk) return [];

  // The board as each club reads it — same values, a different eye.
  const board = G.draftClass.map((id) => G.players[id]).filter(Boolean)
    .sort((a, b) => draftValue(b) - draftValue(a));
  if (!board.length) return [];

  const offers = [];
  for (let i = mine + 1; i < Math.min(total, mine + TRADE_UP_HORIZON); i++) {
    const club = pickOwner(G, i);
    if (club === G.userTeam) continue;
    /* Their man: near the top of the board, nudged by a taste of their own so
       thirty-two clubs don't all covet the same player. */
    const lean = Math.floor(hashUnit(club * 7919 + G.draftPick) * 3);
    const want = board[Math.min(lean, board.length - 1)];
    if (!want) continue;
    // He has to be somebody they will genuinely miss — expected gone well
    // before their own turn, or there is nothing to trade up for.
    const expectedAt = G.draftPick + board.indexOf(want);
    if (expectedAt >= i - 2) continue;

    const theirPk = (G.picks || []).find((pk) => pk.year === G.year
      && pk.round === Math.floor(i / G.teams.length) + 1
      && pk.orig === G.draftOrder[i % G.teams.length] && pk.owner === club);
    if (!theirPk) continue;

    // What they have to make up, and what they can add to make it up with.
    const gap = pickValue(G, myPk) * TRADE_UP_PREMIUM - pickValue(G, theirPk);
    const extras = [];
    let made = 0;
    tradablePicks(G, club)
      .filter((pk) => !(pk.year === theirPk.year && pk.round === theirPk.round && pk.orig === theirPk.orig))
      .sort((a, b) => pickValue(G, a) - pickValue(G, b))
      .forEach((pk) => {
        if (made >= gap) return;
        extras.push(pk); made += pickValue(G, pk);
      });
    if (made < gap) continue;   // they can't reach it, so they don't call
    offers.push({ from: club, want: want.id, myPick: myPk, at: mine + 1,
      theirPick: theirPk, theirAt: i + 1, extras });
  }
  // Best offer first — the one that gives up the most to get up.
  return offers.sort((a, b) =>
    (pickValue(G, b.theirPick) + b.extras.reduce((s, p) => s + pickValue(G, p), 0))
    - (pickValue(G, a.theirPick) + a.extras.reduce((s, p) => s + pickValue(G, p), 0))).slice(0, 4);
}

/* Taking one. It routes through `doTrade` like any other deal, so the cap, the
 * roster limits and the pick records all behave exactly as they do elsewhere.
 *
 * THE OFFERING CLUB IS SIDE A. `evalTrade` asks whether side A has given side B
 * enough, and applies the AI's asking-price margin when side A is the user —
 * which is right for a deal you propose and exactly wrong for one proposed to
 * you. Passing the user as side A had the engine rejecting offers for being too
 * generous to him: a pick worth 9 for a package worth 12.8, refused on the
 * grounds that they wanted more back. */
function acceptDraftUp(G, offer) {
  if (!offer) return { ok: false, why: "no offer" };
  return doTrade(G, offer.from, [], [offer.theirPick].concat(offer.extras || []),
    G.userTeam, [], [offer.myPick]);
}

/* Eligible players BEYOND the number of picks. The class has always been
   exactly as big as the draft is long, which means every prospect is taken and
   "undrafted" can't happen — a real draft has far more eligible players than
   slots, and the ones nobody calls are the whole point of the rule. Generated
   only when it's on, so a classic league draws exactly the randomness it
   always did and every calibrated seed still replays. */
/* The shape of a draft class. A prospect is raw and the interesting number is
   how far he might travel, not where he starts. */
/* What a pick is expected to become, for grading a class after the fact. */
const DRAFT_PAR_TOP = 74;      // a first overall has to become a real NHL player
const DRAFT_PAR_LAST = 44;     // a last pick, roughly a fringe professional

const DRAFT_TIER_BASE = 31;    // roughly where the last pick in the draft lands
const DRAFT_TIER_SPREAD = 15;  // and how much better the first one is
const DRAFT_OVR_CAP = 56;      // nobody arrives an NHL player at eighteen
const DRAFT_GAP_LOW = 13;      // ceiling above current rating, late in the draft
const DRAFT_GAP_SPREAD = 27;   // and how much more of it the top of the board has

const UNDRAFTED_POOL = 24;
function buildDraftClass(G) {
  G.draftClass = [];
  const picks = DRAFT_ROUNDS * G.teams.length;
  const total = picks + (depthOn(G, "undraftedFA") ? UNDRAFTED_POOL : 0);
  for (let i = 0; i < total; i++) {
    /* Both curves run off `picks`, not `total`, so the men who would have been
       in the class anyway are generated exactly as they always were and the
       extras are simply tacked on below them — turning the rule on deepens the
       bottom of the board without reshaping the top of it. */
    /* RAW, WITH A LONG WAY TO GO. Top picks were arriving at 61–66 overall at
       eighteen — nearly NHL players already, which left the farm nothing to do
       and put 80 of every 96 draftees straight into the league. A first
       overall now lands near the low fifties and a late third-rounder in the
       low thirties, and what separates them is the CEILING rather than the
       rating: the gap runs about 40 at the top of the board and 14 at the
       bottom. `DRAFT_OVR_CAP` is the hard bit — an eighteen-year-old is not a
       finished hockey player however the dice land. */
    const slot = (picks - i) / picks;                  // 1 at the top, ~0 at the end
    const p = genPlayer(G, pick(G, ["C", "C", "LW", "RW", "D", "D", "G"]),
      DRAFT_TIER_BASE + slot * DRAFT_TIER_SPREAD, 18);
    p.r && Object.keys(p.r).forEach((k) => { p.r[k] = Math.min(p.r[k], DRAFT_OVR_CAP + 6); });

/* A no-trade clause is the price of signing a star in his prime. It can be

/* ------------------------------ buying it out ------------------------------
 * `terminateContract` handles fringe money and waivers handle players somebody
 * else might want, which left the case that actually hurts untouched: a big
 * contract with years to run that nobody will take and you can't cut. There was
 * no way out of a bad deal at all.
 *

 * term — the real trade, and the reason a buyout is a decision rather than an

      ? "he's cheap enough to simply cut" : "he isn't yours to buy out" };

  const c = buyoutCost(G, pid);

  G.retained.push({ pid, from, amt: c.perYear, yrs: c.yrs, dead: true, buyout: true });
  releaseToPool(G, p);

function evalTrade(G, aId, aPlayers, aPicks, bId, bPlayers, bPicks, opts) {
  opts = opts || {};
  const R = rules(G);
  const aOut = aPlayers.map((id) => G.players[id]);
  const bOut = bPlayers.map((id) => G.players[id]);
  if (aOut.some((p) => !p || p.teamId !== aId) || bOut.some((p) => !p || p.teamId !== bId))
    return { ok: false, why: "a player isn't on that roster" };
  if (!tradesOpen(G)) return { ok: false, why: G.phase === "playoffs" ? "the roster is frozen for the playoffs" : "the trade deadline has passed" };
  const locked = aOut.concat(bOut).find((p) => hasNtc(p));
  if (locked) return { ok: false, why: `${fullName(locked)} has a no-trade clause` };

  const retain = opts.retain || {};
  const retainAmt = (p, from) => {
    const pct = clamp(retain[p.id] || 0, 0, R.retainedSalary ? RETAIN_MAX_PCT : 0);
    return round1(p.contract.amt * pct);
  };
  const aRetain = aOut.reduce((s, p) => s + retainAmt(p, aId), 0);
  const bRetain = bOut.reduce((s, p) => s + retainAmt(p, bId), 0);
  if (aRetain > 0 && retainedTraded(G, aId).length + aOut.filter((p) => retain[p.id]).length > MAX_RETAINED)
    return { ok: false, why: `${G.teams[aId].abbr} can only retain ${MAX_RETAINED} contracts` };
  if (bRetain > 0 && retainedTraded(G, bId).length + bOut.filter((p) => retain[p.id]).length > MAX_RETAINED)
    return { ok: false, why: `${G.teams[bId].abbr} can only retain ${MAX_RETAINED} contracts` };

  const aSalOut = aOut.reduce((s, p) => s + effectiveCap(G, p), 0) - aRetain;
  const bSalOut = bOut.reduce((s, p) => s + effectiveCap(G, p), 0) - bRetain;
  if (R.hardCap) {
    if (capHit(G, aId) - aSalOut + bSalOut > R.capAmount) return { ok: false, why: `${G.teams[aId].abbr} would be over the cap` };

    why: accepted ? "accepted" : "they want more back" };
}
function doTrade(G, aId, aPlayers, aPicks, bId, bPlayers, bPicks, opts) {

  if (!ev.ok) return ev;
  const retain = opts.retain || {};
  G.retained = G.retained || [];
  const bank = (p, from) => {
    const pct = clamp(retain[p.id] || 0, 0, rules(G).retainedSalary ? RETAIN_MAX_PCT : 0);
    if (pct <= 0) return;
    G.retained.push({ pid: p.id, from, amt: round1(p.contract.amt * pct), yrs: p.contract.yrs });
  };
  aPlayers.forEach((id) => { bank(G.players[id], aId); G.players[id].teamId = bId; G.players[id].farm = false; });
  bPlayers.forEach((id) => { bank(G.players[id], bId); G.players[id].teamId = aId; G.players[id].farm = false; });
  aPicks.forEach((pk) => { const r = G.picks.find((x) => x.year === pk.year && x.round === pk.round && x.orig === pk.orig); if (r) r.owner = bId; });
  bPicks.forEach((pk) => { const r = G.picks.find((x) => x.year === pk.year && x.round === pk.round && x.orig === pk.orig); if (r) r.owner = aId; });

  news(G, `Trade with ${G.teams[bId].name}: out ${aPlayers.length} / in ${bPlayers.length}.`, "info");

/* ------------------------------ the third club -----------------------------
 * The deal that dies at the cap. You have the pieces, they have the piece, and
 * neither of you can fit the contract — so it doesn't happen, and the best
 * player available at the deadline goes nowhere.
 *
 * In real hockey somebody else eats the money. A club going nowhere with room
 * on its books takes a share of the salary and charges a pick for it, which is
 * the only reason a bad team's cap space is an asset at all.
 *
 * It reuses every part of the machinery that already exists: the broker's share
 * is an ordinary `G.retained` row stamped with HIS club id, so `effectiveCap`
 * discounts the contract and `capHit` charges him for it without a line of new
 * accounting. The row goes on the books BEFORE the trade is evaluated — which
 * is the whole point, since the deal only passes the cap because of it — and is
 * taken straight back off if the two clubs still can't agree.
 * ------------------------------------------------------------------------- */
const BROKER_FEE_RATE = 0.9;    // trade-value points charged per $M-year eaten
const BROKER_MIN_SPACE = 2;     // a club with no room is no use to anybody
/* What eating this costs, and therefore what the third club charges. Money is
   worth more the longer it's owed, which is why a rental is brokered cheaply
   and four years of somebody's mistake is not. */
function brokerFee(G, pid, pct) {
  const p = G.players[pid];
  if (!p) return 0;
  const amt = round1(p.contract.amt * clamp(pct, 0, RETAIN_MAX_PCT));
  return round1(amt * Math.max(1, p.contract.yrs) * BROKER_FEE_RATE);

/* Who could do it. Anyone with the room and a free retention slot who isn't

   the further from the playoffs the cheaper he is to hire. */
function brokerCandidates(G, pid, pct, involved) {
  if (!rules(G).retainedSalary) return [];
  const p = G.players[pid];
  if (!p) return [];
  const out = [];
  const order = standings(G);
  const need = round1(p.contract.amt * clamp(pct, 0, RETAIN_MAX_PCT));
  G.teams.forEach((t) => {
    if ((involved || []).includes(t.id)) return;
    if (retainedTraded(G, t.id).length >= MAX_RETAINED) return;
    const space = capSpace(G, t.id);
    if (space < Math.max(BROKER_MIN_SPACE, need)) return;
    /* 0 at the top of the table, 1 at the bottom. A club out of it wants the
       pick; a club chasing one wants its room. */
    const pos = order.findIndex((x) => x.id === t.id);
    const outOfIt = clamp(pos / Math.max(1, G.teams.length - 1), 0, 1);
    out.push({ teamId: t.id, space, eats: need,

  });
  return out.sort((a, b) => a.fee - b.fee);
}
/* The deal itself. `broker` is `{teamId, pid, pct, picks}` — who helps, whose
   contract, how much of it, and what he's paid with. */
function brokerTrade(G, aId, aPlayers, aPicks, bId, bPlayers, bPicks, broker, opts) {
  if (!broker || broker.teamId == null) return { ok: false, why: "no third club" };
  if (!rules(G).retainedSalary) return { ok: false, why: "retained salary is switched off" };
  const { teamId: cId, pid, pct } = broker;
  const p = G.players[pid];
  if (!p) return { ok: false, why: "no such player" };
  if (p.teamId !== aId && p.teamId !== bId) return { ok: false, why: "he isn't in this trade" };
  if (cId === aId || cId === bId) return { ok: false, why: "the third club has to be a third club" };
  if (retainedTraded(G, cId).length >= MAX_RETAINED)
    return { ok: false, why: `${G.teams[cId].abbr} already holds ${MAX_RETAINED} retained contracts` };
  const share = clamp(pct || 0, 0, RETAIN_MAX_PCT);
  if (share <= 0) return { ok: false, why: "there's nothing for him to take on" };
  const amt = round1(p.contract.amt * share);
  if (capSpace(G, cId) < amt) return { ok: false, why: `${G.teams[cId].abbr} hasn't the room` };

  /* What he's paid. The fee is quoted in trade-value points and settled in
     picks, which is how these are settled in life. */
  const fee = brokerFee(G, pid, share);
  const paid = (broker.picks || []);
  const paidVal = paid.reduce((s, pk) => s + pickValue(G, pk), 0);
  const ownerOf = (pk) => {
    const r = (G.picks || []).find((x) => x.year === pk.year && x.round === pk.round && x.orig === pk.orig);
    return r ? r.owner : null;
  };
  const payer = paid.length === 0 ? null
    : paid.every((pk) => ownerOf(pk) === aId) ? aId
    : paid.every((pk) => ownerOf(pk) === bId) ? bId : null;
  if (paid.length && payer == null) return { ok: false, why: "the fee has to come from one club" };

  G.retained = G.retained || [];

  G.retained.push(row);

  if (!ev.ok) { G.retained.splice(G.retained.indexOf(row), 1); return ev; }
  paid.forEach((pk) => {
    const r = G.picks.find((x) => x.year === pk.year && x.round === pk.round && x.orig === pk.orig);

  const done = doTrade(G, aId, aPlayers, aPicks, bId, bPlayers, bPicks, opts);
  if (!done.ok) { G.retained.splice(G.retained.indexOf(row), 1); return done; }
  G.teams[cId].lines = null;
  news(G, `${G.teams[cId].name} brokered it — $${amt}M of ${fullName(p)}'s deal stays with them.`, "info");
  return { ...done, broker: { teamId: cId, amt, fee: round1(fee), paid: round1(paidVal) } };
}

/* -------------------------------- the market -------------------------------
 * Two things a GM does that the game only let the AI do: listen to offers, and
 * trade on draft day.
 * ------------------------------------------------------------------------- */

/* Players you've made available. Listing a player invites offers rather than
   forcing a sale — the AI still has to want him. */
/* Picks you can actually move.
 *
 * THIS YEAR'S PICKS COUNT. They used to be tradable only once the draft was
 * already under way, which quietly removed the single most-traded asset in the
 * sport from the deadline: "our second in June" is what a rental costs. The
 * draft for year Y happens at the END of year Y — until the class is on the
 * clock, every one of that year's picks is a future asset like any other.
 *
 * Once the draft IS running, a pick survives only until its own slot comes up;
 * after that there is nothing left to trade. Trading up or down on the clock is
 * where draft-day drama lives, so that window stays open. */
function tradablePicks(G, teamId) {
  const out = [];
  /* Has THIS year's order been drawn? `G.draftYear` is stamped when the class
     is built, and it has to be checked rather than just the presence of
     `G.draftOrder` — the order from last June survives the rollover, and
     reading it as this year's would price every pick off a stale lottery. */
  const drawn = G.draftYear === G.year && G.draftOrder && G.draftOrder.length;
  (G.picks || []).forEach((pk) => {
    if (pk.owner !== teamId || pk.year < G.year) return;
    if (pk.year > G.year) { out.push(pk); return; }
    // This year's: still ahead of us until the draft is actually on the clock.
    if (G.phase !== "offseason" || !drawn) { out.push(pk); return; }
    // Its slot in this year's order — gone once that pick has been made.
    const slot = G.draftOrder.indexOf(pk.orig) + (pk.round - 1) * G.teams.length;
    if (slot >= G.draftPick) out.push(pk);
  });
  return out.sort((a, b) => a.year - b.year || a.round - b.round
    || ((pickSlot(G, a) || 99) - (pickSlot(G, b) || 99)));
}

/* ------------------------------ pick protections ---------------------------
 * `G.picks` recorded an owner and an origin and nothing else, so every traded
 * pick was unconditional — you could not sell a first without risking the first
 * overall, which is why real clubs almost never do.
 *
 * A protection is a range the pick does NOT convey in. If it lands there the
 * original club keeps it and the obligation rolls to the next year, which is
 * the whole mechanism and the reason a protected pick is worth less.
 * ------------------------------------------------------------------------- */
const PROTECTIONS = [
  { k: "none", label: "Unprotected", blurb: "conveys wherever it lands", top: 0, value: 1 },
  { k: "lottery", label: "Lottery protected", blurb: "you keep it if it wins the lottery", top: 1, value: 0.92 },
  { k: "top5", label: "Top-5 protected", blurb: "you keep it in the top five", top: 5, value: 0.74 },
  { k: "top10", label: "Top-10 protected", blurb: "you keep it in the top ten", top: 10, value: 0.58 },

const protectionOf = (pk) => PROTECTIONS.find((x) => x.k === ((pk && pk.protect) || "none")) || PROTECTIONS[0];

/* Does it convey THIS year? Only meaningful once the order is drawn — before
   that the honest answer is "we don't know yet". */
function pickConveys(G, pk) {
  const prot = protectionOf(pk);
  if (!prot.top) return true;
  const slot = pickSlot(G, pk);
  if (slot == null) return true;
  return !(pk.round === 1 && slot <= prot.top);
}
/* Run when the order is known. A pick caught by its protection goes back to the
   club that owns it and the debt moves to next year's pick instead. */
function resolveProtections(G) {
  if (!depthOn(G, "pickProtection")) return G;
  (G.picks || []).forEach((pk) => {
    if (pk.year !== G.year || !pk.protect || pk.protect === "none") return;
    if (pk.owner === pk.orig) return;
    if (pickConveys(G, pk)) { pk.protect = null; return; }
    const to = pk.owner;
    pk.owner = pk.orig;                       // he keeps it
    pk.protect = null;
    // The obligation rolls: next year's pick of the same round goes instead.
    const next = (G.picks || []).find((x) => x.year === G.year + 1 && x.round === pk.round
      && x.orig === pk.orig && x.owner === pk.orig);
    if (next) { next.owner = to; next.rolled = true; }
    if (pk.orig === G.userTeam) news(G, `Your protected ${pk.round === 1 ? "first" : "pick"} stayed home — it rolls to ${G.year + 1}.`, "good");
    else if (to === G.userTeam) news(G, `${G.teams[pk.orig].abbr}'s pick was protected. You get next year's instead.`, "bad");
  });

}

/* Where a pick is likely to land. A round number alone doesn't distinguish the
   asset everyone wants from the one nobody does — a first from the worst club
   in the league and a first from the Cup holder are both "round 1", and being
   unable to tell them apart is what made trading picks feel vague.

 * Exact once the lottery has been drawn, PROJECTED off the current table before
 * that, and genuinely unknown for future years — which the UI says rather than
 * papering over with a number that would be a guess about a season nobody has
 * played. Returns a 1-based position within the round. */
function pickSlot(G, pk) {
  if (pk.year !== G.year) return null;
  if (G.draftYear === G.year && G.draftOrder && G.draftOrder.length) {
    const i = G.draftOrder.indexOf(pk.orig);
    return i < 0 ? null : i + 1;
  }
  // Before the lottery: worst record picks first, which is the order as it
  // stands tonight and moves with every result.
  const order = G.teams.slice().sort((a, b) => a.pts - b.pts || (a.gf - a.ga) - (b.gf - b.ga));
  const i = order.findIndex((t) => t.id === pk.orig);
  return i < 0 ? null : i + 1;
}

/* How a pick reads on a trade sheet: the year, the round, whose it originally
   was, and where it is expected to land. */
function pickLabel(G, pk, teamId) {
  const rd = pk.round === 1 ? "1st" : pk.round === 2 ? "2nd" : pk.round === 3 ? "3rd" : `${pk.round}th`;
  const from = pk.orig !== teamId && G.teams[pk.orig] ? ` (from ${G.teams[pk.orig].abbr})` : "";
  const slot = pickSlot(G, pk);
  const exact = !!(G.draftYear === G.year && G.draftOrder && G.draftOrder.length);
  /* The OVERALL number, not just the place in the round. "12th of the round" in
     a second round is pick 44, and the number everybody actually quotes is 44 —
     the draft board says it that way, so the trade screen should too. */
  const overall = slot == null ? null : (pk.round - 1) * G.teams.length + slot;
  return {
    text: `${pk.year} ${rd}${from}`,
    slot, overall,
    // A projection is a projection and is labelled as one.
    note: slot == null ? null
      : `${exact ? "" : "proj. "}${overall} overall`,
    // Roughly how good the asset is, for colour: an early pick is a real prize.
    tone: slot == null ? "text-slate-500"
      : slot <= 5 ? "text-emerald-300" : slot <= 15 ? "text-sky-300" : "text-slate-400",

}

/* Who's likely to be in the other net, and where he's soft. The information
   exists — goalieHole is permanent and the shot maps already draw it — but
   nothing surfaced it before the game it matters for. */
function nextOpponent(G) {
  if (G.phase !== "regular") return null;
  const day = G.schedule[G.day] || [];
  const fx = day.find((f) => f.home === G.userTeam || f.away === G.userTeam);
  if (!fx) return null;
  const oppId = fx.home === G.userTeam ? fx.away : fx.home;
  const lines = ensureLines(G, oppId);
  const starter = G.players[pickStarter(G, lines, restFor(G, oppId))];
  return {
    teamId: oppId,
    home: fx.home === G.userTeam,
    rivalry: isRivalry(G, G.userTeam, oppId),
    starter,
    hole: starter ? goalieHole(starter) : null,
    rest: restFor(G, oppId),
    form: (G.teams[oppId].l10 || []).slice(-5).join(""),
  };
}

/* A real scouting report reads what a goalie has ACTUALLY conceded, not a
   constant derived from his id. `goalieHole` is permanent and genuinely bends
   `pickCell`, but printing it directly meant the note said the same thing on
   day 1 as on day 82 no matter what happened on the ice — a label, not a
   report. This reads his per-cell record from `p.season.net`, which the engine
   already fills in for every goalie and nothing ever surfaced.
 *
 * The evidence CORRELATES with the hole rather than equalling it, which is the
 * point: you infer where he's soft from what he's given up, and early in the
 * season you genuinely don't know yet. `confidence` is how much of the read to
 * trust, so the UI can say "too early to tell" instead of inventing certainty. */
const REPORT_MIN_SHOTS = 12;    // per cell, before a rate means anything
const REPORT_TRUST_SA = 250;    // total shots faced for a confident read
/* What the whole league concedes in each of the nine cells this season — the

   stored: it's derived from data already in the save, and a stale copy would
   quietly skew every report. */
function leagueNetRates(G) {
  const tot = {};

 * the second to keep the first. Over a decade that shreds exactly the cheap,
 * established depth a roster is built on.

    let moved = false;

    // club has to be able to ice.

 * ------------------------------------------------------------------------- */

    skaters.forEach((p) => { if (rnd(G) < 0.06) farmLine(p).pim += 2; });
    const swing = gf - ga;
    skaters.slice(0, 12).forEach((p) => { if (rnd(G) < 0.5) farmLine(p).pm += swing > 0 ? 1 : swing < 0 ? -1 : 0; });
  });
  return G;
}

/* Every affiliate whose parent club plays today plays the mirrored fixture.
 *
 * The scorelines used to be thrown away the instant they'd moved the table,
 * which is why the farm read as a spreadsheet that ticked over rather than a
 * league: your affiliate could win eleven straight and the only trace was the
 * points column. Two things are kept now, and deliberately only two:
 *
 *  - `G.farmDay`, last night's scoreboard across the league. One day, replaced
 *    every day, so it costs the same in March as in October.
 *  - `t.farmLog`, a full season of results — FOR YOUR CLUB ONLY. Nobody ever
 *    opens Calgary's affiliate's game log, and thirty-two of these would cost
 *    thirty-two times as much as the one that gets read.
 * ------------------------------------------------------------------------- */
const FARM_LOG_MAX = 120;
function simFarmDay(G, day) {
  const games = [];
  (G.schedule[day] || []).forEach((fx) => {
    const res = simFarmGame(G, fx.home, fx.away);
    applyFarmGame(G, res);
    games.push({ h: res.home, a: res.away, hg: res.hg, ag: res.ag, ot: !!res.ot, so: !!res.so });
  });
  G.farmDay = { day, games };
  const mine = games.find((g) => g.h === G.userTeam || g.a === G.userTeam);
  if (mine) {
    const t = G.teams[G.userTeam];
    const home = mine.h === G.userTeam;
    t.farmLog = (t.farmLog || []).concat([{
      d: day, o: home ? mine.a : mine.h, home,
      gf: home ? mine.hg : mine.ag, ga: home ? mine.ag : mine.hg,
      ot: mine.ot, so: mine.so,
    }]).slice(-FARM_LOG_MAX);
  }
  return G;
}

/* What the affiliate has coming. The farm mirrors the parent schedule, so the
   fixture list already exists and costs nothing to store — it just has to be
   read from the other side. */
function farmFixtures(G, teamId, n) {
  const out = [];
  for (let d = G.day; d < G.schedule.length && out.length < (n || 5); d++) {
    (G.schedule[d] || []).forEach((fx) => {
      if (fx.home !== teamId && fx.away !== teamId) return;
      out.push({ d, opp: fx.home === teamId ? fx.away : fx.home, home: fx.home === teamId });
    });
  }
  return out;
}

function farmStandings(G, filterFn) {
  return G.teams.filter(filterFn || (() => true)).slice().sort((a, b) => {
    const x = farmRec(a), y = farmRec(b);
    return y.pts - x.pts || y.w - x.w || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf;
  });
}

/* The affiliates play for something too. Eight clubs, best-of-three, three
   rounds — enough to be a real trophy without a second postseason to sit
   through. It resolves in one go at the end of the regular season. */
const FARM_CUP_FIELD = 8;
function runFarmPlayoffs(G) {
  const field = farmStandings(G).filter((t) => farmRec(t).gp > 0).slice(0, FARM_CUP_FIELD);
  if (field.length < 2) return G;
  const rounds = [];
  let alive = field.map((t) => t.id);
  let guard = 0;
  while (alive.length > 1 && guard++ < 5) {
    const pairs = [];
    for (let i = 0; i < Math.floor(alive.length / 2); i++) pairs.push([alive[i], alive[alive.length - 1 - i]]);
    const survivors = [];
    pairs.forEach(([hi, lo]) => {
      let hw = 0, lw = 0, g = 0;
      while (hw < 2 && lw < 2 && g++ < 5) {
        const r = simFarmGame(G, g % 2 === 1 ? hi : lo, g % 2 === 1 ? lo : hi);
        const hiWon = (g % 2 === 1) === (r.hg > r.ag);
        if (hiWon) hw++; else lw++;
      }
      survivors.push(hw > lw ? hi : lo);
    });
    rounds.push(pairs.map(([hi, lo], i) => ({ hi, lo, winner: survivors[i] })));
    alive = survivors;
  }
  const champ = alive[0];
  G.farmCup = { year: G.year, champion: champ, rounds, field: field.map((t) => t.id) };
  /* The affiliate league had a table, a playoff and a trophy and no individual
     honours at all, so a prospect could lead it in scoring and nothing
     anywhere would say so. Names are stored alongside ids for the same reason
     the season leaders are: `pruneSave` forgets people. */
  const farmers = playersOf(G).filter((p) => p.farm && p.farmSeason && p.farmSeason.gp > 0);
  const top = (list, score) => {
    const best = list.slice().sort((a, b) => score(b) - score(a))[0];
    return best ? { pid: best.id, name: fullName(best), team: best.teamId, v: round1(score(best)) } : null;
  };
  const skaters = farmers.filter((p) => p.pos !== "G");
  const keepers = farmers.filter((p) => p.pos === "G" && p.farmSeason.sa >= 200);
  G.farmAwards = {
    year: G.year,
    scoring: top(skaters, (p) => (p.farmSeason.g || 0) + (p.farmSeason.a || 0)),
    goals: top(skaters, (p) => p.farmSeason.g || 0),
    goalie: top(keepers, (p) => (p.farmSeason.sv / Math.max(1, p.farmSeason.sa)) * 100),
  };
  const t = G.teams[champ];
  t.farmCups = (t.farmCups || 0) + 1;
  // The players who won it get it on their record, the same as a Cup ring.
  farmRoster(G, champ).forEach((p) => {
    p.farmTitles = (p.farmTitles || []).concat([G.year]);
  });
  if (champ === G.userTeam) news(G, `Your affiliate won the farm championship.`, "good");
  else news(G, `${t.city}'s affiliate won the farm championship.`, "info");
  return G;
}

/* ----------------------------- deadline trading ---------------------------
 * On deadline day the league sorts itself into buyers and sellers: clubs out of
 * the race move expiring veterans to contenders for picks.
 * ------------------------------------------------------------------------- */

/* Where the league stands as the deadline comes. Buyers, sellers, and the
   players actually available — which the engine already decides internally in
   `aiDeadlineMoves` and never showed anyone, so the deadline arrived as a line
   in the news feed rather than as a window you could work. */
const RENTAL_MIN_OVR = 62;
function deadlineBoard(G) {
  const table = standings(G);
  const cut = Math.floor(G.teams.length / 2);
  const buyers = new Set(table.slice(0, cut).map((t) => t.id));
  const isRental = (p) => p.contract.yrs <= 1 && p.age >= 27 && p.ovr >= RENTAL_MIN_OVR;
  /* What a contender would give up. The AI pays a first for a genuine top-line
     rental and a second for the rest, which is exactly the trade it makes in
     `aiDeadlineMoves` — so the price shown here is the price you'd actually
     face rather than a decorative estimate. */
  const priceOf = (p) => (p.ovr >= 72 ? 1 : 2);
  const rentals = [];
  G.teams.forEach((t) => {
    if (buyers.has(t.id)) return;
    rosterOf(G, t.id)
      // Your own rentals appear on the board too when the club runs itself —
      // this is a view of who's available, and yours are.
      .filter((p) => isRental(p) && (p.teamId !== G.userTeam || !!autoStyle(G)))
      .sort((a, b) => b.ovr - a.ovr)
      .slice(0, 2)
      .forEach((p) => rentals.push({ p, from: t.id, round: priceOf(p), blocked: hasNtc(p) }));
  });
  rentals.sort((a, b) => b.p.ovr - a.p.ovr);
  const mine = G.teams[G.userTeam];
  const myRank = table.findIndex((t) => t.id === G.userTeam) + 1;
  return {
    buyers: table.filter((t) => buyers.has(t.id)).map((t) => t.id),
    sellers: table.filter((t) => !buyers.has(t.id)).map((t) => t.id),
    rentals,
    // Which side of it you are on, which is the only question that matters.
    youBuy: buyers.has(G.userTeam),
    myRank,
    myRentals: rosterOf(G, G.userTeam).filter(isRental)
      .sort((a, b) => b.ovr - a.ovr)
      .map((p) => ({ p, round: priceOf(p), blocked: hasNtc(p) })),
    days: daysToDeadline(G),
    open: tradesOpen(G),
  };
}

function aiDeadlineMoves(G) {
  const table = standings(G);
  const cut = Math.floor(G.teams.length / 2);
  /* A club running itself belongs on one side of the deadline or the other.
     Leaving it out of both is why an auto-managed club never made a trade in
     thirty seasons — and a STYLE can override the table, which is the whole
     point of telling it to build while it's still winning games. */
  const stance = (id) => {
    if (!aiRuns(G, id)) return null;
    const s = styleFor(G, id).deadline;
    if (s) return s;
    return table.findIndex((t) => t.id === id) < cut ? "buy" : "sell";
  };
  const buyers = table.map((t) => t.id).filter((id) => stance(id) === "buy");
  const sellers = table.map((t) => t.id).filter((id) => stance(id) === "sell");
  let done = 0;
  sellers.forEach((sid) => {
    if (done >= 6) return;
    const rental = rosterOf(G, sid)
      .filter((p) => p.contract.yrs <= 1 && p.age >= 27 && p.ovr >= 62 && !hasNtc(p))
      .sort((a, b) => b.ovr - a.ovr)[0];
    if (!rental) return;
    for (const bid of buyers) {
      const pick = (G.picks || []).find((pk) => pk.owner === bid && pk.year > G.year && pk.round === (rental.ovr >= 72 ? 1 : 2));
      if (!pick) continue;
      const ev = doTrade(G, sid, [rental.id], [], bid, [], [pick]);
      if (ev.ok) {
        done++;
        news(G, `${G.teams[sid].abbr} sent ${fullName(rental)} to ${G.teams[bid].abbr} for a pick.`, "info");
        break;
      }
    }
  });
  return G;
}

/* ------------------------------ development -------------------------------
 * What a season actually taught a young player. NHL minutes are the best
 * teacher the sport has — but only when he's genuinely playing them and holding
 * his own. A nineteen-year-old stapled to the fourth line learns less than he
 * would driving a farm team, and one thrown in over his head learns least of
 * all. The farm is the safe middle: steady, unspectacular, always positive.
 *
 * This used to be a flat "+1.5 if he's on the farm", which made the answer the
 * same for every prospect. Now it's a judgement call: a kid who can hold down
 * real minutes is better off in the NHL, and a kid who can't is better off
 * playing them somewhere else.
 *
 * A player who moves mid-season gets both, weighted by games in each league, so
 * a December callup is worth exactly the share of the year it covered.
 * ------------------------------------------------------------------------- */
/* How hard a wide ceiling gap pulls a young player toward it. Raised with the
   draft rework: prospects arrive raw now, so the gap is bigger and it has to
   mean more, or a fifty-overall kid with a ninety ceiling is still a fringe
   player at twenty-three. */
/* What a year is worth to a young player who has ALREADY arrived — nearly
   nothing, which is the point. It used to be 2.4 unconditionally and that is
   what inflated the league. */
const DEV_BASE = 0.35;
/* And how hard the remaining gap pulls. Raised well past the old 0.135 because
   the gap is now doing all of the work: a raw draftee with twenty-seven points
   to travel gains six a year, faster than the old curve ever moved him, and it
   tapers to nothing as he closes on it. */
const DEV_GAP_PULL = 0.22;
/* Over how much remaining headroom ice time counts at full value. Inside eight
   points of his ceiling, minutes start mattering less; at the ceiling they stop
   mattering at all, because there is nothing left to teach him. */
const DEV_HEADROOM = 8;
/* A farm season is worth more than it was — but it MUST stay below what a
   genuine NHL role gives (`solid` measures about 2.2), or the trade-off the
   whole development model rests on inverts and everyone is better off hidden
   in the minors. Raised, not unleashed. */
const DEV_FARM = 1.95;     // a full season of top farm minutes
const DEV_NHL_HI = 3.4;    // thriving in a real NHL role
const DEV_NHL_LO = 0;      // dressed, but buried — the year taught him nothing
// Minutes that count as no role at all and as a full one, plus the production a
// regular at the position is expected to post. These are MEASURED off the sim,
// not invented: forwards run ~12.7 min a night at ~1.15 pts/60, defencemen
// ~16.2 and ~0.90, and goalies ~.907. Re-measure before retuning them.
const DEV_BANDS = {
  F: { floor: 9, full: 19, mid: 1.15, spread: 0.80 },
  D: { floor: 12, full: 22, mid: 0.90, spread: 0.50 },
  G: { floor: 5, full: 40, mid: 0.907, spread: 0.020 },
};
const devBand = (p) => (p.pos === "G" ? DEV_BANDS.G : p.pos === "D" ? DEV_BANDS.D : DEV_BANDS.F);

/* How an NHL season went, as two normalised numbers: was he playing (`role`,
   0–1) and did he hold his own (`perf`, -1–1). Null if he never dressed. */
function nhlDevRead(p, st) {
  if (!st || !st.gp) return null;
  const b = devBand(p);
  const role = (v) => clamp((v - b.floor) / (b.full - b.floor), 0, 1);
  if (p.pos === "G") {
    const sv = st.sa ? st.sv / st.sa : 0;
    return { role: role(st.gp), perf: clamp((sv - b.mid) / b.spread, -1, 1) };
  }
  const p60 = st.toi > 0 ? ((st.g + st.a) * 60) / st.toi : 0;
  return { role: role(st.toi / st.gp), perf: clamp((p60 - b.mid) / b.spread, -1, 1) };
}

/* The environment term, before the age taper: what this season was worth to
   him. Role GATES the whole thing — playing badly still teaches something, but
   not playing at all teaches nothing, so ice time is the part you can't fake.
   The two combine so that beating the farm takes roughly top-nine minutes AND
   above-average production; a fourth-liner is better off in the minors even if
   he's scoring there. */
/* ---------------------------- winning teaches -----------------------------
 * A farm season was worth a flat `DEV_FARM` whether the affiliate won the
 * championship or finished last by twenty points, which made the whole farm
 * league — its table, its playoffs, its trophy — decorative as far as the
 * prospects living in it were concerned. Playing meaningful games in a winning
 * room is a real part of how players come through, so it pays.
 *
 * SYMMETRIC ABOUT THE LEAGUE, not about zero. The bonus is measured against the
 * average affiliate, so a good room adds exactly as much as a bad one takes
 * away and the league-wide rate of development is unchanged. Centring it on a
 * guessed .500 instead would have quietly inflated everybody, because the
 * loser point puts the real mean nearer .530.
 * ------------------------------------------------------------------------- */
const DEV_WIN_SWING = 0.55;   // best-to-average affiliate, on top of DEV_FARM
const DEV_WIN_TITLE = 0.35;   // and winning the thing outright
/* How much of a year's improvement a focus moves off everything else and onto
   the one rating. Kept modest: at 0.35 a focused summer is clearly visible in
   the chosen rating without turning a player into a one-trick specialist in
   two years, and because it is taken from the others the total is unchanged. */
const DEV_FOCUS_SHARE = 0.35;

/* The room a prospect spent the year in: how good his affiliate was, measured
   against the average one, and whether it won. Returns null when there's no
   farm season to judge, which is what keeps `devEnvironment` unchanged for
   everyone who never went down. */
function farmRoom(G, p) {
  if (!p || p.teamId == null || !G.teams[p.teamId]) return null;
  const mine = farmRec(G.teams[p.teamId]);
  if (!mine.gp) return null;
  let pts = 0, gp = 0;
  G.teams.forEach((t) => { const r = farmRec(t); pts += r.pts; gp += r.gp; });
  if (!gp) return null;
  return {
    pct: mine.pts / (2 * mine.gp),
    mean: pts / (2 * gp),
    title: (p.farmTitles || []).includes(G.year),
  };
}
/* How much that room was worth. Clamped, because a 20-game affiliate can post a
   points percentage no full season could and shouldn't out-earn a title. */
function farmRoomBonus(room) {
  if (!room) return 0;
  const edge = clamp((room.pct - room.mean) * 2, -1, 1);
  return edge * DEV_WIN_SWING + (room.title ? DEV_WIN_TITLE : 0);
}

/* ------------------------- the spring, and doing both ----------------------
 * Playoff hockey is the hardest the sport gets and it taught a young player
 * NOTHING — `p.po` was cleared at the rollover before `progress` ever ran, so a
 * prospect called up for a Cup run developed exactly as if he had sat at home.
 *
 * DOUBLE DIPPING is the case worth paying for: a kid who plays a full season on
 * the farm, carries a real role there, and is then thrown into the NHL
 * postseason has had two developmental years in one. He got the minutes AND the
 * intensity, which is precisely the thing neither path gives on its own. It is
 * worth roughly twice what the run alone is.
 *
 * Scaled by how deep the run went, so a first-round exit is a taste and a final
 * is an education. A player with no playoff games is completely unaffected —
 * the term is additive and starts at zero.
 * ------------------------------------------------------------------------- */
const DEV_PLAYOFF = 1.1;          // a deep run, on top of whatever the year was worth
const DEV_PLAYOFF_FULL = 16;      // games that count as having gone the distance
const DEV_DOUBLE_DIP = 0.9;       // and again, for a man who earned it in the minors first
const DOUBLE_DIP_MIN_FARM = 20;   // a real season down there, not a cameo

function playoffDev(farm, po) {
  const pGp = (po && po.gp) || 0;
  if (!pGp) return 0;
  const fGp = (farm && farm.gp) || 0;
  const dip = fGp >= DOUBLE_DIP_MIN_FARM ? DEV_DOUBLE_DIP : 0;
  return (DEV_PLAYOFF + dip) * clamp(pGp / DEV_PLAYOFF_FULL, 0, 1);
}

function devEnvironment(p, st, farm, room, po) {
  const nGp = (st && st.gp) || 0;
  const fGp = (farm && farm.gp) || 0;
  const spring = playoffDev(farm, po);
  // Played nowhere, learned nothing — but a spring on its own still counts.
  if (!nGp && !fGp) return spring;
  const r = nhlDevRead(p, st);
  const nhl = r ? DEV_NHL_LO + (DEV_NHL_HI - DEV_NHL_LO) * r.role * (0.3 + 0.7 * ((r.perf + 1) / 2)) : 0;
  // The room only weighs on the part of the year he actually spent down there.
  const onFarm = DEV_FARM + farmRoomBonus(room);
  return (nhl * nGp + onFarm * fGp) / (nGp + fGp) + spring;
}
// Where he plays stops mattering once he's made. Ages are post-birthday.
function devAgeWeight(age) { return age <= 21 ? 1 : age <= 23 ? 0.75 : age <= 25 ? 0.4 : 0; }

/* ------------------------------ the rollover ------------------------------ */

function progress(G, p, po) {
  /* A goalie matures later than a skater — that much is real hockey. But at 28
     against 26 he got TWO extra years of climbing and started declining two
     years later, and a cohort traced through this function peaks 2.2 points
     higher than the skaters it was drafted alongside. There are only sixty-four
     goaltending jobs against six hundred and seventy-two, so that edge is
     amplified by how thin the selection is, and the league's save percentage
     climbed .898 to .909 across twenty seasons while goals slid 6.08 to 5.52.
     One year later, not two. */
  const peak = p.pos === "G" ? 27 : 26;
  const keys = p.pos === "G" ? GOALIE_KEYS : SKATER_KEYS;
  let delta;
  /* HOW FAR HE STILL HAS TO TRAVEL. Everything below is scaled by this, and
     that is the whole fix for the thing twenty simulated seasons found: the
     league inflated, the average NHL player going from 62 to 75, because the
     old curve added a FLAT +2.4 every year to anybody under his peak whether
     he had anywhere left to go or not.
     Traced on a single cohort with no games played at all: sixty-four of
     ninety-six had passed their own ceiling by twenty-five, and `pot` ratcheted
     from 65.4 to 72.0 behind them because it follows `ovr` up. The class peaked
     six and a half points above the ceiling it was drafted with, every year,
     for ever.
     Now he APPROACHES it. The gap does the work, so a raw kid with a long way
     to go moves faster than he ever did — and a man who has arrived stops. */
  const head = Math.max(0, p.pot - p.ovr);
  if (p.age < peak) delta = gauss(G, DEV_BASE + head * DEV_GAP_PULL, 1.7);
  else if (p.age < peak + 4) delta = gauss(G, 0.2, 1.4);
  else delta = gauss(G, -(p.age - peak - 3) * 0.95, 1.5);
  // Where he played and how it went. `p.stats` is the season that just ended —
  // `p.season` has already been blanked by this point in the rollover — and
  // `p.farmSeason` is still intact until it's archived further down.
  /* `farmRoom` reads `t.farmRec` and `p.farmTitles`, both of which are still
     intact here — the table is reset in `startNextSeason` and the title was
     awarded by `runFarmPlayoffs` back at the end of the regular season. */
  /* Minutes are scaled by the SAME headroom. Real ice time is what makes a
     young player come along fast, and with the flat base gone it is now the
     biggest single thing in this function rather than a garnish on it — but it
     accelerates the approach to his ceiling instead of carrying him past it,
     which is what it used to do. */
  const env = devEnvironment(p, p.stats, p.farmSeason, farmRoom(G, p), po) * devAgeWeight(p.age);
  delta += env * (env > 0 ? clamp(head / DEV_HEADROOM, 0, 1) : 1);
  /* An owner's building, and the course he set. Both only touch a player young
     enough for his surroundings to matter, and both are exactly 1 for every
     club in the league that isn't yours — so nothing here moves unless you own
     the place and decided it should. */
  if (p.teamId != null && devAgeWeight(p.age) > 0 && delta > 0) {
    const dir = directionOf(G, p.teamId);
    delta *= (1 + investLevel(G, p.teamId, "facility") * 0.06) * (dir ? dir.dev : 1);
  }
  // A coach who develops players is worth real progression on top of that —
  // and on the farm it's the affiliate's coach whose job that is.
  if (p.age <= 24 && p.teamId != null) {
    delta += (devCoachRating(G, p) - 55) * 0.035;
  }
  /* Summer development. Left alone a player improves evenly across everything,
     which is why nobody ever specialised — the delta is the same number applied
     to all nine ratings. A focus concentrates it: `DEV_FOCUS_SHARE` of the
     year's gain is taken off the other ratings and spent on the chosen one. */
  const focus = depthOn(G, "devFocus") ? p.devFocus : null;
  const vol = p.age <= 24 ? volatilityOf(G, p) : 1;
  keys.forEach((k) => {
    if (p.r[k] == null) return;
    /* The focus is a REDISTRIBUTION, not a bonus — the year is worth what it
       was worth, you just choose where it lands. Only while he's still young
       enough for the environment to matter at all. */
    let d = delta;
    if (focus && keys.includes(focus) && devAgeWeight(p.age) > 0 && delta > 0) {
      const pot = delta * DEV_FOCUS_SHARE * (keys.length - 1);
      d = k === focus ? delta + pot : delta * (1 - DEV_FOCUS_SHARE);
    }
    // A volatile player's year swings harder in both directions. The MEAN is
    // untouched — only the spread — so bust risk costs nothing on average and
    // is purely a question of how much variance you're buying.
    p.r[k] = Math.round(clamp(p.r[k] + d + gauss(G, 0, 1.1 * vol), 15, 99));
  });
  p.ovr = ovrOf(p);
  p.pot = Math.max(p.ovr, p.pot - (p.age > peak ? 2 : 0));
}
/* Who leaves the sport.
 *
 * Retirement used to be impossible before 32, so a player who never made it
 * simply accumulated: he sat in the pool or on a farm roster into his thirties
 * taking up a place, and the league filled with men who were never going to
 * play. Two ways out now — the old age curve, and a separate, gentler one for
 * players who are old enough to have shown something and haven't. A 27-year-old
 * who has never held down an NHL job is not a prospect, he is a career minor
 * leaguer, and some of them stop. */
const NEVER_MADE_IT_AGE = 26;
const NEVER_MADE_IT_GAMES = 60;
/* The league's own level, so that "is he good enough" is asked against his
 * peers rather than against a number.
 *
 * This matters more than it sounds. Both retirement tests used to compare a
 * player's rating to a FIXED figure — 55 and 58 — and the league's average
 * drifts upward as the pool fills to capacity. Every point of drift pushed more
 * players under an unmoving bar, and culling the weakest raises the average
 * again: a positive feedback loop, running quietly for the whole career.
 *
 * `LEAGUE_LEVEL_BASE` is what a fresh league generates at, and the offsets
 * below are written against it, so YEAR ONE BEHAVES IDENTICALLY and only a
 * drifted league behaves differently. Cached per season because this is asked
 * once per player at every rollover. */
const LEAGUE_LEVEL_BASE = 62;
function leagueLevel(G) {
  if (G.levelYear === G.year && G.level != null) return G.level;
  const nhl = playersOf(G).filter((p) => p.teamId != null && !p.farm && !p.retired);
  G.level = nhl.length
    ? Math.round(nhl.reduce((s, p) => s + p.ovr, 0) / nhl.length)
    : LEAGUE_LEVEL_BASE;
  G.levelYear = G.year;
  return G.level;
}
function retirementChance(G, p) {
  // How far above or below his peers he is, rather than above or below 62.
  const rel = p.ovr - leagueLevel(G);
  if (p.age >= 32) {
    const decline = (p.age - 32) * 0.09 + Math.max(0, -(rel + 7)) * 0.012;
    return clamp(decline, 0, 0.95);
  }
  // Never established, and past the age where that changes.
  if (p.age >= NEVER_MADE_IT_AGE && nhlGames(p) < NEVER_MADE_IT_GAMES && rel < -4) {
    return clamp(0.1 + (p.age - NEVER_MADE_IT_AGE) * 0.09, 0, 0.6);
  }
  return 0;
}

function startNextSeason(G) {
  applyPendingRules(G);
  G.year++;
  // Ageing and contract expiry already happened at the end of the playoffs.
  // What's left is to fill out the league and rebuild the calendar.
  aiFreeAgency(G);
  /* Shed illegal money BEFORE topping the roster up, so anything this opens up
     gets filled in the same pass rather than leaving a club a body short. */
  enforceCap(G);
  fillRosters(G);
  // Before the limits are enforced, so a stocked affiliate is trimmed like any
  // other and can never push an organisation over its cap.
  stockAffiliates(G);
  /* AFTER the market and the top-ups, because both add players — the draft has
     also just put seven more into every organisation. This is the point at
     which the roster about to play a season has to be a legal one. */
  enforceFloor(G);
  enforceRosterLimits(G);
  // Bodies are legal; now the money has to be. The draft has just added seven
  // entry contracts per club and nothing else checks them against the cap.
  enforceCap(G);
  capFreeAgentPool(G);
  // Reset the league.
  /* Settle the books before the season is wiped. Last year's gate becomes this
     year's budget — so a club that filled its building can afford people, and
     one that didn't has to choose. The floor keeps a bad year from making the
     staff market unusable for a decade. */
  G.teams.forEach((t) => {
    const earned = t.revenue || 0;
    t.budget = round1(Math.max(6, earned * 0.42));
    t.revenue = 0;
    // Staff contracts run out, which is what keeps the market alive year to year.
    if (t.staffHired) {
      Object.keys(t.staffHired).forEach((k) => {
        const s = t.staffHired[k];
        if (s.until && s.until <= G.year) {
          delete t.staffHired[k];
          if (t.id === G.userTeam) news(G, `${s.name}'s contract is up — he has left.`, "info");
        }
      });
    }
    // A hard call fades if you stop making them.
    if (t.roomHit) t.roomHit = t.roomHit * 0.5;
  });
  G.teams.forEach((t) => {
    t.w = 0; t.l = 0; t.otl = 0; t.pts = 0; t.gf = 0; t.ga = 0; t.gp = 0; t.streak = 0; t.l10 = [];
    t.pp = 0; t.ppg = 0; t.pk = 0; t.pkga = 0;
    // The season's best run is a season thing; the record book already has it.
    t.wsMax = 0;
    t.farmRec = blankFarmRec();
    t.farmLog = null;
    t.lines = null;
  });
  G.farmCup = null;
  G.farmAwards = null;
  G.farmDay = null;
  G.results = [];
  G.playoffs = null;
  G.awards = null;
  G.allStar = null;
  /* The tournament itself is cleared, but `G.worldCups` is not — every medal
     ever won stays, the way the drafts do. */
  G.worldCup = null;
  G.lastGame = null;
  // The logs are a this-season view; a career's worth would dwarf the save.
  G.shotLog = {};
  G.gameLog = {};
  G.phase = "regular";
  G.offseasonStep = null;
  playersOf(G).forEach((p) => { p.marks = null; });
  pruneSave(G);
  seedPicks(G, G.year + 2, 1);
  G.picks = G.picks.filter((pk) => pk.year >= G.year);
  buildSchedule(G);
  G.teams.forEach((t) => ensureLines(G, t.id));
  setMandate(G);
  return G;
}

/* -------------------------------- persistence -----------------------------
 * A save grows by roughly a tenth of a megabyte a season, so a long career would
 * eventually walk into the storage ceiling. Retired players keep a career total
 * rather than a row per season, and nobody who has left the league entirely is
 * carried forever.
 * ------------------------------------------------------------------------- */

function pruneSave(G) {
  const keep = [];
  playersOf(G).forEach((p) => {
    if (!p.retired) return;
    /* Collapse a retired player's seasons — but ONE ROW PER CLUB, not one row
       for the career. Stamping the whole thing with `career[0].teamId` made a
       man who moved read as having spent his entire career at his first club:
       a Hall of Famer with rings from two different sides showed "2026–2031
       WIC" and nothing about the years he won the second one. Grouped by club
       in the order he played for them, so the row and the ring agree. */
    if (p.career && p.career.length > 1) {
      const spells = [];
      p.career.forEach((c) => {
        const last = spells[spells.length - 1];
        if (last && last.teamId === c.teamId) {
          Object.keys(c).forEach((k) => {
            if (k === "year" || k === "teamId" || k === "z" || k === "to") return;
            last[k] = (last[k] || 0) + (c[k] || 0);
          });
          last.to = c.year;
        } else {
          spells.push({ ...c, to: c.year, total: true });
        }
      });
      p.career = spells;
    }
    // Blank rather than null: plenty of code walks every player and reads these.
    p.season = blankStats(p.pos); p.stats = blankStats(p.pos);
    p.po = null; p.farmSeason = null; p.farmCareer = null; p.marks = null;
    /* Anyone with no trophies and no honours is not history, just clutter.
     *
     * But "honoured" was FOR EVER, and a Cup gives twenty-three men a ring
     * every single spring — so a twenty-season career carried four hundred and
     * seventy-six retired players and the save grew without a ceiling: 2.5 MB
     * at year one, 5.4 MB by year twenty, past what localStorage will take
     * somewhere around year seventeen. A trend nothing showed at twelve.
     *
     * The Hall of Fame and a retired number are permanent, because those are
     * the two things the game will still show you in fifty years. Everything
     * else — a ring, a trophy, a gold medal — keeps a man for `HONOUR_YEARS`
     * and then lets him go, by which time nothing on any screen names him. */
    const permanent = p.hof != null
      || G.teams.some((t) => (t.honours || []).some((h) => h.pid === p.id));
    const decorated = (p.rings || []).length > 0 || (p.trophies || []).length > 0
      || (p.medals || []).some((m) => m.kind === "gold");
    const gone = G.year - (p.retiredYear || p.hof || G.year);
    if (!permanent && (!decorated || gone > HONOUR_YEARS)) keep.push(p.id);
  });
  // Keep the most recent departures around so history pages can still name them.
  keep.slice(0, Math.max(0, keep.length - 250)).forEach((id) => { delete G.players[id]; });
  if (G.results.length > 900) G.results.splice(0, G.results.length - 900);
  if (G.news.length > 80) G.news.length = 80;
  return G;
}

/* -------------------------------- storage --------------------------------- */

/* Saves live in IndexedDB, which has room to spare; localStorage is the fallback
   when IndexedDB isn't there or refuses. Slot metadata always goes to
   localStorage so the splash screen can list careers synchronously. */
const SAVE_PREFIX = "pgmh:";
const DB_NAME = "pgmh", DB_STORE = "saves";
const saveKey = (slot) => `${SAVE_PREFIX}slot${slot}`;
const metaKey = (slot) => `${SAVE_PREFIX}meta${slot}`;

let _db = null, _dbDead = false;
function openDb() {
  return new Promise((res, rej) => {
    if (_db) return res(_db);
    if (_dbDead || typeof indexedDB === "undefined") return rej(new Error("no indexeddb"));
    let req;
    try { req = indexedDB.open(DB_NAME, 1); } catch (e) { _dbDead = true; return rej(e); }
    req.onupgradeneeded = () => { try { req.result.createObjectStore(DB_STORE); } catch (e) {} };
    req.onsuccess = () => { _db = req.result; res(_db); };
    req.onerror = () => { _dbDead = true; rej(req.error); };
  });
}
function idbPut(key, val) {
  return openDb().then((db) => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  }));
}
function idbGet(key) {
  return openDb().then((db) => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const r = tx.objectStore(DB_STORE).get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function idbDel(key) {
  return openDb().then((db) => new Promise((res) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => res(false);
  }));
}

/* Both stores get every save, wrapped with a timestamp, and a load takes
   whichever is newer. localStorage is written synchronously so a save can never
   be lost to an in-flight IndexedDB transaction; IndexedDB is the one with room
   to spare if the save outgrows the 5MB quota. */
function saveGame(G, slot) {
  const t = G.teams[G.userTeam];
  const at = Date.now();
  let payload;
  try { payload = JSON.stringify({ at, data: G }); } catch (e) { return false; }
  let wroteLocal = false;
  try {
    localStorage.setItem(saveKey(slot), payload);
    wroteLocal = true;
  } catch (e) { /* quota — IndexedDB has to carry it */ }
  try {
    localStorage.setItem(metaKey(slot), JSON.stringify({
      team: t.name, city: t.city, year: G.year, phase: G.phase, cups: t.cupWins,
      record: `${t.w}-${t.l}-${t.otl}`, at,
    }));
  } catch (e) {}
  idbPut(saveKey(slot), payload).catch(() => {});
  return wroteLocal;
}
// Accepts both the wrapped format and the bare game object older saves used.
function unwrap(raw) {
  if (!raw) return null;
  try {
    const v = JSON.parse(raw);
    if (v && v.data && v.at) return { at: v.at, g: v.data };
    return { at: 0, g: v };
  } catch (e) { return null; }
}
function loadGame(slot) {
  const local = unwrap(localStorage.getItem(saveKey(slot)));
  return idbGet(saveKey(slot))
    .catch(() => null)
    .then((v) => {
      const remote = unwrap(v);
      const best = !remote ? local : !local ? remote : (remote.at > local.at ? remote : local);
      return best ? migrate(best.g) : null;
    })
    .catch(() => (local ? migrate(local.g) : null));
}
function slotMeta(slot) {
  try { const m = localStorage.getItem(metaKey(slot)); return m ? JSON.parse(m) : null; }
  catch (e) { return null; }
}
function deleteSlot(slot) {
  try { localStorage.removeItem(saveKey(slot)); localStorage.removeItem(metaKey(slot)); } catch (e) {}
  idbDel(saveKey(slot)).catch(() => {});
}
