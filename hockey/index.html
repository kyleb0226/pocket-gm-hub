  const R = rules(G);
  const hl = ensureLines(G, homeId), al = ensureLines(G, awayId);
  const home = emptyBox(G, homeId), away = emptyBox(G, awayId);
  const hG = pickStarter(G, hl, opts.homeRest), aG = pickStarter(G, al, opts.awayRest);
  home.goalie = hG; away.goalie = aG;
  // Events are only recorded when somebody is going to watch. The engine works
  // in aggregate per matchup, so each event gets a clock time and the whole log
  // is sorted at the end — the ordering is invented, the events are not.
  const ev = opts.events ? [] : null;
  // A per-shot record, kept only for the user's club so the log stays bounded.
  const shotLog = opts.log ? [] : null;

  const sides = [
    { box: home, opp: away, lines: hl, gid: hG, oppGid: aG, oppLines: al, isHome: true },
    { box: away, opp: home, lines: al, gid: aG, oppGid: hG, oppLines: hl, isHome: false },
  ];

  // ---- rivalry ----
  // A rivalry night is played harder by both sides: more push, more gloves off,
  // and a result the room feels for longer.
  /* Heat is the built-in pairing plus whatever history the two have. With
     `rivalryGrowth` off `rivalryHeat` returns exactly the old 0-or-1, so this
     is the same 1.045 it always was. */
  const heat = rivalryHeat(G, homeId, awayId);
  const rivalNight = heat > 0;
  const rivalHeat = 1 + 0.045 * heat;

  // ---- fighting ----
  // A fight is five minutes each and a small, real swing in who carries the play
  // afterwards. It never touches the scoreboard directly.
  const momentum = { [homeId]: 1, [awayId]: 1 };
  if (R.fighting && rnd(G) < (rivalNight ? Math.min(0.55, 0.38 + (heat - 1) * 0.06) : 0.22)) {
    const enforcer = (tid) => {
      const pool = activeRoster(G, tid).filter((p) => p.pos !== "G")
        .sort((x, y) => y.r.phy * roleTrait(y, "fight") - x.r.phy * roleTrait(x, "fight")).slice(0, 5);
      if (!pool.length) return null;
      // Weighted even inside the shortlist — the enforcer answers most nights.
      const fw = pool.map((x) => Math.max(0.1, roleTrait(x, "fight")));
      const fTot = fw.reduce((a, c) => a + c, 0);
      let fx = rnd(G) * fTot;
      for (let i = 0; i < pool.length; i++) { fx -= fw[i]; if (fx <= 0) return pool[i]; }
      return pool[pool.length - 1];
    };
    const hf = enforcer(homeId), af = enforcer(awayId);
    if (hf && af && home.players[hf.id] && away.players[af.id]) {
      home.players[hf.id].pim += 5; away.players[af.id].pim += 5;
      home.players[hf.id].fights++; away.players[af.id].fights++;
      home.pim += 5; away.pim += 5;
      const hWon = rnd(G) < clamp(0.5 + (hf.r.phy - af.r.phy) * 0.01, 0.15, 0.85);
      momentum[hWon ? homeId : awayId] = 1.07;
      home.fight = { home: hf.id, away: af.id, winner: hWon ? hf.id : af.id };
      if (ev) ev.push({ t: rnd(G) * 60, kind: "fight", team: hWon ? homeId : awayId, pid: hWon ? hf.id : af.id, other: hWon ? af.id : hf.id });
    }
  }

  // ---- rest ----
  // The second night of a back-to-back costs a few percent of everything.
  const legs = { [homeId]: 1 - Math.max(0, 2 - (opts.homeRest == null ? 2 : opts.homeRest)) * 0.025,
                 [awayId]: 1 - Math.max(0, 2 - (opts.awayRest == null ? 2 : opts.awayRest)) * 0.025 };

  // ---- even strength, line matchup by line matchup ----
  // Chemistry is read and advanced once per team per game, before either side's
  // shots are resolved — a defending pair's continuity has to be known before the
  // attacking side that faces it gets its shot rate.
  const teamChemF = {}, teamChemD = {};
  sides.forEach((side) => {
    teamChemF[side.box.teamId] = lineChemistry(G.teams[side.box.teamId], side.lines);
    teamChemD[side.box.teamId] = pairChemistry(G.teams[side.box.teamId], side.lines);
  });
  sides.forEach((side) => {
    const chem = teamChemF[side.box.teamId];
    const oppChemD = teamChemD[side.opp.teamId];
    const myT = G.teams[side.box.teamId];
    const oppT = G.teams[side.opp.teamId];
    const fIce = iceTimeF(myT), myIce = iceTimeD(myT), oppIce = iceTimeD(oppT);
    side.lines.F.forEach((fLine, li) => {
      const mins = ES_MINUTES * fIce[li];
      // Which of THEIR lines this one sees. The default is line-for-line, but
      // last change bends it: at home a coach hides his top line from their
      // checkers and throws his checking line at their best.
      const oppMix = matchupMix(G, side, li, oppT);
      // Last change: at home, the top line sees soft pairs more often.
      side.oppLines.D.forEach((pair, pi) => {
        /* Their pairs play the split THEIR coach chose. Last change bends which
           pair our top line sees, but the shares still have to sum to one —
           scaling them raw handed the home side extra minutes, and hard-coding
           the bent values ignored the opposing coach entirely. */
        let share = oppIce[pi];
        if (side.isHome && li === 0 && ruleValue(G, "homeIce") !== "none") {
          const bent = oppIce.map((v, k) => v * HOME_TOP_LINE_BEND[k]);
          const bt = bent.reduce((a, b) => a + b, 0);
          share = bt > 0 ? bent[pi] / bt : share;
        }
        const m = mins * share;
        // Draw the opposing forward line from the matchup distribution.
        let ox = rnd(G), oi = oppMix.length - 1;
        for (let k = 0; k < oppMix.length; k++) { ox -= oppMix[k]; if (ox <= 0) { oi = k; break; } }
        const oppF = side.oppLines.F[oi] || side.oppLines.F[0];
        // The unit on the ice is five skaters, not three. Which of our own pairs
        // is out there is drawn by ice-time share — that's what puts defencemen
        // on the scoresheet at all, and it evens out across a season.
        let x = rnd(G), di = 0;
        for (let k = 0; k < myIce.length; k++) { x -= myIce[k]; if (x <= 0) { di = k; break; } }
        const myPair = side.lines.D[di] || side.lines.D[0];
        const unit = fLine.concat(myPair);
        const off = lineOff(G, fLine) * (1 + chem[li] * LINE_CHEM_PER_GAME);
        const def = unitDef(G, oppF, pair) * (1 + oppChemD[pi] * PAIR_CHEM_PER_GAME);
        // ~30 shots per 60 at even strength for an average team.
        const sys = systemOf(myT), oppSys = systemOf(oppT);
        // Our system pushes our own volume; theirs decides how much they allow.
        const rate = (30.5 / 60) * (off / def) * momentum[side.box.teamId] * legs[side.box.teamId]
          * sys.off * oppSys.def * rivalHeat * homeEdge(G, side.isHome, side.box.teamId);
        const shots = Math.max(0, Math.round(gauss(G, rate * m, Math.sqrt(Math.max(0.4, rate * m)) * 0.9)));
        resolveShots(G,
          { off, ppOff: off, sBox: side.box, gBox: side.opp, oppBox: side.opp, events: ev, shots: shotLog },
          shots, unit, pair.concat(oppF), side.oppGid, "es");
        // Everyone on the ice is on the ice for the whole shift — the minutes
        // are not split between linemates.
        fLine.forEach((id) => { if (side.box.players[id]) side.box.players[id].toi += m; });
        pair.forEach((id) => { if (side.opp.players[id]) side.opp.players[id].toi += m; });
      });
    });
  });

  // ---- penalties and special teams ----
  sides.forEach((side) => {
    const drawn = Math.max(0, Math.round(gauss(G, 3.1, 1.2)));
    side.opp.pim += drawn * 2;
    side.box.pp += drawn;
    const skaters = activeRoster(G, side.opp.teamId).filter((p) => p.pos !== "G");
    /* Who takes the penalty. This used to be a uniform draw, which is why the
       league's penalty-minute leader finished on 84 — everyone took the same
       number. Weighting it by role gives a club its repeat offenders. */
    const boxWt = skaters.map((p) => Math.max(0.15, roleTrait(p, "pim")));
    const boxTot = boxWt.reduce((a, b) => a + b, 0);
    const drawOffender = () => {
      let x = rnd(G) * boxTot;
      for (let i = 0; i < skaters.length; i++) { x -= boxWt[i]; if (x <= 0) return skaters[i]; }
      return skaters[skaters.length - 1];
    };
    for (let i = 0; i < drawn && skaters.length; i++) {
      const off = drawOffender();
      if (side.opp.players[off.id]) side.opp.players[off.id].pim += 2;
      if (ev) ev.push({ t: rnd(G) * 60, kind: "penalty", team: side.opp.teamId, pid: off.id });
    }
    /* BOTH units, not just the first. Running the whole power play through PP1
       and the whole kill through PK1 handed anyone on both an extra eleven
       minutes a night — which is where a 33-minute top pair came from, and why
       the league's shot-blocking leader sat 50% clear of the field. The second
       units have always existed in `lines.PP`/`lines.PK`; nothing ever used
       them. Real clubs split roughly 65/35 on the power play and 58/42 on the
       kill. */
    const ppUnits = [side.lines.PP[0], side.lines.PP[1]]
      .filter((u) => u && u.length);
    const pkUnits = [side.oppLines.PK[0], side.oppLines.PK[1]]
      .filter((u) => u && u.length);
    const ppSets = ppUnits.length ? ppUnits : [side.lines.F[0]];
    const pkSets = pkUnits.length ? pkUnits : [side.oppLines.D[0]];
    const ppShare = ppSets.length > 1 ? PP_UNIT_SPLIT : [1];
    const pkShare = pkSets.length > 1 ? PK_UNIT_SPLIT : [1];
    // Whoever actually runs each unit — the head coach, or the specialist you
    // hired for the job. `staffOf` reports the head coach when the rule is off.
    const ppC = staffOf(G, G.teams[side.box.teamId]), pkC = staffOf(G, G.teams[side.opp.teamId]);
    const totalPP = drawn * PP_MIN_PER;
    let firstPk = pkSets[0];
    ppSets.forEach((unit, ui) => {
      const m = totalPP * ppShare[ui];
      if (m <= 0) return;
      // The kill rotates on its own schedule, so pair unit i against kill unit i.
      const pkUnit = pkSets[Math.min(ui, pkSets.length - 1)];
      const rate = (52 / 60) * (lineOff(G, unit) / unitDef(G, pkUnit, side.oppLines.D[0]))
        * (1 + (ppC.pp - 55) * 0.0035) * (1 - (pkC.pk - 55) * 0.0030);
      const shots = Math.max(0, Math.round(gauss(G, rate * m, Math.sqrt(Math.max(0.4, rate * m)))));
      resolveShots(G, { off: 1, ppOff: 1, sBox: side.box, gBox: side.opp, oppBox: side.opp, events: ev, shots: shotLog },
        shots, unit, pkUnit, side.oppGid, "pp");
      unit.forEach((id) => { if (side.box.players[id]) side.box.players[id].toi += m; });
    });
    // The kill's minutes follow its OWN split, not the power play's.
    pkSets.forEach((pkUnit, ki) => {
      const m = totalPP * (pkShare[ki] != null ? pkShare[ki] : 0);
      pkUnit.forEach((id) => { if (side.opp.players[id]) side.opp.players[id].toi += m; });
    });
    // Shorthanded chances are rare but real.
    if (rnd(G) < 0.16 * drawn) {
      resolveShots(G, { off: 1, ppOff: 1, sBox: side.opp, gBox: side.box, oppBox: side.box, events: ev, shots: shotLog },
        1, firstPk, ppSets[0], side.gid, "sh");
    }
  });

  // ---- faceoffs, hits, blocks ----
  sides.forEach((side) => {
    const cs = side.lines.F.map((l) => G.players[l[1]]).filter(Boolean);
    const oppCs = side.oppLines.F.map((l) => G.players[l[1]]).filter(Boolean);
    const my = cs.reduce((s, p) => s + p.r.fo, 0) / Math.max(1, cs.length);
    const th = oppCs.reduce((s, p) => s + p.r.fo, 0) / Math.max(1, oppCs.length);
    const total = 30;
    const winP = clamp(0.5 + (my - th) * 0.006, 0.3, 0.7);
    let won = 0;
    for (let i = 0; i < total; i++) if (rnd(G) < winP) won++;
    side.box.fow += won; side.box.fol += total - won;
    cs.forEach((p, i) => {
      const share = Math.round(total * LINE_TOI[i]);
      const w = Math.round(share * winP);
      side.box.players[p.id].fow += w; side.box.players[p.id].fol += share - w;
    });
    // Hits are their own thing. Blocks are NOT generated here — they come out of
    // real shot attempts in resolveShots, so a shot-blocking defenceman's total
    // reflects shots that were actually taken at him.
    activeRoster(G, side.box.teamId).filter((p) => p.pos !== "G").forEach((p) => {
      // Tuned to the NHL's ~21 hits a team a night. The clamp at zero pulls the
      // mean up, so the divisor is larger than the target rate implies.
      // The divisor absorbs the role multipliers, whose league-wide weighted mean
      // is about 1.19 — scaling hits by role without it inflated the league rate.
      const h = Math.round(Math.max(0, gauss(G, (p.r.phy / 62) * roleTrait(p, "hit"), 1)));
      side.box.players[p.id].hit += h;
      side.box.hits += h;
    });
  });

  // ---- the last two minutes ----
  // Down one, the trailing side pulls its goalie. Six on five is a genuine
  // chance to tie and a bigger chance to concede into the empty net — and an
  // empty-net goal has no goalie behind it, so no save opportunity is charged.
  if (Math.abs(home.g - away.g) === 1) {
    const trailing = home.g < away.g ? home : away;
    const leading = trailing === home ? away : home;
    const tLines = trailing === home ? hl : al;
    const lLines = leading === home ? hl : al;
    const roll = rnd(G);
    /* HOW EARLY he goes for it. The draw stays exactly where it was and there
       is still exactly one of it — only the two thresholds move — so a club on
       the default reproduces the old numbers to the goal and every calibrated
       seed replays unchanged. Going early buys chances at the cost of empty
       nets, which is the entire bargain and the reason coaches disagree. */
    const pull = pullTiming(G, trailing.teamId);
    if (roll < pull.tie) {
      const unit = tLines.PP[0].length ? tLines.PP[0] : tLines.F[0];
      resolveShots(G, { sBox: trailing, gBox: leading, oppBox: leading, events: ev, shots: shotLog },
        1, unit, [], leading.goalie, "en6");
    } else if (roll < pull.eng) {
      const sc = shooterFrom(G, lLines.F[0], 0.3);
      if (sc && leading.players[sc.id]) {
        leading.g++; leading.sog++;
        // No goalie, so no placement is recorded — an empty net has no corners.
        leading.players[sc.id].g++; leading.players[sc.id].sog++;
        leading.players[sc.id].eng++; leading.players[sc.id].att++;
        const helpers = assistsFrom(G, lLines.F[0], sc.id);
        helpers.forEach((id) => { if (leading.players[id]) leading.players[id].a++; });
        leading.scorers.push({ id: sc.id, a: helpers, strength: "en" });
        leading.eng = (leading.eng || 0) + 1;
        if (ev) ev.push({ t: 58 + rnd(G) * 2, kind: "goal", team: leading.teamId, pid: sc.id, zone: "empty", strength: "en" });
        // Its own outcome code: a real attempt, but at a net nobody was in.
        if (shotLog) shotLog.push({ p: sc.id, g: null, off: leading.teamId, def: trailing.teamId,
          t: 58 + rnd(G) * 2, z: "empty", c: null, r: "e", st: "en" });
      }
    }
  }

  // ---- overtime ----
  let ot = false, so = false;
  if (home.g === away.g) {
    if (R.otFormat === "none") { /* a tie stands */ }
    else {
      ot = true;
      const hS = lineOff(G, hl.F[0]) / unitDef(G, al.F[0], al.D[0]);
      const aS = lineOff(G, al.F[0]) / unitDef(G, hl.F[0], hl.D[0]);
      const pHome = clamp(0.5 + (hS - aS) * 0.55 + 0.02, 0.2, 0.8);
      // In the playoffs, and whenever there's no shootout to fall back on, OT
      // runs until somebody actually scores.
      const decided = opts.playoff || !R.shootout ? true : rnd(G) < 0.62;
      const homeWins = rnd(G) < pHome;
      const winner = homeWins ? home : away, loser = homeWins ? away : home;
      if (decided) {
        const lines = homeWins ? hl : al;
        let guard = 0;
        const otEv = ev ? [] : null;
        while (winner.g <= loser.g && guard++ < 60) {
          resolveShots(G, { off: 1, ppOff: 1, sBox: winner, gBox: loser, oppBox: loser, events: otEv, shots: shotLog },
            1, lines.F[0], [], homeWins ? aG : hG, "es");
        }
        // Whatever it took to end it, only the winner is on the clock in OT.
        if (ev && otEv) otEv.filter((e) => e.kind === "goal").slice(-1)
          .forEach((e) => ev.push({ ...e, t: 60 + rnd(G) * 5, ot: true }));
      }
      if (winner.g <= loser.g) {
        // The shootout is the one goal nobody is credited with, exactly as in
        // real bookkeeping: the team's score goes up, no skater's total does.
        so = true;
        const soWinner = R.shootout ? runShootout(G, home, away, hl, al, hG, aG) : winner;
        soWinner.g++;
      }
    }
  }

  // Goalie minutes and the decision.
  if (home.players[hG]) home.players[hG].toi += 60;
  if (away.players[aG]) away.players[aG].toi += 60;
  if (ev && so) ev.push({ t: 65, kind: "shootout", team: home.g > away.g ? homeId : awayId });
  const res = {
    home: homeId, away: awayId, hg: home.g, ag: away.g, ot, so,
    boxes: { [homeId]: home, [awayId]: away },
    events: ev ? ev.sort((a, b) => a.t - b.t) : null,
    shots: shotLog,
  };
  return res;
}

/* --------------------------- writing a result down ------------------------- */

function applyGame(G, res, opts) {
  opts = opts || {};
  const R = rules(G);
  const H = G.teams[res.home], A = G.teams[res.away];
  const homeWon = res.hg > res.ag;
  const tie = res.hg === res.ag;

  /* The game-winning goal: the one that put the winner ahead for good — his
     (loser's total + 1)-th goal, which is exactly how the NHL scores it. The
     field has existed since the first build, is listed in the record book, and
     was never once incremented, so every club's GWG leader read zero forever.
     A shootout winner is deliberately credited to nobody, so nobody gets it. */
  if (!tie && !res.so) {
    const winId = homeWon ? res.home : res.away;
    const lost = homeWon ? res.ag : res.hg;
    const gw = (res.boxes[winId].scorers || [])[lost];
    if (gw && res.boxes[winId].players[gw.id]) res.boxes[winId].players[gw.id].gwg = 1;
  }

  [res.home, res.away].forEach((tid) => {
    const t = G.teams[tid];
    const box = res.boxes[tid];
    const gf = tid === res.home ? res.hg : res.ag;
    const ga = tid === res.home ? res.ag : res.hg;
    if (!opts.playoff) {
      t.gp++; t.gf += gf; t.ga += ga;
      /* Special teams. `simGame` has been counting power plays drawn and scored
         on into the box since the beginning and NOTHING EVER READ THEM — the
         two numbers every hockey fan checks after the score existed for every
         game ever played and were thrown away at the whistle. The kill is the
         same pair seen from the other end, so it costs one more line here and
         no new simulation at all. */
      const mine = res.boxes[tid], theirs = res.boxes[tid === res.home ? res.away : res.home];
      t.pp = (t.pp || 0) + (mine.pp || 0);
      t.ppg = (t.ppg || 0) + (mine.ppg || 0);
      t.pk = (t.pk || 0) + (theirs.pp || 0);
      t.pkga = (t.pkga || 0) + (theirs.ppg || 0);
      const won = gf > ga;
      if (tie) { t.otl++; t.pts += 1; }
      else if (won) { t.w++; t.pts += 2; t.streak = t.streak >= 0 ? t.streak + 1 : 1; }
      else if ((res.ot || res.so) && R.otLoserPoint) { t.otl++; t.pts += 1; t.streak = t.streak <= 0 ? t.streak - 1 : -1; }
      else { t.l++; t.streak = t.streak <= 0 ? t.streak - 1 : -1; }
      /* The longest run of the year, kept as it happens. `t.streak` is a live
         number that the next loss erases, so a club that won fourteen in a row
         in November had nothing to show for it by April. */
      if (t.streak > (t.wsMax || 0)) {
        t.wsMax = t.streak;
        if (t.streak >= WIN_STREAK_NEWS && t.id === G.userTeam)
          news(G, `${t.streak} in a row.`, "good");
      }
      t.l10.push(won ? "W" : (res.ot || res.so) ? "O" : "L");
      if (t.l10.length > 10) t.l10.shift();
    }

    Object.entries(box.players).forEach(([pid, s]) => {
      const p = G.players[pid];
      if (!p) return;
      // The box carries the whole organisation so lookups can't miss; only the
      // players who took a shift are credited with a game.
      if (s.toi <= 0) return;
      // Season totals, and — in the regular season — the same line again
      // against the club he was playing for at the time. That's what lets a
      // traded player's year read "40 with Hartford, 22 with Albany" instead of
      // silently crediting the whole thing to wherever he ended up.
      const dest = opts.playoff ? (p.po = p.po || blankStats(p.pos)) : p.season;
      const targets = opts.playoff ? [dest] : [dest, stintFor(p, tid)];
      targets.forEach((d) => {
        d.gp++; d.toi += s.toi;
        if (p.pos === "G") {
          d.sa += s.sa; d.sv += s.sv; d.ga += s.ga; d.starts++;
          d.sosa += s.sosa || 0; d.sosv += s.sosv || 0;
          if (s.ga === 0 && s.sa > 0) d.so++;
          const won = gf > ga;
          if (res.so) { if (won) d.sow++; else d.sol++; }
          if (won) d.w++;
          else if ((res.ot || res.so) && R.otLoserPoint) d.otl++;
          else d.l++;
        } else {
          d.g += s.g; d.a += s.a; d.sog += s.sog; d.pim += s.pim;
          d.hit += s.hit; d.blk += s.blk; d.pm += s.pm;
          d.fow += s.fow; d.fol += s.fol; d.ppg += s.ppg; d.shg += s.shg; d.gwg += s.gwg || 0;
          d.eng += s.eng || 0; d.fights += s.fights || 0;
          d.sos += s.sos || 0; d.soa += s.soa || 0;
          d.att += s.att || 0; d.miss += s.miss || 0; d.blkd += s.blkd || 0;
        }
      });
      /* A point streak. The one running number in hockey that a fan follows
         night to night, and the engine threw away every line the moment it
         wrote it. Regular season only — a run doesn't carry into the spring. */
      if (!opts.playoff && p.pos !== "G") {
        if ((s.g || 0) + (s.a || 0) > 0) {
          p.streak = (p.streak || 0) + 1;
          if (p.streak > (p.bestStreak || 0)) p.bestStreak = p.streak;
          const milestone = p.streak >= POINT_STREAK_NEWS
            && (p.streak === POINT_STREAK_NEWS || p.streak % 5 === 0);
          if (milestone && (tid === G.userTeam || p.streak >= POINT_STREAK_LEAGUE)) {
            news(G, `${fullName(p)} has a point in ${p.streak} straight.`,
              tid === G.userTeam ? "good" : "info");
          }
        } else p.streak = 0;
      }
      addZones(dest, s.z);
      addNet(dest, s.net);
      // A goalie's night costs far more than a skater's shift — that's what
      // eventually forces the backup into the net. For skaters it's minutes
      // above a normal night that wear them down; a fourth-liner recovers.
      p.fatigue = clamp(p.fatigue + (p.pos === "G" ? 14 : (s.toi - 12) / 60 * 10), 0, 100);
      // Rust burns off by PLAYING, not by the calendar turning over — a man
      // sitting in the press box gets no closer to being himself.
      if (p.rust > 0 && !opts.playoff) { p.rust--; if (p.rust === 0) p.rustFrom = 0; }
      else if (p.rust > 0) p.rust--;
    });
  });

  rollInjuries(G, res);
  recordLogs(G, res, opts);
  G.results.push({
    day: G.day, home: res.home, away: res.away, hg: res.hg, ag: res.ag,
    ot: res.ot, so: res.so, playoff: !!opts.playoff,
    scorers: [].concat(res.boxes[res.home].scorers.map((s) => ({ ...s, t: res.home })),
                       res.boxes[res.away].scorers.map((s) => ({ ...s, t: res.away }))),
  });
  if (G.results.length > 1400) G.results.splice(0, 400);
  return res;
}

/* --------------------------------- the logs -------------------------------
 * A record of every shot and every game — but only for the user's club, which
 * is the only one anybody inspects. Doing it league-wide would add roughly a
 * megabyte and a half to a save for data nobody opens.
 * ------------------------------------------------------------------------- */

const SHOT_LOG_MAX = 1400;
const GAME_LOG_MAX = 220;

function recordLogs(G, res, opts) {
  G.shotLog = G.shotLog || {};
  G.gameLog = G.gameLog || {};
  const day = G.day, po = !!(opts && opts.playoff);

  (res.shots || []).forEach((s) => {
    const shooter = G.players[s.p], keeper = G.players[s.g];
    const push = (pid, role, opp) => {
      const arr = (G.shotLog[pid] = G.shotLog[pid] || []);
      arr.push({ d: day, o: opp, t: Math.round(s.t * 10) / 10, z: s.z, c: s.c, r: s.r, st: s.st, role, po });
      if (arr.length > SHOT_LOG_MAX) arr.splice(0, arr.length - SHOT_LOG_MAX);
    };
    if (shooter && shooter.teamId === G.userTeam) push(s.p, "s", s.def);
    // A goalie only ever faced the ones that got to him.
    if (s.c && keeper && keeper.teamId === G.userTeam) push(s.g, "g", s.off);
  });

  [res.home, res.away].forEach((tid) => {
    if (tid !== G.userTeam) return;
    const box = res.boxes[tid];
    const opp = tid === res.home ? res.away : res.home;
    const gf = tid === res.home ? res.hg : res.ag;
    const ga = tid === res.home ? res.ag : res.hg;
    Object.entries(box.players).forEach(([pid, s]) => {
      if (s.toi <= 0) return;
      const p = G.players[pid];
      if (!p) return;
      const arr = (G.gameLog[pid] = G.gameLog[pid] || []);
      arr.push(p.pos === "G"
        ? { d: day, o: opp, gf, ga, sa: s.sa, sv: s.sv, toi: Math.round(s.toi), po }
        : { d: day, o: opp, gf, ga, g: s.g, a: s.a, sog: s.sog, pm: s.pm, toi: Math.round(s.toi * 10) / 10, po });
      if (arr.length > GAME_LOG_MAX) arr.splice(0, arr.length - GAME_LOG_MAX);
    });
  });
  return G;
}

/* Injuries carry a KIND as well as a length, because they don't all cost the
   same thing on the way back: a knee takes a skater's legs, a shoulder takes
   his shot, a concussion takes everything for a while. The fourth field names
   the rating the rehab bites hardest. */
const INJURIES = [
  ["upper body", 3, 12, "hnd"], ["lower body", 4, 16, "spd"], ["groin", 6, 22, "spd"],
  ["concussion", 10, 40, null], ["shoulder", 12, 45, "sht"], ["knee", 20, 70, "spd"],
  ["broken hand", 14, 35, "hnd"], ["ankle", 8, 26, "spd"],
];

/* Coming back is not a switch. A player who has missed two months is in the
   lineup before he is himself again, and the fortnight where he looks a step
   off is part of the cost of the injury — it used to vanish the instant the
   counter hit zero.

   `p.rust` counts the GAMES of that ramp, not days, so it ticks with the same
   clock injuries do. Effectiveness climbs back linearly across it. */
const REHAB_MIN_GAMES = 8;      // shorter than this and he just plays
const REHAB_RATIO = 0.42;       // rehab length as a share of time missed
const REHAB_MAX = 22;
/* How far below himself he starts. Keep this SMALL: it applies to every
   rating a rusty player has, so it moves league-wide rates too — at 0.16 the
   league's save percentage fell almost a full point because returning goalies
   dragged the average down. */
const REHAB_DEPTH = 0.07;
function rehabFor(games) {
  return games < REHAB_MIN_GAMES ? 0 : Math.min(REHAB_MAX, Math.round(games * REHAB_RATIO));
}
/* How much of himself he is right now, 0.84–1. Everything that reads a rating
   in the engine goes through this, so a rusty player is worse in every phase
   rather than only on the scoresheet. (Not `formOf` — that name is already the
   hot/cold scoring flag, which is a different idea entirely.) */
function sharpness(p) {
  if (!p || !p.rust || p.rust <= 0) return 1;
  const span = Math.max(1, p.rustFrom || p.rust);
  return 1 - REHAB_DEPTH * (p.rust / span);
}
// A rating as it plays TODAY, which is what the sim should ever ask for.
function ratingNow(p, key) {
  const base = (p.r && p.r[key]) || 0;
  if (!p.rust || p.rust <= 0) return base;
  // The hurt part comes back slowest.
  const bite = p.rustKey === key ? 1.6 : 1;
  return base * (1 - (1 - sharpness(p)) * bite);
}
function rollInjuries(G, res) {
  const R = rules(G);
  const mult = ({ low: 0.55, normal: 1, high: 1.6 })[R.injuries] * diff(G).injury;
  [res.home, res.away].forEach((tid) => {
    rosterOf(G, tid).forEach((p) => {
      if (p.inj > 0) return;
      const risk = 0.0022 * mult * (1 + (70 - p.r.dur) / 90) * (1 + p.fatigue / 240);
      if (rnd(G) < risk) {
        const [desc, lo, hi, hurts] = pick(G, INJURIES);
        p.inj = ri(G, lo, hi);
        p.injDesc = desc;
        p.rustKey = hurts;
        p.injGames = p.inj;
        p.rust = 0; p.rustFrom = 0;
        if (tid === G.userTeam) news(G, `${fullName(p)} is out ~${p.inj} games (${desc}).`, "bad");
        G.teams[tid].lines = null;
      }
    });
  });
}

function news(G, text, kind) {
  G.news.unshift({ day: G.day, year: G.year, text, kind: kind || "info" });
  if (G.news.length > 120) G.news.pop();
}

/* --------------------------------- one day -------------------------------- */

function simDay(G) {
  if (G.phase !== "regular") return G;
  const day = G.schedule[G.day];
  if (!day) { endRegularSeason(G); return G; }
  if (!G.lastPlayed) G.lastPlayed = new Array(G.teams.length).fill(-9);
  const playedToday = new Set();
  day.forEach((fx) => {
    if (fx.played) return;
    const mine = fx.home === G.userTeam || fx.away === G.userTeam;
    const res = simGame(G, fx.home, fx.away, {
      homeRest: restFor(G, fx.home), awayRest: restFor(G, fx.away), events: mine, log: mine,
    });
    applyGame(G, res);
    fx.played = true; fx.hg = res.hg; fx.ag = res.ag; fx.ot = res.ot; fx.so = res.so;
    playedToday.add(fx.home); playedToday.add(fx.away);
    // Only the latest of the user's games is kept — a full season of play-by-play
    // would dwarf everything else in the save.
    if (mine) G.lastGame = { day: G.day, home: fx.home, away: fx.away, hg: res.hg, ag: res.ag,
      ot: res.ot, so: res.so, events: res.events || [], boxes: res.boxes };
  });
  playedToday.forEach((tid) => { G.lastPlayed[tid] = G.day; });
  // The gate. Only the home side takes one, which is what makes a home date
  // worth something off the ice as well as on it.
  day.forEach((fx) => { const t = G.teams[fx.home]; if (t) t.revenue = round1((t.revenue || 0) + gateFor(G, fx.home)); });
  processWaivers(G);
  // The affiliates play the mirrored fixtures, so every farm game has a real opponent.
  simFarmDay(G, G.day);
  // A stint is served in games, so it only ticks for clubs that actually played.
  tickStints(G, playedToday);
  rollDemands(G);
  if (G.day % 7 === 0) decayRoomHits(G);
  if (G.day % DEMAND_EVERY === 0 && G.day > 0) {
    checkPromises(G); demandOffers(G); rollHoldouts(G); aiAnswerDemands(G);
  }
  checkMilestones(G);
  // The media, if there's anything worth asking. Reads state; draws nothing.
  if (!G.presser) { const q = pickPresser(G); if (q) G.presser = q; }
  // Clubs ring about listed players every few days rather than instantly.
  if ((G.block || []).length && G.day % 5 === 0) generateOffers(G);
  if (G.day === deadlineDay(G)) { aiDeadlineMoves(G); news(G, "The trade deadline has passed.", "info"); }
  /* The break is one fortnight, so it's one thing or the other — in a
     tournament year the All-Star game simply doesn't happen, which is exactly
     what the league does. */
  if (G.day === G.allStarDay && !G.allStar) {
    if (worldCupYear(G) && (!G.worldCup || G.worldCup.year !== G.year)) runWorldCup(G);
    else runAllStar(G);
  }

  // Recovery. Injuries are quoted in GAMES, so they only tick down for clubs
  // that actually played — an injury doesn't heal on an off day. Fatigue does.
  playersOf(G).forEach((p) => {
    if (p.inj > 0 && p.teamId != null && playedToday.has(p.teamId)) {
      p.inj--;
      if (p.inj === 0) {
        // He's available again, but a long absence leaves a ramp behind it.
        const back = rehabFor(p.injGames || 0);
        if (back > 0) {
          p.rust = back; p.rustFrom = back;
          if (p.teamId === G.userTeam) {
            news(G, `${fullName(p)} is back, and will need a few weeks to look himself again.`, "info");
          }
        }
        p.injDesc = ""; p.injGames = 0;
        G.teams[p.teamId].lines = null;
      }
    }
    p.fatigue = clamp(p.fatigue - (p.pos === "G" ? 4.2 : 0.8), 0, 100);
  });
  G.day++;
  if (G.day >= G.schedule.length) endRegularSeason(G);
  return G;
}
function simDays(G, n) { for (let i = 0; i < n && G.phase === "regular"; i++) simDay(G); return G; }

/* ------------------------------- standings -------------------------------- */

function standings(G, filterFn) {
  return G.teams
    .filter(filterFn || (() => true))
    .slice()
    .sort((a, b) => b.pts - a.pts || (b.w - a.w) || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
}
function divStandings(G, div) { return standings(G, (t) => t.div === div); }
function confStandings(G, conf) { return standings(G, (t) => t.conf === conf); }

/* Playoff field. Divisional format is the interesting one: three from each
   division plus two conference wildcards. */
function playoffField(G, conf) {
  if (ruleValue(G, "playoffFormat") === "seeded") {
    return confStandings(G, conf).slice(0, 8).map((t, i) => ({ team: t, seed: i + 1 }));
  }
  const divs = DIVS.map((_, i) => i).filter((d) => DIV_CONF[d] === conf);
  const top = [], rest = [];
  divs.forEach((d) => {
    const s = divStandings(G, d);
    s.slice(0, 3).forEach((t, i) => top.push({ team: t, div: d, divRank: i + 1 }));
    s.slice(3).forEach((t) => rest.push(t));
  });
  const wc = rest.sort((a, b) => b.pts - a.pts || b.w - a.w).slice(0, 2);
  return { top, wc, divs, out: rest.slice(2) };
}

/* ---------------------------- the playoff line -----------------------------
 * The standings knew who was in the field — `playoffField` has always decided
 * the bracket — but the table never said so, which made the one number anybody
 * actually reads during a season invisible: where the cutoff is.
 *
 * This turns the field into a per-club verdict the table can render. `label` is
 * the berth as a fan would say it (A1, WC2, or a plain seed), `bubble` is the
 * last club currently holding a place and `firstOut` the one that would take it
 * — those two are the whole story of a playoff race, so they get their own
 * marks rather than being left as "in" and "out" like everyone else.
 * ------------------------------------------------------------------------- */
const DIV_TAG = ["A", "M", "C", "P"];
function playoffBerths(G) {
  const map = {};
  [0, 1].forEach((conf) => {
    if (ruleValue(G, "playoffFormat") === "seeded") {
      const s = confStandings(G, conf);
      s.slice(0, 8).forEach((t, i) => {
        map[t.id] = { in: true, label: `${i + 1}`, seed: i + 1, bubble: i === 7 };
      });
      if (s[8]) map[s[8].id] = { in: false, label: "9th", firstOut: true };
      return;
    }
    const { top, wc, out } = playoffField(G, conf);
    top.forEach((x) => {
      map[x.team.id] = {
        in: true, label: `${DIV_TAG[x.div] || "?"}${x.divRank}`,
        seed: x.divRank, divRank: x.divRank, bubble: x.divRank === 3,
      };
    });
    wc.forEach((t, i) => {
      map[t.id] = { in: true, label: `WC${i + 1}`, seed: 4 + i, wildcard: true, bubble: i === wc.length - 1 };
    });
    // Everyone still chasing a wildcard, nearest first.
    (out || []).forEach((t, i) => {
      map[t.id] = { in: false, label: i === 0 ? "1st out" : `${i + 1} out`, firstOut: i === 0 };
    });
  });
  return map;
}

/* ------------------------------ clinching ---------------------------------
 * Who is mathematically safe, and who is mathematically done.
 *
 * Rather than reason about the divisional format's cases — three per division
 * plus two wildcards, where a club can miss on points and still get in on
 * division rank — this asks `playoffField` itself, on a hypothetical table:
 *
 *   CLINCHED: give every rival every point still available to it, freeze this
 *   club where it is, and break every tie against it. If it is STILL in the
 *   field in that table, nothing that can still happen can put it out.
 *
 *   ELIMINATED: the mirror image. Give this club every remaining point and win
 *   it every tie, leave everyone else where they are. If it still misses, it
 *   cannot get in.
 *
 * Both are conservative — rivals play each other, so they cannot all win out —
 * which is the right direction for a guarantee. And because the verdict comes
 * from the same function that builds the bracket, the two can never disagree
 * about what a berth is.
 * ------------------------------------------------------------------------- */
function shadowTable(G, ptsOf) {
  return { ...G, teams: G.teams.map((t) => ({ ...t, pts: ptsOf(t) })) };
}
function inFieldOf(shadow, teamId) {
  const conf = shadow.teams[teamId].conf;
  if (ruleValue(shadow, "playoffFormat") === "seeded")
    return playoffField(shadow, conf).some((x) => x.team.id === teamId);
  const { top, wc } = playoffField(shadow, conf);
  return top.some((x) => x.team.id === teamId) || wc.some((t) => t.id === teamId);
}

function clinchState(G) {
  const out = {};
  const len = ruleValue(G, "seasonLen");
  const left = (t) => Math.max(0, len - (t.gp || 0));
  // Nothing to clinch before a game is played, and nothing left to say once
  // every game has been.
  if (!G.teams.some((t) => t.gp > 0) || !G.teams.some((t) => left(t) > 0)) return out;

  G.teams.forEach((t) => {
    // Worst case for this club: everyone else wins out and takes every tie.
    const worst = shadowTable(G, (u) => (u.id === t.id ? u.pts : u.pts + left(u) * 2 + 0.5));
    // Best case: this club wins out and takes every tie.
    const best = shadowTable(G, (u) => (u.id === t.id ? u.pts + left(u) * 2 + 0.5 : u.pts));
    const safe = inFieldOf(worst, t.id);
    const alive = inFieldOf(best, t.id);

    let mark = null;
    if (safe) {
      mark = "x";   // a berth, by whatever route
      if (ruleValue(G, "playoffFormat") !== "seeded") {
        // Sharper statements, where they're true: the division, or a top-three
        // place in it (which is a berth that owes nothing to the wildcard race).
        const rivals = G.teams.filter((u) => u.div === t.div && u.id !== t.id);
        const canPass = rivals.filter((u) => u.pts + left(u) * 2 >= t.pts).length;
        if (canPass === 0) mark = "z";
        else if (canPass <= 2) mark = "y";
      }
    }
    out[t.id] = { mark, eliminated: !alive };
  });
  return out;
}
const CLINCH_LABEL = {
  z: "has won the division",
  y: "has clinched a top-three place in the division",
  x: "has clinched a playoff berth",
};

/* -------------------------------- playoffs -------------------------------- */

function seriesLen(G) { return ruleValue(G, "seriesLen"); }
function winsNeeded(G) { return Math.ceil(seriesLen(G) / 2); }

function buildBracket(G) {
  const R = ruleValue(G, "playoffFormat");
  const rounds = [];
  const matchups = [];
  [0, 1].forEach((conf) => {
    /* ORDER IS THE BRACKET. `advancePlayoffRound` pairs adjacent survivors —
       slots 0-1 and 2-3 — so round one has to be pushed with the series that
       are meant to meet sitting next to each other. Pushing them in any other
       order silently ruins the seeding: listing all four 1-vs-8 style openers
       first put the 1 and 2 seeds in the SAME half, so they met in round two
       instead of the conference final. */
    if (R === "seeded") {
      const f = playoffField(G, conf);
      // 1/8 with 4/5, 2/7 with 3/6 — so the 1 seed's half is the soft one.
      [[0, 7], [3, 4], [1, 6], [2, 5]].forEach(([a, b]) => {
        if (f[a] && f[b]) matchups.push(mkSeries(G, f[a].team.id, f[b].team.id, conf));
      });
    } else {
      const { top, wc, divs } = playoffField(G, conf);
      const winnerOf = (d) => (top.find((x) => x.div === d && x.divRank === 1) || {}).team;
      const winners = divs.map(winnerOf);
      // The cross-division part of the format: the conference's stronger
      // division winner draws the LOWER wildcard, the weaker one the higher.
      const better = winners[0] && winners[1] && winners[0].pts >= winners[1].pts ? 0 : 1;
      const wcFor = {};
      wcFor[divs[better]] = wc[1] || wc[0];
      wcFor[divs[1 - better]] = wc[0];
      // Each division's two series go in ADJACENT slots, so their winners meet
      // in round two — that's what makes it a divisional bracket at all.
      divs.forEach((d) => {
        const one = winnerOf(d), w = wcFor[d];
        const two = top.find((x) => x.div === d && x.divRank === 2);
        const three = top.find((x) => x.div === d && x.divRank === 3);
        if (one && w) matchups.push(mkSeries(G, one.id, w.id, conf));
        if (two && three) matchups.push(mkSeries(G, two.team.id, three.team.id, conf));
      });
    }
  });
  rounds.push(matchups);
  G.playoffs = { round: 0, rounds, champion: null };
  return G.playoffs;
}
function mkSeries(G, hi, lo, conf) {
  return { hi, lo, conf, w: [0, 0], games: [], done: false, winner: null };
}

function simSeriesGame(G, s) {
  if (s.done) return s;
  const gameNo = s.w[0] + s.w[1];
  // 2-2-1-1-1 home ice.
  const homeIsHi = [0, 1, 4, 6].includes(gameNo);
  const home = homeIsHi ? s.hi : s.lo, away = homeIsHi ? s.lo : s.hi;
  // The user's playoff games get the same play-by-play and shot log his regular
  // season games get — a spring run is the part you most want to look back at.
  const mine = home === G.userTeam || away === G.userTeam;
  const res = simGame(G, home, away, { playoff: true, events: mine, log: mine });
  applyGame(G, res, { playoff: true });
  if (mine) {
    G.lastGame = { day: G.day, home, away, hg: res.hg, ag: res.ag,
      ot: res.ot, so: res.so, playoff: true, events: res.events || [], boxes: res.boxes };
  }
  const hiWon = (res.hg > res.ag) === homeIsHi;
  s.w[hiWon ? 0 : 1]++;
  // The DAY is what ties this game to its row in `G.results`, which is where
  // the scoring summary lives. Without it a series game is only a scoreline.
  s.games.push({ home, away, hg: res.hg, ag: res.ag, ot: res.ot, so: res.so, d: G.day });
  const need = winsNeeded(G);
  if (s.w[0] >= need || s.w[1] >= need) {
    s.done = true;
    s.winner = s.w[0] >= need ? s.hi : s.lo;
    const loser = s.winner === s.hi ? s.lo : s.hi;
    // Meeting in the spring is what makes it personal, and it stays that way.
    addGrudge(G, s.hi, s.lo);
    if (s.winner === G.userTeam) news(G, `You beat ${G.teams[loser].name} ${s.w[0]}–${s.w[1]}.`, "good");
    if (loser === G.userTeam) news(G, `Eliminated by ${G.teams[s.winner].name}.`, "bad");
  }
  return s;
}

/* One night of playoff hockey: a game in every series that's still alive. This
   is the default way to move through the postseason — a seven-game series is
   worth watching game by game, not resolving in a single click. `G.day` ticks
   so shot-log records still carry a day that increases. */
function simPlayoffDay(G) {
  if (!G.playoffs || G.playoffs.champion != null) return G;
  const cur = G.playoffs.rounds[G.playoffs.round];
  const live = cur.filter((s) => !s.done);
  if (!live.length) return advancePlayoffRound(G);
  live.forEach((s) => simSeriesGame(G, s));
  G.day++;
  playersOf(G).forEach((p) => {
    if (p.inj > 0) { p.inj--; if (p.inj === 0) { p.injDesc = ""; if (p.teamId != null) G.teams[p.teamId].lines = null; } }
    p.fatigue = clamp(p.fatigue - (p.pos === "G" ? 4.2 : 0.8), 0, 100);
  });
  if (cur.every((s) => s.done)) advancePlayoffRound(G);
  return G;
}

/* Every series in the round is finished — crown a champion or build the next
   bracket. Shared by the game-by-game path and the whole-round fast-forward, so
   the two can never disagree about how the postseason advances. */
function advancePlayoffRound(G) {
  const P = G.playoffs;
  const cur = P.rounds[P.round];
  if (cur.some((s) => !s.done)) return G;
  const winners = cur.map((s) => s.winner);
  if (winners.length === 1) {
    P.champion = winners[0];
    const t = G.teams[P.champion];
    t.cupWins++;
    // Rings go on the players, not just the club — a career is measured in them.
    rosterOf(G, P.champion).forEach((p) => {
      p.rings = p.rings || [];
      p.rings.push({ year: G.year, t: P.champion });
    });
    news(G, `${t.city} ${t.name} win the Cup.`, "good");
    finishSeason(G);
    return G;
  }
  // Reseed inside the conference, then cross over for the final.
  const next = [];
  if (winners.length === 8 || winners.length === 4) {
    [0, 1].forEach((conf) => {
      const cw = cur.filter((s) => s.conf === conf).map((s) => s.winner);
      for (let i = 0; i < cw.length; i += 2) {
        const a = cw[i], b = cw[i + 1];
        if (b == null) { next.push(mkSeries(G, a, a, conf)); continue; }
        const hi = G.teams[a].pts >= G.teams[b].pts ? a : b;
        const lo = hi === a ? b : a;
        next.push(mkSeries(G, hi, lo, conf));
      }
    });
  } else {
    const [a, b] = winners;
    const hi = G.teams[a].pts >= G.teams[b].pts ? a : b;
    next.push(mkSeries(G, hi, hi === a ? b : a, -1));
  }
  P.rounds.push(next);
  P.round++;
  return G;
}

// Fast-forward: play the current round out in one go.
function simPlayoffRound(G) {
  if (!G.playoffs || G.playoffs.champion != null) return G;
  const cur = G.playoffs.rounds[G.playoffs.round];
  let guard = 0;
  while (cur.some((s) => !s.done) && guard++ < 60) simPlayoffDay(G);
  return G;
}

function endRegularSeason(G) {
  G.phase = "playoffs";
  updateRecords(G);
  computeAwards(G);
  // The affiliates settle their own championship before the Cup gets going.
  runFarmPlayoffs(G);
  buildBracket(G);
  const field = new Set();
  G.playoffs.rounds[0].forEach((s) => { field.add(s.hi); field.add(s.lo); });
  field.forEach((id) => G.teams[id].playoffApps++);
  if (!field.has(G.userTeam)) news(G, "You missed the playoffs.", "bad");
  else news(G, "You're in the playoffs.", "good");
  return G;
}

/* ----------------------------- the Hall of Fame ----------------------------
 * Rings, trophies and honoured numbers all accumulate; this is what they were
 * for. Eligible three years after retiring, judged on a career score, and the
 * class is capped so induction stays worth something.
 * ------------------------------------------------------------------------- */
const HOF_WAIT = 3;         // years after retirement before he's on the ballot
/* How long a decorated but un-enshrined player is kept after he retires. The
   Hall and a retired number are for ever; a ring is not, or the save grows
   without a ceiling — see `pruneSave`. Long enough that nothing you can still
   click on ever goes missing. */
const HONOUR_YEARS = 30;
const HOF_CLASS_MAX = 3;    // inducted per year
const HOF_BAR = 62;         // career score needed

function hofScore(G, p) {
  const c = p.career || [];
  const gp = c.reduce((s, x) => s + (x.gp || 0), 0);
  if (!gp) return 0;
  if (p.pos === "G") {
    const sv = c.reduce((s, x) => s + (x.sv || 0), 0);
    const sa = c.reduce((s, x) => s + (x.sa || 0), 0);
    const w = c.reduce((s, x) => s + (x.w || 0), 0);
    const so = c.reduce((s, x) => s + (x.so || 0), 0);
    return w * 0.16 + so * 1.1 + (sa ? (sv / sa - 0.9) * 900 : 0)
      + (p.trophies || []).length * 9 + (p.rings || []).length * 7 + (p.allStars || []).length * 2;
  }
  const g = c.reduce((s, x) => s + (x.g || 0), 0);
  const a = c.reduce((s, x) => s + (x.a || 0), 0);
  return (g + a) * 0.11 + g * 0.05
    + (p.trophies || []).length * 9 + (p.rings || []).length * 7 + (p.allStars || []).length * 2;
}
function runHallOfFame(G) {
  G.hall = G.hall || [];
  const inducted = new Set(G.hall.map((h) => h.pid));
  const ballot = playersOf(G)
    .filter((p) => p.retired && !inducted.has(p.id))
    .filter((p) => p.retiredYear == null || G.year - p.retiredYear >= HOF_WAIT)
    .map((p) => ({ p, score: hofScore(G, p) }))
    .filter((x) => x.score >= HOF_BAR)
    .sort((a, b) => b.score - a.score)
    .slice(0, HOF_CLASS_MAX);
  ballot.forEach(({ p, score }) => {
    const c = p.career || [];
    G.hall.push({
      pid: p.id, name: fullName(p), pos: p.pos, year: G.year,
      score: Math.round(score),
      gp: c.reduce((s, x) => s + (x.gp || 0), 0),
      g: c.reduce((s, x) => s + (x.g || 0), 0),
      a: c.reduce((s, x) => s + (x.a || 0), 0),
      w: c.reduce((s, x) => s + (x.w || 0), 0),
      rings: (p.rings || []).length,
      trophies: (p.trophies || []).length,
      teamId: c.length ? c[c.length - 1].teamId : null,
    });
    p.hof = G.year;
    news(G, `${fullName(p)} has been elected to the Hall of Fame.`, "good");
  });
  return G.hall;
}

/* ------------------------------ record book -------------------------------
 * League records survive across seasons, and a player closing on one is worth
 * a line on the wire while it's still in doubt.
 * ------------------------------------------------------------------------- */

const RECORD_DEFS = [
  { key: "goals",   label: "Goals in a season",   pos: "S", get: (s) => s.g },
  { key: "points",  label: "Points in a season",  pos: "S", get: (s) => pts(s) },
  { key: "assists", label: "Assists in a season", pos: "S", get: (s) => s.a },
  { key: "pim",     label: "Penalty minutes",     pos: "S", get: (s) => s.pim },
  { key: "wins",    label: "Wins by a goalie",    pos: "G", get: (s) => s.w },
  { key: "shutouts", label: "Shutouts",           pos: "G", get: (s) => s.so },
];
const MILESTONES = { goals: [40, 50, 60], points: [80, 100, 120] };
/* Streaks. `POINT_STREAK_NEWS` is where the wire starts caring about your own
   player; `POINT_STREAK_LEAGUE` is where it's a story whoever he plays for. */
const POINT_STREAK_NEWS = 8, POINT_STREAK_LEAGUE = 15, WIN_STREAK_NEWS = 6;

/* Who led each category THIS season. The record book only ever kept the
   all-time best, so a year in which somebody scored 54 goals left no trace
   anywhere once a later season beat it — the league had a record holder and no
   history. Captured at the rollover, while `p.season` is still the season that
   just finished, and stored with the NAME as well as the id because
   `pruneSave` eventually forgets the player. */
function seasonLeaders(G) {
  const out = {};
  RECORD_DEFS.forEach((def) => {
    let best = null;
    playersOf(G).forEach((p) => {
      if ((def.pos === "G") !== (p.pos === "G")) return;
      if (!p.season.gp) return;
      const v = def.get(p.season);
      if (v > 0 && (!best || v > best.v)) best = { v, pid: p.id, name: fullName(p) };
    });
    if (best) out[def.key] = best;
  });
  return out;
}

function updateRecords(G) {
  G.records = G.records || {};
  RECORD_DEFS.forEach((def) => {
    playersOf(G).forEach((p) => {
      const isG = p.pos === "G";
      if ((def.pos === "G") !== isG) return;
      if (!p.season.gp) return;
      const v = def.get(p.season);
      const cur = G.records[def.key];
      if (!cur || v > cur.v) G.records[def.key] = { v, pid: p.id, name: fullName(p), year: G.year, team: p.teamId };
    });
  });
  /* Streaks don't live on a stat line, so they can't come through RECORD_DEFS —
     but they belong in the same book. The season's best point run by anybody,
     and the longest winning run any club put together. */
  playersOf(G).forEach((p) => {
    const v = p.bestStreak || 0;
    if (v < 3) return;
    const cur = G.records.pointStreak;
    if (!cur || v > cur.v) G.records.pointStreak = { v, pid: p.id, name: fullName(p), year: G.year, team: p.teamId };
  });
  G.teams.forEach((t) => {
    const v = t.wsMax || 0;
    if (v < 3) return;
    const cur = G.records.winStreak;
    if (!cur || v > cur.v) G.records.winStreak = { v, pid: null, name: `${t.city} ${t.name}`, year: G.year, team: t.id };
  });
  updateCareerRecords(G);
  return G.records;
}

/* ---------------------------- the career book ------------------------------
 * The record book held single SEASONS only, so the longest, most complete
 * careers in a save — the thing a twenty-year league is actually for — left no
 * mark on it anywhere. A man could play nine hundred games and score a thousand
 * points and the records page would never mention him.
 *
 * Totals include the season in progress, so the book is live rather than a year
 * behind, and the holder's name is stored for the same reason the season book
 * stores it: `pruneSave` forgets people.
 * ------------------------------------------------------------------------- */
const CAREER_RECORD_DEFS = [
  { key: "cGames",   label: "Games played",       pos: "S", get: (c) => c.gp },
  { key: "cGoals",   label: "Career goals",       pos: "S", get: (c) => c.g },
  { key: "cAssists", label: "Career assists",     pos: "S", get: (c) => c.a },
  { key: "cPoints",  label: "Career points",      pos: "S", get: (c) => c.g + c.a },
  { key: "cPim",     label: "Career penalty minutes", pos: "S", get: (c) => c.pim },
  { key: "cWins",    label: "Career wins",        pos: "G", get: (c) => c.w },
  { key: "cShutouts", label: "Career shutouts",   pos: "G", get: (c) => c.so },
];
// Everything he has done, this season included.
function careerTotals(p) {
  const t = { gp: 0, g: 0, a: 0, pim: 0, w: 0, so: 0 };
  (p.career || []).forEach((c) => Object.keys(t).forEach((k) => { t[k] += c[k] || 0; }));
  Object.keys(t).forEach((k) => { t[k] += (p.season && p.season[k]) || 0; });
  return t;
}
function updateCareerRecords(G) {
  G.careerRecords = G.careerRecords || {};
  playersOf(G).forEach((p) => {
    const isG = p.pos === "G";
    const tot = careerTotals(p);
    if (!tot.gp) return;
    CAREER_RECORD_DEFS.forEach((def) => {
      if ((def.pos === "G") !== isG) return;
      const v = def.get(tot);
      const cur = G.careerRecords[def.key];
      if (v > 0 && (!cur || v > cur.v)) {
        G.careerRecords[def.key] = { v, pid: p.id, name: fullName(p), year: G.year, team: p.teamId };
      }
    });
  });
  return G.careerRecords;
}

// Fires while the season is still running, for the user's players only. The
// marks are quoted for an 82-game year and scaled to whatever's being played,
// so a 41-game season still has a fifty-goal equivalent worth chasing.
function checkMilestones(G) {
  const scale = ruleValue(G, "seasonLen") / 82;
  rosterOf(G, G.userTeam).forEach((p) => {
    if (p.pos === "G") return;
    p.marks = p.marks || {};
    Object.entries(MILESTONES).forEach(([k, marks]) => {
      const v = k === "goals" ? p.season.g : pts(p.season);
      marks.forEach((m) => {
        const tag = `${k}${m}`;
        const target = Math.max(5, Math.round(m * scale));
        if (v >= target && !p.marks[tag]) {
          p.marks[tag] = true;
          news(G, `${fullName(p)} reached ${target} ${k} on the season.`, "good");
        }
      });
    });
  });
}

/* ------------------------------ the All-Star break ------------------------ */

function allStarRosters(G) {
  const pickSide = (conf) => {
    const pool = playersOf(G).filter((p) => p.teamId != null && G.teams[p.teamId].conf === conf && p.season.gp > 5);
    const fwd = pool.filter((p) => p.pos !== "D" && p.pos !== "G").sort((a, b) => pts(b.season) - pts(a.season)).slice(0, 6);
    const d = pool.filter((p) => p.pos === "D").sort((a, b) => pts(b.season) - pts(a.season)).slice(0, 3);
    const g = pool.filter((p) => p.pos === "G").sort((a, b) => svPct(b.season) - svPct(a.season)).slice(0, 1);
    return fwd.concat(d, g).map((p) => p.id);
  };
  return { east: pickSide(0), west: pickSide(1) };
}
function runAllStar(G) {
  const rosters = allStarRosters(G);
  const rate = (ids) => ids.map((id) => G.players[id]).filter(Boolean)
    .reduce((s, p) => s + (p.pos === "G" ? 0 : p.r.sht + p.r.hnd), 0);
  const e = rate(rosters.east), w = rate(rosters.west);
  const eastScore = Math.round(6 + gauss(G, (e - w) / 400, 2.2));
  const westScore = Math.round(6 + gauss(G, (w - e) / 400, 2.2));
  const mvpPool = (eastScore >= westScore ? rosters.east : rosters.west).map((id) => G.players[id]).filter(Boolean);
  const mvp = mvpPool.sort((a, b) => pts(b.season) - pts(a.season))[0];
  // Snapshot the club each player was picked for. A selection is a fact about
  // the moment it was made — a deadline trade to the other conference must not
  // retroactively put him on the wrong bench.
  const at = {};
  rosters.east.concat(rosters.west).forEach((id) => { at[id] = G.players[id].teamId; });
  G.allStar = {
    year: G.year, day: G.day, ...rosters,
    east: rosters.east, west: rosters.west, at,
    eastScore: Math.max(0, eastScore), westScore: Math.max(0, westScore),
    mvp: mvp ? mvp.id : null,
  };
  rosters.east.concat(rosters.west).forEach((id) => {
    const p = G.players[id];
    if (!p) return;
    p.allStars = p.allStars || [];
    if (!p.allStars.includes(G.year)) p.allStars.push(G.year);
  });
  const mine = rosters.east.concat(rosters.west).filter((id) => G.players[id] && G.players[id].teamId === G.userTeam);
  if (mine.length) news(G, `All-Star selections: ${mine.map((id) => fullName(G.players[id])).join(", ")}.`, "good");
  return G.allStar;
}

/* ---------------------------- the world tournament -------------------------
 * Every four years the midwinter break is somebody else's fortnight. Your best
 * player disappears to play for his country, comes back with a medal or a limp,
 * and for two weeks the league is not the only thing that matters.
 *
 * NATIONALITY IS DERIVED, never stored. `hashUnit(p.id)` against a weighted
 * table gives every player in the game — past, present, and the fourteen
 * hundred already in your save — a country for free: no save size, no draw, no
 * migration, and the same answer every time you ask. The weights are the shape
 * of the sport, so the two big hockey nations supply most of the league and the
 * rest are real but thin, which is what makes an upset an upset.
 *
 * Behind the `worldCup` rule and off by default, because a career that never
 * leaves the league is a perfectly good career.
 * ------------------------------------------------------------------------- */
const NATIONS = [
  { k: "CAN", name: "Canada", w: 0.42 },
  { k: "USA", name: "United States", w: 0.24 },
  { k: "SWE", name: "Sweden", w: 0.09 },
  { k: "FIN", name: "Finland", w: 0.07 },
  { k: "RUS", name: "Russia", w: 0.07 },
  { k: "CZE", name: "Czechia", w: 0.05 },
  { k: "SVK", name: "Slovakia", w: 0.03 },
  { k: "SUI", name: "Switzerland", w: 0.03 },
];
const WORLD_CUP_EVERY = 4;      // an Olympic rhythm
const WORLD_SQUAD = 20;
function nationOf(p) {
  if (!p) return NATIONS[0];
  let x = hashUnit(p.id * 7 + 13);
  for (let i = 0; i < NATIONS.length; i++) { x -= NATIONS[i].w; if (x <= 0) return NATIONS[i]; }
  return NATIONS[NATIONS.length - 1];
}
const worldCupYear = (G) => depthOn(G, "worldCup") && G.year % WORLD_CUP_EVERY === 0;
/* Who he'd pick. The season to date is the whole selection argument, which is
   why a hot winter is worth something beyond the standings. */
function worldSquad(G, key) {
  const pool = playersOf(G).filter((p) => p.teamId != null && !p.retired
    && nationOf(p).k === key && p.season && p.season.gp >= 5);
  const rank = (p) => (p.pos === "G" ? svPct(p.season) * 100 : pts(p.season) / Math.max(1, p.season.gp) * 40)
    + p.ovr * 0.6;
  const g = pool.filter((p) => p.pos === "G").sort((a, b) => rank(b) - rank(a)).slice(0, 2);
  const d = pool.filter((p) => p.pos === "D").sort((a, b) => rank(b) - rank(a)).slice(0, 6);
  const f = pool.filter((p) => p.pos !== "D" && p.pos !== "G").sort((a, b) => rank(b) - rank(a))
    .slice(0, WORLD_SQUAD - g.length - d.length);
  return g.concat(d, f).map((p) => p.id);
}
function squadStrength(G, ids) {
  const ps = ids.map((id) => G.players[id]).filter(Boolean);
  if (!ps.length) return 0;
  // The top of a national squad decides the game; the twentieth man never plays.
  const sorted = ps.slice().sort((a, b) => b.ovr - a.ovr).slice(0, 14);
  return round1(sorted.reduce((s, p) => s + p.ovr, 0) / sorted.length);
}
/* A straight eight-nation knockout. Seeded by squad, so the shape of an upset
   is the shape of an upset: possible every round, likelier the closer it is. */
function runWorldCup(G) {
  const entrants = NATIONS.map((n) => {
    const ids = worldSquad(G, n.k);
    return { ...n, ids, str: squadStrength(G, ids) };
  }).filter((n) => n.ids.length >= 10).sort((a, b) => b.str - a.str);
  if (entrants.length < 4) return null;
  const rounds = [];
  let alive = entrants.slice(0, 8);
  // Seed one against eight, and so on down.
  alive = alive.map((n, i) => n).sort((a, b) => b.str - a.str);
  let order = alive.slice();
  const bracket = [];
  for (let i = 0; i < Math.floor(order.length / 2); i++) bracket.push([order[i], order[order.length - 1 - i]]);
  let ties = bracket;
  let bronzePair = null;
  while (ties.length >= 1) {
    const results = ties.map(([a, b]) => {
      if (!b) return { a, b: null, aG: 0, bG: 0, win: a };
      const edge = (a.str - b.str) * 0.09;
      const aG = Math.max(0, Math.round(gauss(G, 2.9 + edge, 1.35)));
      let bG = Math.max(0, Math.round(gauss(G, 2.9 - edge, 1.35)));
      // Somebody has to go home, so a draw goes to overtime and one goal.
      if (aG === bG) return { a, b, aG: aG + 1, bG, win: rnd(G) < clamp(0.5 + edge * 0.5, 0.2, 0.8) ? a : b, ot: true };
      return { a, b, aG, bG, win: aG > bG ? a : b };
    });
    // Fix the overtime scoreline to match who actually won it.
    results.forEach((r) => { if (r.ot && r.win === r.b) { const t = r.aG; r.aG = r.bG; r.bG = t; } });
    rounds.push(results.map((r) => ({ a: r.a.k, b: r.b ? r.b.k : null, aG: r.aG, bG: r.bG, win: r.win.k, ot: !!r.ot })));
    const winners = results.map((r) => r.win);
    if (winners.length === 1) break;
    if (winners.length === 2) bronzePair = results.map((r) => (r.win === r.a ? r.b : r.a)).filter(Boolean);
    ties = [];
    for (let i = 0; i < winners.length; i += 2) ties.push([winners[i], winners[i + 1]]);
  }
  const final = rounds[rounds.length - 1][0];
  const gold = final.win;
  const silver = final.win === final.a ? final.b : final.a;
  let bronze = null;
  if (bronzePair && bronzePair.length === 2) {
    const [x, y] = bronzePair;
    const edge = (x.str - y.str) * 0.09;
    bronze = (rnd(G) < clamp(0.5 + edge * 0.35, 0.2, 0.8) ? x : y).k;
  }
  const champ = entrants.find((n) => n.k === gold);
  const mvp = champ.ids.map((id) => G.players[id]).filter(Boolean)
    .sort((a, b) => (pts(b.season) || 0) - (pts(a.season) || 0))[0];
  const cup = {
    year: G.year, gold, silver, bronze, rounds,
    mvp: mvp ? mvp.id : null,
    squads: entrants.reduce((m, n) => { m[n.k] = { ids: n.ids, str: n.str }; return m; }, {}),
  };
  // On the player, so a medal outlives the tournament that produced it.
  [["gold", gold], ["silver", silver], ["bronze", bronze]].forEach(([kind, key]) => {
    if (!key) return;
    (entrants.find((n) => n.k === key) || { ids: [] }).ids.forEach((id) => {
      const p = G.players[id];
      if (!p) return;
      p.medals = p.medals || [];
      p.medals.push({ year: G.year, kind, nation: key });
    });
  });
  G.worldCup = cup;
  G.worldCups = (G.worldCups || []).concat(cup);
  const mine = (champ.ids || []).filter((id) => G.players[id] && G.players[id].teamId === G.userTeam);
  news(G, `${NATIONS.find((n) => n.k === gold).name} win the world tournament`
    + (mine.length ? ` — ${mine.map((id) => fullName(G.players[id])).join(", ")} bring one home.` : "."),
    mine.length ? "good" : "info");
  return cup;
}

/* --------------------------------- awards --------------------------------- */

/* A ballot rather than a sort. `share` is the fraction of the vote each man
   got, so a runaway winner reads as one and a close race reads as one — which
   is most of what an awards page is for. Scores are shifted so the fifth-placed
   candidate sits near zero; otherwise every ballot comes out looking like a
   four-way tie, because the gap between first and fifth is small next to the
   absolute numbers. */
const BALLOT_SIZE = 5;
function ballot(cands, scoreFn, size) {
  const n = size || BALLOT_SIZE;
  const scored = cands.map((p) => ({ p, score: scoreFn(p) }))
    .filter((x) => isFinite(x.score))
    .sort((a, b) => b.score - a.score)
    .slice(0, n);
  if (!scored.length) return [];
  const floor = scored[scored.length - 1].score;
  const spread = scored.map((x) => Math.max(0, x.score - floor) + 0.12 * Math.abs(scored[0].score - floor || 1));
  const tot = spread.reduce((a, b) => a + b, 0) || 1;
  /* `val` is the RAW score, kept alongside the vote share. For the Hart or the
     Norris the share is the whole story and the raw number is an internal
     index nobody should see. For the scoring and goal-scoring titles it's the
     reverse: those are not votes at all, they're counts, and rendering "31% of
     the vote" next to a man who scored 54 goals was a made-up number sitting
     where the real one belonged. Storing both lets each award show the one
     that means something. */
  return scored.map((x, i) => ({ id: x.p.id, share: spread[i] / tot, val: x.score }));
}

/* The ballot's electorate: one entry per player, carrying the line the voters
 * are reading and the club record behind it.
 *
 * This is split out from `computeAwards` so the SAME vote can be run over a
 * season rebuilt from the career archive. A retroactive award and a live one
 * have to come out of one function — two implementations of "who was the MVP"
 * is two different records of the same season, and the one nobody is looking at
 * is always the one that drifts.
 * ------------------------------------------------------------------------- */
function awardPool(G, opts) {
  const o = opts || {};
  return playersOf(G).map((p) => {
    const s = o.lineOf ? o.lineOf(p) : p.season;
    if (!s || !s.gp) return null;
    return {
      id: p.id, p, s,
      clubPts: o.clubPtsOf ? o.clubPtsOf(p, s)
        : (p.teamId != null && G.teams[p.teamId] ? G.teams[p.teamId].pts : 0),
      rookie: o.rookieOf ? o.rookieOf(p) : !!p.rookie,
    };
  }).filter(Boolean);
}

function voteAwards(G, pool, year) {
  const sk = pool.filter((x) => x.p.pos !== "G" && x.s.gp > 10);
  const gs = pool.filter((x) => x.p.pos === "G" && x.s.gp > 15);
  const byPts = sk.slice().sort((a, b) => pts(b.s) - pts(a.s) || b.s.g - a.s.g);
  const byGoals = sk.slice().sort((a, b) => b.s.g - a.s.g);
  const rookiePool = pool.filter((x) => x.rookie && x.s.gp > 10);
  const clubPts = (x) => x.clubPts || 0;

  /* The MVP used to BE the scoring champion — the same id in two fields, so the
     two trophies could never disagree and the Hart meant nothing on its own.
     It's now its own argument: value on the ice, weighted by whether it carried
     a team anywhere. */
  /* Goalies are DISCOUNTED here, not boosted. Point shares systematically rate
     them above skaters — a starter's saves-over-replacement dwarfs a forward's
     goals-over-replacement — so scoring the Hart on raw shares handed it to a
     goaltender in every season tested. Real voters correct for exactly that,
     giving it to a netminder perhaps one year in ten. */
  const mvpScore = (x) => {
    const ps = pointShares(G, x.p, x.s);
    if (x.p.pos === "G") return ps.ps * 0.72 + clubPts(x) * 0.028;
    // For skaters, weight what he did WITH THE PUCK. Defensive shares come
    // mostly from ice time, so scoring the Hart on total shares handed it to a
    // defenceman five years in eight — the same flaw as the goalie case.
    return ps.ops * 1.5 + ps.dps * 0.3 + clubPts(x) * 0.028;
  };
  const votes = {
    mvp: ballot(sk.concat(gs), mvpScore),
    defence: ballot(sk.filter((x) => x.p.pos === "D"),
      (x) => pointShares(G, x.p, x.s).ps * 1.25 + x.s.blk * 0.012 + x.s.pm * 0.06
        + (x.s.toi / Math.max(1, x.s.gp)) * 0.18),
    goalie: ballot(gs.filter((x) => x.s.sa > 700),
      (x) => (svPct(x.s) - 0.885) * 240 + x.s.w * 0.09 + x.s.so * 0.35),
    // A rookie goaltender is eligible for the Calder, which sorting by points
    // quietly made impossible.
    rookie: ballot(rookiePool,
      (x) => (x.p.pos === "G"
        ? (svPct(x.s) - 0.885) * 200 + x.s.w * 0.08
        : pts(x.s) * 0.12 + pointShares(G, x.p, x.s).ps * 0.5)),
    scoring: ballot(sk, (x) => pts(x.s)),
    goals: ballot(sk, (x) => x.s.g),
  };
  const winner = (k) => (votes[k] && votes[k][0] ? votes[k][0].id : null);
  return {
    year,
    scoring: byPts[0] ? byPts[0].id : null,
    goals: byGoals[0] ? byGoals[0].id : null,
    mvp: winner("mvp"),
    defence: winner("defence"),
    goalie: winner("goalie"),
    rookie: winner("rookie"),
    votes,
  };
}

/* Hand the trophies out. Idempotent on (player, year, award), because the
   retroactive pass runs over seasons that may already have been settled — a
   save reloaded twice must not give the same man two of the same trophy. */
function awardTrophies(G, A) {
  Object.entries(A).forEach(([k, id]) => {
    if (k === "year" || k === "votes" || id == null) return;
    const p = G.players[id];
    if (!p) return;
    p.trophies = p.trophies || [];
    if (p.trophies.some((t) => t.year === A.year && t.award === k)) return;
    p.trophies.push({ year: A.year, award: k });
  });
  return A;
}

function computeAwards(G) {
  const A = voteAwards(G, awardPool(G), G.year);
  awardTrophies(G, A);
  G.awards = A;
  return A;
}

/* ---------------------------- awards, after the fact -----------------------
 * Awards arrived later than the seasons some careers had already played, so a
 * save carried years with no trophies at all and a player's bio was missing
 * silverware he had plainly earned. Two different holes, and this fills both:
 *
 *  1. A season that was never voted on. Rebuilt from the career archive and
 *     put through `voteAwards` — the same ballot the live season uses.
 *  2. A season that WAS voted on but whose trophies never reached the players.
 *     Cheap to fix and the more common of the two: the vote is already stored
 *     on the history row, so it just has to be handed out.
 *
 * Case 1 is only honest while the season is still reconstructible. `pruneSave`
 * collapses a retired man's seasons into one career total and eventually drops
 * him entirely, so an old enough year survives only as its stars — and electing
 * an MVP from forty surviving players is not a record, it's an invention. Below
 * `RETRO_MIN_POOL` skaters the year is left blank, which is the truthful
 * answer. Case 2 has no such problem: nothing is being decided, only delivered.
 * ------------------------------------------------------------------------- */
const RETRO_MIN_POOL = 220;   // skaters that must survive for a rebuilt vote to mean anything

/* One player's line for a finished season, rebuilt from his career rows. A
   traded year is stored one row per club, so the rows are summed back into the
   season the voters would actually have seen. A collapsed retired total is not
   a season and is ignored. */
function archivedLine(p, year) {
  const rows = (p.career || []).filter((c) => c.year === year && !c.total);
  if (!rows.length) return null;
  if (rows.length === 1) return rows[0];
  const line = {};
  rows.forEach((c) => Object.keys(c).forEach((k) => {
    if (k === "year" || k === "teamId" || k === "to" || typeof c[k] !== "number") return;
    line[k] = (line[k] || 0) + c[k];
  }));
  return line;
}

function backfillAwards(G) {
  let voted = 0, handed = 0;
  (G.history || []).forEach((h) => {
    if (!h || h.year == null) return;

    // Case 2 first — it's free, and it also covers the years case 1 just filled.
    if (h.awards) { awardTrophies(G, h.awards); handed++; return; }

    // Case 1: rebuild the season and put it to a vote.
    const ptsOf = {};
    (h.standings || []).forEach((s) => { ptsOf[s.id] = s.pts; });
    const lines = {};
    playersOf(G).forEach((p) => {
      const s = archivedLine(p, h.year);
      if (s && s.gp) lines[p.id] = s;
    });
    const pool = awardPool(G, {
      lineOf: (p) => lines[p.id],
      // The club he was with THAT year, not the one he plays for now.
      clubPtsOf: (p) => {
        const row = (p.career || []).find((c) => c.year === h.year && !c.total);
        return (row && ptsOf[row.teamId]) || 0;
      },
      // Nothing records who was a rookie, but a career's first season is one.
      // Wrong only for a man whose debut year has already been pruned away —
      // and he is not winning the Calder in a rebuilt vote anyway.
      rookieOf: (p) => {
        const first = (p.career || []).filter((c) => !c.total).map((c) => c.year).sort()[0];
        return first === h.year;
      },
    });
    if (pool.filter((x) => x.p.pos !== "G").length < RETRO_MIN_POOL) return;
    h.awards = awardTrophies(G, voteAwards(G, pool, h.year));
    h.retroAwards = true;   // so the history page can say the vote was reconstructed
    voted++;
  });
  return { voted, handed };
}

/* ------------------------------ end of season ----------------------------- */

function finishSeason(G) {
  G.phase = "offseason";
  G.offseasonStep = "review";
  // Before `p.season` is blanked further down — that line IS the bonus test.
  settleBonuses(G);
  const champ = G.playoffs && G.playoffs.champion;
  G.history.push({
    year: G.year,
    champion: champ,
    standings: G.teams.map((t) => ({ id: t.id, w: t.w, l: t.l, otl: t.otl, pts: t.pts })),
    awards: G.awards,
    // Captured here because `p.season` is blanked further down the rollover.
    leaders: seasonLeaders(G),
    userRecord: { w: G.teams[G.userTeam].w, l: G.teams[G.userTeam].l, otl: G.teams[G.userTeam].otl, pts: G.teams[G.userTeam].pts },
  });
  // Board reaction: making the playoffs is the baseline expectation.
  const me = G.teams[G.userTeam];
  const made = G.playoffs && G.playoffs.rounds[0].some((s) => s.hi === G.userTeam || s.lo === G.userTeam);
  // Judged against what the board actually asked for at the start of the year,
  // not against a flat "did you make the playoffs".
  const want = (G.mandate && G.mandate.need) || 1;
  const got = seasonAchievement(G);
  /* The board used to be unreasonable. `(got - want) * 9` is linear and blind:
     a club told to win the Cup that instead made the playoffs lost 27
     confidence — a good season, punished as hard as a collapse — and from a
     start of 62 that meant sacked in two years for reaching the postseason
     twice. A board that can't be satisfied isn't pressure, it's noise.
     Missing by a little is now cheap, and A SEASON IN THE PLAYOFFS IS NEVER
     A DISASTER whatever was asked. Missing them entirely still hurts, and
     hurts more the more was expected. */
  const gap = got - want;
  let swing;
  if (gap >= 0) swing = 8 + gap * 6;
  else if (got >= 1) swing = -Math.min(10, -gap * 3);
  else swing = -(12 + Math.max(0, want - 1) * 5);
  if (champ === G.userTeam) swing = Math.max(swing, 30);
  if (got >= want) news(G, `The board is satisfied: ${(G.mandate && G.mandate.label) || "expectations met"}.`, "good");
  else news(G, `The board wanted more: ${(G.mandate && G.mandate.label) || "expectations"}.`, "bad");
  G.lastMandate = { ...(G.mandate || {}), got, met: got >= want };
  G.boardConfidence = clamp(G.boardConfidence + (swing < 0 ? swing / diff(G).patience : swing * diff(G).patience), 0, 100);

  /* And the board can act on it. Confidence has been tracked and displayed
     since the first build while nothing whatsoever depended on it, which made
     every mandate advisory — you could miss the playoffs for a decade and keep
     the job. Winning the Cup buys a year no matter what came before it. */
  /* Once. Nothing cleared `G.fired` or moved the confidence that caused it, so
     the condition stayed true and the board sacked the same manager again at
     every rollover — eight entries in `G.tenure` for one unbroken spell in one
     job. Being already out of work is the guard. */
  /* A majority owner cannot be sacked by his own board — that is what the
     majority is for. A minority owner faces a vote instead, and every point of
     stake is a point of protection. */
  const shielded = depthOn(G, "ownership") && isMajorityOwner(G, G.userTeam);
  const votedOut = depthOn(G, "ownership") && !shielded && myShare(G, G.userTeam) > 0
    && rnd(G) < ownerVoteChance(G, G.userTeam);
  if (shielded && G.boardConfidence <= FIRING_LINE) {
    news(G, `The board would move against you, but you own the club.`, "info");
    G.boardConfidence = Math.max(G.boardConfidence, FIRING_LINE + 8);
  }
  if (depthOn(G, "ownership") && !shielded && myShare(G, G.userTeam) > 0
      && G.boardConfidence <= FIRING_LINE && !votedOut) {
    news(G, `Your partners considered a vote and let it lie. Your stake spoke for you.`, "info");
  }
  if (!shielded && champ !== G.userTeam && G.boardConfidence <= FIRING_LINE && !G.fired
      && (myShare(G, G.userTeam) <= 0 || votedOut)) {
    G.tenure = (G.tenure || []).concat([{
      teamId: G.userTeam,
      from: G.hiredYear != null ? G.hiredYear : G.year - (G.teams[G.userTeam].seasons || []).length + 1,
      to: G.year,
      cups: (G.teams[G.userTeam].cupWins || 0),
    }]);
    G.fired = { year: G.year, teamId: G.userTeam, mandate: (G.mandate && G.mandate.label) || "expectations" };
    news(G, `You have been relieved of your duties by the ${G.teams[G.userTeam].name}.`, "bad");
  }

  // Ageing, progression and contract expiry all happen HERE rather than at the
  // rollover, so that the offseason screens show next year's ratings and a real
  // free-agent class instead of last year's leftovers.
  playersOf(G).forEach((p) => {
    if (p.season.gp) {
      // The shot maps are a this-season view; carrying nine net cells and three
      // ice zones into every career row for every player is what pushes a long
      // save past the storage ceiling.
      const { z, net, ...totals } = p.season;
      const spells = (p.stints || []).filter((st) => st.s.gp);
      if (spells.length > 1) {
        // A traded year goes into the record as one row per club, which is how
        // a real career table reads it. Each spell's shares are computed from
        // that spell's own line, so the rows still sum to the season.
        spells.forEach((st) => p.career.push(stampShares(G, p, { year: G.year, teamId: st.t, ...st.s })));
      } else {
        p.career.push(stampShares(G, p, { year: G.year, teamId: spells.length ? spells[0].t : p.teamId, ...totals }));
      }
    }
    p.stints = null;
    /* Last season's line is kept for the UI, but WITHOUT the nine net cells and
       three ice zones — the shot maps are a current-season view and nothing
       reads `p.stats.z` or `p.stats.net`. Carrying them was ~240 bytes on every
       player in the league for a year, for data no screen ever showed. */
    const { z: _lz, net: _ln, ...lastYear } = p.season;
    p.stats = stampShares(G, p, lastYear);
    p.season = blankStats(p.pos);
    /* A run doesn't carry across a summer. The CAREER best does, which is the
       whole reason it's worth keeping — one number a man carries for ever. */
    p.streak = 0;
    // A playoff run used to be thrown away at the rollover, which meant a
    // twenty-year career had no postseason record at all. Keep the running
    // total and a count of the springs he played.
    if (p.po && p.po.gp) {
      if (!p.careerPO) { p.careerPO = blankStats(p.pos); delete p.careerPO.z; delete p.careerPO.net; }
      Object.keys(p.careerPO).forEach((k) => {
        if (typeof p.careerPO[k] === "number" && typeof p.po[k] === "number") p.careerPO[k] += p.po[k];
      });
      p.poRuns = (p.poRuns || 0) + 1;
    }
    /* Held until AFTER `progress`. The spring is part of what the year taught
       him — clearing it here meant development could never see it, which is
       why a prospect called up for a playoff run learned nothing from it. */
    const poLine = p.po;
    p.po = null;
    /* Rookie status is about his first season IN THE LEAGUE, not his first
       season after being drafted. Clearing it unconditionally meant a prospect
       who spent a year on the farm — which is most of them — arrived in the
       NHL already ineligible for the Calder, and the award went by default to
       whoever happened to jump straight from the draft. He stays a rookie until
       he has actually played a real NHL season. */
    if (p.rookie && (p.stats.gp || 0) >= rookieGames(G)) p.rookie = false;
    p.age++;
    // A summer is long enough to heal anything and shake off any rust.
    p.inj = 0; p.injDesc = ""; p.fatigue = 0;
    p.rust = 0; p.rustFrom = 0; p.rustKey = null; p.injGames = 0;
    progress(G, p, poLine);
    if (p.contract.yrs > 0) p.contract.yrs--;
  });
  playersOf(G).forEach((p) => {
    if (p.retired || p.teamId == null) return;
