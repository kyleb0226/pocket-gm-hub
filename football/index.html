function rollRatings(pos, target){
  const w = RW[GROUP(pos)]; let r = w.map(() => clamp(round(gauss(target, 6)), 25, 99));

  return r;
}

    home: town[0] + ", " + town[1], hs: (chance(.5) ? town[0] + " " : pick(LAST) + " ") + pick(HS_SUFFIX),
    num: rint(1, 99), gpa: clamp(+(gauss(3.0, .45)).toFixed(2), 1.8, 4.0), chr: clamp(round(gauss(60, 18)), 5, 99),

  else if (pos === "RB") { s.ra = n(g * 15.5); s.ry = round(s.ra * (3.7 + q * .035)); s.rtd = n(s.ry / 105); s.rec = n(g * 2.2); s.tg = s.rec + n(g * .8); s.rcy = n(s.rec * 7.6); s.rctd = n(g * .08); }
  else if (pos === "WR") { s.rec = n(g * (2.4 + q * .1)); s.tg = round(s.rec * 1.6); s.rcy = n(s.rec * 13.2); s.rctd = n(s.rcy / 145); }
  else if (pos === "TE") { s.rec = n(g * (1.6 + q * .07)); s.tg = round(s.rec * 1.5); s.rcy = n(s.rec * 11); s.rctd = n(s.rcy / 150); }
  else if (GROUP(pos) === "OL") { s.pk = n(g * (2 + q * .09)); s.sal = n(g * .22); }

function proAwards(G){

  proVoted(G, all).forEach(([name, pool, f, note]) => { const w = voteAward(G, A, name, pool.map(p => [p, f(p)]), 50); give(name, w, note); if (w && isUser(G, w.tid)) { news(G, `Your ${w.pos} ${pname(w)} is the ${name}.`, "award", w.tid); gainLP(G, /Valuable/.test(name) ? 6 : 3, name); } });

  A.coy = { name: coy.coach.name, tid: coy.id, rec: coy.w + "-" + coy.l }; coy.coach.aw.push([G.year, "Coach of the Year"]);

  const [a1, a2] = allTeams(G, all); a1.forEach(p => p.aw.push([G.year, "First-team All-Pro"])); a2.forEach(p => p.aw.push([G.year, "Second-team All-Pro"]));
  A.ap1 = a1.map(p => ref(G, p)); A.ap2 = a2.map(p => ref(G, p));

  const h = seasonHist(G); h.proAwards = A.list; h.ap1 = A.ap1; h.coyPro = A.coy;

/* ----------------------------- record books ----------------------------- */
const REC_KEYS = [["py","Passing yards"],["ptd","Passing TD"],["ry","Rushing yards"],["rtd","Rushing TD"],["rec","Receptions"],["rcy","Receiving yards"],["rctd","Receiving TD"],["tk","Tackles"],["sck","Sacks"],["int","Interceptions"],["fgm","Field goals"]];
function careerTotals(p, lvl){ const o = {}; p.hist.forEach(r => { if (r.lvl !== lvl) return; STAT_KEYS.concat(["g", "gs"]).forEach(k => { if (r[k]) o[k] = (o[k] || 0) + r[k]; }); }); return o; }
// Close the books on a season: stamp league leaders, push the history row, update records.
// Championship rings: one for every title a player's team won while he was on it. Derived from the
// season history, so old saves get them too; p.rg only covers pros who never got into a game that year.
function ringsOf(G, p){
  const out = [], seen = {}, add = (y, lvl, tid) => { const k = y + lvl; if (seen[k]) return; seen[k] = 1; out.push({ y, lvl, tid }); };
  (G.hist || []).forEach(h => {
    const rows = p.hist.filter(r => r.y === h.y);
    rows.forEach(r => { if (r.lvl === "C" && r.tid === h.natChamp) add(h.y, "C", r.tid); if (r.lvl === "P" && r.tid === h.proChamp) add(h.y, "P", r.tid); });
    if (!rows.length && h.y === G.year && G.phase !== "off" && p.tid != null && !p.ret) { if (p.tid === h.natChamp) add(h.y, "C", p.tid); if (p.tid === h.proChamp) add(h.y, "P", p.tid); }
  });
  (p.rg || []).forEach(r => add(r[0], r[1], r[2]));
  return out.sort((a, b) => a.y - b.y);
}
function archiveStats(G){
  [["C", colPlayers(G), G.records.col, G.records.colCareer], ["P", proPlayers(G), G.records.pro, G.records.proCareer]].forEach(([lvl, pool, seasonRec, careerRec]) => {
    const lead = {}; REC_KEYS.forEach(([k]) => { let b = null; pool.forEach(p => { if ((p.st[k] || 0) > (b ? b.st[k] : 0)) b = p; }); if (b) (lead[b.id] || (lead[b.id] = [])).push(k); });
    pool.forEach(p => {
      if (!(p.st.g > 0)) { if (lvl === "C" && p.cls != null) p.hist.push(histRow(G, p, T(G, p.tid), lvl, { g: 0 }, { cls: CLS[p.cls], dnp: 1 })); return; }
      const t = T(G, p.tid), st = Object.assign({}, p.st), extra = lvl === "C" ? { cls: CLS[p.cls] } : {}; if (lead[p.id]) extra.ld = lead[p.id]; if (p.inj || p.bigInj === G.year) extra.inj = 1;
      p.hist.push(histRow(G, p, t, lvl, st, extra));
      const car = careerTotals(p, lvl);
      REC_KEYS.forEach(([k]) => {
        if ((st[k] || 0) > ((seasonRec[k] || {}).v || 0)) seasonRec[k] = { v: st[k], pid: p.id, n: pname(p), t: t.abbr, y: G.year };
        if ((car[k] || 0) > ((careerRec[k] || {}).v || 0)) careerRec[k] = { v: car[k], pid: p.id, n: pname(p), t: t.abbr, y: G.year };
      });
    });
  });
}

/* ----------------------------- offseason ----------------------------- */
// Steps the Advance button walks through once the title games are played.
const OFF_STEPS = ["Season review", "Re-signing", "Free agency", "The Draft", "Portal & Signing Day", "Training camp"];
const draftValue = p => p.ovr * .68 + p.pot * .32 + ({ QB: 2.5, K: -13, P: -14, C: -2, OG: -1.5, S: -1, RB: -1 }[p.pos] || 0);
const awardScore = (p, pro) => sum(p.aw, ([, a]) => pro
  ? (a === "Most Valuable Player" ? 25 : /Player of the Year/.test(a) ? 12 : a === "First-team All-Pro" ? 8 : a === "Second-team All-Pro" ? 4 : a === "Pro Bowl" ? 2.5 : a === "Pocket Bowl MVP" ? 6 : 0)
  : (a === "Heisman Trophy" ? 30 : /All-American$/.test(a) && !/Second|Freshman/.test(a) ? 12 : a === "Second-team All-American" ? 5 : /Award|Trophy$|Golden Arm/.test(a) && !/finalist|Joe Moore/.test(a) ? 10 : /^First-team All-/.test(a) ? 2 : 0));
const notable = p => p.hof || p.chof || awardScore(p, false) >= 10 || awardScore(p, true) >= 4 || (p.exp || 0) >= 7;
function retire(G, p, why){
  honourPro(G, p);
  p.ret = G.year; p.tid = null; delete p.fa; delete p.c; G._ros = null;
  if (p.exp != null && awardScore(p, true) + (careerTotals(p, "P").g || 0) / 16 >= 45 && !p.hof) { p.hof = G.year; G.hof.push(p.id); news(G, `${pname(p)} (${p.pos}) retires and is headed for the Pro Hall of Fame.`, "hof"); }
  if (!notable(p)) dropP(G, p);
}
function leaveCollege(G, p){
  honourCol(G, p);
  if (awardScore(p, false) >= 34 && !p.chof) { p.chof = G.year; G.colHof.push(p.id); }
  p.col = p.tid; delete p.portal; delete p.stay;
}
const payroll = (G, tid) => sum(rosterOf(G, tid), p => p.c ? p.c.amt : 0) + ((G.dead && G.dead[tid]) || 0);
const capRoom = (G, tid) => CAP - payroll(G, tid);
const askOf = (G, p) => +Math.max(.9, salaryFor(p) * (G.capK || 1)).toFixed(2);
function toFA(G, p){ if (p.tid != null) p.lastT = p.tid; p.fa = 1; p.tid = null; delete p.c; G._ros = null; }

function beginOffseason(G){
  archiveStats(G); seasonLP(G);
  if (G.preds.proChamp != null) { if (G.preds.proChamp === G.pp.champ) gainLP(G, 10, "called the pro champion in the preseason"); }
  // --- coaching carousel ---
  const fired = [];
  G.col.forEach(t => { if (isUser(G, t.id)) return; const h = t.hist.slice(-3), c = t.coach; c.age++;
    const exp = (t.prestige - 45) / 52 * .62 + .2, got = avgOf(h, r => r.w / Math.max(1, r.w + r.l), .5);
    if ((G.year - c.since >= 2 && got < exp - .2 && chance(.6)) || c.age > 72) fired.push(t); });
  fired.sort((a, b) => b.prestige - a.prestige).forEach(t => {
    const old = t.coach, risers = G.col.filter(x => x.prestige < t.prestige - 8 && !fired.includes(x) && !isUser(G, x.id) && coachScore(x) > 2.5).sort((a, b) => coachScore(b) - coachScore(a));
    if (risers.length && chance(.65)) { const from = risers[0]; t.coach = from.coach; t.coach.since = G.year + 1; from.coach = makeCoach(G, 30 + from.prestige * .5); from.coach.since = G.year + 1; fired.push(from);
      news(G, `${t.name} hires ${t.coach.name} away from ${from.name} after parting ways with ${old.name}.`, "coach", t.id); }
    else { t.coach = makeCoach(G, 34 + t.prestige * .5); t.coach.since = G.year + 1; if (t.prestige >= 70) news(G, `${t.name} fires ${old.name} and hires ${t.coach.name}.`, "coach", t.id); }
  });
  G.openJobs = fired.filter(t => !isUser(G, t.id)).map(t => t.id);
  G.openPro = [];
  G.pro.forEach(t => { if (isUser(G, t.id)) return; const h = t.hist.slice(-2); t.coach.age++; if (h.length === 2 && h.every(r => r.w <= 5) && G.year - t.coach.since >= 1) { const old = t.coach; G.openPro.push(t.id); t.coach = makeCoach(G, 68); t.coach.since = G.year + 1; news(G, `The ${t.nick} fire ${old.name}; ${t.coach.name} takes over.`, "coach", t.id); } });
  G.fans = clamp((G.fans == null ? 55 : G.fans) * .85 + 8 + (/National Champions|Won Pocket Bowl/.test((userTeam(G).hist[userTeam(G).hist.length - 1] || {}).post || "") ? 14 : 0), 0, 100);
  jobReview(G); staffOffseason(G); realignment(G); eraShift(G); G.nego = {}; G.dead = {};
  // --- pro: retirements and expiring deals ---
  proPlayers(G).concat(Object.values(G.players).filter(p => p.fa)).forEach(p => {
    const old = p.age >= 38 || (p.age >= 35 && chance(.5)) || (p.age >= 31 && p.ovr < 72 && chance(.45)) || (p.fa && (p.age >= 29 || p.ovr < 64));
    if (old) { if (isUser(G, p.tid) || p.ovr >= 86 || awardScore(p, true) >= 20) news(G, `${pname(p)} (${p.pos}, ${p.age}) announces his retirement.`, "ret", p.tid); return retire(G, p); }
    if (p.c && --p.c.yrs <= 0) p.expiring = 1;
  });
  // --- college: seniors and early entrants leave ---
  const pool = [];
  colPlayers(G).forEach(p => {
    const t = T(G, p.tid), dv = draftValue(p), early = p.cls === 2 && !p.stay && (dv >= 79 || (dv >= 75 && chance(.5)));
    if ((p.cls === 3 && p.rs !== G.year) || early) { p.dcl = G.year; p.tx.push([G.year, early ? `Declared early for the draft (${t.name})` : `Finished his eligibility at ${t.name}`]); leaveCollege(G, p); p.tid = null; pool.push(p);
      if (early && (isUser(G, t.id) || dv >= 84)) news(G, `${t.name} ${p.pos} ${pname(p)} declares for the draft.`, "draft", t.id); }
  });
  G._ros = null;
  pool.sort((a, b) => draftValue(b) - draftValue(a));
  pool.slice(420).forEach(p => { p.ret = G.year; if (!notable(p)) dropP(G, p); });
  const order = G.pro.slice().sort((a, b) => { const d = t => { const r = (t.hist[t.hist.length - 1] || {}).post || ""; return r === "Won Pocket Bowl" ? 5 : r === "Lost Pocket Bowl" ? 4 : /Conf/.test(r) ? 3 : /Div/.test(r) ? 2 : /Wild/.test(r) ? 1 : 0; }; return d(a) - d(b) || winPct(a) - winPct(b); }).map(t => t.id);
  G.draft = { pool: pool.slice(0, 420).map(p => p.id), order: applyPickOwn(G, order).concat(compPicks(G)), pick: 0, log: [], done: false, rank: {} };
  G.draft.pool.forEach((id, i) => (G.draft.rank[id] = i + 1)); G.ivLeft = 30;
  // --- transfer portal entries ---
  G.portal = [];
  G.col.forEach(t => { const d = depthChart(G, t.id); POS.forEach(pos => d[pos].forEach((p, i) => {
    if (p.stay || p.cls == null || p.cls >= 3) return;
    const buried = i >= STARTERS[pos] && p.ovr >= 66 && p.cls >= 1, big = i < STARTERS[pos] && p.ovr >= 76 && t.prestige < 66;
    if ((buried && chance(.3)) || (big && chance(.35)) || chance(.012)) { p.portal = 1; G.portal.push(p.id); } }));
  });
  promiseReview(G);
  genRecruits(G);
  G.pitchLeft = 15 + (G.bonusPitch || 0) + staffBonus(G, "rc"); G.bonusPitch = 0; G.pitches = {}; nilReset(G);
  if (G.mode === "pro") G.ivLeft += staffBonus(G, "sc") * 2 + ((G.fac || {}).recruit || 0) * 3;
  news(G, `The ${G.year} season is in the books. ${G.draft.pool.length} prospects are in the draft pool, ${G.portal.length} players have entered the transfer portal, and ${G.rec.length} recruits are waiting on Signing Day.`, "off");
}

function jobOffers(G){
  const t = userTeam(G), score = coachScore(t);
  const jobs = (G.openJobs || []).map(id => T(G, id)).filter(x => x.prestige > t.prestige + 3 && x.prestige < t.prestige + 12 + score * 5).sort((a, b) => b.prestige - a.prestige).slice(0, 3);
  if (!jobs.length || score < 1.5) return;
  G.events.push({ id: ++G.gid, key: "job", w: 99, title: "Job offers", body: `Your ${t.w}-${t.l} season at ${t.name} got noticed. ${jobs.map(j => j.name).join(", ")} ${jobs.length > 1 ? "have" : "has"} called. Taking a job moves you to that program for good — your record and trophies come with you.`, ctx: { jobs: jobs.map(j => j.id) }, opts: [...jobs.map(j => ({ l: "Take the " + j.name + " job", d: `${G.confs[j.conf].name} · prestige ${round(j.prestige)}` })), { l: "Stay at " + t.name, d: "Loyalty: +4 Legacy Points and a morale boost" }] });
}

/* --- pro roster moves --- */

  const t = userTeam(G); if (t.pro) return [];
  return G.col.filter(x => x.id !== t.id && (x.conf !== t.conf || t.conf === "IND")).map(x => ({ t: x, kind: x.prestige <= t.prestige - 14 ? "Cupcake" : x.prestige >= 84 && x.prestige >= t.prestige - 10 ? "Marquee" : x.prestige >= t.prestige - 5 ? "Even fight" : "Should win" })).sort((a, b) => b.t.prestige - a.t.prestige);
}
function toggleWish(G, tid){ G.ncWish = G.ncWish || []; const i = G.ncWish.indexOf(tid); if (i >= 0) G.ncWish.splice(i, 1); else if (G.ncWish.length < 3) G.ncWish.push(tid); }

/* ----------------------------- contract talks (pro) ----------------------------- */
const wantYears = p => p.age <= 28 ? 4 : p.age <= 30 ? 3 : p.age <= 32 ? 2 : 1;
const baseAsk = (G, p) => p.fa ? askFor(G, p, G.uid) : askOf(G, p);
// How the player's side scores an offer against what he's asking: 1.0 or better gets signed.
function offerScore(G, p, o){ return o.amt * (1 + (o.gtd - .3) * .35) * (1 - Math.abs(o.yrs - wantYears(p)) * .045) / baseAsk(G, p); }
function negotiate(G, p, o){
  G.nego = G.nego || {}; const s = G.nego[p.id] || (G.nego[p.id] = { tries: 0 });
  if (s.walked) return { ok: false, msg: "His agent isn't taking your calls any more this year." };
  const room = capRoom(G, G.uid) + (p.tid === G.uid && p.c ? p.c.amt : 0); if (o.amt > room) return { ok: false, msg: `That doesn't fit: you have ${money(Math.max(0, room))} of room.` };
  if (p.fa && rosterOf(G, G.uid).length >= 58) return { ok: false, msg: "Your roster is full." };
  const lc = s.counter, meets = lc && o.amt >= lc.amt - .005 && o.gtd >= lc.gtd - .005 && o.yrs === lc.yrs, r = meets ? 1 : offerScore(G, p, o);
  if (r >= 1 || (r >= .95 && chance(.5))) {
    if (p.fa) signFA(G, p, G.uid, o.yrs, +o.amt.toFixed(2)); else { p.c = { amt: +o.amt.toFixed(2), yrs: o.yrs }; delete p.expiring; p.tx.push([G.year, `Re-signed with the ${T(G, p.tid).nick} (${o.yrs} yr, ${money(o.amt)})`]); }
    p.c.gtd = +o.gtd.toFixed(2); delete G.nego[p.id];
    return { ok: true, msg: r >= 1.12 ? "His agent says yes before you finish the sentence." : "Deal. He signs." };
  }
  s.tries++;
  if (s.tries >= 4 || (r < .72 && chance(.6))) { s.walked = true; return { ok: false, walked: true, msg: r < .72 ? "Insulted, his agent hangs up. Talks are over for this year." : "Four rounds in, his side walks away from the table." }; }
  const wy = wantYears(p), ask = baseAsk(G, p), c = { yrs: wy, gtd: .4, amt: +(ask * (1 - .035 * s.tries) / (1 + (.4 - .3) * .35)).toFixed(2) };
  s.counter = c;
  return { ok: false, counter: c, msg: r >= .9 ? "Close. They come back with a number." : o.yrs !== wy && Math.abs(o.yrs - wy) >= 2 ? `He wants a ${wy}-year deal, not ${o.yrs}.` : o.gtd < .2 ? "Not enough guaranteed. They counter." : "Too light. They counter." };
}
/* ----------------------------- franchise tag + fifth-year option ----------------------------- */
function tagCost(G, p){ const top = proPlayers(G).filter(x => x.pos === p.pos && x.c).sort((a, b) => b.c.amt - a.c.amt).slice(0, 5); return +Math.max(askOf(G, p) * 1.15, avgOf(top, x => x.c.amt, 0)).toFixed(2); }
function tagPlayer(G, p){ if (G.tagUsed === G.year || !p.expiring || p.tid !== G.uid) return false; p.c = { amt: tagCost(G, p), yrs: 1, tag: 1, gtd: 1 }; delete p.expiring; G.tagUsed = G.year; p.tx.push([G.year, `Franchise-tagged by the ${T(G, p.tid).nick} (${money(p.c.amt)})`]); news(G, `The ${T(G, p.tid).nick} place the franchise tag on ${p.pos} ${pname(p)}.`, "fa", p.tid); return true; }
const canOption = p => !!(p.expiring && p.draft && p.draft.rd === 1 && !p.opt && (p.exp || 0) <= 4);
function fifthYear(G, p){ if (!canOption(p)) return false; p.c = { amt: +(askOf(G, p) * .9).toFixed(2), yrs: 1, gtd: 1 }; p.opt = 1; delete p.expiring; p.tx.push([G.year, `Fifth-year option picked up (${money(p.c.amt)})`]); return true; }

/* ----------------------------- draft day: offers to move down ----------------------------- */
function tradeDownOffers(G){
  const d = G.draft; if (!d || d.done || onClock(G) !== G.uid) return [];
  const i = d.pick, v0 = pickVal(i + 1), out = [], seen = new Set();
  for (let j = i + 2; j < Math.min(d.order.length, i + 34) && out.length < 3; j++) { const tid = d.order[j]; if (tid === G.uid || seen.has(tid)) continue; seen.add(tid);
    if (hk(tid * 131 + i, "td") > .55) continue;                                   // not everyone wants up
    const need = v0 * (1.02 + hk(tid + i, "tdp") * .2) - pickVal(j + 1); let k = -1, best = 1e9;
    for (let x = j + 1; x < d.order.length; x++) if (d.order[x] === tid) { const diff = Math.abs(pickVal(x + 1) - need); if (diff < best) { best = diff; k = x; } }
    if (k < 0 || pickVal(j + 1) + pickVal(k + 1) < v0 * .92) continue;
    out.push({ tid, i, j, k, v: +(pickVal(j + 1) + pickVal(k + 1)).toFixed(1), v0: +v0.toFixed(1) }); }
  return out;
}
function acceptTradeDown(G, o){
  const d = G.draft; if (!d || d.pick !== o.i || d.order[o.j] !== o.tid || d.order[o.k] !== o.tid) return false;
  d.order[o.i] = o.tid; d.order[o.j] = G.uid; d.order[o.k] = G.uid; const t = T(G, o.tid);
  (G.trades = G.trades || []).unshift({ y: G.year, w: 0, a: G.uid, b: o.tid, ga: `pick No. ${o.i + 1}`, gb: `picks No. ${o.j + 1} and No. ${o.k + 1}` });
  news(G, `DRAFT TRADE: the ${t.nick} move up to No. ${o.i + 1}, sending picks ${o.j + 1} and ${o.k + 1} to the ${userTeam(G).nick}.`, "draft", o.tid);
  draftRun(G, false); return true;
}
/* ----------------------------- compensatory picks ----------------------------- */

/* ----------------------------- fans and owner ----------------------------- */

/* ----------------------------- record watch ----------------------------- */
function recordWatch(G, w){
  if (w < 7) return; G.recWatch = G.recWatch || {};
  [["col", colPlayers(G), COL_WEEKS - 2, "college"], ["pro", proPlayers(G), PRO_WEEKS, "pro"]].forEach(([lvl, pool, N, label]) => {
    if (w > N + (lvl === "col" ? 2 : 0)) return;
    REC_KEYS.forEach(([k, name]) => { const r = G.records[lvl][k]; if (!r || !r.v) return; let top = null; for (const p of pool) if ((p.st[k] || 0) > (top ? top.st[k] : 0)) top = p; if (!top || (top.st.g || 0) < 6) return;
      const t = T(G, top.tid), key = lvl + k + top.id, v = top.st[k];
      if (v > r.v && !G.recWatch[key + "b"]) { G.recWatch[key + "b"] = 1; news(G, `RECORD: ${t ? t.abbr + " " : ""}${top.pos} ${pname(top)} now has ${v.toLocaleString()} ${name.toLowerCase()}, breaking ${r.n}'s ${label} single-season mark of ${r.v.toLocaleString()} (${r.y}).`, "award", top.tid); if (isUser(G, top.tid)) gainLP(G, 3, "a record broken"); }

}

function gainLP(G, n, why){ G.lp = (G.lp || 0) + n; G.lpLog = G.lpLog || []; G.lpLog.unshift([G.year, G.week, n, why]); if (G.lpLog.length > 40) G.lpLog.length = 40; }

/* ----------------------------- pick'em & predictions ----------------------------- */
function makeSlate(G){
  const w = G.week, col = G.cs.filter(g => g.w === w && !g.done && g.a >= 0), pro = G.ps.filter(g => g.w === w && !g.done);
  const heat = g => { const h = T(G, g.h), a = T(G, g.a); return (h.rank ? 30 - h.rank : 0) + (a.rank ? 30 - a.rank : 0) + (g.riv != null ? 14 : 0) + (g.post ? 40 : 0) - Math.abs(h.pw - a.pw) * .5; };
  const games = (w >= 15 ? col : col.sort((x, y) => heat(y) - heat(x)).slice(0, 5)).concat(pro.sort((x, y) => (winPct(T(G, y.h)) + winPct(T(G, y.a))) - (winPct(T(G, x.h)) + winPct(T(G, x.a)))).slice(0, w > PRO_WEEKS ? 8 : 3));
  G.slate = { w, games: games.map(g => ({ gid: g.id, pick: null })) };
}
function resolvePicks(G, w){
  const s = G.slate; if (!s || s.w !== w) return; let right = 0, made = 0;
  s.games.forEach(x => { if (x.pick == null) return; const g = gameById(G, x.gid); if (!g || !g.done) return; made++; x.ok = winnerOf(g) === x.pick; if (x.ok) { right++; G.pickRec.w++; G.pickRec.streak++; G.pickRec.best = Math.max(G.pickRec.best, G.pickRec.streak); } else { G.pickRec.l++; G.pickRec.streak = 0; } });

  let lp = made >= 3 && right >= made * .75 ? 2 : right > made / 2 ? 1 : 0; if (made === s.games.length && right === made && made >= 3) lp += 2;
  if (lp) gainLP(G, lp, `${right}/${made} in the Week ${w} pick'em${right === made && made === s.games.length ? " (perfect slate!)" : ""}`);
  s.result = { right, made, lp }; G.lastSlate = s;
}

function spawnEvent(G, key, ctx){
  const d = EV[key]; if (!d) return;
  try { G.events.push({ id: ++G.gid, key, w: G.week + 2, y: G.year, ctx, title: d.title(G, ctx), body: d.body(G, ctx), opts: d.opts.map(o => ({ l: o.l, d: o.d })) }); G.usedEv.push(key); } catch (e) {}
}
function weeklyEvents(G){
  makeSlate(G);
  G.pending = (G.pending || []).filter(x => { if (x.w > G.week) return true; if (!x.ctx.pid || (G.players[x.ctx.pid] && G.players[x.ctx.pid].tid === G.uid)) spawnEvent(G, x.key, x.ctx); return false; });
  if (G.events.filter(e => !e.done).length >= 3 || G.week > 15 || !chance(.55)) return;
  const keys = shuffle(Object.keys(EV).filter(k => !EV[k].chain && !G.usedEv.includes(k) && (!EV[k].mode || EV[k].mode === G.mode)));
  for (const k of keys) { let c = null; try { c = EV[k].when(G); } catch (e) {} if (c) { spawnEvent(G, k, c); break; } }

// "3× First-team All-SEC" style chips from the raw award list.
function awardChips(p){
  const m = new Map(); p.aw.forEach(([y, a]) => { const k = a.replace(/ \(\d\w\w\)$/, ""); const e = m.get(k) || { n: 0, ys: [] }; e.n++; if (!e.ys.includes(y)) e.ys.push(y); m.set(k, e); });
  const w = a => a === "Heisman Trophy" ? 100 : a === "Most Valuable Player" ? 99 : /Pocket Bowl MVP/.test(a) ? 90 : /Unanimous/.test(a) ? 85 : /All-American$/.test(a) && !/Second|Freshman/.test(a) ? 80 : /All-Pro/.test(a) ? 78 : /(Award|Trophy|Golden Arm)/.test(a) && !/finalist|Joe Moore/.test(a) ? 70 : /of the Year/.test(a) ? 65 : /Heisman Trophy finalist/.test(a) ? 60 : /Pro Bowl/.test(a) ? 55 : /MVP/.test(a) ? 50 : /^First-team All-/.test(a) ? 45 : /Second-team/.test(a) ? 35 : /Freshman/.test(a) ? 30 : /captain/i.test(a) ? 20 : /Week/.test(a) ? 5 : 25;

/* =========================================================================
   UI — the bigger visualizations: career arc, poll and Heisman races, bracket
   tree, program timeline, recruiting map, draft night, cap charts, trades
   ========================================================================= */
const MAJOR_AW = /Heisman Trophy$|Most Valuable|All-American|All-Pro|Pocket Bowl MVP|of the Year|Award$|Trophy$/;
const TOP_AW = /Heisman Trophy$|Most Valuable|Pocket Bowl MVP/;

/* ----------------------------- player: career arc + radar vs. his position ----------------------------- */
function CareerArc({ p, color }){
  const G = useUI().G, endY = p.ret || G.year, raw = p.ovh.slice(); if (!p.ret && (!raw.length || raw[raw.length - 1][0] < G.year)) raw.push([G.year, p.ovr]);
  if (raw.length < 2) return <div className="text-xs text-slate-500 py-3">His arc fills in after a season.</div>;
  const lvl = {}; p.hist.forEach(r => (lvl[r.y] = r.lvl)); const aw = {}; p.aw.forEach(a => { if (MAJOR_AW.test(a[1]) && !/Player of the Week|finalist/.test(a[1])) (aw[a[0]] || (aw[a[0]] = [])).push(a[1]); });
  const w = 320, h = 132, n = raw.length, X = i => 16 + i * (w - 32) / (n - 1), lo = Math.max(30, Math.min(...raw.map(r => r[1])) - 8), hi = Math.min(99, Math.max(p.pot || 0, ...raw.map(r => r[1])) + 6), Y = v => 16 + (1 - (v - lo) / Math.max(1, hi - lo)) * (h - 44);
  const peak = raw.reduce((m, r, i) => r[1] > raw[m][1] ? i : m, 0), step = n > 12 ? 2 : 1, d = raw.map((r, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(r[1]).toFixed(1)).join(" ");
  const pro = i => lvl[raw[i][0]] === "P" || (p.draft && raw[i][0] > p.draft.y - 1 && lvl[raw[i][0]] !== "C"), firstPro = raw.findIndex((_, i) => pro(i));
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ maxHeight: 240 }}>
      {firstPro > 0 && <g><rect x={X(firstPro) - (X(1) - X(0)) / 2} y="6" width={w - X(firstPro) + (X(1) - X(0)) / 2 - 4} height={h - 30} fill="#94a3b8" opacity=".06" rx="4" /><text x={X(firstPro) - (X(1) - X(0)) / 2 + 4} y="14" fontSize="7" fill="#64748b">PRO</text><text x="8" y="14" fontSize="7" fill="#8b7fd1">COLLEGE</text></g>}
      {!p.ret && p.pot > p.ovr && <g><line x1="12" x2={w - 12} y1={Y(p.pot)} y2={Y(p.pot)} stroke="#a78bfa" strokeDasharray="3 4" opacity=".7" /><text x={w - 12} y={Y(p.pot) - 3} fontSize="7" fill="#a78bfa" textAnchor="end">ceiling {p.pot}</text></g>}
      <path d={d + ` L${X(n - 1)} ${h - 26} L${X(0)} ${h - 26}Z`} fill={color} opacity=".12" />
      <path d={d} fill="none" stroke={color} strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round" className="draw" />
      {raw.map((r, i) => { const a = aw[r[0]], top = a && a.some(x => TOP_AW.test(x)); return (
        <g key={i}>
          <circle cx={X(i)} cy={Y(r[1])} r={i === peak ? 4 : 2.6} fill={i === peak ? color : "#0f1626"} stroke={color} strokeWidth="1.8" />
          {(i === peak || i === n - 1 || i === 0) && <text x={X(i)} y={Y(r[1]) - 7} textAnchor="middle" fontSize="8" fontWeight="700" fill="#e2e8f0">{r[1]}</text>}
          {a && <text x={X(i)} y={Y(r[1]) - (i === peak || i === n - 1 || i === 0 ? 16 : 7)} textAnchor="middle" fontSize={top ? 11 : 8} fill={top ? "#facc15" : "#fbbf24"}><title>{r[0] + ": " + a.join(", ")}</title>★</text>}
          {i % step === 0 && <text x={X(i)} y={h - 14} textAnchor="middle" fontSize="7.5" fill="#94a3b8">{p.age - (endY - r[0])}</text>}
          {i % step === 0 && <text x={X(i)} y={h - 5} textAnchor="middle" fontSize="6.5" fill="#475569">'{String(r[0]).slice(2)}</text>}
        </g>); })}
    </svg>
  );
}
function RadarVs({ p, color }){
  const G = useUI().G, grp = GROUP(p.pos), pro = p.exp != null;
  const avg = useMemo(() => { const s = p.r.map(() => 0); let n = 0; for (const id in G.players) { const q = G.players[id]; if (q.pos !== p.pos || q.tid == null || q.ret || (q.exp != null) !== pro || !q.r || q.r.length !== p.r.length) continue; q.r.forEach((v, i) => (s[i] += v)); n++; } return n ? s.map(v => round(v / n)) : null; }, [p.id, G.year]);

/* ----------------------------- college: Heisman bar race ----------------------------- */

  const G = useUI().G, hist = (G.hwHist || []).map(wk => wk.map(e => Array.isArray(e) ? e : [e, null])), [wk, setWk] = useState(Math.max(0, hist.length - 1)), [play, setPlay] = useState(false);

function drawSeasonCard(cv, G, t, row, honors){

  const g = x.createLinearGradient(0, 0, W, Hh); g.addColorStop(0, t.c1); g.addColorStop(.55, "#0b111e"); g.addColorStop(1, "#05080f"); x.fillStyle = g; x.fillRect(0, 0, W, Hh);

  for (let i = 0; i < 9; i++) { x.strokeStyle = "rgba(255,255,255,.05)"; x.lineWidth = 2; x.beginPath(); x.moveTo(0, 760 + i * 70); x.lineTo(W, 760 + i * 70); x.stroke(); }
  const F = (s, w = 800, it = true) => `${it ? "italic " : ""}${w} ${s}px 'Avenir Next Condensed','Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif`, ink = brightOf(t);
  x.textAlign = "left"; x.fillStyle = "rgba(255,255,255,.75)"; x.font = F(34, 600, false); x.fillText(`${row.y} SEASON  ·  ${t.pro ? t.conf.toUpperCase() + " " + t.div.toUpperCase() : G.confs[t.conf].full.toUpperCase()}`, 70, 110);
  x.fillStyle = "#fff"; x.font = F(124); const nm = (t.pro ? t.city : t.name).toUpperCase(); let fs = 124; while (x.measureText(nm).width > W - 140 && fs > 60) { fs -= 6; x.font = F(fs); } x.fillText(nm, 70, 240);
  x.fillStyle = ink; x.font = F(84); x.fillText(t.nick.toUpperCase(), 70, 330);
  x.fillStyle = "#fff"; x.font = F(330, 900); x.fillText(`${row.w}–${row.l}`, 60, 660);
  const champ = /National Champions|Won Pocket Bowl/.test(row.post || ""), finish = [row.post, row.cc ? "Conference champions" : "", row.rk ? "Final rank No. " + row.rk : ""].filter(Boolean);
  x.font = F(54, 800); x.fillStyle = champ ? "#facc15" : "#e2e8f0"; x.fillText((champ ? "🏆 " : "") + (finish[0] || (t.pro ? "Missed the playoffs" : "No bowl game")).toUpperCase(), 70, 760);
  x.font = F(38, 600, false); x.fillStyle = "rgba(255,255,255,.8)"; x.fillText(finish.slice(1).join("  ·  "), 70, 815);
  x.fillText(`${row.pf} points scored  ·  ${row.pa} allowed${row.cw != null ? `  ·  ${row.cw}–${row.cl} in conference` : ""}`, 70, 870);
  x.fillStyle = ink; x.fillRect(70, 915, 120, 8);
  x.font = F(32, 700, false); x.fillStyle = "rgba(255,255,255,.6)"; x.fillText("HONORS", 70, 975);
  x.font = F(36, 600, false); x.fillStyle = "#f1f5f9"; (honors.length ? honors : [["", "A season in the books."]]).slice(0, 6).forEach(([n, a], i) => { const s = n ? `${n} — ${a}` : a; let str = s; while (x.measureText(str).width > W - 140 && str.length > 10) str = str.slice(0, -2); x.fillText(str === s ? s : str + "…", 70, 1030 + i * 50); });
  x.font = F(30, 600, false); x.fillStyle = "rgba(255,255,255,.55)"; x.fillText(`${t.pro ? "GM" : "Coach"} ${G.coach.name}  ·  career ${G.coach.w}–${G.coach.l}`, 70, Hh - 60);
  x.textAlign = "right"; x.fillStyle = "rgba(255,255,255,.4)"; x.fillText("POCKET GM FOOTBALL", W - 70, Hh - 60);
}
function SeasonCardBtn({ row, tid, label }){
  const ui = useUI(), G = ui.G, [open, setOpen] = useState(false), ref_ = useRef(null), t = T(G, tid);

/* ----------------------------- draft day: the call (college) ----------------------------- */
// When the draft is in, each of your players gets his moment: the phone rings, then the pick.
const myDraftees = G => G.mode === "college" && G.draft && G.draft.log ? G.draft.log.filter(r => r[5] === G.uid) : [];

  useEffect(() => { if (!show || i >= picks.length) return; const t = setTimeout(() => setPh(p => Math.min(2, p + 1)), ph === 0 ? 1700 : 1500); return () => clearTimeout(t); }, [show, i, ph]);
  if (!show) return null;
  const done = () => ui.act(G => { G.callsSeen = yr; }), next = () => { setPh(0); setI(i + 1); };

    <Modal onClose={done} accent={[userTeam(G).c1, userTeam(G).c2]}><div className="p-5">

      <div className="text-xs text-slate-400 mt-3">Every pick is a recruiting pitch that writes itself. {picks.some(r => r[0] <= 32) ? "A first-rounder is worth extra Legacy Points." : ""}</div>
      <div className="mt-4"><Btn kind="pri" onClick={done}>Back to work</Btn></div></div></Modal>);
  const r = picks[i], t = T(G, r[1]), p = G.players[r[2]], ct = userTeam(G), rd = Math.ceil(r[0] / 32), rank = r[6] || 0, v = rank ? (r[0] - rank) / Math.sqrt(r[0] + 8) : 0, col = p ? careerTotals(p, "C") : {}, grp = p ? GROUP(p.pos) : "";
  const line = !p ? "" : grp === "QB" ? `${(col.py || 0).toLocaleString()} passing yards, ${col.ptd || 0} TD` : p.pos === "RB" ? `${(col.ry || 0).toLocaleString()} rushing yards, ${col.rtd || 0} TD` : p.pos === "WR" || p.pos === "TE" ? `${col.rec || 0} catches, ${(col.rcy || 0).toLocaleString()} yards, ${col.rctd || 0} TD` : grp === "OL" ? `${col.gs || 0} starts, ${col.pk || 0} pancakes` : grp === "KP" ? `${col.g || 0} games` : `${col.tk || 0} tackles, ${col.sck || 0} sacks, ${col.int || 0} INT`;
  const said = rd === 1 ? "“Son, how would you like to be a " + t.nick.replace(/s$/, "") + "? We're turning the card in right now.”" : v >= 1.5 ? "“We can't believe you're still on the board. Pack a bag.”" : v <= -1.5 ? "“We weren't going to risk waiting another round on you.”" : rd >= 6 ? "“It's late, but we've had you circled all week. Come earn a spot.”" : "“We've got a job for you here. Are you ready to go to work?”";

    </Modal>

              <span className="text-xs text-slate-300 font-semibold">Continue ▸</span>
              <button onClick={e => { e.stopPropagation(); if (confirm(`Delete the ${s.name} save? This can't be undone.`)) deleteSlot(s.id).then(() => setSlots(listSlots())); }} className="w-7 h-7 rounded-full text-slate-500 hover:text-rose-400 hover:bg-white/5" title="Delete save">×</button>
            </div>))}
        </div>
        <div className="mt-8 grid grid-cols-3 gap-2 w-full max-w-md text-center text-[11px] text-slate-300 rise" style={{ animationDelay: "320ms" }}>
          {[["🏆", "Heisman night, 20+ national awards, All-Americans"], ["📖", "A reference page for every player, college and pro"], ["🎟️", "12-team playoff, 30+ bowls, the Pocket Bowl"]].map(([i, t]) => <div key={t} className="rounded-xl p-2.5" style={{ background: "rgba(10,16,30,.6)", border: "1px solid rgba(255,255,255,.08)" }}><div className="text-xl">{i}</div>{t}</div>)}
        </div>
      </div>
    </div>
  );
}

function NewCareer({ onStart, onBack }){
  const [mode, setMode] = useState("college"), [cid, setCid] = useState("SEC"), [sel, setSel] = useState(STUBS.col[0]), [name, setName] = useState(""), [busy, setBusy] = useState(false);
  const pickMode = m => { setMode(m); setSel(m === "pro" ? STUBS.pro[0] : STUBS.col.find(t => t.conf === cid)); };
  const tile = t => <button key={t.id} onClick={() => setSel(t)} className={cx("flex items-center gap-2 rounded-lg p-2 text-left border transition-all", sel.id === t.id ? "border-white bg-white/10" : "border-[#26324f] hover:border-slate-500 bg-[#0b111e]/80")}><Helmet t={t} size={30} /><div className="min-w-0"><div className="text-sm font-bold truncate">{t.pro ? t.city : t.name}</div><div className="text-[10px] text-slate-400 truncate">{t.nick}{t.pro ? "" : " · prestige " + t.prestige}</div></div></button>;
  const go = () => { setBusy(true); setTimeout(() => onStart({ mode, team: sel.id, name: name.trim() || "Coach" }), 40); };
  return (
    <div className="relative min-h-screen">
      <div className="absolute inset-x-0 top-0 h-72"><SceneBackdrop teams={[sel]} dim={.35} /></div>
      <div className="relative z-10 max-w-4xl mx-auto px-3 pt-5 pb-28">
        <button onClick={onBack} className="text-sm text-white/80 hover:text-white">‹ Back</button>
        <div className="mt-24 flex items-end gap-3"><Helmet t={sel} size={76} /><div><div className="text-[11px] uppercase tracking-[.3em] text-white/70">{sel.pro ? `${sel.conf} ${sel.div}` : CONFS[sel.conf].full}</div><div className="disp text-4xl sm:text-5xl text-white" style={{ textShadow: "0 4px 24px rgba(0,0,0,.8)" }}>{tname(sel)}{!sel.pro && <span className="text-2xl text-white/70 ml-2">{sel.nick}</span>}</div></div></div>
        <div className="card p-3 mt-4 flex flex-wrap items-center gap-3">
          <div className="flex rounded-lg overflow-hidden border border-[#26324f]">{[["college", "College head coach"], ["pro", "Pro general manager"]].map(([m, l]) => <button key={m} onClick={() => pickMode(m)} className={cx("px-3 py-2 text-sm font-semibold", mode === m ? "bg-white text-slate-950" : "text-slate-300")}>{l}</button>)}</div>
          <input value={name} onChange={e => setName(e.target.value)} maxLength={24} placeholder="Your name" className="flex-1 min-w-[140px] bg-[#0b111e] border border-[#26324f] rounded-lg px-3 py-2 text-sm" />
        </div>
        <div className="text-xs text-slate-400 mt-2 px-1">{mode === "college" ? "Recruit, win your conference, chase the playoff and the Heisman. Bigger programs may come calling." : "Run the cap, the draft and free agency. The college game plays out underneath you and feeds your draft board."}</div>
        <div className="mt-3">
          {mode === "college" && <SubTabs tabs={CONF_ORDER.map(c => [c, CONFS[c].name])} value={cid} onChange={c => { setCid(c); setSel(STUBS.col.find(t => t.conf === c)); }} />}
          {mode === "college" ? <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">{STUBS.col.filter(t => t.conf === cid).map(tile)}</div>
            : PRO_CONFS.map(c => <div key={c} className="mb-3"><div className="disp text-sm text-slate-300 mb-1.5">{c} Conference</div><div className="grid grid-cols-2 sm:grid-cols-4 gap-2">{STUBS.pro.filter(t => t.conf === c).map(tile)}</div></div>)}
        </div>
      </div>
      <div className="fixed bottom-0 inset-x-0 z-20 p-3 flex justify-center" style={{ background: "linear-gradient(transparent, #070b14 45%)" }}><button disabled={busy} onClick={go} className="w-full max-w-md rounded-xl py-3.5 font-black text-lg active:scale-[.98] transition-all" style={{ background: sel.c1, color: inkOn(sel.c1), border: "2px solid " + sel.c2 }}>{busy ? "Building the football world…" : "Take over " + (sel.pro ? "the " + sel.nick : sel.name)}</button></div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState("menu"), gref = useRef(null), [, bump] = useState(0), [tab, setTab] = useState("Home"), [stack, setStack] = useState([]);
  const [ceremony, setCeremony] = useState(false), [busy, setBusy] = useState(null), [toastMsg, setToastMsg] = useState(null), [menu, setMenu] = useState(false), saveT = useRef(null), toastT = useRef(null);
  const G = gref.current, redraw = () => bump(x => x + 1);
  const toast = m => { setToastMsg(m); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToastMsg(null), 3200); };
  const save = () => { clearTimeout(saveT.current); saveT.current = setTimeout(() => { if (gref.current) saveGame(gref.current).catch(() => toast("Couldn't save — storage may be full.")); }, 400); };
  const enter = g => { gref.current = g; setTab("Home"); setStack([]); setCeremony(false); setScreen("play"); window.scrollTo(0, 0); };
  useEffect(() => { const t = G && screen === "play" ? userTeam(G) : null; document.documentElement.style.setProperty("--acc", t ? brightOf(t) : "#38bdf8"); });

  if (screen === "menu") return <MainMenu onNew={() => setScreen("new")} onLoad={id => loadSlot(id).then(g => g ? enter(g) : alert("That save couldn't be loaded.")).catch(() => alert("That save couldn't be loaded."))} />;
  if (screen === "new") return <NewCareer onBack={() => setScreen("menu")} onStart={o => { const g = newGame(o); enter(g); saveGame(g).catch(() => {}); }} />;

  const step = () => { const had = !!G.awards.col; if (G.phase === "reg") simWeek(G); else advanceOff(G); return !had && !!G.awards.col; };
  const advance = () => { if (busy) return; setBusy("Simulating…"); setTimeout(() => { let show = false; try { show = step(); } catch (e) { console.error(e); toast("Something went wrong simulating: " + e.message); } setBusy(null); if (show) setCeremony(true); redraw(); save(); }, 30); };
  // Sim ahead a week at a time so the screen stays alive; stops at the Heisman, the offseason, or a new season.
  const simTo = until => { if (busy) return; setMenu(false); let n = 0; const tick = () => { let show = false, stop = false; try { show = step(); } catch (e) { console.error(e); toast("Something went wrong simulating: " + e.message); stop = true; }
    n++; stop = stop || show || n > 40 || until(G); setBusy(stop ? null : (G.phase === "reg" ? weekName(G.week) : OFF_STEPS[G.offStep]) + "…"); redraw(); if (stop) { if (show) setCeremony(true); save(); } else setTimeout(tick, 20); };
    setBusy("Simulating…"); setTimeout(tick, 30); };
  const ui = { G, act: fn => { fn(G); redraw(); save(); }, go: setTab, toast, setCeremony, openPlayer: id => setStack(s => [...s, ["p", id]]), openTeam: id => setStack(s => [...s, ["t", id]]), openGame: id => setStack(s => [...s, ["g", id]]), openInterview: id => setStack(s => [...s, ["i", id]]) };
  const t = userTeam(G), pop = () => setStack(s => s.slice(0, -1)), top = stack[stack.length - 1], off = G.phase === "off", open = G.events.filter(e => !e.done).length;
  const label = off ? (G.offStep < 5 ? "Next: " + OFF_STEPS[G.offStep + 1] : "Start the " + (G.year + 1) + " season") : "Play " + weekName(G.week).replace(/^Week/, "week");
  const TABS = [["Home", "Home"], ["Team", t.pro ? "Team" : "Team"], ["College", "College"], ["Pro", "Pro"], ["Office", "Front Office"], ["Stories", "Stories"], ["History", "History"]];
  return (
    <UICtx.Provider value={ui}>
      <div className="min-h-screen pb-24">
        <div className="relative overflow-hidden" style={{ height: 132 }}>
          <SceneBackdrop teams={[t]} dim={.5} nolabel />
          <div className="absolute inset-0 max-w-6xl mx-auto px-3 flex items-end pb-3 gap-3">
            <div className="cursor-pointer" onClick={() => ui.openTeam(t.id)}><Helmet t={t} size={62} /></div>
            <div className="flex-1 min-w-0"><div className="text-[10px] uppercase tracking-[.3em] text-white/70">{G.year} · {off ? "Offseason · " + OFF_STEPS[G.offStep] : weekName(G.week)}</div>
              <div className="disp text-3xl sm:text-4xl text-white truncate" style={{ textShadow: "0 3px 18px rgba(0,0,0,.8)" }}>{!t.pro && t.rank ? <span className="text-xl text-white/70 mr-1.5">#{t.rank}</span> : null}{tname(t)}</div>
              <div className="text-xs text-white/80 tnum">{t.w}–{t.l}{!t.pro && t.conf !== "IND" ? ` (${t.cw}–${t.cl} ${G.confs[t.conf].name})` : ""} · {G.coach.name}</div></div>
            <div className="text-right"><div className="cursor-pointer" onClick={() => setTab("Stories")}><LPChip n={G.lp} /></div>
              <div className="relative mt-1"><button onClick={() => setMenu(!menu)} className="text-xs text-white/80 hover:text-white px-2 py-1 rounded-lg bg-black/30">Menu ▾</button>
                {menu && <div className="absolute right-0 top-8 z-40 w-56 card p-1 text-left text-sm pop" onMouseLeave={() => setMenu(false)}>
                  {!off && <button className="w-full text-left px-3 py-2 rounded-lg hover:bg-white/5" onClick={() => simTo(G => G.phase !== "reg" || G.week > COL_WEEKS)}>Sim to the end of the regular season</button>}
                  {!off && <button className="w-full text-left px-3 py-2 rounded-lg hover:bg-white/5" onClick={() => simTo(G => G.phase !== "reg")}>Sim to the offseason</button>}
                  {off && <button className="w-full text-left px-3 py-2 rounded-lg hover:bg-white/5" onClick={() => simTo(G => G.phase === "reg")}>Let the staff finish the offseason</button>}
                  <button className="w-full text-left px-3 py-2 rounded-lg hover:bg-white/5" onClick={() => { setMenu(false); saveGame(G).then(() => toast("Saved.")).catch(() => toast("Couldn't save.")); }}>Save now</button>
                  <button className="w-full text-left px-3 py-2 rounded-lg hover:bg-white/5" onClick={() => { setMenu(false); clearTimeout(saveT.current); saveGame(G).catch(() => {}).then(() => { gref.current = null; setScreen("menu"); }); }}>Save and exit to menu</button>
                </div>}</div></div>
          </div>
        </div>
        <div className="sticky top-0 z-30 border-b border-[#1f2a44]" style={{ background: "rgba(7,11,20,.92)", backdropFilter: "blur(10px)" }}>
          <div className="max-w-6xl mx-auto px-2 flex overflow-x-auto">{TABS.map(([k, l]) => <button key={k} onClick={() => { setTab(k); window.scrollTo({ top: 0 }); }} className={cx("tabbtn px-3 py-3 text-sm font-semibold whitespace-nowrap", tab === k ? "on text-white" : "text-slate-400 hover:text-slate-200")}>{l}{k === "Stories" && open > 0 && <span className="ml-1 inline-block w-4 h-4 rounded-full bg-acc text-slate-950 text-[10px] font-black leading-4 text-center">{open}</span>}</button>)}</div>
        </div>
        <div key={tab} className="max-w-6xl mx-auto px-3 pt-3 rise"><Safe key={tab + G.year + G.phase + G.offStep + G.week}>
          {tab === "Home" && <HomeTab />}
          {tab === "Team" && <TeamTab />}
          {tab === "College" && <CollegeTab />}
          {tab === "Pro" && <ProTab />}
          {tab === "Office" && <OfficeTab key={G.year + G.phase + G.offStep} />}
          {tab === "Stories" && <StoriesTab />}
          {tab === "History" && <HistoryTab />}
        </Safe></div>
        <div className="fixed bottom-0 inset-x-0 z-30 flex justify-end sm:justify-center p-3 pointer-events-none" style={{ background: "linear-gradient(transparent, rgba(7,11,20,.9) 60%)" }}>
          <button disabled={!!busy} onClick={advance} className="pointer-events-auto rounded-full px-6 py-3 font-black text-sm sm:text-base bg-acc text-slate-950 shadow-xl active:scale-95 transition-all" style={{ boxShadow: "0 10px 30px rgba(0,0,0,.5)" }}>{busy || label} {!busy && "▸"}</button>
        </div>
        {top && top[0] === "p" && <PlayerPage key={"p" + top[1] + stack.length} pid={top[1]} onClose={pop} />}
        {top && top[0] === "t" && <TeamPage key={"t" + top[1] + stack.length} tid={top[1]} onClose={pop} />}
        {top && top[0] === "g" && <BoxScore key={"g" + top[1] + stack.length} gid={top[1]} onClose={pop} />}
        {top && top[0] === "i" && <InterviewModal key={"i" + top[1] + stack.length} pid={top[1]} onClose={pop} />}
        {ceremony && G.awards.col && <Ceremony onClose={() => setCeremony(false)} />}
        {!ceremony && !busy && <DraftCalls />}
        {!ceremony && !busy && <SelectionShow />}
        {!ceremony && !busy && <OrderReveal />}
        {toastMsg && <div className="fixed left-1/2 -translate-x-1/2 bottom-20 z-[90] px-4 py-2.5 rounded-xl text-sm bg-slate-100 text-slate-950 font-semibold shadow-xl pop max-w-[90vw] text-center">{toastMsg}</div>}
      </div>
    </UICtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
<script>
  (function(){
    try {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);

      document.getElementById("root").innerHTML = '<pre style="color:#f87171;padding:16px;white-space:pre-wrap">App failed to start:\n' + (e && (e.stack || e.message || e)) + '</pre>';

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
